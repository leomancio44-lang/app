<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leo Wealth">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%23000000'/%3E%3Crect x='14' y='14' width='152' height='152' rx='28' fill='%23111113' stroke='%23222227' stroke-width='2'/%3E%3Ctext x='90' y='108' text-anchor='middle' fill='%23ffffff' font-family='-apple-system,sans-serif' font-size='56' font-weight='800' letter-spacing='-2'%3ELW%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Leo%20Wealth%22%2C%22short_name%22%3A%22Leo%20Wealth%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
<title>Leo Wealth</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --s1:#111113;
  --s2:#19191D;
  --t:#FFFFFF;
  --m:#86868D;
  --b:#222227;
  --bh:rgba(255,255,255,.26);
  --ok:#32D74B;
  --w:#F59E0B;
  --bad:#EF4444;
  --vac:#38BDF8;
  box-sizing:border-box;
}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  overflow-x:hidden;
  background:#000000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--t);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

.app-shell{
  max-width:448px;
  width:100%;
  min-height:100dvh;
  margin:0 auto;
  background:var(--bg);
  border-left:1px solid rgba(34,34,39,.45);
  border-right:1px solid rgba(34,34,39,.45);
  padding:max(14px,env(safe-area-inset-top,14px)) 16px calc(108px + env(safe-area-inset-bottom,0px));
  position:relative;
}

.kicker{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.11em;
  color:var(--m);
  font-weight:600;
  margin:0;
  display:block;
}
h1{
  font-size:18px;
  font-weight:700;
  margin:2px 0 0;
  letter-spacing:-.35px;
  line-height:1.15;
}
h2{
  font-size:10px;
  color:var(--m);
  text-transform:uppercase;
  letter-spacing:.11em;
  margin:18px 2px 8px;
  font-weight:600;
}
.hero-num{
  font-size:clamp(32px,9.2vw,42px);
  font-weight:800;
  letter-spacing:-1.3px;
  line-height:1.04;
}
.big{font-size:clamp(20px,5.5vw,24px);font-weight:800;letter-spacing:-.6px;line-height:1.12}
.m{color:var(--m);font-size:11.5px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.w{color:var(--w)}

.card{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:20px;
  padding:15px;
  margin-bottom:12px;
  max-width:100%;
  transition:border-color .16s,transform .14s;
}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--bh)}
.lp{user-select:none;-webkit-user-select:none}
.lp:active{transform:scale(.975);border-color:rgba(255,255,255,.36)}

.row{display:flex;align-items:center;gap:10px;min-width:0}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2>div,.g3>div{min-width:0}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  padding-top:14px;
  margin-top:14px;
  border-top:1px solid var(--b);
}
.hstat{
  background:var(--s2);
  border:0;
  padding:10px 9px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:76px;
  cursor:pointer;
  transition:background .15s;
}
.hstat:hover{background:#222228}
.hstat b{display:block;font-size:14.5px;font-weight:800;margin-top:4px;color:var(--t);letter-spacing:-.3px}
.hstat .sub-stat{font-size:10px;color:var(--m);margin-top:3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gami-pill{
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  align-items:center;
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:16px;
  padding:10px 12px;
  margin-bottom:12px;
  gap:10px;
}
.gami-div{height:24px;background:var(--b)}
.gami-cell{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer}
.gami-ico{
  width:28px;height:28px;border-radius:9px;
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  flex:none;
}

.qgrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-bottom:12px;
}
.qbtn{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:16px;
  padding:11px 6px;
  min-height:66px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  text-align:center;
  min-width:0;
}
.qbtn:hover{border-color:var(--bh);background:var(--s2)}
.qbtn.pri{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.qbtn.austerity{
  background:#0D0D0F;
  border-color:#27272A;
  color:#A1A1AA;
}
.qbtn.austerity.pri{
  background:#27272A;
  border-color:#3F3F46;
  color:#E4E4E7;
}
.qbtn b{font-size:12px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qbtn .qsub{font-size:9.5px;color:var(--m);line-height:1}
.qbtn.pri .qsub{color:rgba(0,0,0,.6)}
.qbtn.austerity.pri .qsub{color:#A1A1AA}

button,input,select,textarea{font:inherit;color:var(--t)}
button{
  cursor:pointer;
  transition:transform .13s cubic-bezier(.16,1,.3,1),opacity .13s,background .15s,border-color .15s;
}
button:active{transform:scale(.96);opacity:.9}

.btn{
  background:#FFFFFF;
  color:#000000;
  border:1px solid #FFFFFF;
  border-radius:14px;
  padding:10px 14px;
  font-weight:600;
  font-size:12.5px;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn:hover{background:#E5E5EA}
.btn.s{
  background:var(--s1);
  color:var(--t);
  border:1px solid var(--b);
}
.btn.s:hover{background:var(--s2);border-color:var(--bh)}
.btn.d{
  background:rgba(239,68,68,.12);
  color:var(--bad);
  border:1px solid rgba(239,68,68,.28);
}
.btn.sm{padding:6.5px 11px;font-size:11.5px;border-radius:10px}

.icon-btn{
  width:36px;height:36px;border-radius:13px;
  background:var(--s1);border:1px solid var(--b);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--m);padding:0;flex:none;
}
.icon-btn:hover{color:var(--t);border-color:var(--bh)}
.icon-btn.on{color:#000000;background:#FFFFFF;border-color:#FFFFFF}

input,select,textarea{
  background:#000000;
  border:1px solid var(--b);
  border-radius:12px;
  padding:9.5px 12px;
  width:100%;
  max-width:100%;
  min-width:0;
  font-size:16px;
  outline:0;
  -webkit-appearance:none;
  transition:border-color .15s;
}
textarea{resize:vertical;min-height:86px;font-size:14px}
input[type="date"],input[type="time"]{min-height:40px;font-size:13.5px}
input[type="time"]::-webkit-calendar-picker-indicator,
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.65}
input:focus,select:focus,textarea:focus{border-color:#FFFFFF}
label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--m);
  font-weight:600;
  display:block;
  margin:10px 0 4px;
}

.seg{
  display:flex;
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:13px;
  padding:3px;
  gap:3px;
}
.seg button{
  flex:1;min-width:0;background:0;border:0;
  border-radius:10px;padding:6.5px 4px;
  font-size:11px;font-weight:500;color:var(--m);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg button.on{
  background:#FFFFFF;color:#000000;font-weight:600;
}

nav.liquid-dock{
  position:fixed;
  left:16px;right:16px;
  bottom:max(14px,env(safe-area-inset-bottom,14px));
  max-width:416px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(22,22,26,.84);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 14px 36px rgba(0,0,0,.85);
  border-radius:26px;
  padding:6px 6px;
  z-index:30;
}
nav.liquid-dock button{
  flex:1;min-width:0;background:0;border:0;
  padding:7px 2px;border-radius:18px;
  color:var(--m);font-size:9.5px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:3px;
}
nav.liquid-dock button.on{
  color:#FFFFFF;
  background:rgba(255,255,255,.11);
  font-weight:600;
}

.fab{
  position:fixed;
  right:max(18px,calc(50vw - 206px));
  bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:46px;height:46px;border-radius:15px;
  border:1px solid rgba(255,255,255,.22);
  background:#FFFFFF;color:#000000;
  font-size:21px;font-weight:600;line-height:1;
  box-shadow:0 10px 26px rgba(0,0,0,.85);
  z-index:25;
  display:flex;align-items:center;justify-content:center;
}

.leds{display:flex;gap:4px}
.led{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.1)}
.led.on{background:var(--ok)}
.led.lo{background:var(--w)}
.led.cr{background:var(--bad)}
.leds.mini{gap:3px;margin-top:5px}
.leds.mini .led{height:4px;border-radius:2px}

.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:2px;transition:width .35s cubic-bezier(.16,1,.3,1)}

.li-card{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:15px;
  padding:11px 13px;
  margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  touch-action:pan-y;
}
.li{
  display:flex;align-items:center;gap:9px;
  padding:10px 0;
  border-bottom:1px solid var(--b);
  touch-action:pan-y;
}
.li:last-child{border:0;padding-bottom:2px}
.li:first-child{padding-top:2px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.x{background:0;border:0;color:var(--m);font-size:12.5px;padding:4px 6px}
.x:hover{color:var(--bad)}

.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:14px;
  padding:8px 2px;
  min-height:62px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  color:var(--m);
}
.wday.t{border-color:rgba(255,255,255,.45)}
.wday.s{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.wday.off:not(.s){background:rgba(255,255,255,.03);border-style:dashed}
.wday .wn{font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.wday .wd{font-size:13.5px;font-weight:700}
.wday .wdots{display:flex;gap:2px;height:4px}
.wday .wdots u{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal b{font-size:10px;color:var(--m);font-weight:600;padding-bottom:4px}
.cal button{
  aspect-ratio:1;border-radius:11px;border:1px solid transparent;
  background:rgba(255,255,255,.04);font-size:12.5px;position:relative;padding:0;
}
.cal button.t{border-color:rgba(255,255,255,.45)}
.cal button.s{background:#FFFFFF;color:#000000;font-weight:700}
.cal button.off{border-color:rgba(255,255,255,.22);border-style:dashed}
.cal button.e{opacity:.15;pointer-events:none}
.cal i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal i u{width:3.5px;height:3.5px;border-radius:50%;background:var(--ok)}
.cal i u.x2{background:var(--w)}
.cal i u.x3{background:#FFFFFF}

.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi-box{
  background:var(--s2);
  border:0;
  border-radius:12px;
  padding:8px 10px;
}
.kpi-box .m{font-size:10px;display:block}
.kpi-box b{font-size:12.5px;display:block;margin-top:2px}

.sheet{
  position:fixed;inset:0;
  background:rgba(0,0,0,.84);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:40;display:none;align-items:flex-end;justify-content:center;
}
.sheet.on{display:flex}
.sheet.on>div{animation:slideUp .25s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet>div{
  width:100%;max-width:448px;
  background:var(--s2);
  border-top:1px solid rgba(255,255,255,.14);
  border-radius:26px 26px 0 0;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));
  max-height:90dvh;overflow-y:auto;
  will-change:transform;
}
.grabber-wrap{
  padding:4px 0 10px;
  display:flex;justify-content:center;
  cursor:grab;touch-action:none;
}
.grabber{
  width:36px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.24);
}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}
.keys button{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.06);
  border-radius:14px;padding:12px;font-size:18px;font-weight:700;
}
.keys button:hover{background:rgba(255,255,255,.14)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  background:#000000;border:1px solid var(--b);
  border-radius:11px;padding:6px 10px;font-size:11.5px;font-weight:500;color:var(--m);
}
.chip.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF;font-weight:600}

.wd-pills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:6px}
.wd-pill{
  padding:8px 0;border-radius:10px;
  background:#000000;border:1px solid var(--b);
  color:var(--m);font-size:11px;font-weight:700;text-align:center;
}
.wd-pill.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF}

.chk-box{
  width:18px;height:18px;border-radius:6px;
  border:1.5px solid var(--bh);
  background:transparent;
  display:inline-flex;align-items:center;justify-content:center;
  flex:none;color:#000000;
}
.chk-box.on{background:#FFFFFF;border-color:#FFFFFF}

.toast{
  position:fixed;left:16px;right:16px;
  top:max(12px,env(safe-area-inset-top,12px));
  max-width:416px;margin:0 auto;
  background:rgba(26,26,30,.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:15px;padding:10px 14px;z-index:50;
  display:none;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.85);font-size:12.5px;
}
.toast.on{display:flex;animation:dropDown .26s cubic-bezier(.16,1,.3,1)}
@keyframes dropDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}

.msg{
  background:var(--s2);border:1px solid rgba(255,255,255,.18);
  border-radius:16px;padding:12px 14px;margin-bottom:12px;line-height:1.45;font-size:12.5px;
}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:7px;font-size:9.5px;font-weight:700;
  letter-spacing:.04em;
  background:rgba(255,255,255,.08);color:var(--m);
}
.badge.ok{background:rgba(50,215,75,.15);color:var(--ok)}
.badge.w{background:rgba(245,158,11,.16);color:var(--w)}
.badge.bad{background:rgba(239,68,68,.16);color:var(--bad)}
.badge.vac{background:rgba(56,189,248,.16);color:var(--vac)}
.badge.aus{background:#27272A;color:#A1A1AA}

.spotlight-wrap{
  position:sticky;
  top:max(8px,env(safe-area-inset-top,8px));
  z-index:15;
  background:rgba(0,0,0,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  padding:4px 0 8px;
  margin-bottom:6px;
}
.spotlight-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:14px;
  padding:4px 10px;
  transition:border-color .15s;
}
.spotlight-box:focus-within{border-color:#FFFFFF}
.spotlight-box input{
  border:0;
  background:transparent;
  padding:6px 2px;
  font-size:14px;
  color:var(--t);
}
.spotlight-clear{
  background:rgba(255,255,255,.1);
  border:0;
  color:var(--t);
  width:22px;height:22px;
  border-radius:50%;
  font-size:11px;
  display:inline-flex;align-items:center;justify-content:center;
  flex:none;
}

.sw-toggle{
  width:46px;height:26px;border-radius:99px;
  background:rgba(255,255,255,.12);
  border:1px solid var(--b);
  padding:2px;
  display:inline-flex;align-items:center;
  transition:background .2s,border-color .2s;
  flex:none;
}
.sw-toggle.on{background:#FFFFFF;border-color:#FFFFFF}
.sw-toggle i{
  width:20px;height:20px;border-radius:50%;
  background:#86868D;
  display:block;
  transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s;
}
.sw-toggle.on i{transform:translateX(20px);background:#000000}

.codebox{
  background:#000000;border:1px solid var(--b);border-radius:11px;
  padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;color:#d1d1d6;overflow-x:auto;white-space:nowrap;
}

#confetti-cv{
  position:fixed;inset:0;width:100vw;height:100vh;
  pointer-events:none;z-index:60;display:none;
}

body.blur-mode .money-val{filter:blur(7px);opacity:.72;transition:filter .18s}
body.blur-mode .money-val:active{filter:none;opacity:1}

button,.btn,.icon-btn,input,select{touch-action:manipulation}
:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:2px}
body:has(#sh.on){overflow:hidden}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="confetti-cv"></canvas>
<div class="app-shell">
  <main id="v"></main>
</div>
<div class="toast" id="to"></div>
<button class="fab" aria-label="Nuovo" onclick="np(today(),'ex')">+</button>
<nav class="liquid-dock" id="nv"></nav>
<div class="sheet" id="sh" onclick="if(event.target===this)closeNp()"></div>

<script>
/* ==========================================================================
   1. UTILITY CORE, COUNT-UP NUMERICO & SERVICE WORKER
   ========================================================================== */
const APP_VER = '14.1';
let storagePersisted = false;

const $ = s => document.querySelector(s),
      pad = n => String(n).padStart(2, '0'),
      pad2h = h => String(h).padStart(2, '0') + ':00',
      iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),

function animateNum(el, from, to, fmt = eur, ms = 220) {
  if (!el || Math.abs(to - from) < 0.01) { if (el) el.textContent = fmt(to); return; }
  const t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / ms);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * ease);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

(function initServiceWorker() {
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const code = `
        const CACHE = 'leo-wealth-v${APP_VER}';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => {
          e.waitUntil(
            caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
              .then(() => self.clients.claim())
          );
        });
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET' || !e.request.url.startsWith(self.location.origin)) return;
          e.respondWith(
            fetch(e.request, { cache: 'no-store' })
              .then(r => {
                if (r && r.status === 200) {
                  const copy = r.clone();
                  caches.open(CACHE).then(c => c.put(e.request, copy));
                }
                return r;
              })
              .catch(() => caches.match(e.request))
          );
        });
      `;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'application/javascript' }))).catch(() => {});
    }
  } catch (e) {}
})();

   2. CONFETTI ENGINE
   ========================================================================== */
function launchConfetti() {
  vib([25, 45, 35]);
  const cv = $('#confetti-cv');
  if (!cv) return;
  cv.style.display = 'block';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr;
  cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const colors = ['#FFFFFF', '#32D74B', '#F59E0B', '#38BDF8', '#A1A1AA'];
  const pieces = Array.from({ length: 85 }, () => ({
    x: W * (0.2 + Math.random() * 0.6),
    y: H * 0.35 + (Math.random() - 0.5) * 60,
    vx: (Math.random() - 0.5) * 11,
    vy: -6 - Math.random() * 9,
    w: 5 + Math.random() * 5,
    h: 3 + Math.random() * 4,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.25,
    col: colors[Math.floor(Math.random() * colors.length)],
    alpha: 1
  }));

  const start = performance.now();
  function frame(now) {
    const dt = now - start;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    pieces.forEach(p => {
      p.vy += 0.32;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (dt > 1700) p.alpha = Math.max(0, 1 - (dt - 1700) / 700);
      if (p.alpha > 0 && p.y < H + 30) {
        alive++;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
    });
    if (alive > 0 && dt < 2500) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  }
  requestAnimationFrame(frame);
}

const DB = {

          e.target.result.createObjectStore('receipts');

    try {
      if (!DB.db) return r(null);
      const q = DB.db.transaction('receipts').objectStore('receipts').get(id);

};

function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.68));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function getCycleRange(offset = 0) {
  const pd = Math.min(31, Math.max(1, +S.payDay || 1));
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  const dimCurr = new Date(y, m + 1, 0).getDate();
  const effCurr = Math.min(pd, dimCurr);
  if (now.getDate() < effCurr) {
    m -= 1;
    if (m < 0) { m = 11; y -= 1; }
  }
  const startDate = new Date(y, m + offset, 1);
  const sy = startDate.getFullYear(), sm = startDate.getMonth();
  const sDim = new Date(sy, sm + 1, 0).getDate();
  const start = new Date(sy, sm, Math.min(pd, sDim));

  const nextMonth = new Date(sy, sm + 1, 1);
  const ny = nextMonth.getFullYear(), nm = nextMonth.getMonth();
  const nDim = new Date(ny, nm + 1, 0).getDate();
  const nextStart = new Date(ny, nm, Math.min(pd, nDim));
  const end = new Date(nextStart.getTime() - 86400000);

  const startStr = iso(start);
  const endStr = iso(end);
  const totalDays = Math.round((end - start) / 86400000) + 1;
  const label = pd === 1
    ? `${MESI[sm].slice(0, 3)} ${sy}`
    : `${start.getDate()} ${MESI[sm].slice(0, 3)} – ${end.getDate()} ${MESI[nm].slice(0, 3)}`;

  return { startStr, endStr, totalDays, label };
}

function liq() {
  const totalIn = S.inc.reduce((s, i) => s + (+i.a || 0), 0);
  const totalOut = S.ex.reduce((s, e) => s + (+e.a || 0), 0);
  return Math.round(((+S.liq0 || 0) + totalIn - totalOut) * 100) / 100;
}

function stats(offset = 0) {
  const cyc = getCycleRange(offset);
  const t = today();
  const exList = S.ex.filter(e => !e.vac && e.d >= cyc.startStr && e.d <= cyc.endStr);
  const incList = S.inc.filter(i => i.d >= cyc.startStr && i.d <= cyc.endStr);
  const spent = Math.round(exList.reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const earned = Math.round(incList.reduce((s, i) => s + (+i.a || 0), 0) * 100) / 100;
  const bud = +S.bud || 0;
  const rem = Math.round((bud - spent) * 100) / 100;

  const sDate = new Date(cyc.startStr + 'T12:00');
  const eDate = new Date(cyc.endStr + 'T12:00');
  const tDate = new Date(t + 'T12:00');

  let elapsed = Math.floor((tDate - sDate) / 86400000) + 1;
  elapsed = Math.min(cyc.totalDays, Math.max(1, elapsed));
  let left = Math.floor((eDate - tDate) / 86400000) + 1;
  left = Math.min(cyc.totalDays, Math.max(1, left));

  const spentToday = Math.round(S.ex.filter(e => !e.vac && e.d === t).reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const idealPerDay = bud / cyc.totalDays;
  const safeToday = rem <= 0 ? 0 : Math.round((rem / left) * 100) / 100;
  const burnRate = spent / elapsed;
  const projSpentEnd = Math.round(burnRate * cyc.totalDays * 100) / 100;
  const projLiqEnd = Math.round((liq() - Math.max(0, projSpentEnd - spent)) * 100) / 100;

  return {
    cyc, exList, incList, dim: cyc.totalDays, spent, earned, net: Math.round((earned - spent) * 100) / 100,
    rem, left, day: elapsed, spentToday, daily: safeToday, per: idealPerDay,
    projSpentEnd, projLiqEnd, goal: (+S.sal || 0) - bud
  };
}

function vacStats() {
  const start = S.vacStart || today();
  const vacEx = S.ex.filter(e => e.vac && (!S.vacStart || e.d >= start));
  const spent = Math.round(vacEx.reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const bud = +S.vacBud || 0;
  const rem = Math.round((bud - spent) * 100) / 100;
  const spentToday = Math.round(vacEx.filter(e => e.d === today()).reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const daysActive = Math.max(1, (S.vacDays || []).filter(d => !S.vacStart || d >= start).length);
  return { exList: vacEx, spent, bud, rem, spentToday, daysActive };
}

function getNoSpendStreak() {
  const impulseCats = ['heets', 'caffe', 'cibo', 'svago', 'altro'];
  let streak = 0;
  const d = new Date();
  const firstD = [...S.ex.map(e => e.d), ...S.inc.map(i => i.d), ...(S.zeroSpendDays || [])].sort()[0] || today();
  for (let i = 0; i < 120; i++) {
    const ds = iso(d);
    if (ds < firstD) break;
    const hasImpulse = S.ex.some(e => e.d === ds && !e.rid && !e.vac && impulseCats.includes(e.c));
    if (hasImpulse) {
      if (i === 0) { d.setDate(d.getDate() - 1); continue; }
      break;
    }
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function getSpendingAnomalies() {
  const s0 = stats(0);

  if (s1.spent <= 0 || s0.day < 5) return [];

  const c0 = catSumRange(s0.cyc.startStr, today());
  const c1 = catSumRange(s1.cyc.startStr, s1.cyc.endStr);
  const alerts = [];
  Object.keys(c0).forEach(k => {
    if (k === 'gpl' || k === 'benz') return;
    const paceNow = c0[k] / s0.day;
    const pacePrev = (c1[k] || 0) / s1.dim;
    if (pacePrev > 0.3 && paceNow > pacePrev * 1.32 && c0[k] >= 12) {
      const pct = Math.round(((paceNow - pacePrev) / pacePrev) * 100);
      alerts.push({ cat: cats[k]?.[0] || k, pct, proj: Math.round(paceNow * s0.dim * 100) / 100 });
    }
  });
  return alerts.slice(0, 2);
}

function catSumRange(startStr, endStr) {

  S.ex.filter(e => !e.vac && e.d >= startStr && e.d <= endStr).forEach(e => o[e.c] = (o[e.c] || 0) + (+e.a || 0));
  return o;
}

function getAnalyticsPoints(metric, range, offset) {
  const t = today();
  if (range === '6M') {
    const pts = [];
    for (let k = -5; k <= 0; k++) {
      const st = stats(offset + k);
      const val = metric === 'exp' ? st.spent : metric === 'sav' ? Math.max(0, st.rem) : (S.liq0 + S.inc.filter(i => i.d <= st.cyc.endStr).reduce((a, b) => a + b.a, 0) - S.ex.filter(e => e.d <= st.cyc.endStr).reduce((a, b) => a + b.a, 0));
      pts.push({ label: st.cyc.label, short: st.cyc.label.split(' ')[0], v: val });
    }
    return pts;
  }

  let dates = [];
  if (range === '14G') {
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      dates.push(iso(d));
    }
  } else {
    const cyc = getCycleRange(offset);
    for (let d = new Date(cyc.startStr + 'T12:00'); iso(d) <= cyc.endStr; d.setDate(d.getDate() + 1)) {
      const ds = iso(d);
      if (offset === 0 && ds > t) break;
      dates.push(ds);
    }
    if (!dates.length) dates = [cyc.startStr];
  }

  return dates.map((ds) => {
    const parts = ds.split('-');
    const short = `${parts[2]}/${parts[1]}`;
    let v = 0, ideal = null;
    if (metric === 'liq') {
      v = S.liq0 + S.inc.filter(i => i.d <= ds).reduce((s, i) => s + i.a, 0) - S.ex.filter(e => e.d <= ds).reduce((s, e) => s + e.a, 0);
    } else if (metric === 'exp') {
      v = S.ex.filter(e => !e.vac && e.d === ds).reduce((s, e) => s + e.a, 0);
    } else {
      const cyc = getCycleRange(offset);
      const spentSoFar = S.ex.filter(e => !e.vac && e.d >= cyc.startStr && e.d <= ds).reduce((s, e) => s + e.a, 0);
      v = Math.max(0, S.bud - spentSoFar);
      const dayIdx = Math.max(1, Math.round((new Date(ds + 'T12:00') - new Date(cyc.startStr + 'T12:00')) / 86400000) + 1);
      ideal = Math.max(0, S.bud - (S.bud / cyc.totalDays) * dayIdx);
    }
    return { label: short, short, v, ideal };
  });
}

/* ==========================================================================
   8. MOTORE AUTO, GPL, PREVISIONE GIORNO RISERVA & CARPOOLING
   ========================================================================== */
function dayK(f, w) {
  const km = S.kmDay || 92;
  return wk(f.d) ? (f.pl === 'wk' ? km / 2 : (w === 'a' ? km : 0)) : 0;
}

function kmB(a, b) {
  const km = S.kmDay || 92;
  let k = dayK(a, 'a') + dayK(b, 'b');
  for (let d = new Date(a.d + 'T12:00'); ;) {
    d.setDate(d.getDate() + 1);
    const x = iso(d);
    if (x >= b.d) break;
    if (wk(x)) k += km;
  }
  return k + Object.entries(S.extra).filter(([d]) => d >= a.d && d <= b.d).reduce((s, [, v]) => s + v, 0);
}

function predictReserveDate(remKm) {
  if (remKm == null || remKm <= 0) return { label: 'In riserva', ds: today() };
  const km = S.kmDay || 92;
  if (km <= 0 || S.commuteMode === 'remote') return { label: 'Solo extra', ds: null };
  let left = remKm;
  const d = new Date();
  const h = d.getHours();
  const endH = hh(S.workEnd || '18:00');
  if (wk(today())) {
    const remToday = h < hh(S.workStart || '09:00') ? km : h < endH ? km / 2 : 0;
    left -= remToday;
    if (left <= 0) return { label: 'Fino a stasera', ds: today() };
  }
  for (let i = 1; i <= 30; i++) {
    d.setDate(d.getDate() + 1);
    const ds = iso(d);
    if (wk(ds)) {
      left -= km;
      if (left <= 0) {
        if (i === 1) return { label: 'Fino a domani', ds };
        const dn = DN[d.getDay()].slice(0, 3);
        return { label: `Fino a ${dn} ${d.getDate()}`, ds };
      }
    }
  }
  return { label: 'Oltre 30 giorni', ds: null };
}

function car() {
  const km = S.kmDay || 92;
  const ideal = S.idealKmL || 15.5;
  const f = [...S.fills].sort((a, b) => a.d.localeCompare(b.d));
  let L = 0, K = 0, E = 0;
  const segs = [];
  f.forEach((x, i) => {
    if (i) {
      const k = kmB(f[i - 1], x);
      const lit = x.eur / x.ppl;
      if (k > 0 && lit > 0) {
        K += k;
        L += lit;
        E += x.eur;
        segs.push({ k, lit });
      }
    }
  });

  let avg = ideal;
  if (segs.length) {
    const recent = segs.slice(-5);
    const rK = recent.reduce((s, x) => s + x.k, 0);
    const rL = recent.reduce((s, x) => s + x.lit, 0);
    if (rL > 0) avg = rK / rL;
  }

  const last = f[f.length - 1];
  let since = 0;
  if (last) {
    const t = today(), h = new Date().getHours();
    const startH = hh(S.workStart || '09:00');
    const endH = hh(S.workEnd || '18:00');
    if (last.d < t) {
      since = dayK(last, 'a');
      for (let d = new Date(last.d + 'T12:00'); ;) {
        d.setDate(d.getDate() + 1);
        const x = iso(d);
        if (x >= t) break;
        if (wk(x)) since += km;
      }
      if (wk(t)) since += h < startH ? 0 : h < endH ? km / 2 : km;
    } else if (last.d === t && wk(t)) {
      if (last.pl === 'an' && h >= endH) since += km;
      else if (last.pl === 'an' && h >= startH) since += km / 2;
      else if (last.pl === 'wk' && h >= endH) since += km / 2;
    }
    since += Object.entries(S.extra).filter(([d]) => d >= last.d).reduce((s, [, v]) => s + v, 0);
  }

  const range = S.tank * avg;
  const rem = last ? Math.max(0, range - since) : null;
  const tk = rem == null ? 0 : Math.min(4, Math.max(0, Math.ceil((rem / range) * 4)));
  const ppl = last ? last.ppl : 0.75;
  const mk = km * 22;
  const wl = avg < ideal ? mk / avg - mk / ideal : 0;

  let status = 'NONE', statusLabel = 'VUOTO', statusCls = '';
  if (last) {
    if (rem <= km * 1.15) {
      status = 'CRIT';
      statusLabel = 'FAI PIENO';
      statusCls = 'bad';
    } else if (rem <= km * 2.1) {
      status = 'LOW';
      statusLabel = 'A BREVE';
      statusCls = 'w';
    } else {
      status = 'OK';
      statusLabel = 'OK';
      statusCls = 'ok';
    }
  }

  const cpTotal = (S.carpool || []).reduce((s, x) => s + x.amount, 0);
  const netE = Math.max(0, E - cpTotal);
  const cpk = K ? E / K : 0;
  const netCpk = K ? netE / K : 0;

  const anFills = f.filter(x => x.pl === 'an');
  const wkFills = f.filter(x => x.pl === 'wk');
  const avgAn = anFills.length ? anFills.reduce((s, x) => s + x.ppl, 0) / anFills.length : null;
  const avgWk = wkFills.length ? wkFills.reduce((s, x) => s + x.ppl, 0) / wkFills.length : null;

  const totalTrackedKm = K + since;
  const maintSince = Math.max(0, totalTrackedKm - (S.maintLastKm || 0));
  const maintInt = S.maintInt || 15000;
  const maintLeft = maintInt - maintSince;
  const resPred = predictReserveDate(rem);

  return {
    f, K, avg, last, since, range, rem, tk, wl, we: wl * ppl,
    status, statusLabel, statusCls, reserveDay: resPred.label, reserveDs: resPred.ds,
    cpk, netCpk, cpTotal, avgAn, avgWk, totalTrackedKm, maintSince, maintInt, maintLeft
  };
}

  }, () => toast('Permesso GPS negato'), { timeout: 6000 });
}

   9. AGENDA, SMART WORKING, VACANZA & TIME-FINDER CONTESTUALE
   ========================================================================== */
function evOn(ds) {
  const w = new Date(ds + 'T12:00').getDay();
  return S.ev.filter(e => {
    if (e.d === ds) return true;
    if (e.d > ds) return false;
    if (e.end && ds > e.end) return false;
    if (!e.r) return false;
    if (e.r === 'd') return true;
    if (e.r === 'w') return new Date(e.d + 'T12:00').getDay() === w;
    if (e.r === 'm') return new Date(e.d + 'T12:00').getDate() === new Date(ds + 'T12:00').getDate();
    if (e.r.startsWith('i')) {
      const step = Math.max(1, parseInt(e.r.slice(1), 10) || 1);
      const diff = Math.round((new Date(ds + 'T12:00') - new Date(e.d + 'T12:00')) / 86400000);
      return diff % step === 0;
    }
    return false;
  }).sort((a, b) => a.tm.localeCompare(b.tm));
}

function toggleOffDay(ds, silent = false) {
  vib(20);
  if (isVacDay(ds) && !(S.offDays || []).includes(ds)) {
    if (!silent) toast('Giorno coperto da Modalità Vacanza');
    return false;
  }
  const idx = S.offDays.indexOf(ds);
  const swInfo = getSwSavingsInfo();
  const savedFuelEur = swInfo.perDaySaved;

  if (idx >= 0) {
    S.offDays.splice(idx, 1);
    save();
    if (!silent) { toast('Giorno lavorativo ripristinato'); R(); }
    return false;
  } else {
    lastSwUndo = {
      type: 'sw',
      ds,
      prevOffDays: [...S.offDays],
      prevSavedImpulse: S.savedImpulse || 0
    };
    S.offDays.push(ds);
    S.savedImpulse = Math.round(((S.savedImpulse || 0) + savedFuelEur) * 100) / 100;
    save();
    if (!silent) {
      toast(`Remote / Ferie · +${eur(savedFuelEur)} nel tesoretto`, 'undoSwAction()');
      R();
    }
    return true;
  }
}

function undoSwAction() {
  if (!lastSwUndo) return;
  const snap = lastSwUndo;
  lastSwUndo = null;
  if (snap.type === 'sw') {
    S.offDays = snap.prevOffDays;
    S.savedImpulse = snap.prevSavedImpulse;
  } else if (snap.type === 'tesoretto') {
    S.savedImpulse = snap.prevSavedImpulse;
    if (snap.goalIdx != null && S.goals[snap.goalIdx]) S.goals[snap.goalIdx].s = snap.prevGoalVal;
    if (snap.incId) S.inc = S.inc.filter(x => x.id !== snap.incId);
  }
  save();
  $('#to').classList.remove('on');
  toast('Azione annullata');
  R();
}

function classifyActivityContext(rawTitle) {
  const t = rawTitle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (/colazion|cappuccin|cornett|brioche/.test(t)) {
    return { kind: 'Colazione', defDur: 0.75, wkSlots: [7, 7.5, 8, 8.5, 9], weSlots: [8.5, 9, 9.5, 10], note: 'mattina' };
  }
  if (/pranz|mensa|pausa pranzo/.test(t)) {
    return { kind: 'Pranzo', defDur: 1.25, wkSlots: [12.5, 13, 13.5], weSlots: [12.5, 13, 13.5, 14], note: 'fascia pranzo' };
  }
  if (/aperitiv|spritz|happy hour/.test(t)) {
    return { kind: 'Aperitivo', defDur: 1.5, wkSlots: [18.5, 19, 19.5], weSlots: [18, 18.5, 19, 19.5], note: 'tardo pomeriggio' };
  }
  if (/\bcen(a|are|etta)\b|ristorant|pizz|sushi|trattori|osteri|hamburger/.test(t)) {
    const preferWeekend = /ragazz|greta|fidanzat|fuori|romant/.test(t);
    return { kind: 'Cena', defDur: 2, wkSlots: [20, 20.5, 21, 19.5], weSlots: [20, 20.5, 21], preferWeekend, note: 'serata' };
  }
  if (/allen|palestr|corsa|correr|nuot|calcett|padel|tennis|bici|sport|workout|yoga|pesi/.test(t)) {
    return { kind: 'Allenamento', defDur: 1.5, wkSlots: [18.5, 19, 19.5, 7, 17.5], weSlots: [10, 10.5, 16, 17, 11], note: 'fascia sport' };
  }
  if (/studi|legger|libro|corso|esam|call|riunion|lavor|progett|codic/.test(t)) {
    return { kind: 'Focus / Studio', defDur: 1.5, wkSlots: [18.5, 20.5, 21, 8], weSlots: [9.5, 10.5, 15, 16.5], note: 'concentrazione' };
  }
  if (/medic|dentist|dottor|visita|banc|post|comun|tagli|parrucchier|barbier|meccanic|gommist|commission/.test(t)) {
    return { kind: 'Commissioni / Appuntamento', defDur: 1, wkSlots: [8.5, 13, 17.5, 18, 18.5], weSlots: [9.5, 10.5, 11.5, 16], note: 'orario diurno' };
  }
  if (/cinema|film|serat|uscir|uscit|amic|concert|teatr|bowling|locale|pub/.test(t)) {
    return { kind: 'Uscita / Serata', defDur: 2.5, wkSlots: [20.5, 21, 21.5], weSlots: [20.5, 21, 21.5, 17], note: 'serata' };
  }
  return { kind: 'Generico', defDur: 1, wkSlots: [18.5, 19, 20, 20.5, 8], weSlots: [10, 11, 15.5, 17, 18.5], note: 'finestra libera' };
}

function slots(dur, rawTitle = '', preferRange = null) {
  const out = [], now = new Date();
  const ctx = classifyActivityContext(rawTitle);
  const useDur = dur || ctx.defDur;
  const wStart = hh(S.workStart || '09:00');
  const wEnd = hh(S.workEnd || '18:00');
  const commH = (S.commuteMins || 0) / 60;
  const nowH = now.getHours() + now.getMinutes() / 60;

  const startOffset = preferRange === 'next_week' ? 7 : 0;
  const maxDays = preferRange === 'this_week' ? 7 : 14;

  for (let i = startOffset; i < startOffset + maxDays && out.length < 4; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const ds = iso(d);
    const isWkDay = wk(ds);
    const bz = evOn(ds).map(e => [hh(e.tm), hh(e.tm) + (+e.dur || 1)]);

    if (isWkDay) {
      bz.push([Math.max(0, wStart - commH), Math.min(24, wEnd + commH)]);
    }

    let candidates = isWkDay ? [...ctx.wkSlots] : [...ctx.weSlots];
    if (preferRange === 'morning') candidates = candidates.filter(h => h < 12.5);
    if (preferRange === 'afternoon') candidates = candidates.filter(h => h >= 12.5 && h < 18.5);
    if (preferRange === 'evening') candidates = candidates.filter(h => h >= 18.5);
    if (!candidates.length) candidates = isWkDay ? [18.5, 19.5, 20.5] : [10.5, 15.5, 18.5, 20.5];

    const h = candidates.find(hr =>
      (i > 0 || hr > nowH + 0.25) &&
      hr + useDur <= 23.5 &&
      bz.every(([s, e]) => hr + useDur <= s || hr >= e)
    );
    if (h != null) {
      const reason = !isWkDay ? 'giornata libera' : h >= wEnd + commH ? 'dopo il rientro' : h + useDur <= wStart - commH ? 'prima del lavoro' : 'pausa';
      out.push({ ds, h, dur: useDur, reason, kind: ctx.kind });
    }
  }
  return out;
}

function slotHTML(t, dur, preferRange = null) {
  const s = slots(dur, t, preferRange);
  if (!s.length) return 'Nessuno spazio libero trovato per questa fascia.';
  return `<div class='row sp' style='margin-bottom:6px'><span class='kicker'>SLOT · ${esc(s[0].kind.toUpperCase())}</span><span class='badge'>${s[0].dur}h</span></div>` + s.map(x => {
    const tm = fmtH(x.h), dd = new Date(x.ds + 'T12:00');
    return `<div class='li'><div class='grow'>${['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'][dd.getDay()]} ${dd.getDate()} ${MESI[dd.getMonth()].slice(0, 3)} · <b>${tm}</b><div class='m'>${x.reason}</div></div><button class='btn sm' onclick="addEv('${escAttr(cap(t))}','${x.ds}','${tm}',${x.dur})">Segna</button></div>`;
  }).join('');
}

function addEv(t, d, tm, dur, r, end, silent = false) {

function addNoteOrChecklist(title, itemsOrBody, isChecklist = false, silent = false) {
  const cleanTitle = cap((title || '').trim() || (isChecklist ? 'Lista' : 'Nota veloce'));
  if (isChecklist) {
    const rawItems = Array.isArray(itemsOrBody) ? itemsOrBody : String(itemsOrBody || '').split(/,|\be\b|\n/).map(x => x.trim()).filter(Boolean);
    const existing = S.notes.find(n => n.type === 'checklist' && n.title.toLowerCase() === cleanTitle.toLowerCase());
    if (existing) {
      rawItems.forEach(txt => existing.items.push({ id: uid(), txt: cap(txt), done: false }));
      existing.updatedAt = Date.now();
      save();
      if (!silent) { toast(`Aggiunte ${rawItems.length} voci a «${existing.title}»`); R(); }
      return existing;
    }
    const note = {
      id: uid(),
      type: 'checklist',
      title: cleanTitle,
      items: rawItems.map(txt => ({ id: uid(), txt: cap(txt), done: false })),
      updatedAt: Date.now()
    };
    S.notes.unshift(note);
    save();
    if (!silent) { toast(`Checklist «${cleanTitle}» creata`); R(); }
    return note;
  } else {
    const note = {
      id: uid(),
      type: 'note',
      title: cleanTitle,
      body: String(itemsOrBody || '').trim(),
      updatedAt: Date.now()
    };
    S.notes.unshift(note);
    save();
    if (!silent) { toast(`Nota «${cleanTitle}» salvata`); R(); }
    return note;
  }
}

function toggleChecklistItem(noteId, itemId) {

  if (!n || !Array.isArray(n.items)) return;
  n.items.push({ id: uid(), txt: cap(clean), done: false });

function delParked(id, saved = false) {
  const item = S.parked.find(x => x.id === id);
  if (!item) return;
  S.parked = S.parked.filter(x => x.id !== id);
  if (saved) {
    S.savedImpulse = Math.round(((S.savedImpulse || 0) + item.amount) * 100) / 100;
    toast(`Risparmiati ${eur(item.amount)}`);
  }
  save();
  R();

function promoteParked(id) {
  const item = S.parked.find(x => x.id === id);
  if (!item) return;
  S.parked = S.parked.filter(x => x.id !== id);
  addEx('svago', item.amount, today(), item.name);
}

function impulseToGoal() {
  if (!(S.savedImpulse > 0)) return;
  const v = Math.round(S.savedImpulse * 100) / 100;
  if (S.goals.length) {
    const prevS = S.goals[0].s;
    lastSwUndo = {
      type: 'tesoretto',
      prevSavedImpulse: v,
      goalIdx: 0,
      prevGoalVal: prevS
    };
    S.goals[0].s = Math.round((S.goals[0].s + v) * 100) / 100;
    S.savedImpulse = 0;
    save();
    if (prevS < S.goals[0].t && S.goals[0].s >= S.goals[0].t) launchConfetti();
    toast(`+${eur(v)} versati in ${S.goals[0].n}`, 'undoSwAction()');
  } else {
    const incId = uid();
    lastSwUndo = {
      type: 'tesoretto',
      prevSavedImpulse: v,
      incId
    };
    S.inc.push({ id: incId, d: today(), a: v, t: 'Tesoretto risparmiato' });
    S.savedImpulse = 0;
    save();
    toast(`+${eur(v)} versati nel Patrimonio`, 'undoSwAction()');
  }
  R();
}

function goalAdd(i) {
  const v = +$('#gc' + i).value;
  if (v > 0) {
    const prevS = S.goals[i].s;
    S.goals[i].s = Math.round((S.goals[i].s + v) * 100) / 100;
    save();
    if (prevS < S.goals[i].t && S.goals[i].s >= S.goals[i].t) {
      launchConfetti();
      toast(`Obiettivo ${S.goals[i].n} raggiunto!`);
    } else {
      toast('Versati ' + eur(v));
    }
    R();
  }
}

function addDebt(who, a, dir, silent = false) {
  const val = Math.round((+a || 0) * 100) / 100;
  S.debts.push({ id: uid(), who, a: val, dir, d: today() });
  save();
  if (!silent) R();
  return dir === 'due' ? `<b>${esc(who)}</b> ti deve <b>${eur(val)}</b>.` : `Devi <b>${eur(val)}</b> a <b>${esc(who)}</b>.`;
}

function settle(i, silent = false) {
  const g = S.debts[i];
  if (!g) return;
  g.p = 1;
  if (g.dir === 'due') S.inc.push({ id: uid(), d: today(), a: g.a, t: 'Rimborso ' + g.who });
  else S.ex.push({ id: uid(), d: today(), c: 'altro', a: g.a, n: 'Saldo ' + g.who });
  save();
  if (!silent) {
    toast(g.dir === 'due' ? `Ricevuti ${eur(g.a)} da ${g.who}` : `Saldati ${eur(g.a)} a ${g.who}`);
    R();
  }
}

function cal() {
  const base = new Date();
  base.setDate(base.getDate() + weekOff * 7);
  const dow = (base.getDay() + 6) % 7;
  const mon = new Date(base);
  mon.setDate(base.getDate() - dow);

  const wDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    wDays.push(d);
  }

  const selDate = new Date(sel + 'T12:00');
  const ev = evOn(sel), exs = S.ex.filter(e => e.d === sel), incs = S.inc.filter(i => i.d === sel);
  const cats = getCats();

  return `
    <div class='row sp' style='margin-bottom:12px'>
      <div>
        <span class='kicker'>AGENDA</span>
        <h1>${MESI[mon.getMonth()]} ${mon.getFullYear()}</h1>
      </div>
      <div class='row' style='gap:6px'>
        <button class='icon-btn' onclick='openMonthSheet()' aria-label='Mese'>${I('cal', 16)}</button>
        <button class='icon-btn' onclick='openTimeFinderSheet()' aria-label='Cerca spazio'>${I('search', 16)}</button>
        <button class='btn sm' onclick='openEventSheet()'>Nuovo</button>
      </div>
    </div>

    <div class='row sp' style='margin-bottom:8px'>
      <button class='btn s sm' onclick='weekOff--;R()'>‹</button>
      <button class='btn s sm' onclick="weekOff=0;sel=today();R()">Oggi</button>
      <button class='btn s sm' onclick='weekOff++;R()'>›</button>
    </div>

    <div class='week-grid' style='margin-bottom:12px'>
      ${wDays.map(d => {
        const ds = iso(d);
        const ne = evOn(ds).length;
        const nx = S.ex.some(e => e.d === ds);
        const ni = S.inc.some(i => i.d === ds);
        const noff = isOffDay(ds);
        const dn = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'][(d.getDay() + 6) % 7];
        return `<button class="wday lp ${ds === today() ? 't ' : ''}${ds === sel ? 's ' : ''}${noff ? 'off' : ''}"
          onpointerdown="lpStart(()=>openDayQuickActions('${ds}'))"
          onpointerup="lpEnd()"
          onpointerleave="lpEnd()"
          onclick="lpTap(()=>{sel='${ds}';R()})">
          <span class='wn'>${dn}</span>
          <span class='wd'>${d.getDate()}</span>
          <span class='wdots'>${ne ? '<u></u>' : ''}${nx ? '<u></u>' : ''}${ni ? `<u style='background:${ds === sel ? '#000000' : 'var(--ok)'}'></u>` : ''}</span>
        </button>`;
      }).join('')}
    </div>

    <h2>${DN[selDate.getDay()]} ${selDate.getDate()} ${MESI[selDate.getMonth()].slice(0, 3)}</h2>
    <div class='card'>
      ${isScheduledWorkday(sel) && S.commuteMode !== 'remote' ? `<div class='row sp' style='padding-bottom:10px;border-bottom:1px solid var(--b);margin-bottom:6px'>
        <b style='font-size:12.5px'>${isVacDay(sel) ? 'Modalità Vacanza' : isOffDay(sel) ? 'Remote / Ferie' : `Sede (${S.workStart}–${S.workEnd})`}</b>
        <button class='btn ${isOffDay(sel) ? '' : 's'} sm' onclick="toggleOffDay('${sel}')">${isOffDay(sel) ? '0 km' : (S.kmDay || 92) + ' km'}</button>
      </div>` : ''}
      ${ev.map(e => {
        const rLabel = e.r === 'w' ? 'Sett' : e.r === 'd' ? 'Giorno' : e.r === 'm' ? 'Mese' : (e.r && e.r.startsWith('i')) ? `${e.r.slice(1)}g` : '';
        return `<div class='li'><b>${e.tm}</b><span class='grow'>${esc(e.t)}${rLabel ? ` <span class='badge'>${rLabel}</span>` : ''}</span><button class='x' onclick="delEv('${e.id}')">✕</button></div>`;
      }).join('')}
      ${incs.map(i => `<div class='li'><span class='dot' style='background:var(--ok)'></span><span class='grow'>${esc(i.t || 'Entrata')}</span><b class='ok money-val'>+ ${eur(i.a)}</b><button class='x' onclick="delInc('${i.id}')">✕</button></div>`).join('')}
      ${exs.map(e => `<div class='li'><span class='dot' style='background:${(cats[e.c] || CAT_BASE.altro)[1]}'></span><span class='grow' onclick="openEd('${e.id}')">${(cats[e.c] || CAT_BASE.altro)[0]}${e.vac ? ` <span class='badge vac'>VACANZA</span>` : ''}</span><b class='money-val'>- ${eur(e.a)}</b><button class='x' onclick="delEx('${e.id}')">✕</button></div>`).join('')}
      ${!ev.length && !exs.length && !incs.length ? `<span class='m'>Nessun impegno.</span>` : ''}
    </div>`;

function renderSpotlightContent(qRaw) {
  const q = (qRaw || '').trim().toLowerCase();
  if (!q) return '';
  const cats = getCats();

  const matchedEx = S.ex.filter(e => {
    const catName = (cats[e.c]?.[0] || '').toLowerCase();
    const note = (e.n || '').toLowerCase();
    const amt = String(e.a).replace('.', ',');
    const dateIt = e.d.split('-').reverse().join('/');
    const vacTag = e.vac ? 'vacanza ferie' : '';
    return catName.includes(q) || note.includes(q) || amt.includes(q) || dateIt.includes(q) || e.d.includes(q) || vacTag.includes(q);
  }).map(e => ({
    kind: 'ex',
    id: e.id,
    d: e.d,
    title: e.n || (cats[e.c]?.[0] || 'Altro'),
    sub: `${cats[e.c]?.[0] || 'Altro'} · ${e.d.split('-').reverse().join('/')}`,
    a: +e.a || 0,
    vac: Boolean(e.vac),
    rec: Boolean(e.rec)
  }));

  const matchedInc = S.inc.filter(i => {
    const title = (i.t || 'Entrata').toLowerCase();
    const amt = String(i.a).replace('.', ',');
    const dateIt = i.d.split('-').reverse().join('/');
    return title.includes(q) || amt.includes(q) || dateIt.includes(q) || i.d.includes(q) || 'entrata'.includes(q);
  }).map(i => ({
    kind: 'inc',
    id: i.id,
    d: i.d,
    title: i.t || 'Entrata',
    sub: `Entrata · ${i.d.split('-').reverse().join('/')}`,
    a: +i.a || 0
  }));

  const totOut = Math.round(matchedEx.reduce((s, x) => s + x.a, 0) * 100) / 100;
  const totIn = Math.round(matchedInc.reduce((s, x) => s + x.a, 0) * 100) / 100;
  const net = Math.round((totIn - totOut) * 100) / 100;
  const all = [...matchedEx, ...matchedInc].sort((a, b) => b.d.localeCompare(a.d));

  return `
    <div class='card' style='margin-top:6px'>
      <div class='row sp' style='margin-bottom:8px'>
        <span class='kicker'>RISULTATI SPOTLIGHT</span>
        <span class='badge'>${all.length} movimenti</span>
      </div>
      <div class='kpi-grid'>
        <div class='kpi-box'><span class='m'>Uscite</span><b class='bad money-val'>-${eur(totOut)}</b></div>
        <div class='kpi-box'><span class='m'>Entrate</span><b class='ok money-val'>+${eur(totIn)}</b></div>
        <div class='kpi-box'><span class='m'>Netto</span><b class='${net >= 0 ? 'ok' : 'bad'} money-val'>${net >= 0 ? '+' : ''}${eur(net)}</b></div>
      </div>
    </div>
    ${all.length ? all.map(item => item.kind === 'ex'
      ? `<div class='li-card'>
          <div class='grow' style='cursor:pointer' onclick="openEd('${item.id}')">
            <div style='font-weight:600;font-size:12.5px'>${esc(item.title)}${item.vac ? ` <span class='badge vac'>VACANZA</span>` : ''}${item.rec ? ` <span class='badge'>Foto</span>` : ''}</div>
            <div class='m'>${item.sub}</div>
          </div>
          <div class='row' style='gap:8px'>
            <b class='money-val' style='font-size:12.5px'>- ${eur(item.a)}</b>
            <button class='x' onclick="delEx('${item.id}')">✕</button>
          </div>
        </div>`
      : `<div class='li-card'>
          <div class='grow'>
            <div style='font-weight:600;font-size:12.5px'>${esc(item.title)}</div>
            <div class='m'>${item.sub}</div>

function chartScrub(ev) {
  const svg = $('#an-svg');
  if (!svg || !activeChartCoords.length) return;
  const rect = svg.getBoundingClientRect();
  const relX = ((ev.clientX - rect.left) / rect.width) * 350;
  let nearest = activeChartCoords[0];
  let best = Math.abs(relX - nearest.x);
  for (const p of activeChartCoords) {
    const d = Math.abs(relX - p.x);
    if (d < best) { best = d; nearest = p; }
  }
  const vline = $('#an-vline');
  const dot = $('#an-dot');
  if (vline) { vline.setAttribute('x1', nearest.x); vline.setAttribute('x2', nearest.x); vline.style.display = 'block'; }
  if (dot) { dot.setAttribute('cx', nearest.x); dot.setAttribute('cy', nearest.y); }
  const valEl = $('#an-curr-val');
  const lblEl = $('#an-curr-lbl');
  if (valEl) valEl.textContent = eur(nearest.v);
  if (lblEl) lblEl.textContent = `${activeChartMeta.title} · ${nearest.label}`;
}

function chartReset() {
  if (!activeChartCoords.length) return;
  const last = activeChartCoords[activeChartCoords.length - 1];
  const vline = $('#an-vline');
  const dot = $('#an-dot');
  if (vline) vline.style.display = 'none';
  if (dot) { dot.setAttribute('cx', last.x); dot.setAttribute('cy', last.y); }
  const valEl = $('#an-curr-val');
  const lblEl = $('#an-curr-lbl');
  if (valEl) valEl.textContent = eur(last.v);
  if (lblEl) lblEl.textContent = activeChartMeta.title;
}

/* ==========================================================================
   14. BOTTOM SHEETS (TASTIERINO CON SPLIT, NOTE, AGENDA, AUTO)
   ========================================================================== */
let nps = null, eds = null, lastInc = null;

function qe(i) {
  if (i === 0) addEx('heets', 5.5);
  else if (i === 1) addEx('caffe', 0.35);
  else if (i === 2) addEx('benz', 20);
}

function openCustomPreset(cat, noteLabel) {
  np(today(), 'ex', cat);
  nps.n = noteLabel;
  npR();
}

function np(d, mode = 'ex', defaultCat = 'altro') {
  vib(15);
  const l = S.fills[S.fills.length - 1];
  nps = { mode, v: '', c: defaultCat, incType: 0, d: d || today(), p: l ? l.ppl : '', pl: 'an', n: '', recB64: null, splitN: 1, splitWho: '' };
  npR();
}

function closeNp() {
  vib(12);
  $('#sh').classList.remove('on');
}

function nk(i) {
  vib(10);
  const k = KEYS[i];
  if (k === '<') nps.v = nps.v.slice(0, -1);
  else if (k === ',') { if (!nps.v.includes(',')) nps.v = (nps.v || '0') + ','; }
  else if (nps.v.length < 7) nps.v += k;
  npR();
}

async function handleNpReceipt(inpEl) {
  const f = inpEl.files && inpEl.files[0];
  if (!f) return;
  nps.recB64 = await compressImage(f);
  toast('Allegato pronto');
  npR();
}

function npR() {
  const isInc = nps.mode === 'inc';
  const cats = getCats();
  const cKeys = getCatKeys();
  const splitActive = !isInc && nps.c !== 'gpl' && nps.splitN > 1;
  const rawVal = +nps.v.replace(',', '.') || 0;
  const myShare = splitActive ? Math.round((rawVal / nps.splitN) * 100) / 100 : rawVal;

  openSheet(`
    <div class='row sp' style='padding-bottom:10px;border-bottom:1px solid var(--b)'>
      <div class='row' style='gap:8px'>
        <div class='seg' style='width:168px'>
          <button class="${!isInc ? 'on' : ''}" onclick="vib(12);nps.mode='ex';npR()">Spesa</button>
          <button class="${isInc ? 'on' : ''}" onclick="vib(12);nps.mode='inc';npR()">Entrata</button>
        </div>
        ${!isInc && S.vacMode ? `<span class='badge vac'>VACANZA</span>` : ''}
      </div>
      <button class='x' onclick='closeNp()'>Chiudi</button>
    </div>

    <div class='big money-val' style='text-align:center;margin:12px 0 4px'>${nps.v || '0'} €</div>
    ${splitActive && rawVal > 0 ? `<div class='m' style='text-align:center;margin-bottom:8px'>La tua quota: <b style='color:var(--t)'>${eur(myShare)}</b> (credito ${eur(rawVal - myShare)})</div>` : ''}

    ${isInc
      ? `<div class='chips' style='justify-content:center;margin-bottom:6px'>${IT.map((t, i) => `<button class='chip ${nps.incType === i ? 'on' : ''}' onclick="vib(12);nps.incType=${i};npR()">${t}</button>`).join('')}</div>`
      : `<div class='chips' style='margin-bottom:6px'>${cKeys.map(k => `<button class='chip ${nps.c === k ? 'on' : ''}' onclick="vib(12);nps.c='${k}';npR()">${cats[k][0]}</button>`).join('')}</div>`
    }

    ${!isInc && nps.c === 'gpl' ? `<div class='g2' style='margin-top:6px'>
      <div><label>Prezzo €/L</label><input type='number' step='.001' value='${nps.p}' oninput='nps.p=this.value'></div>
      <div><label>Sede <button class='btn s sm' style='padding:2px 6px;margin-left:4px' onclick="detectGpsLocation('#np_pl')">GPS</button></label>
        <select id='np_pl' onchange='nps.pl=this.value'><option value='an' ${nps.pl === 'an' ? 'selected' : ''}>${esc(S.homeLabel || 'Casa')}</option><option value='wk' ${nps.pl === 'wk' ? 'selected' : ''}>${esc(S.workLabel || 'Sede')}</option></select>
      </div>
    </div>` : ''}

    ${!isInc && nps.c !== 'gpl' ? `<div class='row sp' style='margin-top:6px'>
      <span class='m'>Dividi alla romana</span>
      <div class='seg' style='width:140px'>
        ${[1, 2, 3, 4].map(n => `<button class="${nps.splitN === n ? 'on' : ''}" onclick="vib(10);nps.splitN=${n};npR()">${n === 1 ? 'No' : '÷' + n}</button>`).join('')}
      </div>
    </div>
    ${splitActive ? `<div style='margin-top:6px'><input placeholder='Chi ti deve la differenza? (es. Greta)' value='${esc(nps.splitWho)}' oninput='nps.splitWho=this.value'></div>` : ''}` : ''}

    <div class='keys'>${KEYS.map((k, i) => `<button onclick='nk(${i})'>${k === '<' ? '⌫' : k}</button>`).join('')}</div>

    <div class='g2'>
      <div><label>Data</label><input type='date' value='${nps.d}' max='${today()}' onchange='nps.d=this.value'></div>
      <div><label>Nota</label><input placeholder='Opzionale' value='${esc(nps.n)}' oninput='nps.n=this.value'></div>
    </div>

    ${!isInc ? `<div class='row' style='margin-top:10px'>
      <button class='btn s' style='flex:1' onclick="$('#np_rec').click()">${nps.recB64 ? 'Foto allegata' : 'Allega scontrino'}</button>
      <input type='file' id='np_rec' accept='image/*' capture='environment' hidden onchange='handleNpReceipt(this)'>
    </div>` : ''}

    <button class='btn' style='width:100%;margin-top:10px' onclick='saveNp()'>Salva</button>
  `);
}

function saveNp() {
  const a = +nps.v.replace(',', '.');
  if (!(a > 0)) return toast('Inserisci un importo');
  if (nps.mode === 'inc') {
    addInc(a, nps.d, nps.n.trim() || IT[nps.incType]);
  } else if (nps.c === 'gpl') {
    if (!+nps.p) return toast('Inserisci €/L');
    addFill(a, +nps.p, nps.pl, nps.d);
  } else {
    const id = uid();
    if (nps.recB64) DB.save(id, nps.recB64);
    if (nps.splitN > 1) {
      const share = Math.round((a / nps.splitN) * 100) / 100;
      const credit = Math.round((a - share) * 100) / 100;
      const who = cap(nps.splitWho.trim() || 'Amici');
      addEx(nps.c, share, nps.d, `${nps.n || 'Spesa divisa'} (1/${nps.splitN})`, Boolean(nps.recB64), id, true);
      addDebt(who, credit, 'due', true);
      toast(`Quota ${eur(share)} · Credito ${eur(credit)} (${who})`);
      R();
    } else {
      addEx(nps.c, a, nps.d, nps.n, Boolean(nps.recB64), id);
    }
  }
  closeNp();
}

function openEd(id) {
  const e = S.ex.find(x => x.id === id);
  if (!e) return;
  if (e.fid) return toast('Modifica dalla scheda Auto');
  eds = { id, a: String(e.a), c: e.c, d: e.d, n: e.n || '', rec: Boolean(e.rec), vac: Boolean(e.vac) };
  edR();
}

async function handleEdReceipt(inpEl) {
  const f = inpEl.files && inpEl.files[0];
  if (!f) return;
  const b64 = await compressImage(f);
  DB.save(eds.id, b64);
  eds.rec = true;
  const e = S.ex.find(x => x.id === eds.id);
  if (e) e.rec = true;
  save();
  toast('Foto salvata');
  edR();
}

function edR() {
  const cats = getCats();
  const cKeys = getCatKeys();
  openSheet(`
    <div class='row sp'><b style='font-size:15px'>Modifica spesa</b><button class='x' onclick='closeNp()'>Chiudi</button></div>
    <div class='chips' style='margin-top:10px'>${cKeys.map(k => `<button class='chip ${eds.c === k ? 'on' : ''}' onclick="eds.c='${k}';edR()">${cats[k][0]}</button>`).join('')}</div>
    <label>Importo €</label>
    <input type='number' step='.01' value='${eds.a}' oninput='eds.a=this.value'>
    <div class='g2'>
      <div><label>Data</label><input type='date' value='${eds.d}' max='${today()}' onchange='eds.d=this.value'></div>
      <div><label>Nota</label><input value='${esc(eds.n)}' oninput='eds.n=this.value'></div>
    </div>
    <div class='row sp' style='margin-top:10px'>
      <span class='m'>Tagga come spesa Vacanza</span>
      <button type='button' class='sw-toggle ${eds.vac ? 'on' : ''}' onclick='eds.vac=!eds.vac;edR()'><i></i></button>
    </div>
    <div class='g2' style='margin-top:10px'>
      ${eds.rec ? `<button class='btn s' onclick="viewReceipt('${eds.id}')">Vedi foto</button>` : ''}
      <button class='btn s' style='${eds.rec ? '' : 'grid-column:span 2'}' onclick="$('#ed_rec').click()">${eds.rec ? 'Sostituisci' : 'Allega foto'}</button>
      <input type='file' id='ed_rec' accept='image/*' capture='environment' hidden onchange='handleEdReceipt(this)'>
    </div>
    <div class='g2' style='margin-top:12px'>
      <button class='btn d' onclick="delEx(eds.id);closeNp()">Elimina</button>
      <button class='btn' onclick='saveEd()'>Salva</button>
    </div>
  `);
}

function saveEd() {
  const a = +String(eds.a).replace(',', '.');
  if (!(a > 0)) return toast('Importo non valido');
  const e = S.ex.find(x => x.id === eds.id);
  if (e) Object.assign(e, { a, c: eds.c, d: eds.d, n: eds.n, rec: eds.rec, vac: eds.vac });
  save();
  closeNp();
  toast('Aggiornato');
  R();
}

async function cloudCreateBin() {
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  if (!key) return toast('Inserisci Master Key');
  S.cloud.key = key;
  save(true);
  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Name': 'LeoWealth', 'X-Bin-Private': 'true' },
      body: JSON.stringify(S)
    });
    const j = await res.json();
    if (j && j.metadata && j.metadata.id) {
      S.cloud.bin = j.metadata.id;
      S.cloud.lastSync = Date.now();
      save(true);
      toast('Bin creato: ' + j.metadata.id);
      R();
    } else toast('Chiave non valida');
  } catch (e) { toast('Errore di rete'); }
}

async function cloudPush(silent = false) {
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) { if (!silent) toast('Dati Cloud mancanti'); return; }
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key },
      body: JSON.stringify(S)
    });
    if (res.ok) {
      S.cloud.lastSync = Date.now();
      try { localStorage.setItem('lw', JSON.stringify(S)); } catch (e) {}
      if (!silent) { toast('Salvato su Cloud'); R(); }
    } else if (!silent) toast('Errore Cloud');
  } catch (e) { if (!silent) toast('Errore di rete'); }
}

async function cloudPull(silent = false) {
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) { if (!silent) toast('Dati Cloud mancanti'); return; }
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, { headers: { 'X-Master-Key': key } });
    const j = await res.json();
    if (j && j.record) {
      const remoteUpdated = +j.record.updatedAt || 0;
      if (silent && remoteUpdated <= (S.updatedAt || 0)) return;
      const keepCloud = Object.assign({}, S.cloud, { lastSync: Date.now() });
      S = migrate(j.record);
      S.cloud = keepCloud;
      save(true);
      R();
      if (!silent) toast('Dati caricati dal Cloud');
    } else if (!silent) toast('Bin non trovato');
  } catch (e) { if (!silent) toast('Errore di rete'); }
}

   16. MOTORE NLU UNIVERSALE MULTI-COMANDO (RETTIFICA, CHECKLIST, AGENDA, FINANZE)
