<style>
:root{
  color-scheme:dark;
  --t:#f5f5f7;
  --m:#8e8e93;
  --g:rgba(255,255,255,.07);

html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}

body{

}
main{max-width:540px;width:100%;margin:auto;padding:12px 14px}

}
.row{display:flex;align-items:center;gap:10px;min-width:0}

.big{font-size:clamp(24px,7vw,32px);font-weight:700;letter-spacing:-.8px;line-height:1.1}

button,input,select{font:inherit;color:var(--t)}

/* Font-size 16px sugli input evita lo zoom automatico di Safari su iPhone */

.badge.w{background:#ff9f0a26;color:var(--w)}
.badge.p{background:#bf5af226;color:var(--p)}
.codebox{background:#00000066;border:1px solid var(--b);border-radius:11px;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#d1d1d6;overflow-x:auto;white-space:nowrap}

/* Modalità Ufficio / Privacy: sfoca gli importi, rivela tenendo premuto */
body.blur-mode .money-val{filter:blur(7px);opacity:.72;transition:filter .18s}
body.blur-mode .money-val:active{filter:none;opacity:1}
</style>

<body>
<main id="v"></main>
<div class="toast" id="to"></div>
<button class="fab" aria-label="Nuova spesa" onclick="np(today())">+</button>
<nav id="nv"></nav>
<div class="sheet" id="sh"></div>

<script>
/* ==========================================================================
   1. UTILITY, FEEDBACK APTICO, VERSIONING & SERVICE WORKER NETWORK-FIRST
   ========================================================================== */
const APP_VER = '2.5';
let storagePersisted = false;

const $ = s => document.querySelector(s),
      pad = n => String(n).padStart(2, '0'),
      iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      today = () => iso(new Date()),
      eur = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',') + ' €',
      esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
      escAttr = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;'),
      uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

const vib = (pattern = 35) => {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
};

function copyText(text, label = 'Copiato negli appunti') {
  vib(25);
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(label);
  } catch (e) {
    toast('Impossibile copiare');
  }
}

async function requestPersistentStorage() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      storagePersisted = await navigator.storage.persisted();
      if (!storagePersisted) {
        storagePersisted = await navigator.storage.persist();
      }
    }
  } catch (e) {}
}

// Service Worker Network-First: scarica sempre l'ultima versione da GitHub se online,
// usa la cache solo offline e non tocca mai localStorage/IndexedDB
(function initServiceWorker() {
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const code = `
        const CACHE = 'leo-wealth-v${APP_VER}';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => {
          e.waitUntil(
            caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
              .then(() => self.clients.claim())
          );
        });
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET' || !e.request.url.startsWith(self.location.origin)) return;
          e.respondWith(
            fetch(e.request, { cache: 'no-store' })
              .then(r => {
                if (r && r.status === 200) {
                  const copy = r.clone();
                  caches.open(CACHE).then(c => c.put(e.request, copy));
                }
                return r;
              })
              .catch(() => caches.match(e.request))
          );
        });
      `;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'application/javascript' }))).catch(() => {});
    }
  } catch (e) {}
})();

async function forceAppUpdate() {
  vib(30);
  save(true);
  toast('Aggiornamento codice in corso (dati al sicuro)…');
  try {
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch (e) {}
  setTimeout(() => {
    const url = new URL(location.href);
    url.searchParams.set('_v', String(Date.now()));
    location.replace(url.toString());
  }, 350);
}

/* ==========================================================================
   2. INDEXED DB PER SCONTRINI (NON SATURA I 5MB DI LOCALSTORAGE SU IOS)
   ========================================================================== */
const DB = {
  db: null,
  init: () => new Promise(r => {
    try {
      const q = indexedDB.open('LW_Store', 1);
      q.onupgradeneeded = e => {
        if (!e.target.result.objectStoreNames.contains('receipts')) {
          e.target.result.createObjectStore('receipts');
        }
      };
      q.onsuccess = e => { DB.db = e.target.result; r(); };
      q.onerror = () => r();
    } catch (e) { r(); }
  }),
  save: (id, b64) => {
    try {
      if (DB.db) DB.db.transaction('receipts', 'readwrite').objectStore('receipts').put(b64, id);
    } catch (e) {}
  },
  del: id => {
    try {
      if (DB.db) DB.db.transaction('receipts', 'readwrite').objectStore('receipts').delete(id);
    } catch (e) {}
  },
  get: id => new Promise(r => {
    try {
      if (!DB.db) return r(null);
      const q = DB.db.transaction('receipts').objectStore('receipts').get(id);
      q.onsuccess = () => r(q.result || null);
      q.onerror = () => r(null);
    } catch (e) { r(null); }
  })
};
DB.init();

function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.68));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function viewReceipt(id) {
  const b64 = await DB.get(id);
  if (!b64) return toast('Nessuno scontrino allegato');
  $('#sh').innerHTML = `<div>
    <div class='row sp'><b>🧾 Scontrino</b><button class='x' style='color:#8e8e93' onclick='closeNp()'>✕</button></div>
    <img src='${b64}' alt='Scontrino' style='width:100%;border-radius:16px;margin-top:12px;display:block'>
    <button class='btn s' style='width:100%;margin-top:12px' onclick='closeNp()'>Chiudi</button>
  </div>`;
  $('#sh').classList.add('on');
}

/* ==========================================================================
   3. STATO APPLICATIVO ('lw'), MIGRAZIONE SCHEMA & SALVATAGGIO SICURO
   ========================================================================== */
const CAT = {
  heets: ['Heets', '#ff9f0a'],
  caffe: ['Caffè', '#bf5af2'],
  cibo:  ['Cibo fuori', '#ffd60a'],
  benz:  ['Benzina', '#ff453a'],
  gpl:   ['GPL', '#30d158'],
  svago: ['Svago', '#0a84ff'],
  altro: ['Altro', '#8e8e93']
};
const CK = Object.keys(CAT);
const FIX = { heets: 5.5, caffe: 0.35, benz: 20 };
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
const DN = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const KEYS = [1, 2, 3, 4, 5, 6, 7, 8, 9, ',', 0, '<'];
const IT = ['Stipendio', 'Regalo', 'Altro'];

function defaultState() {
  return {
    schemaVer: 5,
    updatedAt: 0,
    sal: 700,
    bud: 230,
    payDay: 1,          // Giorno del mese in cui arriva lo stipendio (1..31)
    liq0: 0,
    tank: 30,
    kmDay: 92,          // Tratta giornaliera A/R Ancona–Cingoli
    idealKmL: 15.5,     // Rendimento ideale km/L
    ex: [],
    fills: [],
    ev: [],
    extra: {},
    inc: [],
    rec: [],
    goals: [],
    debts: [],
    offDays: [],        // Giorni di Smart Working / Ferie: ['YYYY-MM-DD', ...]
    parked: [],         // Regola 48h: [{ id, name, amount, createdAt }]
    savedImpulse: 0,    // Soldi risparmiati rinunciando agli acquisti parcheggiati
    carpool: [],        // Rimborsi passaggi SS76: [{ id, d, amount, note }]
    maintLastKm: 0,     // Km totali al momento dell'ultimo tagliando
    maintInt: 15000,    // Intervallo tagliando in km
    priv: false,        // Modalità Ufficio / Privacy
    cloud: { key: '', bin: '', lastSync: 0 }
  };
}

function migrate(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;
  const out = Object.assign({}, base, raw);

  if (raw.cap != null && !raw.liq0) out.liq0 = +raw.cap || 0;
  if (raw.payday != null && !raw.payDay) out.payDay = +raw.payday || 1;
  if (raw.maintBase != null && !raw.maintLastKm) out.maintLastKm = +raw.maintBase || 0;
  if (raw.lastServiceKm != null && !raw.maintLastKm) out.maintLastKm = +raw.lastServiceKm || 0;
  if (raw.serviceInt != null && !raw.maintInt) out.maintInt = +raw.serviceInt || 15000;
  if (Array.isArray(raw.park) && !Array.isArray(raw.parked)) out.parked = raw.park;
  if (raw.savedImp != null && !raw.savedImpulse) out.savedImpulse = +raw.savedImp || 0;
  if (raw.sw && !Array.isArray(raw.offDays)) {
    out.offDays = Object.keys(raw.sw).filter(k => raw.sw[k]);
  }
  if ((raw.binKey || raw.binId) && (!raw.cloud || !raw.cloud.key)) {
    out.cloud = { key: raw.binKey || '', bin: raw.binId || '', lastSync: 0 };
  }

  out.schemaVer = base.schemaVer;
  out.updatedAt = +out.updatedAt || 0;
  out.sal = +out.sal || 0;
  out.bud = +out.bud || 0;
  out.payDay = Math.min(31, Math.max(1, +out.payDay || 1));
  out.liq0 = +out.liq0 || 0;
  out.tank = +out.tank || 30;
  out.kmDay = +out.kmDay || 92;
  out.idealKmL = +out.idealKmL || 15.5;
  out.savedImpulse = +out.savedImpulse || 0;
  out.maintLastKm = +out.maintLastKm || 0;
  out.maintInt = +out.maintInt || 15000;
  out.priv = Boolean(out.priv);

  ['ex', 'fills', 'ev', 'inc', 'rec', 'goals', 'debts', 'offDays', 'parked', 'carpool'].forEach(k => {
    if (!Array.isArray(out[k])) out[k] = [];
  });
  if (!out.extra || typeof out.extra !== 'object' || Array.isArray(out.extra)) out.extra = {};
  out.cloud = Object.assign({ key: '', bin: '', lastSync: 0 }, out.cloud || {});

  delete out.cap;
  delete out.maintBase;
  delete out.sw;
  return out;
}

let S = defaultState();
try {
  S = migrate(JSON.parse(localStorage.getItem('lw') || '{}'));
} catch (e) {}

let syncTimer = null;
const save = (skipCloud = false) => {
  S.updatedAt = Date.now();
  try { localStorage.setItem('lw', JSON.stringify(S)); } catch (e) {}
  if (!skipCloud && S.cloud && S.cloud.key && S.cloud.bin) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => cloudPush(true), 2500);
  }
};

let tab = 'home', cm = new Date(), sel = today(), cycOff = 0, chartMode = '14d', ans = '', pend = null;

// Giorno lavorativo reale (lun-ven esclusi i giorni di Smart Working / Ferie)
const isWeekday = ds => { const w = new Date(ds + 'T12:00').getDay(); return w > 0 && w < 6; };
const isOffDay = ds => (S.offDays || []).includes(ds);
const wk = ds => isWeekday(ds) && !isOffDay(ds);
const hh = t => { const [a, b] = t.split(':'); return +a + +b / 60; };

/* ==========================================================================
   4. SWIPE-TO-DELETE TOLLERANTE ALLO SCORRIMENTO VERTICALE
   ========================================================================== */
let tX = 0, tY = 0, tLi = null, swiping = false;
document.addEventListener('touchstart', e => {
  const el = e.target.closest('.li');
  if (!el || !el.querySelector('.x')) return;
  tLi = el;
  tX = e.touches[0].clientX;
  tY = e.touches[0].clientY;
  swiping = false;
  el.style.transition = 'none';
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!tLi) return;
  const dx = e.touches[0].clientX - tX;
  const dy = e.touches[0].clientY - tY;
  if (!swiping) {
    if (Math.abs(dy) > Math.abs(dx)) { tLi = null; return; }
    if (Math.abs(dx) > 10) swiping = true;
  }
  if (swiping && dx < 0) {
    tLi.style.transform = `translateX(${Math.max(-110, dx)}px)`;
  }
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!tLi) return;
  const dx = e.changedTouches[0].clientX - tX;
  tLi.style.transition = 'transform .22s ease-out';
  if (swiping && dx < -68) {
    vib([25, 35]);
    tLi.style.transform = 'translateX(-100vw)';
    const btn = tLi.querySelector('.x');
    setTimeout(() => { if (btn) btn.click(); }, 180);
  } else {
    tLi.style.transform = 'translateX(0)';
  }
  tLi = null;
  swiping = false;
});

/* ==========================================================================
   5. CICLO BUDGET SUL GIORNO DI PAGA & STATISTICHE
   ========================================================================== */
function getCycleRange(offset = 0) {
  const pd = Math.min(31, Math.max(1, +S.payDay || 1));
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  const dimCurr = new Date(y, m + 1, 0).getDate();
  const effCurr = Math.min(pd, dimCurr);
  if (now.getDate() < effCurr) {
    m -= 1;
    if (m < 0) { m = 11; y -= 1; }
  }
  const startDate = new Date(y, m + offset, 1);
  const sy = startDate.getFullYear(), sm = startDate.getMonth();
  const sDim = new Date(sy, sm + 1, 0).getDate();
  const start = new Date(sy, sm, Math.min(pd, sDim));

  const nextMonth = new Date(sy, sm + 1, 1);
  const ny = nextMonth.getFullYear(), nm = nextMonth.getMonth();
  const nDim = new Date(ny, nm + 1, 0).getDate();
  const nextStart = new Date(ny, nm, Math.min(pd, nDim));
  const end = new Date(nextStart.getTime() - 86400000);

  const startStr = iso(start);
  const endStr = iso(end);
  const totalDays = Math.round((end - start) / 86400000) + 1;
  const label = pd === 1
    ? `${MESI[sm]} ${sy}`
    : `${start.getDate()} ${MESI[sm].slice(0, 3)} – ${end.getDate()} ${MESI[nm].slice(0, 3)}`;

  return { startStr, endStr, totalDays, label };
}

function stats(offset = 0) {
  const cyc = getCycleRange(offset);
  const t = today();
  const exList = S.ex.filter(e => e.d >= cyc.startStr && e.d <= cyc.endStr);
  const spent = exList.reduce((s, e) => s + e.a, 0);
  const rem = S.bud - spent;
  const sDate = new Date(cyc.startStr + 'T12:00');
  const eDate = new Date(cyc.endStr + 'T12:00');
  const tDate = new Date(t + 'T12:00');

  let elapsed = Math.floor((tDate - sDate) / 86400000) + 1;
  elapsed = Math.min(cyc.totalDays, Math.max(1, elapsed));
  let left = Math.floor((eDate - tDate) / 86400000) + 1;
  left = Math.min(cyc.totalDays, Math.max(1, left));

  return {
    cyc,
    exList,
    dim: cyc.totalDays,
    spent,
    rem,
    left,
    day: elapsed,
    daily: Math.max(0, rem) / left,
    per: S.bud / cyc.totalDays,
    goal: S.sal - S.bud
  };
}

function catSumRange(startStr, endStr) {
  const o = {};
  S.ex.filter(e => e.d >= startStr && e.d <= endStr).forEach(e => o[e.c] = (o[e.c] || 0) + e.a);
  return o;
}

function liq() {

// Calcola giorni passati dall'ultimo acquisto Heets (per il badge sul pulsante rapido)
function heetsTimer() {
  const h = S.ex.filter(e => e.c === 'heets').sort((a, b) => b.d.localeCompare(a.d));
  if (!h.length) return { badge: '5,50 €', days: null, freq: null };
  const last = new Date(h[0].d + 'T12:00');
  const now = new Date(today() + 'T12:00');
  const diff = Math.max(0, Math.round((now - last) / 86400000));
  const badge = diff === 0 ? '5,50 € · Oggi' : diff === 1 ? '5,50 € · Ieri' : `5,50 € · ${diff}g fa`;
  let freq = null;
  if (h.length >= 2) {
    const first = new Date(h[h.length - 1].d + 'T12:00');
    const span = Math.max(1, Math.round((last - first) / 86400000));
    freq = (span / (h.length - 1)).toFixed(1).replace('.', ',');
  }
  return { badge, days: diff, freq };
}

/* ==========================================================================
   7. MOTORE AUTO, GPL, GPS, CARPOOLING SS76 & TAGLIANDO
   ========================================================================== */
function dayK(f, w) {
  const km = S.kmDay || 92;
  return wk(f.d) ? (f.pl === 'wk' ? km / 2 : (w === 'a' ? km : 0)) : 0;
}

function kmB(a, b) {
  const km = S.kmDay || 92;
  let k = dayK(a, 'a') + dayK(b, 'b');
  for (let d = new Date(a.d + 'T12:00'); ;) {
    d.setDate(d.getDate() + 1);
    const x = iso(d);
    if (x >= b.d) break;
    if (wk(x)) k += km;
  }
  return k + Object.entries(S.extra).filter(([d]) => d >= a.d && d <= b.d).reduce((s, [, v]) => s + v, 0);
}

function car() {
  const km = S.kmDay || 92;
  const ideal = S.idealKmL || 15.5;
  const f = [...S.fills].sort((a, b) => a.d.localeCompare(b.d));
  let L = 0, K = 0, E = 0;
  f.forEach((x, i) => {
    if (i) {
      const k = kmB(f[i - 1], x);
      if (k > 0) {
        K += k;
        L += x.eur / x.ppl;
        E += x.eur;
      }
    }
  });
  const avg = K && L ? K / L : ideal;
  const last = f[f.length - 1];
  let since = 0;
  if (last) {
    const t = today(), h = new Date().getHours();
    if (last.d < t) {
      since = dayK(last, 'a');
      for (let d = new Date(last.d + 'T12:00'); ;) {
        d.setDate(d.getDate() + 1);
        const x = iso(d);
        if (x >= t) break;
        if (wk(x)) since += km;
      }
      if (wk(t)) since += h < 8 ? 0 : h < 18 ? km / 2 : km;
    }
    since += Object.entries(S.extra).filter(([d]) => d >= last.d).reduce((s, [, v]) => s + v, 0);
  }
  const range = S.tank * avg;
  const rem = last ? Math.max(0, range - since) : null;
  const tk = rem == null ? 0 : Math.ceil((rem / range) * 4);
  const ppl = last ? last.ppl : 0.75;
  const mk = km * 22;
  const wl = avg < ideal ? mk / avg - mk / ideal : 0;

  // Rimborsi carpooling SS76 e costo netto reale al km
  const cpTotal = (S.carpool || []).reduce((s, x) => s + x.amount, 0);
  const netE = Math.max(0, E - cpTotal);
  const cpk = K ? E / K : 0;
  const netCpk = K ? netE / K : 0;

  // Confronto prezzi medi Ancona vs Lavoro/Cingoli
  const anFills = f.filter(x => x.pl === 'an');
  const wkFills = f.filter(x => x.pl === 'wk');
  const avgAn = anFills.length ? anFills.reduce((s, x) => s + x.ppl, 0) / anFills.length : null;
  const avgWk = wkFills.length ? wkFills.reduce((s, x) => s + x.ppl, 0) / wkFills.length : null;

  // Tagliando
  const totalTrackedKm = K + since;
  const maintSince = Math.max(0, totalTrackedKm - (S.maintLastKm || 0));
  const maintInt = S.maintInt || 15000;
  const maintLeft = maintInt - maintSince;

  return {
    f, K, avg, last, since, range, rem, tk, wl, we: wl * ppl,
    cpk, netCpk, cpTotal, avgAn, avgWk, totalTrackedKm, maintSince, maintInt, maintLeft
  };
}

function slots(dur) {
  const out = [], now = new Date();
  for (let i = 0; i < 14 && out.length < 4; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const ds = iso(d);
    const bz = evOn(ds).map(e => [hh(e.tm), hh(e.tm) + (+e.dur || 1)]);
    if (wk(ds)) bz.push([8, 19]);
    const pr = wk(ds) ? [19, 20, 21, 7] : [10, 11, 15, 16, 17, 9, 18];
    const h = pr.find(hr => (i > 0 || hr > now.getHours()) && hr + dur <= 22.5 && bz.every(([s, e]) => hr + dur <= s || hr >= e));
    if (h != null) out.push({ ds, h });
  }
  return out;
}

function money() {
  const s = stats(cycOff);
  const prev = stats(cycOff - 1);
  const bc = catSumRange(s.cyc.startStr, s.cyc.endStr);
  const pbc = catSumRange(prev.cyc.startStr, prev.cyc.endStr);
  const tot = Object.values(bc).reduce((a, b) => a + b, 0);
  const ptot = Object.values(pbc).reduce((a, b) => a + b, 0);
  const ents = Object.entries(bc).sort((a, b) => b[1] - a[1]);

  let off = 0;
  const arcs = ents.map(([c, v]) => {
    const l = (v / tot) * 251.3;
    const r = `<circle cx='60' cy='60' r='40' fill='none' stroke='${CAT[c][1]}' stroke-width='16' stroke-dasharray='${l} 251.3' stroke-dashoffset='${-off}' transform='rotate(-90 60 60)'/>`;
    off += l;
    return r;
  }).join('');

  // Grafico 14 giorni vs Giorni settimana (unificati in 1 sola card compatta)
  let chartSVG = '', chartNote = '';
  if (chartMode === '14d') {
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const ds = iso(d);
      days.push([d.getDate(), S.ex.filter(e => e.d === ds).reduce((a, e) => a + e.a, 0)]);
    }
    const mx = Math.max(1, ...days.map(x => x[1]));
    chartSVG = `<svg viewBox='0 0 280 86' width='100%'>${days.map((d, i) => `<rect x='${i * 20 + 2}' y='${68 - (d[1] / mx) * 62}' width='15' height='${Math.max(2, (d[1] / mx) * 62)}' rx='4' fill='${d[1] > s.per * 1.5 ? '#ff453a' : '#0a84ff'}'/><text x='${i * 20 + 9.5}' y='82' fill='#8e8e93' font-size='7.5' text-anchor='middle'>${d[0]}</text>`).join('')}</svg>`;
    chartNote = 'In rosso i giorni sopra la media giornaliera del ciclo.';
  } else {
    const ex = S.ex.filter(e => !e.rid);

    if (ex.length) {

      ex.forEach(e => sum[(new Date(e.d + 'T12:00').getDay() + 6) % 7] += e.a);
      for (let d = new Date(first + 'T12:00'); iso(d) <= today(); d.setDate(d.getDate() + 1)) cnt[(d.getDay() + 6) % 7]++;

    const av = sum.map((v, i) => cnt[i] ? v / cnt[i] : 0), mx = Math.max(...av, 1), L = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'], top = av.indexOf(Math.max(...av));
    chartSVG = `<svg viewBox='0 0 280 92' width='100%'>${av.map((v, i) => `<rect x='${i * 40 + 6}' y='${72 - (v / mx) * 58}' width='28' height='${Math.max(2, (v / mx) * 58)}' rx='6' fill='${i === top ? '#ff9f0a' : '#0a84ff'}'/><text x='${i * 40 + 20}' y='88' fill='#8e8e93' font-size='9' text-anchor='middle'>${L[i]}</text><text x='${i * 40 + 20}' y='${68 - (v / mx) * 58}' fill='#f5f5f7' font-size='8' text-anchor='middle'>${Math.round(v)}</text>`).join('')}</svg>`;
    chartNote = ex.length ? `Media per giorno (escluse fisse): il più caro è <b>${L[top]}</b> (${eur(av[top])}).` : 'Registra qualche spesa per vedere la media settimanale.';
  }

  const diff = tot - ptot;
  const diffRows = CK.map(c => [c, (bc[c] || 0) - (pbc[c] || 0)]).filter(x => Math.abs(x[1]) >= 0.01).sort((a, b) => a[1] - b[1]);
  const hist = s.exList.slice().sort((a, b) => b.d.localeCompare(a.d));
  const openDebts = S.debts.map((g, i) => [g, i]).filter(x => !x[0].p);
  const dueTot = openDebts.filter(x => x[0].dir === 'due').reduce((a, x) => a + x[0].a, 0);
  const oweTot = openDebts.filter(x => x[0].dir === 'owe').reduce((a, x) => a + x[0].a, 0);
  const rate = Math.max(0, S.sal - S.bud);

  return `<h1>Soldi</h1>
    <div class='row sp' style='margin-bottom:10px'>

        ${diffRows.map(r => `<div class='li'><span class='dot' style='background:${CAT[r[0]][1]}'></span><span class='grow'>${CAT[r[0]][0]}</span><b class='${r[1] <= 0 ? 'ok' : 'bad'} money-val'>${r[1] <= 0 ? '−' : '+'}${eur(Math.abs(r[1]))}</b></div>`).join('')}`
      : `<div class='row sp'><span>Spese ciclo: <b class='money-val'>${eur(tot)}</b></span><span class='m'>Budget: ${eur(S.bud)}</span></div>`}
    </div>

    <h2>Dove vanno i soldi</h2>
    <div class='card'>
      ${tot ? `<div class='row'>

        <div class='grow'>${ents.map(([c, v]) => `<div class='row sp m'><span><span class='dot' style='background:${CAT[c][1]};display:inline-block'></span> ${CAT[c][0]}</span><span>${Math.round((v / tot) * 100)}%</span></div>`).join('')}</div>
      </div>
      ${ents.map(([c, v]) => `<div style='margin-top:9px'><div class='row sp'><span>${CAT[c][0]}</span><b class='money-val'>${eur(v)}</b></div><div class='bar'><i style='width:${(v / ents[0][1]) * 100}%;background:${CAT[c][1]}'></i></div></div>`).join('')}`

    <h2>Parcheggio Acquisti · Regola 48h</h2>
    <div class='card'>

        ${S.goals.length ? `<button class='btn sm' onclick='impulseToGoal()'>Versa in ${esc(S.goals[0].n)}</button>` : ''}

      ${S.parked.length ? S.parked.map(p => {

let nps = null, eds = null, ins = null, lastInc = null;

function qe(i) {
  if (i === 0) addEx('heets', 5.5);
  else if (i === 1) addEx('caffe', 0.35);
  else if (i === 2) addEx('benz', 20);
  else {
    np(today());
    nps.c = ['gpl', 'svago', 'altro'][i - 3];
    npR();
  }
}

function np(d) {
  vib(25);
  const l = S.fills[S.fills.length - 1];
  nps = { v: '', c: 'altro', d, p: l ? l.ppl : '', pl: 'an', n: '', recB64: null };
  npR();
  $('#sh').classList.add('on');
}

function closeNp() {
  vib(20);
  $('#sh').classList.remove('on');
}

function nk(i) {
  vib(20);
  const k = KEYS[i];
  if (k === '<') nps.v = nps.v.slice(0, -1);
  else if (k === ',') { if (!nps.v.includes(',')) nps.v = (nps.v || '0') + ','; }
  else if (nps.v.length < 7) nps.v += k;
  npR();
}

async function handleNpReceipt(inpEl) {
  const f = inpEl.files && inpEl.files[0];
  if (!f) return;
  nps.recB64 = await compressImage(f);
  toast('🧾 Scontrino pronto da allegare');
  npR();
}

  $('#sh').innerHTML = `<div>
    <div class='row sp'><b>Nuova spesa</b><button class='x' style='color:#8e8e93' onclick='closeNp()'>✕</button></div>
    <div class='big money-val' style='text-align:center;margin:6px 0'>${nps.v || '0'} €</div>
    <div class='chips'>${CK.map((k, i) => `<button class='chip ${nps.c === k ? 'on' : ''}' onclick="vib(20);nps.c=CK[${i}];npR()">${CAT[k][0]}</button>`).join('')}</div>
    ${nps.c === 'gpl' ? `<div class='g2' style='margin-top:8px'>
      <div><label>Prezzo €/L</label><input type='number' step='.001' value='${nps.p}' oninput='nps.p=this.value'></div>
      <div><label>Dove? <button class='btn s sm' style='padding:2px 6px;margin-left:4px' onclick="detectGpsLocation('#np_pl')">📍</button></label>
        <select id='np_pl' onchange='nps.pl=this.value'><option value='an' ${nps.pl === 'an' ? 'selected' : ''}>Ancona</option><option value='wk' ${nps.pl === 'wk' ? 'selected' : ''}>Lavoro / Cingoli</option></select>
      </div>
    </div>` : ''}
    <div class='keys'>${KEYS.map((k, i) => `<button onclick='nk(${i})'>${k === '<' ? '⌫' : k}</button>`).join('')}</div>
    <div class='g2'>
      <div><label>Data</label><input type='date' value='${nps.d}' max='${today()}' onchange='nps.d=this.value'></div>

    </div>
    <div class='row' style='margin-top:10px'>
      <button class='btn s' style='flex:1' onclick="$('#np_rec').click()">${nps.recB64 ? '🧾 Scontrino allegato ✓' : '📷 Allega scontrino'}</button>
      <input type='file' id='np_rec' accept='image/*' capture='environment' hidden onchange='handleNpReceipt(this)'>
    </div>
    <button class='btn' style='width:100%;margin-top:10px' onclick='saveNp()'>Salva</button>
  </div>`;
}

function saveNp() {
  const a = +nps.v.replace(',', '.');
  if (!(a > 0)) return toast('Inserisci un importo');
  if (nps.c === 'gpl') {
    if (!+nps.p) return toast('Inserisci il prezzo €/L');
    addFill(a, +nps.p, nps.pl, nps.d);
  } else {
    const id = uid();
    if (nps.recB64) DB.save(id, nps.recB64);
    addEx(nps.c, a, nps.d, nps.n, Boolean(nps.recB64), id);
  }
  closeNp();
}

function openEd(id) {
  const e = S.ex.find(x => x.id === id);
  if (!e) return;
  if (e.fid) return toast('I pieni GPL si gestiscono dalla scheda Auto');
  eds = { id, a: String(e.a), c: e.c, d: e.d, n: e.n || '', rec: Boolean(e.rec) };
  edR();
  $('#sh').classList.add('on');
}

async function handleEdReceipt(inpEl) {
  const f = inpEl.files && inpEl.files[0];
  if (!f) return;
  const b64 = await compressImage(f);
  DB.save(eds.id, b64);
  eds.rec = true;
  const e = S.ex.find(x => x.id === eds.id);
  if (e) e.rec = true;
  save();
  toast('🧾 Scontrino salvato');
  edR();
}

function edR() {
  $('#sh').innerHTML = `<div>
    <div class='row sp'><b>Modifica spesa</b><button class='x' style='color:#8e8e93' onclick='closeNp()'>✕</button></div>
    <div class='chips' style='margin-top:10px'>${CK.map((k, i) => `<button class='chip ${eds.c === k ? 'on' : ''}' onclick="eds.c=CK[${i}];edR()">${CAT[k][0]}</button>`).join('')}</div>
    <label>Importo €</label>
    <input type='number' step='.01' value='${eds.a}' oninput='eds.a=this.value'>
    <div class='g2'>
      <div><label>Data</label><input type='date' value='${eds.d}' max='${today()}' onchange='eds.d=this.value'></div>
      <div><label>Nota</label><input value='${esc(eds.n)}' oninput='eds.n=this.value'></div>
    </div>
    <div class='g2' style='margin-top:10px'>
      ${eds.rec ? `<button class='btn s' onclick="viewReceipt('${eds.id}')">🧾 Vedi scontrino</button>` : ''}
      <button class='btn s' style='${eds.rec ? '' : 'grid-column:span 2'}' onclick="$('#ed_rec').click()">📷 ${eds.rec ? 'Sostituisci' : 'Allega scontrino'}</button>
      <input type='file' id='ed_rec' accept='image/*' capture='environment' hidden onchange='handleEdReceipt(this)'>
    </div>
    <div class='g2' style='margin-top:12px'>
      <button class='btn d' onclick="delEx(eds.id);closeNp()">Elimina</button>
      <button class='btn' onclick='saveEd()'>Salva</button>
    </div>
  </div>`;
}

function saveEd() {
  const a = +String(eds.a).replace(',', '.');
  if (!(a > 0)) return toast('Importo non valido');
  const e = S.ex.find(x => x.id === eds.id);
  if (e) Object.assign(e, { a, c: eds.c, d: eds.d, n: eds.n, rec: eds.rec });
  save();
  closeNp();
  toast('Spesa aggiornata');
  R();
}

function payNow() {
  const s = stats(0);
  if (S.inc.some(i => i.d >= s.cyc.startStr && i.d <= s.cyc.endStr && (i.t || 'Stipendio') === 'Stipendio')) {
    return toast('Stipendio di questo ciclo già registrato. Usa «+ Entrata»');
  }
  lastInc = uid();
  S.inc.push({ id: lastInc, d: today(), a: S.sal, t: 'Stipendio' });

  toast('Stipendio accreditato: ' + eur(S.sal), 'undoPay()');
  R();
}
function undoPay() { S.inc = S.inc.filter(i => i.id !== lastInc); save(); $('#to').classList.remove('on'); R(); }

function openInc(k) {
  ins = { a: k === 0 ? String(S.sal) : '', t: k === 0 ? 0 : 1, d: today() };
  incR();
  $('#sh').classList.add('on');
}
function incR() {
  $('#sh').innerHTML = `<div>
    <div class='row sp'><b>Aggiungi entrata</b><button class='x' style='color:#8e8e93' onclick='closeNp()'>✕</button></div>
    <div class='chips' style='margin-top:10px'>${IT.map((n, i) => `<button class='chip ${ins.t === i ? 'on' : ''}' onclick='ins.t=${i};incR()'>${n}</button>`).join('')}</div>
    <label>Importo €</label>
    <input type='number' inputmode='decimal' step='.01' value='${ins.a}' oninput='ins.a=this.value'>
    <label>Data</label>
    <input type='date' value='${ins.d}' max='${today()}' onchange='ins.d=this.value'>
    <button class='btn' style='width:100%;margin-top:12px' onclick='saveInc()'>Salva</button>
  </div>`;
}
function saveInc() {
  const a = +String(ins.a).replace(',', '.');
  if (!(a > 0)) return toast('Inserisci un importo');
  S.inc.push({ id: uid(), d: ins.d, a, t: IT[ins.t] });
  save();
  closeNp();
  toast('Registrati ' + eur(a));
  R();

/* ==========================================================================
   13. CLOUD SYNC AUTOMATICO & MANUALE (JSONBIN.IO) + EXPORT / IMPORT
   ========================================================================== */
async function cloudCreateBin() {
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  if (!key) return toast('Incolla prima la tua X-Master-Key di JSONBin.io');
  S.cloud.key = key;
  save(true);
  toast('Creazione Bin in corso…');
  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Name': 'LeoWealth', 'X-Bin-Private': 'true' },
      body: JSON.stringify(S)
    });
    const j = await res.json();
    if (j && j.metadata && j.metadata.id) {
      S.cloud.bin = j.metadata.id;
      S.cloud.lastSync = Date.now();
      save(true);
      toast('☁️ Bin creato: ' + j.metadata.id);
      R();
    } else {
      toast('Chiave API non valida');
    }
  } catch (e) { toast('Errore di rete'); }
}

async function cloudPush(silent = false) {
  if (!silent) vib(25);
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) {
    if (!silent) toast('Inserisci Master Key e Bin ID');
    return;
  }
  S.cloud.key = key;
  S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key },
      body: JSON.stringify(S)
    });
    if (res.ok) {
      S.cloud.lastSync = Date.now();
      try { localStorage.setItem('lw', JSON.stringify(S)); } catch (e) {}
      if (!silent) { toast('☁️ Dati salvati su Cloud'); R(); }
    } else if (!silent) {
      toast('Errore upload Cloud');
    }
  } catch (e) {
    if (!silent) toast('Errore di connessione');
  }
}

async function cloudPull(silent = false) {
  if (!silent) vib(25);
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) {
    if (!silent) toast('Inserisci Master Key e Bin ID');
    return;
  }
  S.cloud.key = key;
  S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, {
      headers: { 'X-Master-Key': key }
    });
    const j = await res.json();
    if (j && j.record) {
      const remoteUpdated = +j.record.updatedAt || 0;
      if (silent && remoteUpdated <= (S.updatedAt || 0)) return;
      const keepCloud = Object.assign({}, S.cloud, { lastSync: Date.now() });
      S = migrate(j.record);
      S.cloud = keepCloud;
      save(true);
      R();
      toast(silent ? '☁️ Aggiornato automaticamente dal Cloud' : '☁️ Dati caricati dal Cloud');
    } else if (!silent) {
      toast('Bin non trovato');
    }
  } catch (e) {
    if (!silent) toast('Errore download Cloud');
  }
}

function exp() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = `leo-wealth-${today()}.json`;
  a.click();
}

function imp(i) {
  const f = i.files[0];
  if (!f) return;
  f.text().then(t => {
    try {
      S = migrate(JSON.parse(t));
      save();
      R();
      toast('Backup importato con successo');
    } catch (e) {
      toast('File JSON non valido');
    }
  });
}

/* ==========================================================================
   14. ASSISTENTE AI POTENZIATO (SOMME INLINE, SMART WORKING, 48H, DEBITI)
   ========================================================================== */
const NW = { uno: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8, nove: 9, dieci: 10, quindici: 15, venti: 20, trenta: 30, quaranta: 40, cinquanta: 50, sessanta: 60, cento: 100 };
const KW = [
  ['heets', /heets|iqos|sigarett|tabacc|\bfumo\b/],
  ['caffe', /caff|cappuccin|espresso|macchiato/],
  ['benz', /benzin|carburant|diesel/],
  ['gpl', /\bgpl\b|pieno/],
  ['cibo', /colazion|pranz|\bcen(a|o|are|ato)\b|aperitiv|spritz|pizz|ristorant|panin|kebab|sushi|mcdonald|merend|gelat|brunch|mangi|trattori|osteri|hamburger|spesa|coop|conad|lidl/],
  ['svago', /amic|ragazz|fidanzat|uscit|uscire|serata|cinema|disco|locale|\bpub\b|birr|drink|weekend|svago|divert|concert|bowling/]
];
const catOf = t => (KW.find(k => k[1].test(t)) || [])[0];

// Estrae singolo numero o somma automatica di più importi nella stessa frase (es. "15 di carne e 10 di verdura" -> 25)
function getNums(t) {
  const matches = [...t.matchAll(/(\d+(?:[.,]\d+)?)/g)].map(m => +m[1].replace(',', '.')).filter(x => x > 0);
  if (matches.length > 1) return { total: matches.reduce((a, b) => a + b, 0), parts: matches };
  if (matches.length === 1) return { total: matches[0], parts: matches };
  const w = t.match(/\b(uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|quindici|venti|trenta|quaranta|cinquanta|sessanta|cento)\s+(euro|eur)/);
  return w ? { total: NW[w[1]], parts: [NW[w[1]]] } : { total: null, parts: [] };
}

function addIt(c, a, d, when, raw, split, parts) {
  if (split) a = a / 2;
  if (c === 'gpl') {
    np(d || today());
    nps.c = 'gpl';
    nps.v = String(a).replace('.', ',');
    npR();
    return 'Per il GPL mi servono prezzo €/L e dove hai fatto il pieno: completa qui sotto.';
  }
  addEx(c, a, d, raw.slice(0, 50));
  const detail = parts && parts.length > 1 ? ` (${parts.map(x => eur(x)).join(' + ')})` : '';
  return `Segnato <b>${CAT[c][0]}</b> <b class='money-val'>${eur(a)}</b>${detail}${split ? ' (la tua metà)' : ''}${when}.` +
    (d === today() ? ` Oggi puoi ancora spendere <b class='money-val'>${eur(stats(0).daily)}</b>.` : '');
}

function brain(t0, raw) {
  const t = t0.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const oreM = t.match(/(\d+(?:[.,]\d+)?)\s*or[ae]/);
  const nums = oreM ? { total: null, parts: [] } : getNums(t);
  const num = nums.total;
  const c = catOf(t);
  const sv = /spes|segna|pagat|ho preso|comprat|\bpago\b|offert|costat/.test(t);
  const split = /dividi|a meta|50 e 50|alla romana|diviso/.test(t);
  const s = stats(0);
  const day = /altro ?ieri/.test(t) ? 2 : /\bieri\b/.test(t) ? 1 : /domani/.test(t) ? -1 : 0;
  const dt = new Date(); dt.setDate(dt.getDate() - day);
  const ds = iso(dt);
  const when = day === 1 ? ' (ieri)' : day === 2 ? ' (l’altro ieri)' : day === -1 ? ' (domani)' : '';
  const p = pend; pend = null;

  // Smart Working / Ferie vocale o testuale
  if (/smart ?working|lavoro da casa|ferie|non vado in ufficio|resto a casa/.test(t)) {
    const targetDs = day === -1 ? iso(new Date(Date.now() + 86400000)) : today();
    if (!isOffDay(targetDs)) toggleOffDay(targetDs);
    return `Segnato <b>Smart Working / Ferie</b> per ${day === -1 ? 'domani' : 'oggi'}: scalati <b>0 km</b> dal serbatoio GPL.`;
  }

  // Debiti e crediti
  let m;
  if (num > 0 && (m = raw.match(/([A-Za-zÀ-ÿ]+)\s+mi\s+deve/i))) return addDebt(cap(m[1]), num, 'due');
  if (num > 0 && (m = raw.match(/\bdevo\s+[\d.,]+\s*(?:euro|€)?\s*a\s+([A-Za-zÀ-ÿ]+)/i))) return addDebt(cap(m[1]), num, 'owe');
  if ((m = raw.match(/([A-Za-zÀ-ÿ]+)\s+(?:mi\s+ha|ha)\s+(?:ridato|restituito|rimborsato)/i)) || (m = raw.match(/(?:ridato|restituito|rimborsato)\s+(?:a\s+)?([A-Za-zÀ-ÿ]+)/i))) {
    const nm = m[1].toLowerCase();
    const i = S.debts.findIndex(g => !g.p && g.dir === 'due' && g.who.toLowerCase() === nm);
    if (i >= 0) { const g = S.debts[i]; settle(i); return `Fatto: ${esc(g.who)} ti ha restituito ${eur(g.a)}.`; }
    return `Non trovo crediti aperti con ${esc(m[1])}.`;
  }
  if (/chi mi deve|a chi devo|\bdebiti\b|\bcrediti\b/.test(t)) {
    const o = S.debts.filter(g => !g.p);
    return o.length ? o.map(g => `${esc(g.who)} ${g.dir === 'due' ? 'ti deve' : 'devi'} <b>${eur(g.a)}</b>`).join('<br>') : 'Nessun debito aperto.';
  }

  if (p && !/\bposso\b|quanto/.test(t)) {
    if (p.c && num != null) return addIt(c || p.c, num, ds, when, raw, split, nums.parts);
    if (p.a != null && c) return addIt(c, num ?? p.a, ds, when, raw, split, nums.parts);
  }

  if (/stipendio|busta paga/.test(t) && /arriv|ricev|accredit|pagat|preso|incassat/.test(t) && !/quando|\bse\b/.test(t)) {
    const a = num > 0 ? num : S.sal;
    S.inc.push({ id: uid(), d: today(), a, t: 'Stipendio' });
    save();
    R();
    return `Stipendio di <b class='money-val'>${eur(a)}</b> accreditato. Liquidità: <b class='money-val'>${eur(liq())}</b>.`;
  }

  // Regola 48h su domanda "Posso comprare / spendere X?"
  if (/\bposso\b|ce la faccio|mi conviene|mi basta|permettermi/.test(t) && num > 0) {
    const itemName = raw.replace(/.*?(comprare|prendere|spendere|permettermi)\s+(un|una|uno|il|la|lo|i|gli|le)?\s*/i, '').replace(/\s*(da|di|per)?\s*\d+([.,]\d+)?\s*(euro|eur|€).*/i, '').trim() || 'Acquisto extra';
    const parkBtn = `<div style='margin-top:8px'><button class='btn s sm' onclick="parkItem('${escAttr(itemName)}',${num})">⏳ Parcheggia per 48h</button></div>`;
    if (num <= s.rem) {
      return `Sì: dopo questa spesa ti restano <b class='money-val'>${eur(s.rem - num)}</b> di budget nel ciclo, il risparmio non è toccato.${parkBtn}`;
    }
    const days = Math.ceil((num - s.rem) / Math.max(1, s.per));
    return `Non subito: mancano <b class='money-val'>${eur(num - s.rem)}</b>. Se non spendi altro puoi permettertelo tra circa <b>${days} giorni</b>.${parkBtn}`;
  }

  if (/quanto ho (gia )?speso|quanto spendo/.test(t)) {
    const o = /oggi/.test(t);
    const tot = (o ? S.ex.filter(e => e.d === today()) : s.exList).reduce((a, e) => a + e.a, 0);
    return `${o ? 'Oggi' : 'In questo ciclo'} hai speso <b class='money-val'>${eur(tot)}</b>.`;
  }

  if (/quanto (ho|mi resta|mi rimane|posso spendere)|budget|saldo|liquidit|disponibil/.test(t) && !sv) {
    return `Liquidità <b class='money-val'>${eur(liq())}</b>. Nel ciclo hai speso ${eur(s.spent)} su ${eur(S.bud)}: ti restano <b class='money-val'>${eur(s.rem)}</b>, circa <b>${eur(s.daily)}</b> al giorno.`;
  }

  if (/autonomia|quanti km|quanto gpl|gpl.*(rimast|resta)|riserva/.test(t)) {
    const k = car();
    return k.last ? `Hai circa <b>${Math.round(k.rem)} km</b> di autonomia (${k.tk}/4 tacche). ${k.rem < (S.kmDay || 92) * 1.6 ? 'Rifornisci presto!' : 'Sei a posto per qualche giorno.'}` : 'Registra prima un pieno nella scheda Auto.';
  }

  const act = /agenda|calendario/.test(t) || (/voglio|vorrei|devo |organizza|pianifica|prenota|trova|quando|andare|andiamo|stasera|domani|dopodomani|prossim/.test(t) && num == null && !sv);
  if (act) {
    const title = raw.replace(/^(voglio|vorrei|devo|organizza|pianifica|prenota|trova|metti in agenda|segna in agenda)\s+(di\s+)?/i, '').replace(/\d+(?:[.,]\d+)?\s*or[ae]/i, '').trim() || raw;
    const dur = oreM ? +oreM[1].replace(',', '.') : /mezz/.test(t) ? 0.5 : /cena|aperitiv|pranz/.test(t) ? 2 : 1.5;
    return slotHTML(title, dur);
  }

  if (c) {
    const a = num ?? FIX[c];
    if (a == null) { pend = { c }; return `Quanto hai speso per ${CAT[c][0].toLowerCase()}?`; }
    return addIt(c, a, ds, when, raw, split, nums.parts);
  }

  if (num != null) {
    pend = { a: num };
    return `Ok, ${eur(num)}. Per cosa? (es. cena, caffè, svago, benzina…)`;
  }

  return 'Prova così: «spesa coop 15 di carne e 10 di verdura», «posso comprare una felpa da 45 euro?», «oggi smart working», «Marco mi deve 20 euro», «voglio andare in palestra».';
}

function ask(q) {
  q = (q || '').trim();
  if (!q) return;
  vib(25);
  ans = brain(q.toLowerCase(), q);
  R();
  scrollTo(0, 0);
}

function mic() {
  vib(30);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Voce non supportata da questo browser');
  const r = new SR();
  r.lang = 'it-IT';
  r.onresult = e => ask(e.results[0][0].transcript);
  r.start();
  toast('🎙 Ti ascolto…');
}

/* ==========================================================================
   15. URL SHORTCUTS IOS & RENDER PRINCIPALE
   ========================================================================== */
function handleUrlActions() {
  const p = new URLSearchParams(location.search);
  let changed = false;
  if (p.has('add')) {
    const c = p.get('add').toLowerCase();
    if (CAT[c] && FIX[c]) {
      addEx(c, FIX[c], today(), 'Comando Rapido');
      changed = true;
    }
  }
  if (p.get('sw') === '1') {
    if (!isOffDay(today())) toggleOffDay(today());
    changed = true;
  }
  if (changed && history.replaceState) {
    history.replaceState(null, '', location.pathname);
  }
}

const TABS = [
  ['home', I('home'), 'Home', home],
  ['cal', I('cal'), 'Agenda', cal],
  ['money', I('chart'), 'Soldi', money],
  ['car', I('car'), 'Auto', carV],
  ['set', I('gear'), 'Impost.', settingsV]
];

function R() {
  document.body.className = S.priv ? 'blur-mode' : '';
  const y = scrollY;
  $('#v').innerHTML = TABS.find(t => t[0] === tab)[3]();
  $('#nv').innerHTML = TABS.map(t => `<button class="${t[0] === tab ? 'on' : ''}" onclick="vib(20);tab='${t[0]}';R();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('');
  scrollTo(0, y);
}

window.onload = async function () {
  if (location.search.includes('_v=') && history.replaceState) {
    const clean = new URL(location.href);
    clean.searchParams.delete('_v');
    history.replaceState(null, '', clean.pathname + clean.search);
  }
  await requestPersistentStorage();
  applyRec();
  tab = 'home';
  R();
  handleUrlActions();
  if (S.cloud && S.cloud.key && S.cloud.bin) {
    setTimeout(() => cloudPull(true), 1200);
  }
  setTimeout(checkAutoAlerts, 2500);
};
