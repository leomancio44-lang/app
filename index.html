<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Leo Wealth">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%23000000'/%3E%3Crect x='14' y='14' width='152' height='152' rx='28' fill='%23111113' stroke='%23222227' stroke-width='2'/%3E%3Ctext x='90' y='108' text-anchor='middle' fill='%23ffffff' font-family='-apple-system,sans-serif' font-size='56' font-weight='800' letter-spacing='-2'%3ELW%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Leo%20Wealth%22%2C%22short_name%22%3A%22Leo%20Wealth%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
<title>Leo Wealth</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --s1:#0E0E11;
  --s2:#16161A;
  --t:#FFFFFF;
  --m:#84848C;
  --b:rgba(255,255,255,.075);
  --bh:rgba(255,255,255,.22);
  --ok:#32D74B;
  --w:#F59E0B;
  --bad:#EF4444;
  --vac:#38BDF8;
  box-sizing:border-box;
}
html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  overflow-x:hidden;
  background:#000000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  overflow-x:hidden;
  background:#000000;
  color:var(--t);
  font:13.5px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

/* Copertura nero OLED puro sotto la status bar iOS per evitare fasce sbiadite */
.safe-top-cap{
  position:fixed;
  top:0;left:0;right:0;
  height:max(env(safe-area-inset-top,0px),14px);
  background:#000000;
  z-index:45;
  pointer-events:none;
}

.app-shell{
  max-width:448px;
  width:100%;
  min-height:100dvh;
  margin:0 auto;
  background:#000000;
  border-left:1px solid rgba(255,255,255,.045);
  border-right:1px solid rgba(255,255,255,.045);
  padding:calc(max(env(safe-area-inset-top,0px),14px) + 18px) 14px calc(92px + env(safe-area-inset-bottom,0px));
  position:relative;
  transform-origin:top center;
  transition:transform .28s cubic-bezier(.16,1,.3,1),border-radius .28s cubic-bezier(.16,1,.3,1),filter .28s ease;
}
body.sheet-open .app-shell,
body:has(#sh.on) .app-shell{
  transform:scale(.962) translateY(4px);
  border-radius:22px;
  filter:brightness(.82);
  overflow:hidden;
}

.kicker{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.11em;
  color:var(--m);
  font-weight:600;
  margin:0;
  display:block;
}
h1{
  font-size:17px;
  font-weight:700;
  margin:2px 0 0;
  letter-spacing:-.35px;
  line-height:1.15;
}
h2{
  font-size:9.5px;
  color:var(--m);
  text-transform:uppercase;
  letter-spacing:.11em;
  margin:15px 2px 7px;
  font-weight:600;
}
.hero-num{
  font-size:clamp(28px,8vw,34px);
  font-weight:800;
  letter-spacing:-1.15px;
  line-height:1.05;
}
.big{font-size:clamp(19px,5.2vw,22px);font-weight:800;letter-spacing:-.55px;line-height:1.12}
.m{color:var(--m);font-size:11px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.w{color:var(--w)}

.card{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:18px;
  padding:13px;
  margin-bottom:9px;
  max-width:100%;
  transition:border-color .16s,transform .14s;
}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--bh)}
.lp{user-select:none;-webkit-user-select:none}
.lp:active{transform:scale(.978);border-color:rgba(255,255,255,.32)}

/* Semaforo silenzioso sulla Card Patrimonio */
.hero-card{
  background:radial-gradient(280px 150px at 96% -18%,var(--hero-glow,rgba(255,255,255,.07)),transparent),linear-gradient(180deg,#101015 0%,#0B0B0E 100%);
  border-color:var(--hero-border,rgba(255,255,255,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 14px 34px rgba(0,0,0,.65);
  transition:background .35s ease,border-color .35s ease;
}
.hero-card.pace-ok{--hero-glow:rgba(50,215,75,.14);--hero-border:rgba(50,215,75,.24)}
.hero-card.pace-warn{--hero-glow:rgba(245,158,11,.15);--hero-border:rgba(245,158,11,.26)}
.hero-card.pace-bad{--hero-glow:rgba(239,68,68,.16);--hero-border:rgba(239,68,68,.28)}
.hero-card.pace-vac{--hero-glow:rgba(56,189,248,.16);--hero-border:rgba(56,189,248,.32)}

.cmd-bar{
  background:var(--s1);
  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;
  padding:3px 5px 3px 9px;
  display:flex;
  align-items:center;
  gap:4px;
  height:40px;
  transition:border-color .15s;
}
.cmd-bar:focus-within{border-color:rgba(255,255,255,.36)}

.eye-inline{
  width:22px;height:22px;border-radius:7px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  color:var(--m);
  display:inline-flex;align-items:center;justify-content:center;
  padding:0;flex:none;
}
.eye-inline.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF}

.row{display:flex;align-items:center;gap:8px;min-width:0}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2>div,.g3>div{min-width:0}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  padding-top:11px;
  margin-top:11px;
  border-top:1px solid var(--b);
}
.hstat{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.04);
  padding:8px 8px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:62px;
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
.hstat:hover{background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.1)}
.hstat b{display:block;font-size:13.5px;font-weight:800;margin-top:3px;color:var(--t);letter-spacing:-.3px}
.hstat .sub-stat{font-size:9.5px;color:var(--m);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Barra di stato compatta a 3 colonne: Streak | Tesoretto | Smart Working */
.gami-pill{
  display:grid;
  grid-template-columns:1fr 1px 1fr 1px 1fr;
  align-items:center;
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:14px;
  padding:7px 8px;
  margin-bottom:9px;
  gap:6px;
}
.gami-div{height:22px;background:var(--b)}
.gami-cell{
  display:flex;align-items:center;gap:6px;
  min-width:0;cursor:pointer;
  padding:3px 4px;border-radius:9px;
  transition:background .15s;
}
.gami-cell:hover{background:rgba(255,255,255,.04)}
.gami-cell.sw-on{background:rgba(50,215,75,.11)}
.gami-ico{
  width:24px;height:24px;border-radius:7px;
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.gami-cell.sw-on .gami-ico{background:rgba(50,215,75,.2);color:var(--ok)}

.qgrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-bottom:9px;
}
.qbtn{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:13px;
  padding:8px 5px;
  min-height:54px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2.5px;
  text-align:center;
  min-width:0;
}
.qbtn:hover{border-color:var(--bh);background:var(--s2)}
.qbtn.pri{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.qbtn.austerity{background:#09090B;border-color:#1F1F23;color:#8E8E93}
.qbtn.austerity.pri{background:#222226;border-color:#36363C;color:#E4E4E7}
.qbtn b{font-size:11.5px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qbtn .qsub{font-size:9px;color:var(--m);line-height:1}
.qbtn.pri .qsub{color:rgba(0,0,0,.6)}
.qbtn.austerity.pri .qsub{color:#A1A1AA}

button,input,select,textarea{font:inherit;color:var(--t)}
button{
  cursor:pointer;
  transition:transform .13s cubic-bezier(.16,1,.3,1),opacity .13s,background .15s,border-color .15s;
}
button:active{transform:scale(.96);opacity:.9}

.btn{
  background:#FFFFFF;
  color:#000000;
  border:1px solid #FFFFFF;
  border-radius:12px;
  padding:9px 13px;
  font-weight:600;
  font-size:12px;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn:hover{background:#E5E5EA}
.btn.s{background:var(--s1);color:var(--t);border:1px solid var(--b)}
.btn.s:hover{background:var(--s2);border-color:var(--bh)}
.btn.d{background:rgba(239,68,68,.12);color:var(--bad);border:1px solid rgba(239,68,68,.28)}
.btn.sm{padding:6px 10px;font-size:11px;border-radius:9px}

.icon-btn{
  width:34px;height:34px;border-radius:11px;
  background:var(--s1);border:1px solid var(--b);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--m);padding:0;flex:none;
}
.icon-btn:hover{color:var(--t);border-color:var(--bh)}
.icon-btn.on{color:#000000;background:#FFFFFF;border-color:#FFFFFF}

input,select,textarea{
  background:#000000;
  border:1px solid var(--b);
  border-radius:11px;
  padding:9px 11px;
  width:100%;
  max-width:100%;
  min-width:0;
  font-size:16px;
  outline:0;
  -webkit-appearance:none;
  transition:border-color .15s;
}
textarea{resize:vertical;min-height:82px;font-size:14px}
input[type="date"],input[type="time"]{min-height:38px;font-size:13.5px}
input[type="time"]::-webkit-calendar-picker-indicator,
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.65}
input:focus,select:focus,textarea:focus{border-color:#FFFFFF}
label{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--m);
  font-weight:600;
  display:block;
  margin:9px 0 4px;
}

.seg{
  display:flex;
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:12px;
  padding:3px;
  gap:3px;
}
.seg button{
  flex:1;min-width:0;background:0;border:0;
  border-radius:9px;padding:6px 4px;
  font-size:10.5px;font-weight:500;color:var(--m);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg button.on{background:#FFFFFF;color:#000000;font-weight:600}

nav.liquid-dock{
  position:fixed;
  left:14px;right:14px;
  bottom:max(12px,env(safe-area-inset-bottom,12px));
  max-width:420px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(16,16,20,.86);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 12px 32px rgba(0,0,0,.85);
  border-radius:22px;
  padding:5px;
  z-index:30;
}
nav.liquid-dock button{
  flex:1;min-width:0;background:0;border:0;
  padding:6px 2px;border-radius:16px;
  color:var(--m);font-size:9px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:2.5px;
}
nav.liquid-dock button.on{
  color:#FFFFFF;
  background:rgba(255,255,255,.11);
  font-weight:600;
}

.fab{
  position:fixed;
  right:max(16px,calc(50vw - 208px));
  bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:42px;height:42px;border-radius:13px;
  border:1px solid rgba(255,255,255,.22);
  background:#FFFFFF;color:#000000;
  font-size:20px;font-weight:600;line-height:1;
  box-shadow:0 8px 22px rgba(0,0,0,.8);
  z-index:25;
  display:flex;align-items:center;justify-content:center;
}

.leds{display:flex;gap:4px}
.led{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
.led.on{background:var(--ok)}
.led.lo{background:var(--w)}
.led.cr{background:var(--bad)}

.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:visible;margin-top:6px;position:relative}
.bar i{display:block;height:100%;border-radius:2px;transition:width .35s cubic-bezier(.16,1,.3,1)}
.pace-tick{position:absolute;top:-2px;width:1.5px;height:8px;background:rgba(255,255,255,.55);border-radius:1px;pointer-events:none}

.li-card{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:14px;
  padding:10px 12px;
  margin-bottom:7px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  touch-action:pan-y;
}
.li{
  display:flex;align-items:center;gap:9px;
  padding:9px 0;
  border-bottom:1px solid var(--b);
  touch-action:pan-y;
}
.li:last-child{border:0;padding-bottom:2px}
.li:first-child{padding-top:2px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.x{background:0;border:0;color:var(--m);font-size:12px;padding:4px 6px}
.x:hover{color:var(--bad)}

.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wday{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:13px;
  padding:7px 2px;
  min-height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  color:var(--m);
}
.wday.t{border-color:rgba(255,255,255,.45)}
.wday.s{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.wday.off:not(.s){background:rgba(255,255,255,.03);border-style:dashed}
.wday .wn{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.wday .wd{font-size:13px;font-weight:700}
.wday .wdots{display:flex;gap:2px;height:4px}
.wday .wdots u{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal b{font-size:10px;color:var(--m);font-weight:600;padding-bottom:4px}
.cal button{
  aspect-ratio:1;border-radius:10px;border:1px solid transparent;
  background:rgba(255,255,255,.04);font-size:12px;position:relative;padding:0;
}
.cal button.t{border-color:rgba(255,255,255,.45)}
.cal button.s{background:#FFFFFF;color:#000000;font-weight:700}
.cal button.off{border-color:rgba(255,255,255,.22);border-style:dashed}
.cal button.e{opacity:.15;pointer-events:none}
.cal i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal i u{width:3.5px;height:3.5px;border-radius:50%;background:var(--ok)}
.cal i u.x2{background:var(--w)}
.cal i u.x3{background:#FFFFFF}

.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.kpi-box{background:var(--s2);border:0;border-radius:11px;padding:8px 9px}
.kpi-box .m{font-size:9.5px;display:block}
.kpi-box b{font-size:12px;display:block;margin-top:2px}

.sheet{
  position:fixed;inset:0;
  background:rgba(0,0,0,.84);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:40;display:none;align-items:flex-end;justify-content:center;
}
.sheet.on{display:flex}
.sheet.on>div{animation:slideUp .24s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet>div{
  width:100%;max-width:448px;
  background:var(--s2);
  border-top:1px solid rgba(255,255,255,.14);
  border-radius:24px 24px 0 0;
  padding:8px 15px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:90dvh;overflow-y:auto;
  will-change:transform;
}
.grabber-wrap{padding:4px 0 9px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.grabber{width:34px;height:4px;border-radius:99px;background:rgba(255,255,255,.24)}

.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:9px 0}
.keys button{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;padding:11px;font-size:18px;font-weight:700;
}
.keys button:hover{background:rgba(255,255,255,.14)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  background:#000000;border:1px solid var(--b);
  border-radius:10px;padding:5.5px 9.5px;font-size:11px;font-weight:500;color:var(--m);
}
.chip.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF;font-weight:600}

.wd-pills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:6px}
.wd-pill{padding:7px 0;border-radius:9px;background:#000000;border:1px solid var(--b);color:var(--m);font-size:10.5px;font-weight:700;text-align:center}
.wd-pill.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF}

.chk-box{
  width:17px;height:17px;border-radius:5px;
  border:1.5px solid var(--bh);
  background:transparent;
  display:inline-flex;align-items:center;justify-content:center;
  flex:none;color:#000000;
}
.chk-box.on{background:#FFFFFF;border-color:#FFFFFF}

.toast{
  position:fixed;left:14px;right:14px;
  top:calc(max(env(safe-area-inset-top,0px),14px) + 14px);
  max-width:420px;margin:0 auto;
  background:rgba(24,24,28,.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;padding:9px 13px;z-index:50;
  display:none;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.85);font-size:12px;
}
.toast.on{display:flex;animation:dropDown .24s cubic-bezier(.16,1,.3,1)}
@keyframes dropDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}

.msg{
  position:relative;overflow:hidden;
  background:var(--s2);border:1px solid rgba(255,255,255,.16);
  border-radius:15px;padding:11px 13px;margin-bottom:9px;line-height:1.42;font-size:12px;
  transition:opacity .28s ease,transform .28s ease;
}
.msg.fading{opacity:0;transform:translateY(-6px)}
.msg::after{
  content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;
  background:rgba(255,255,255,.32);transform-origin:left center;
  animation:msgTimer var(--dur,5200ms) linear forwards;
}
.msg.paused::after{animation-play-state:paused}
@keyframes msgTimer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.checkin-card{
  background:linear-gradient(180deg,#121513 0%,#0D0F0E 100%);
  border:1px solid rgba(50,215,75,.24);
  border-radius:15px;padding:10px 12px;margin-bottom:9px;
}

.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 6.5px;border-radius:6px;font-size:9px;font-weight:700;
  letter-spacing:.04em;
  background:rgba(255,255,255,.08);color:var(--m);
}
.badge.ok{background:rgba(50,215,75,.15);color:var(--ok)}
.badge.w{background:rgba(245,158,11,.16);color:var(--w)}
.badge.bad{background:rgba(239,68,68,.16);color:var(--bad)}
.badge.vac{background:rgba(56,189,248,.16);color:var(--vac)}
.badge.aus{background:#222226;color:#A1A1AA}

<div class="safe-top-cap"></div>

<div id="app-kb" aria-hidden="true"></div>

<script>
/* ==========================================================================
   1. UTILITY CORE, COUNT-UP NUMERICO & AVVIO ISTANTANEO (STALE-WHILE-REVALIDATE)
   ========================================================================== */
const APP_VER = '16.0';
let storagePersisted = false;

const $ = s => document.querySelector(s),
      pad = n => String(n).padStart(2, '0'),
      pad2h = h => String(h).padStart(2, '0') + ':00',
      iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      today = () => iso(new Date()),
      tomorrow = () => iso(new Date(Date.now() + 86400000)),
      eur = n => (Math.round((+n || 0) * 100) / 100).toFixed(2).replace('.', ',') + ' €',
      esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
      escAttr = s => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;'),
      uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

const vib = (pattern = 18) => { try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {} };

function animateNum(el, from, to, fmt = eur, ms = 220) {
  if (!el || Math.abs(to - from) < 0.01) { if (el) el.textContent = fmt(to); return; }
  const t0 = performance.now();
  function step(now) {
    const p = Math.min(1, (now - t0) / ms);
    const ease = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * ease);
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function copyText(text, label = 'Copiato negli appunti') {
  vib(18);
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(label);
  } catch (e) { toast('Impossibile copiare'); }
}

async function requestPersistentStorage() {
  try {
    if (navigator.storage && navigator.storage.persist) {
      storagePersisted = await navigator.storage.persisted();
      if (!storagePersisted) storagePersisted = await navigator.storage.persist();
    }
  } catch (e) {}
}

(function initServiceWorker() {
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const code = `
        const CACHE = 'leo-wealth-v${APP_VER}';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => {
          e.waitUntil(
            caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k))))
              .then(() => self.clients.claim())
          );
        });
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET' || !e.request.url.startsWith(self.location.origin)) return;
          e.respondWith(
            caches.open(CACHE).then(cache =>
              cache.match(e.request).then(cached => {
                const netFetch = fetch(e.request).then(res => {
                  if (res && res.status === 200) cache.put(e.request, res.clone());
                  return res;
                }).catch(() => cached);
                return cached || netFetch;
              })
            )
          );
        });
      `;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'application/javascript' }))).catch(() => {});
    }
  } catch (e) {}
})();

async function forceAppUpdate() {
  vib(20); save(true); toast('Aggiornamento codice in corso...');
  try {
    if ('caches' in window) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
    if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); }
  } catch (e) {}
  setTimeout(() => {
    const url = new URL(location.href);
    url.searchParams.set('_v', String(Date.now()));
    location.replace(url.toString());
  }, 300);
}

function launchConfetti() {
  vib([25, 45, 35]);
  const cv = $('#confetti-cv');
  if (!cv) return;
  cv.style.display = 'block';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const colors = ['#FFFFFF', '#32D74B', '#F59E0B', '#38BDF8', '#A1A1AA'];
  const pieces = Array.from({ length: 85 }, () => ({
    x: W * (0.2 + Math.random() * 0.6), y: H * 0.35 + (Math.random() - 0.5) * 60,
    vx: (Math.random() - 0.5) * 11, vy: -6 - Math.random() * 9,
    w: 5 + Math.random() * 5, h: 3 + Math.random() * 4,
    rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 0.25,
    col: colors[Math.floor(Math.random() * colors.length)], alpha: 1
  }));
  const start = performance.now();
  function frame(now) {
    const dt = now - start;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    pieces.forEach(p => {
      p.vy += 0.32; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (dt > 1700) p.alpha = Math.max(0, 1 - (dt - 1700) / 700);
      if (p.alpha > 0 && p.y < H + 30) {
        alive++; ctx.save(); ctx.globalAlpha = p.alpha; ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    });
    if (alive > 0 && dt < 2500) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  }
  requestAnimationFrame(frame);
}

/* ==========================================================================
   2. INDEXED DB PER SCONTRINI (100% LOCALE)
   ========================================================================== */
const DB = {
  db: null,
  init: () => new Promise(r => {
    try {
      const q = indexedDB.open('LW_Store', 1);
      q.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains('receipts')) e.target.result.createObjectStore('receipts'); };
      q.onsuccess = e => { DB.db = e.target.result; r(); };
      q.onerror = () => r();
    } catch (e) { r(); }
  }),
  save: (id, b64) => { try { if (DB.db) DB.db.transaction('receipts', 'readwrite').objectStore('receipts').put(b64, id); } catch (e) {} },
  del: id => { try { if (DB.db) DB.db.transaction('receipts', 'readwrite').objectStore('receipts').delete(id); } catch (e) {} },
  get: id => new Promise(r => {
    try {
      if (!DB.db) return r(null);
      const q = DB.db.transaction('receipts').objectStore('receipts').get(id);
      q.onsuccess = () => r(q.result || null); q.onerror = () => r(null);
    } catch (e) { r(null); }
  })
};

function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900, scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.68));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function viewReceipt(id) {
  const b64 = await DB.get(id);
  if (!b64) return toast('Nessun allegato o salvato solo in locale');
  openSheet(`
    <div class='row sp'><b style='font-size:14.5px'>Scontrino</b><button class='x' onclick='closeNp()'>Chiudi</button></div>
    <img src='${b64}' alt='Scontrino' style='width:100%;border-radius:14px;margin-top:11px;display:block'>
  `);
}

function scanReceipt() {
  vib(15);
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.setAttribute('capture', 'environment');
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const b64 = await compressImage(f);
    np(today(), 'ex');
    nps.recB64 = b64;
    npR();
    toast('Scontrino allegato: inserisci l’importo');
  };
  inp.click();
}

/* ==========================================================================
   3. STATO, MIGRAZIONE & CATEGORIE
   ========================================================================== */
const CAT_BASE = {
  heets: ['Heets', '#F59E0B'],
  caffe: ['Caffè', '#A855F7'],
  cibo: ['Cibo fuori', '#EAB308'],
  benz: ['Benzina', '#EF4444'],
  gpl: ['GPL', '#32D74B'],
  svago: ['Svago', '#3B82F6'],
  altro: ['Altro', '#86868D']
};
function getCats() {
  const out = Object.assign({}, CAT_BASE);
  if (Array.isArray(S.customCats)) S.customCats.forEach(cc => { if (cc && cc.id && cc.name) out[cc.id] = [cc.name, cc.col || '#38BDF8']; });
  return out;
}
const getCatKeys = () => Object.keys(getCats());
const FIX = { heets: 5.5, caffe: 0.35, benz: 20 };
const MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
const DN = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const KEYS = [1, 2, 3, 4, 5, 6, 7, 8, 9, ',', 0, '<'];
const IT = ['Stipendio', 'Regalo', 'Rimborso', 'Altro'];

function defaultState() {
  return {
    schemaVer: 15, updatedAt: 0, sal: 700, bud: 230, payDay: 1, liq0: 0, tank: 30, kmDay: 92, idealKmL: 15.5,
    workDays: [1, 2, 3, 4, 5], workStart: '09:00', workEnd: '18:00', commuteMins: 60, homeLabel: 'Ancona', workLabel: 'Cingoli', commuteMode: 'gpl',
    roundUp: false, customCats: [], archivedCycles: [], lastBackupAt: 0, zeroSpendDays: [],
    ex: [], fills: [], ev: [], notes: [], extra: {}, inc: [], rec: [], goals: [], debts: [], offDays: [], swClaimedDays: [],
    vacMode: false, vacBud: 500, vacStart: '', vacDays: [], parked: [], savedImpulse: 0, carpool: [], maintLastKm: 0, maintInt: 15000, priv: false, celebratedCycles: [],
    nf: { types: { evento: true, gpl: true, budget: true, stipendio: true, parcheggio: true, sera: true, tagliando: true, debiti: true, backup: true, fisse: true }, evMin: 30, evening: 21, autoCal: false, shortcutCal: false, shortcutName: 'LeoCalendar', sent: {}, sysd: {}, ntfyTopic: '', ntfyOn: false },
    cloud: { key: '', bin: '', lastSync: 0 }
  };
}

function migrate(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;
  const out = Object.assign({}, base, raw);
  if (raw.cap != null && !raw.liq0) out.liq0 = +raw.cap || 0;
  if (raw.payday != null && !raw.payDay) out.payDay = +raw.payday || 1;
  if (raw.maintBase != null && !raw.maintLastKm) out.maintLastKm = +raw.maintBase || 0;
  if (Array.isArray(raw.park) && !Array.isArray(raw.parked)) out.parked = raw.park;
  if (raw.sw && !Array.isArray(raw.offDays)) out.offDays = Object.keys(raw.sw).filter(k => raw.sw[k]);

  out.schemaVer = base.schemaVer;
  out.updatedAt = +out.updatedAt || 0;
  out.sal = +out.sal || 0; out.bud = +out.bud || 0; out.payDay = Math.min(31, Math.max(1, +out.payDay || 1)); out.liq0 = +out.liq0 || 0;
  out.tank = +out.tank || 30; out.kmDay = +out.kmDay >= 0 ? +out.kmDay : 92; out.idealKmL = +out.idealKmL || 15.5;
  out.workStart = typeof out.workStart === 'string' && out.workStart.includes(':') ? out.workStart : '09:00';
  out.workEnd = typeof out.workEnd === 'string' && out.workEnd.includes(':') ? out.workEnd : '18:00';
  out.commuteMins = Math.max(0, +out.commuteMins || 0);
  out.homeLabel = (out.homeLabel || 'Casa').trim(); out.workLabel = (out.workLabel || 'Sede').trim();
  out.commuteMode = ['gpl', 'transit', 'remote'].includes(out.commuteMode) ? out.commuteMode : 'gpl';
  out.roundUp = Boolean(out.roundUp);
  out.savedImpulse = Math.round((+out.savedImpulse || 0) * 100) / 100;
  out.maintLastKm = +out.maintLastKm || 0; out.maintInt = +out.maintInt || 15000;
  out.priv = Boolean(out.priv); out.vacMode = Boolean(out.vacMode); out.vacBud = +out.vacBud >= 0 ? +out.vacBud : 500;
  out.vacStart = typeof out.vacStart === 'string' ? out.vacStart : ''; out.lastBackupAt = +out.lastBackupAt || 0;
  if (!Array.isArray(out.workDays)) out.workDays = [1, 2, 3, 4, 5];
  ['ex', 'fills', 'ev', 'notes', 'inc', 'rec', 'goals', 'debts', 'offDays', 'swClaimedDays', 'vacDays', 'parked', 'carpool', 'celebratedCycles', 'customCats', 'archivedCycles', 'zeroSpendDays'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  if (!out.extra || typeof out.extra !== 'object' || Array.isArray(out.extra)) out.extra = {};
  out.cloud = Object.assign({ key: '', bin: '', lastSync: 0 }, out.cloud || {});
  out.nf = Object.assign({}, base.nf, out.nf || {});
  out.nf.types = Object.assign({}, base.nf.types, out.nf.types || {});
  return out;
}

let S = defaultState();
let loadWarn = '';
try { S = migrate(JSON.parse(localStorage.getItem('lw') || '{}')); } catch (e) {
  try {
    const raw = localStorage.getItem('lw'); if (raw) { localStorage.setItem('lw_corrupt', raw); loadWarn = 'corrupt'; }
    const bk = ['lw_bak1', 'lw_bak2', 'lw_bak3'].map(k => localStorage.getItem(k)).find(Boolean);
    if (bk) { S = migrate(JSON.parse(bk)); loadWarn = 'restored'; }
  } catch (e2) {}
}

let syncTimer = null;
const dropKeys = ks => ks.forEach(k => { try { localStorage.removeItem(k); } catch (_) {} });
const save = (skipCloud = false) => {
  S.updatedAt = Date.now();
  let json; try { json = JSON.stringify(S); } catch (e) { return; }
  try {
    const day = today();
    if (localStorage.getItem('lw_bak_d') !== day) {
      const cur = localStorage.getItem('lw');
      if (cur && cur.length > 20) {
        const b1 = localStorage.getItem('lw_bak1'), b2 = localStorage.getItem('lw_bak2');
        if (b2) localStorage.setItem('lw_bak3', b2); if (b1) localStorage.setItem('lw_bak2', b1);
        localStorage.setItem('lw_bak1', cur); localStorage.setItem('lw_bak_d', day);
      }
    }
  } catch (e) {}
  try { localStorage.setItem('lw', json); } catch (e) {
    dropKeys(['lw_bak3', 'lw_bak2', 'lw_bak1', 'lw_corrupt', 'lw_pre']);
    try { localStorage.setItem('lw', json); } catch (e2) { if (!save.warned) { save.warned = true; toast('Memoria piena: esporta subito un backup'); } }
  }
  if (!skipCloud && S.cloud && S.cloud.key && S.cloud.bin) { clearTimeout(syncTimer); syncTimer = setTimeout(() => cloudPush(true), 2500); }
};

let tab = 'home', cm = new Date(), sel = today(), cycOff = 0, weekOff = 0, ans = '', ansTimer = null, pend = null;
let anRange = '14G', anMetric = 'liq', moneySub = 'mov', sysSub = 'fin', noteFilter = 'all', spotlightQuery = '';
let lastVoiceSnapshot = null, lastSwUndo = null, lastActionMeta = null, showVoiceHelp = false;
let activeChartCoords = [], activeChartMeta = { title: 'Patrimonio' }, prevKpiVals = null;

function getCycleRange(offset = 0) {
  const pd = Math.min(31, Math.max(1, +S.payDay || 1)), now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  if (now.getDate() < Math.min(pd, new Date(y, m + 1, 0).getDate())) { m -= 1; if (m < 0) { m = 11; y -= 1; } }
  const startDate = new Date(y, m + offset, 1), sy = startDate.getFullYear(), sm = startDate.getMonth();
  const start = new Date(sy, sm, Math.min(pd, new Date(sy, sm + 1, 0).getDate()));
  const nextMonth = new Date(sy, sm + 1, 1), ny = nextMonth.getFullYear(), nm = nextMonth.getMonth();
  const nextStart = new Date(ny, nm, Math.min(pd, new Date(ny, nm + 1, 0).getDate()));
  const end = new Date(nextStart.getTime() - 86400000);
  return { startStr: iso(start), endStr: iso(end), totalDays: Math.round((end - start) / 86400000) + 1, label: pd === 1 ? `${MESI[sm].slice(0, 3)} ${sy}` : `${start.getDate()} ${MESI[sm].slice(0, 3)} – ${end.getDate()} ${MESI[nm].slice(0, 3)}` };
}

function liq() {
  return Math.round(((+S.liq0 || 0) + S.inc.reduce((s, i) => s + (+i.a || 0), 0) - S.ex.reduce((s, e) => s + (+e.a || 0), 0)) * 100) / 100;
}

function stats(offset = 0) {
  const cyc = getCycleRange(offset), t = today();
  const exList = S.ex.filter(e => !e.vac && e.d >= cyc.startStr && e.d <= cyc.endStr);
  const incList = S.inc.filter(i => i.d >= cyc.startStr && i.d <= cyc.endStr);
  const spent = Math.round(exList.reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const fixedSpent = Math.round(exList.filter(e => e.rid).reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const varSpent = Math.round((spent - fixedSpent) * 100) / 100;
  const earned = Math.round(incList.reduce((s, i) => s + (+i.a || 0), 0) * 100) / 100;
  const bud = +S.bud || 0, rem = Math.round((bud - spent) * 100) / 100;

  let elapsed = Math.min(cyc.totalDays, Math.max(1, Math.floor((new Date(t + 'T12:00') - new Date(cyc.startStr + 'T12:00')) / 86400000) + 1));
  let left = Math.min(cyc.totalDays, Math.max(1, Math.floor((new Date(cyc.endStr + 'T12:00') - new Date(t + 'T12:00')) / 86400000) + 1));

  // Spese fisse ancora in scadenza nel ciclo corrente (solo quota personale se condivise)
  let upcomingFixed = 0;
  if (offset === 0 && Array.isArray(S.rec)) {
    S.rec.forEach(r => {
      const splitN = Math.max(1, +r.splitN || 1);
      const myShare = Math.round(((+r.a || 0) / splitN) * 100) / 100;
      for (let d = new Date(t + 'T12:00'); iso(d) <= cyc.endStr; d.setDate(d.getDate() + 1)) {
        const ds = iso(d);
        if (ds <= t) continue;
        const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        if (d.getDate() === Math.min(r.day, dim)) upcomingFixed += myShare;
      }
    });
  }
  upcomingFixed = Math.round(upcomingFixed * 100) / 100;

  const spendableRem = Math.max(0, rem - upcomingFixed);
  const projSpentEnd = Math.round((fixedSpent + upcomingFixed + (varSpent / elapsed) * cyc.totalDays) * 100) / 100;
  const idealPct = Math.min(100, Math.round((elapsed / cyc.totalDays) * 100));
  const actualPct = bud > 0 ? Math.min(100, Math.round((spent / bud) * 100)) : 0;
  const paceRatio = bud > 0 ? (spent / bud) / Math.max(0.05, elapsed / cyc.totalDays) : 0;
  const paceStatus = rem <= 0 ? 'pace-bad' : paceRatio > 1.15 ? 'pace-warn' : 'pace-ok';

  return {
    cyc, exList, incList, dim: cyc.totalDays, spent, fixedSpent, varSpent, upcomingFixed, earned,
    net: Math.round((earned - spent) * 100) / 100,
    rem, left, day: elapsed, idealPct, actualPct, paceRatio, paceStatus,
    spentToday: Math.round(S.ex.filter(e => !e.vac && e.d === t).reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100,
    daily: spendableRem <= 0 ? 0 : Math.round((spendableRem / left) * 100) / 100,
    per: bud / cyc.totalDays,
    projSpentEnd,
    projLiqEnd: Math.round((liq() - Math.max(0, projSpentEnd - spent)) * 100) / 100,
    goal: (+S.sal || 0) - bud
  };
}

function vacStats() {
  const start = S.vacStart || today(), vacEx = S.ex.filter(e => e.vac && (!S.vacStart || e.d >= start));
  const spent = Math.round(vacEx.reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  return { exList: vacEx, spent, bud: +S.vacBud || 0, rem: Math.round(((+S.vacBud || 0) - spent) * 100) / 100, spentToday: Math.round(vacEx.filter(e => e.d === today()).reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100, daysActive: Math.max(1, (S.vacDays || []).filter(d => !S.vacStart || d >= start).length) };
}

function getNoSpendStreak() {
  const impulseCats = ['heets', 'caffe', 'cibo', 'svago', 'altro'];
  let streak = 0, d = new Date();
  const firstD = [...S.ex.map(e => e.d), ...S.inc.map(i => i.d), ...(S.zeroSpendDays || [])].sort()[0] || today();
  for (let i = 0; i < 120; i++) {
    const ds = iso(d);
    if (ds < firstD) break;
    const hasImpulse = S.ex.some(e => e.d === ds && !e.rid && !e.vac && impulseCats.includes(e.c));
    if (hasImpulse) break;
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function getSwSavingsInfo() {

    ? Math.round(((km / kml) * (c.last ? c.last.ppl : 0.75) + km * 0.04) * 100) / 100
    : S.commuteMode === 'transit' ? 5.00 : 0;
  const claimed = Array.isArray(S.swClaimedDays) ? S.swClaimedDays : [];
  const swDaysCycle = (S.offDays || []).filter(ds => ds >= s.cyc.startStr && ds <= s.cyc.endStr && isScheduledWorkday(ds));
  const unclaimedDays = (S.offDays || []).filter(ds => isScheduledWorkday(ds) && !claimed.includes(ds));
  const unclaimedSwSaved = Math.round(unclaimedDays.length * perDaySaved * 100) / 100;
  const tesoretto = Math.round(((S.savedImpulse || 0) + unclaimedSwSaved) * 100) / 100;
  return { count: swDaysCycle.length, unclaimedDays, cycleSaved: Math.round(swDaysCycle.length * perDaySaved * 100) / 100, unclaimedSwSaved, perDaySaved, tesoretto };
}

function getSpendingAnomalies() {
  const s0 = stats(0), s1 = stats(-1);
  if (s1.varSpent <= 0 || s0.day < 5) return [];
  const cats = getCats();
  const c0 = {}, c1 = {};
  S.ex.filter(e => !e.vac && !e.rid && e.d >= s0.cyc.startStr && e.d <= today()).forEach(e => c0[e.c] = (c0[e.c] || 0) + e.a);
  S.ex.filter(e => !e.vac && !e.rid && e.d >= s1.cyc.startStr && e.d <= s1.cyc.endStr).forEach(e => c1[e.c] = (c1[e.c] || 0) + e.a);
  const alerts = [];
  Object.keys(c0).forEach(k => {
    if (k === 'gpl' || k === 'benz') return;
    const paceNow = c0[k] / s0.day;
    const pacePrev = (c1[k] || 0) / s1.dim;
    if (pacePrev > 0.35 && paceNow > pacePrev * 1.35 && c0[k] >= 12) {
      alerts.push({ cat: cats[k]?.[0] || k, pct: Math.round(((paceNow - pacePrev) / pacePrev) * 100), proj: Math.round(paceNow * s0.dim * 100) / 100 });
    }
  });
  return alerts.slice(0, 2);
}

function checkCycleCelebration() {

}

function isCycleClosingDue() {

function catSumRange(startStr, endStr) {

  return o;
}

function getAnalyticsPoints(metric, range, offset) {
  const t = today();
  if (range === '6M') {
    const pts = [];
    for (let k = -5; k <= 0; k++) {
      const st = stats(offset + k);
      const val = metric === 'exp' ? st.spent : metric === 'sav' ? Math.max(0, st.rem) : (S.liq0 + S.inc.filter(i => i.d <= st.cyc.endStr).reduce((a, b) => a + b.a, 0) - S.ex.filter(e => e.d <= st.cyc.endStr).reduce((a, b) => a + b.a, 0));
      pts.push({ label: st.cyc.label, short: st.cyc.label.split(' ')[0], v: val });
    }
    return pts;
  }
  let dates = [];
  if (range === '14G') {
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); dates.push(iso(d)); }
  } else {
    const cyc = getCycleRange(offset);
    for (let d = new Date(cyc.startStr + 'T12:00'); iso(d) <= cyc.endStr; d.setDate(d.getDate() + 1)) {
      const ds = iso(d);
      if (offset === 0 && ds > t) break;
      dates.push(ds);
    }
    if (!dates.length) dates = [cyc.startStr];
  }
  return dates.map(ds => {
    const parts = ds.split('-'), short = `${parts[2]}/${parts[1]}`;
    let v = 0, ideal = null;
    if (metric === 'liq') {
      v = S.liq0 + S.inc.filter(i => i.d <= ds).reduce((s, i) => s + i.a, 0) - S.ex.filter(e => e.d <= ds).reduce((s, e) => s + e.a, 0);
    } else if (metric === 'exp') {
      v = S.ex.filter(e => !e.vac && e.d === ds).reduce((s, e) => s + e.a, 0);
    } else {
      const cyc = getCycleRange(offset);
      const spentSoFar = S.ex.filter(e => !e.vac && e.d >= cyc.startStr && e.d <= ds).reduce((s, e) => s + e.a, 0);
      v = Math.max(0, S.bud - spentSoFar);
      const dayIdx = Math.max(1, Math.round((new Date(ds + 'T12:00') - new Date(cyc.startStr + 'T12:00')) / 86400000) + 1);
      ideal = Math.max(0, S.bud - (S.bud / cyc.totalDays) * dayIdx);
    }
    return { label: short, short, v, ideal };
  });
}

function addEx(c, a, d, n, hasRec = false, customId = null, silent = false) {
  const cats = getCats(); if (!cats[c]) c = 'altro';
  const id = customId || uid(), isVac = Boolean(S.vacMode);
  const val = Math.round((+a || 0) * 100) / 100;
  const e = { id, d: d || today(), c, a: val, n: n || '', rec: Boolean(hasRec), vac: isVac };
  S.ex.push(e); lastActionMeta = { kind: 'ex', id };
  if (S.roundUp && val > 0 && val % 1 !== 0) {
    const spare = Math.round((Math.ceil(val) - val) * 100) / 100;
    if (spare > 0 && spare < 1) S.savedImpulse = Math.round(((S.savedImpulse || 0) + spare) * 100) / 100;
  }
  save();
  if (!silent) { toast((isVac ? '[Vacanza] ' : '') + cats[c][0] + ' · ' + eur(val), `delEx('${e.id}')`); R(); }
  return id;
}

function addInc(a, d, t, silent = false) {
  const id = uid(), val = Math.round((+a || 0) * 100) / 100;
  S.inc.push({ id, d: d || today(), a: val, t: t || 'Entrata' });
  lastActionMeta = { kind: 'inc', id }; save();
  if (!silent) { toast('Entrata · +' + eur(val), `delInc('${id}')`); R(); }
  return id;
}

function delEx(id) {
  const e = S.ex.find(x => x.id === id); if (!e) return;
  if (e.fid) S.fills = S.fills.filter(f => f.id !== e.fid);
  if (e.rid) { const r = S.rec.find(x => x.id === e.rid); if (r) { r.sk = r.sk || []; r.sk.push(e.d.slice(0, 7)); } }
  if (e.rec) DB.del(e.id);

/* ==========================================================================
   7. MOTORE AUTO, GPL, PREVISIONE GIORNO RISERVA & CARPOOLING
   ========================================================================== */
function dayK(f, w) {
  const km = S.kmDay || 92;
  return wk(f.d) ? (f.pl === 'wk' ? km / 2 : (w === 'a' ? km : 0)) : 0;
}

function kmB(a, b) {
  const km = S.kmDay || 92;
  let k = dayK(a, 'a') + dayK(b, 'b');
  for (let d = new Date(a.d + 'T12:00'); ;) {
    d.setDate(d.getDate() + 1);
    const x = iso(d);
    if (x >= b.d) break;
    if (wk(x)) k += km;
  }
  return k + Object.entries(S.extra).filter(([d]) => d > a.d && d < b.d).reduce((s, [, v]) => s + v, 0);
}

function predictReserveDate(remKm) {
  if (remKm == null || remKm <= 0) return { label: 'In riserva', ds: today() };
  const km = S.kmDay || 92;
  if (km <= 0 || S.commuteMode === 'remote') return { label: 'Solo extra', ds: null };
  let left = remKm;
  const d = new Date(), h = d.getHours(), endH = hh(S.workEnd || '18:00');
  if (wk(today())) {
    const remToday = h < hh(S.workStart || '09:00') ? km : h < endH ? km / 2 : 0;
    left -= remToday;
    if (left <= 0) return { label: 'Fino a stasera', ds: today() };
  }
  for (let i = 1; i <= 30; i++) {
    d.setDate(d.getDate() + 1);
    const ds = iso(d);
    if (wk(ds)) {
      left -= km;
      if (left <= 0) {
        if (i === 1) return { label: 'Fino a domani', ds };
        return { label: `Fino a ${DN[d.getDay()].slice(0, 3)} ${d.getDate()}`, ds };
      }
    }
  }
  return { label: 'Oltre 30g', ds: null };
}

function car() {
  const km = S.kmDay || 92, ideal = S.idealKmL || 15.5, f = [...S.fills].sort((a, b) => a.d.localeCompare(b.d));
  let L = 0, K = 0, E = 0, segs = [];
  f.forEach((x, i) => {
    if (i) {
      const k = kmB(f[i - 1], x), lit = x.eur / x.ppl;
      if (k > 0 && lit > 0) { K += k; L += lit; E += x.eur; segs.push({ k, lit }); }
    }
  });
  let avg = ideal;
  if (segs.length) { const recent = segs.slice(-5), rK = recent.reduce((s, x) => s + x.k, 0), rL = recent.reduce((s, x) => s + x.lit, 0); if (rL > 0) avg = rK / rL; }
  const last = f[f.length - 1]; let since = 0;
  if (last) {
    const t = today(), h = new Date().getHours(), startH = hh(S.workStart || '09:00'), endH = hh(S.workEnd || '18:00');
    if (last.d < t) {
      since = dayK(last, 'a');
      for (let d = new Date(last.d + 'T12:00'); ;) { d.setDate(d.getDate() + 1); const x = iso(d); if (x >= t) break; if (wk(x)) since += km; }
      if (wk(t)) since += h < startH ? 0 : h < endH ? km / 2 : km;
    } else if (last.d === t && wk(t)) {
      if (last.pl === 'an' && h >= endH) since += km; else if (last.pl === 'an' && h >= startH) since += km / 2; else if (last.pl === 'wk' && h >= endH) since += km / 2;
    }
    since += Object.entries(S.extra).filter(([d]) => d >= last.d).reduce((s, [, v]) => s + v, 0);
  }
  const range = S.tank * avg, rem = last ? Math.max(0, range - since) : null;
  const tk = rem == null ? 0 : Math.min(4, Math.max(0, Math.ceil((rem / range) * 4)));
  let status = 'NONE', statusLabel = 'VUOTO', statusCls = '';
  if (last) {
    if (rem <= km * 1.15) { status = 'CRIT'; statusLabel = 'FAI PIENO'; statusCls = 'bad'; }
    else if (rem <= km * 2.1) { status = 'LOW'; statusLabel = 'A BREVE'; statusCls = 'w'; }
    else { status = 'OK'; statusLabel = 'OK'; statusCls = 'ok'; }
  }
  const cpTotal = (S.carpool || []).reduce((s, x) => s + (+x.amount || 0), 0);
  const netE = Math.max(0, E - cpTotal);
  const anFills = f.filter(x => x.pl === 'an'), wkFills = f.filter(x => x.pl === 'wk');
  const totalTrackedKm = K + since;
  const resPred = predictReserveDate(rem);
  return {
    f, K, avg, last, since, range, rem, tk, status, statusLabel, statusCls, reserveDay: resPred.label, reserveDs: resPred.ds,
    cpk: K ? E / K : 0, netCpk: K ? netE / K : 0, cpTotal,
    avgAn: anFills.length ? anFills.reduce((s, x) => s + x.ppl, 0) / anFills.length : null,
    avgWk: wkFills.length ? wkFills.reduce((s, x) => s + x.ppl, 0) / wkFills.length : null,
    totalTrackedKm, maintSince: Math.max(0, totalTrackedKm - (S.maintLastKm || 0)), maintInt: S.maintInt || 15000, maintLeft: (S.maintInt || 15000) - Math.max(0, totalTrackedKm - (S.maintLastKm || 0))
  };
}

/* ==========================================================================
   8. AGENDA, CONTO ALLA ROVESCIA LIVE, SMART WORKING & COMANDI RAPIDI IOS
   ========================================================================== */
function evOn(ds) {
  const w = new Date(ds + 'T12:00').getDay();
  return S.ev.filter(e => {
    if (e.d === ds) return true;
    if (e.d > ds) return false;
    if (e.end && ds > e.end) return false;
    if (!e.r) return false;
    if (e.r === 'd') return true;
    if (e.r === 'w') return new Date(e.d + 'T12:00').getDay() === w;
    if (e.r === 'm') return new Date(e.d + 'T12:00').getDate() === new Date(ds + 'T12:00').getDate();
    if (e.r.startsWith('i')) {
      const step = Math.max(1, parseInt(e.r.slice(1), 10) || 1);
      const diff = Math.round((new Date(ds + 'T12:00') - new Date(e.d + 'T12:00')) / 86400000);
      return diff % step === 0;
    }
    return false;
  }).sort((a, b) => a.tm.localeCompare(b.tm));
}

function getLiveAgendaStatus() {
  const t = today(), ev = evOn(t);
  const now = new Date(), nowMins = now.getHours() * 60 + now.getMinutes();

  for (const e of ev) {
    const [eh, em] = (e.tm || '00:00').split(':').map(Number);
    const startM = eh * 60 + em;
    const endM = startM + Math.round((+e.dur || 1) * 60);
    if (nowMins >= startM && nowMins < endM) {
      return { text: `In corso · ${e.t}`, cls: 'ok' };
    }
    const diff = startM - nowMins;
    if (diff > 0 && diff <= 240) {
      const h = Math.floor(diff / 60), m = diff % 60;
      const span = h > 0 ? `${h}h ${m ? m + 'm' : ''}`.trim() : `${m} min`;
      return { text: `Tra ${span} · ${e.t}`, cls: diff <= 30 ? 'w' : '' };
    }
  }
  if (isVacDay(t)) return { text: 'Vacanza · 0 km', cls: 'vac' };
  if (isOffDay(t)) return { text: 'Remote · 0 km', cls: 'ok' };
  if (ev.length) return { text: `${ev.length} ${ev.length === 1 ? 'impegno' : 'impegni'} oggi`, cls: '' };
  if (wk(t)) {
    const endH = hh(S.workEnd || '18:00');
    const retH = endH + (S.commuteMins || 0) / 60;
    if (nowMins < endH * 60) return { text: `${S.workStart}–${S.workEnd} · Rientro ~${fmtH(retH)}`, cls: '' };
    return { text: 'Giornata lavorativa conclusa', cls: '' };
  }
  return { text: 'Giornata libera', cls: '' };
}

function classifyActivityContext(rawTitle) {
  const t = rawTitle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (/colazion|cappuccin|cornett|brioche/.test(t)) return { kind: 'Colazione', defDur: 0.75, wkSlots: [7, 7.5, 8, 8.5, 9], weSlots: [8.5, 9, 9.5, 10] };
  if (/pranz|mensa|pausa pranzo/.test(t)) return { kind: 'Pranzo', defDur: 1.25, wkSlots: [12.5, 13, 13.5], weSlots: [12.5, 13, 13.5, 14] };
  if (/aperitiv|spritz|happy hour/.test(t)) return { kind: 'Aperitivo', defDur: 1.5, wkSlots: [18.5, 19, 19.5], weSlots: [18, 18.5, 19, 19.5] };
  if (/\bcen(a|are|etta)\b|ristorant|pizz|sushi|trattori|osteri|hamburger/.test(t)) return { kind: 'Cena', defDur: 2, wkSlots: [20, 20.5, 21, 19.5], weSlots: [20, 20.5, 21] };
  if (/allen|palestr|corsa|correr|nuot|calcett|padel|tennis|bici|sport|workout|yoga|pesi/.test(t)) return { kind: 'Allenamento', defDur: 1.5, wkSlots: [18.5, 19, 19.5, 7, 17.5], weSlots: [10, 10.5, 16, 17, 11] };
  if (/studi|legger|libro|corso|esam|call|riunion|lavor|progett|codic/.test(t)) return { kind: 'Focus / Studio', defDur: 1.5, wkSlots: [18.5, 20.5, 21, 8], weSlots: [9.5, 10.5, 15, 16.5] };
  if (/medic|dentist|dottor|visita|banc|post|comun|tagli|parrucchier|barbier|meccanic|gommist|commission/.test(t)) return { kind: 'Appuntamento', defDur: 1, wkSlots: [8.5, 13, 17.5, 18, 18.5], weSlots: [9.5, 10.5, 11.5, 16] };
  if (/cinema|film|serat|uscir|uscit|amic|concert|teatr|bowling|locale|pub/.test(t)) return { kind: 'Serata', defDur: 2.5, wkSlots: [20.5, 21, 21.5], weSlots: [20.5, 21, 21.5, 17] };
  return { kind: 'Generico', defDur: 1, wkSlots: [18.5, 19, 20, 20.5, 8], weSlots: [10, 11, 15.5, 17, 18.5] };
}

function slots(dur, rawTitle = '', preferRange = null) {
  const out = [], now = new Date();
  const ctx = classifyActivityContext(rawTitle);
  const useDur = dur || ctx.defDur;
  const wStart = hh(S.workStart || '09:00'), wEnd = hh(S.workEnd || '18:00'), commH = (S.commuteMins || 0) / 60;
  const nowH = now.getHours() + now.getMinutes() / 60;
  const startOffset = preferRange === 'next_week' ? 7 : 0;
  const maxDays = preferRange === 'this_week' ? 7 : 14;

  for (let i = startOffset; i < startOffset + maxDays && out.length < 4; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    const ds = iso(d), isWkDay = wk(ds), bz = evOn(ds).map(e => [hh(e.tm), hh(e.tm) + (+e.dur || 1)]);
    if (isWkDay) bz.push([Math.max(0, wStart - commH), Math.min(24, wEnd + commH)]);
    let candidates = isWkDay ? [...ctx.wkSlots] : [...ctx.weSlots];
    if (preferRange === 'morning') candidates = candidates.filter(h => h < 12.5);
    if (preferRange === 'afternoon') candidates = candidates.filter(h => h >= 12.5 && h < 18.5);
    if (preferRange === 'evening') candidates = candidates.filter(h => h >= 18.5);
    if (!candidates.length) candidates = isWkDay ? [18.5, 19.5, 20.5] : [10.5, 15.5, 18.5, 20.5];
    const h = candidates.find(hr => (i > 0 || hr > nowH + 0.25) && hr + useDur <= 23.5 && bz.every(([s, e]) => hr + useDur <= s || hr >= e));
    if (h != null) {
      const reason = !isWkDay ? 'giornata libera' : h >= wEnd + commH ? 'dopo il rientro' : h + useDur <= wStart - commH ? 'prima del lavoro' : 'pausa';
      out.push({ ds, h, dur: useDur, reason, kind: ctx.kind });
    }
  }
  return out;
}

function slotHTML(t, dur, preferRange = null) {

  if (isChecklist) {
    const rawItems = Array.isArray(itemsOrBody) ? itemsOrBody : String(itemsOrBody || '').split(/,|\be\b|\n/).map(x => x.trim()).filter(Boolean);
    const existing = S.notes.find(n => n.type === 'checklist' && n.title.toLowerCase() === cleanTitle.toLowerCase());
    if (existing) {
      rawItems.forEach(txt => existing.items.push({ id: uid(), txt: cap(txt), done: false }));
      existing.updatedAt = Date.now();
      save();
      if (!silent) { toast(`Aggiunte ${rawItems.length} voci a «${existing.title}»`); R(); }
      return existing;
    }
    const note = { id: uid(), type: 'checklist', title: cleanTitle, items: rawItems.map(txt => ({ id: uid(), txt: cap(txt), done: false })), updatedAt: Date.now() };
    S.notes.unshift(note); save();
    if (!silent) { toast(`Checklist «${cleanTitle}» creata`); R(); }
    return note;
  } else {
    const note = { id: uid(), type: 'note', title: cleanTitle, body: String(itemsOrBody || '').trim(), updatedAt: Date.now() };
    S.notes.unshift(note); save();
    if (!silent) { toast(`Nota «${cleanTitle}» salvata`); R(); }
    return note;
  }
}

  const n = S.notes.find(x => x.id === noteId); if (!n || !Array.isArray(n.items)) return;
  const it = n.items.find(x => x.id === itemId);
  if (it) { it.done = !it.done; n.updatedAt = Date.now(); save(); R(); }
}

function addChecklistItemInline(noteId, txt) {

  n.items.push({ id: uid(), txt: cap(clean), done: false }); n.updatedAt = Date.now(); save(); R();
}

function parkItem(name, amount, silent = false) {
  const n = (name || '').trim() || 'Acquisto extra';
  const a = Math.round((+amount || 0) * 100) / 100;
  if (!(a > 0)) { if (!silent) toast('Importo non valido'); return; }
  S.parked.push({ id: uid(), name: cap(n), amount: a, createdAt: Date.now() });
  save();
  if (!silent) { toast(`Parcheggiato per 48h · ${cap(n)}`); R(); }
}

function delParked(id, saved = false) {
  const item = S.parked.find(x => x.id === id); if (!item) return;
  S.parked = S.parked.filter(x => x.id !== id);
  if (saved) { S.savedImpulse = Math.round(((S.savedImpulse || 0) + item.amount) * 100) / 100; toast(`Risparmiati ${eur(item.amount)}`); }
  save(); R();
}

function promoteParked(id) {
  const item = S.parked.find(x => x.id === id); if (!item) return;
  S.parked = S.parked.filter(x => x.id !== id);
  addEx('svago', item.amount, today(), item.name);
}

function impulseToGoal() {
  const swInfo = getSwSavingsInfo();
  const v = swInfo.tesoretto;
  if (!(v > 0)) return;
  const prevImp = S.savedImpulse || 0;
  const prevClaimed = [...(S.swClaimedDays || [])];
  S.swClaimedDays = [...new Set([...prevClaimed, ...swInfo.unclaimedDays])];
  S.savedImpulse = 0;

  if (S.goals.length) {
    const prevS = S.goals[0].s;
    lastSwUndo = { type: 'tesoretto', prevSavedImpulse: prevImp, prevClaimedDays: prevClaimed, goalIdx: 0, prevGoalVal: prevS };
    S.goals[0].s = Math.round((S.goals[0].s + v) * 100) / 100;
    save();
    if (prevS < S.goals[0].t && S.goals[0].s >= S.goals[0].t) launchConfetti();
    toast(`+${eur(v)} versati in ${S.goals[0].n}`, 'undoSwAction()');
  } else {
    const incId = uid();
    lastSwUndo = { type: 'tesoretto', prevSavedImpulse: prevImp, prevClaimedDays: prevClaimed, incId };
    S.inc.push({ id: incId, d: today(), a: v, t: 'Tesoretto risparmiato' });
    save();
    toast(`+${eur(v)} versati nel Patrimonio`, 'undoSwAction()');
  }
  R();
}

function goalAdd(i) {
  const v = +$('#gc' + i).value;
  if (v > 0) {
    const prevS = S.goals[i].s;
    S.goals[i].s = Math.round((S.goals[i].s + v) * 100) / 100;
    save();
    if (prevS < S.goals[i].t && S.goals[i].s >= S.goals[i].t) { launchConfetti(); toast(`Obiettivo ${S.goals[i].n} raggiunto!`); }
    else toast('Versati ' + eur(v));
    R();
  }
}

function addDebt(who, a, dir, silent = false) {
  const val = Math.round((+a || 0) * 100) / 100;
  S.debts.push({ id: uid(), who, a: val, dir, d: today() });
  save();
  if (!silent) R();
  return dir === 'due' ? `<b>${esc(who)}</b> ti deve <b>${eur(val)}</b>.` : `Devi <b>${eur(val)}</b> a <b>${esc(who)}</b>.`;
}

function settle(i, silent = false) {
  const g = S.debts[i]; if (!g) return;
  g.p = 1;
  if (g.dir === 'due') S.inc.push({ id: uid(), d: today(), a: g.a, t: 'Rimborso ' + g.who });
  else S.ex.push({ id: uid(), d: today(), c: 'altro', a: g.a, n: 'Saldo ' + g.who });
  save();
  if (!silent) { toast(g.dir === 'due' ? `Ricevuti ${eur(g.a)} da ${g.who}` : `Saldati ${eur(g.a)} a ${g.who}`); R(); }
}

function buildMiniSparkline() {
  const pts = getAnalyticsPoints('liq', '14G', 0).slice(-7);
  if (pts.length < 2) return '';
  const vals = pts.map(p => p.v);
  const mn = Math.min(...vals), mx = Math.max(...vals), sp = Math.max(1, mx - mn);
  const d = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${(i * (52 / (pts.length - 1))).toFixed(1)} ${(18 - ((p.v - mn) / sp) * 14).toFixed(1)}`).join(' ');
  const up = vals[vals.length - 1] >= vals[0];
  return `<svg viewBox='0 0 52 20' width='52' height='20' style='overflow:visible'><path d='${d}' fill='none' stroke='${up ? 'var(--ok)' : 'var(--m)'}' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>`;
}

function renderSpotlightContent(qRaw) {
  const q = (qRaw || '').trim().toLowerCase();
  if (!q) return '';
  const cats = getCats();
  const matchedEx = S.ex.filter(e => {
    const catName = (cats[e.c]?.[0] || '').toLowerCase(), note = (e.n || '').toLowerCase();
    return catName.includes(q) || note.includes(q) || String(e.a).replace('.', ',').includes(q) || e.d.split('-').reverse().join('/').includes(q);
  });
  const matchedInc = S.inc.filter(i => (i.t || 'Entrata').toLowerCase().includes(q) || String(i.a).replace('.', ',').includes(q) || i.d.split('-').reverse().join('/').includes(q));
  const totOut = Math.round(matchedEx.reduce((s, x) => s + x.a, 0) * 100) / 100;
  const totIn = Math.round(matchedInc.reduce((s, x) => s + x.a, 0) * 100) / 100;
  const all = [
    ...matchedEx.map(e => ({ kind: 'ex', id: e.id, d: e.d, title: e.n || (cats[e.c]?.[0] || 'Altro'), sub: `${cats[e.c]?.[0] || 'Altro'} · ${e.d.split('-').reverse().join('/')}`, a: e.a, rec: e.rec })),
    ...matchedInc.map(i => ({ kind: 'inc', id: i.id, d: i.d, title: i.t || 'Entrata', sub: `Entrata · ${i.d.split('-').reverse().join('/')}`, a: i.a }))
  ].sort((a, b) => b.d.localeCompare(a.d));

  return `
    <div class='card' style='margin-top:6px'>
      <div class='row sp' style='margin-bottom:7px'><span class='kicker'>RISULTATI SPOTLIGHT</span><span class='badge'>${all.length}</span></div>

        <div class='kpi-box'><span class='m'>Netto</span><b class='${totIn - totOut >= 0 ? 'ok' : 'bad'} money-val'>${totIn - totOut >= 0 ? '+' : ''}${eur(totIn - totOut)}</b></div>
      </div>
    </div>

      ? `<div class='li-card'><div class='grow' style='cursor:pointer' onclick="openEd('${x.id}')"><div style='font-weight:600;font-size:12px'>${esc(x.title)}${x.rec ? ` <span class='badge'>Foto</span>` : ''}</div><div class='m'>${x.sub}</div></div><div class='row' style='gap:8px'><b class='money-val' style='font-size:12px'>- ${eur(x.a)}</b><button class='x' onclick="delEx('${x.id}')">✕</button></div></div>`

    ).join('') : `<div class='card m' style='text-align:center'>Nessun movimento per «${esc(qRaw)}».</div>`}`;
}

function chartScrub(ev) {
  const svg = $('#an-svg');
  if (!svg || !activeChartCoords.length) return;
  const rect = svg.getBoundingClientRect();
  const relX = ((ev.clientX - rect.left) / rect.width) * 350;
  let nearest = activeChartCoords[0];
  let best = Math.abs(relX - nearest.x);
  for (const p of activeChartCoords) {
    const d = Math.abs(relX - p.x);
    if (d < best) { best = d; nearest = p; }
  }
  const vline = $('#an-vline'), dot = $('#an-dot');
  if (vline) { vline.setAttribute('x1', nearest.x); vline.setAttribute('x2', nearest.x); vline.style.display = 'block'; }
  if (dot) { dot.setAttribute('cx', nearest.x); dot.setAttribute('cy', nearest.y); dot.style.display = 'block'; }
  const valEl = $('#an-curr-val'), lblEl = $('#an-curr-lbl');
  if (valEl) valEl.textContent = eur(nearest.v);
  if (lblEl) lblEl.textContent = `${activeChartMeta.title} · ${nearest.label}`;
}

function chartReset() {
  if (!activeChartCoords.length) return;
  const last = activeChartCoords[activeChartCoords.length - 1];
  const vline = $('#an-vline'), dot = $('#an-dot');
  if (vline) vline.style.display = 'none';
  if (dot) { dot.setAttribute('cx', last.x); dot.setAttribute('cy', last.y); if (anMetric === 'exp') dot.style.display = 'none'; }
  const valEl = $('#an-curr-val'), lblEl = $('#an-curr-lbl');
  if (valEl) valEl.textContent = eur(last.v);
  if (lblEl) lblEl.textContent = activeChartMeta.title;
}

  nps.n = noteLabel;
  npR();
}

function np(d, mode = 'ex', defaultCat = 'altro') {
  vib(15);
  const l = S.fills[S.fills.length - 1];
  nps = { mode, v: '', c: defaultCat, incType: 0, d: d || today(), p: l ? l.ppl : '', pl: 'an', n: '', recB64: null, splitN: 1, splitWho: '' };
  npR();
}

function closeNp() {
  vib(12);
  kbClose(false);
  $('#sh').classList.remove('on');
  document.body.classList.remove('sheet-open');
}

function updateNpDisplay() {
  const valEl = $('#np-val');
  if (valEl) valEl.textContent = (nps.v || '0') + ' €';
  const splitSub = $('#np-split-sub');
  if (splitSub) {
    const isInc = nps.mode === 'inc';
    const splitActive = !isInc && nps.c !== 'gpl' && nps.splitN > 1;
    const rawVal = +nps.v.replace(',', '.') || 0;
    if (splitActive && rawVal > 0) {
      const myShare = Math.round((rawVal / nps.splitN) * 100) / 100;
      splitSub.style.display = 'block';
      splitSub.textContent = `La tua quota: ${eur(myShare)} (credito ${eur(rawVal - myShare)})`;
    } else {
      splitSub.style.display = 'none';
    }
  }
}

function nk(i) {
  vib(10);
  const k = KEYS[i];
  if (k === '<') nps.v = nps.v.slice(0, -1);
  else if (k === ',') { if (!nps.v.includes(',')) nps.v = (nps.v || '0') + ','; }
  else if (nps.v.length < 7) nps.v += k;
  updateNpDisplay();
}

async function handleNpReceipt(inpEl) {
  const f = inpEl.files && inpEl.files[0];
  if (!f) return;
  nps.recB64 = await compressImage(f);
  const btn = $('#np-rec-btn');
  if (btn) btn.textContent = 'Foto allegata';
  toast('Allegato pronto');
}

function setNpMode(mode) {
  vib(12);
  nps.mode = mode;
  const isInc = mode === 'inc';
  const bEx = $('#np-m-ex'), bInc = $('#np-m-inc');
  if (bEx) bEx.className = !isInc ? 'on' : '';
  if (bInc) bInc.className = isInc ? 'on' : '';
  const vacB = $('#np-vac-badge');
  if (vacB) vacB.style.display = (!isInc && S.vacMode) ? 'inline-flex' : 'none';
  const cEx = $('#np-chips-ex'), cInc = $('#np-chips-inc');
  if (cEx) cEx.style.display = !isInc ? 'flex' : 'none';
  if (cInc) cInc.style.display = isInc ? 'flex' : 'none';
  const gplBox = $('#np-gpl-box');
  if (gplBox) gplBox.style.display = (!isInc && nps.c === 'gpl') ? 'grid' : 'none';
  const splitBox = $('#np-split-box');
  if (splitBox) splitBox.style.display = (!isInc && nps.c !== 'gpl') ? 'block' : 'none';
  const recWrap = $('#np-rec-wrap');
  if (recWrap) recWrap.style.display = !isInc ? 'flex' : 'none';
  updateNpDisplay();
}

function setNpCat(k) {
  vib(12);
  nps.c = k;
  document.querySelectorAll('#np-chips-ex .chip').forEach(el => {
    el.classList.toggle('on', el.dataset.k === k);
  });
  const gplBox = $('#np-gpl-box');
  if (gplBox) gplBox.style.display = (nps.mode !== 'inc' && k === 'gpl') ? 'grid' : 'none';
  const splitBox = $('#np-split-box');
  if (splitBox) splitBox.style.display = (nps.mode !== 'inc' && k !== 'gpl') ? 'block' : 'none';
  updateNpDisplay();
}

function setNpIncType(i) {
  vib(12);
  nps.incType = i;
  document.querySelectorAll('#np-chips-inc .chip').forEach(el => {
    el.classList.toggle('on', +el.dataset.i === i);
  });
}

function setNpSplit(n) {
  vib(10);
  nps.splitN = n;
  document.querySelectorAll('#np-split-seg button').forEach(el => {
    el.classList.toggle('on', +el.dataset.n === n);
  });
  const whoW = $('#np-split-who-w');
  if (whoW) whoW.style.display = n > 1 ? 'block' : 'none';
  updateNpDisplay();
}

    <div id='np-chips-inc' class='chips' style='justify-content:center;margin-bottom:6px;display:${isInc ? 'flex' : 'none'}'>${IT.map((t, i) => `<button class='chip ${nps.incType === i ? 'on' : ''}' data-i='${i}' onclick="setNpIncType(${i})">${t}</button>`).join('')}</div>
    <div id='np-chips-ex' class='chips' style='margin-bottom:6px;display:${!isInc ? 'flex' : 'none'}'>${cKeys.map(k => `<button class='chip ${nps.c === k ? 'on' : ''}' data-k='${k}' onclick="setNpCat('${k}')">${cats[k][0]}</button>`).join('')}</div>

    <div id='np-gpl-box' class='g2' style='margin-top:6px;display:${!isInc && nps.c === 'gpl' ? 'grid' : 'none'}'>
      <div><label>Prezzo €/L</label><input type='number' step='.001' value='${nps.p}' oninput='nps.p=this.value'></div>
      <div><label>Sede <button class='btn s sm' style='padding:2px 6px;margin-left:4px' onclick="detectGpsLocation('#np_pl')">GPS</button></label>
        <select id='np_pl' onchange='nps.pl=this.value'><option value='an' ${nps.pl === 'an' ? 'selected' : ''}>${esc(S.homeLabel || 'Casa')}</option><option value='wk' ${nps.pl === 'wk' ? 'selected' : ''}>${esc(S.workLabel || 'Sede')}</option></select>
      </div>
    </div>

    <div id='np-split-box' style='display:${!isInc && nps.c !== 'gpl' ? 'block' : 'none'}'>
      <div class='row sp' style='margin-top:6px'>
        <span class='m'>Dividi alla romana</span>
        <div id='np-split-seg' class='seg' style='width:136px'>
          ${[1, 2, 3, 4].map(n => `<button class="${nps.splitN === n ? 'on' : ''}" data-n='${n}' onclick="setNpSplit(${n})">${n === 1 ? 'No' : '÷' + n}</button>`).join('')}
        </div>
      </div>
      <div id='np-split-who-w' style='margin-top:6px;display:${splitActive ? 'block' : 'none'}'><input placeholder='Chi ti deve la differenza? (es. Greta)' value='${esc(nps.splitWho)}' oninput='nps.splitWho=this.value'></div>
    </div>

      <button id='np-rec-btn' class='btn s' style='flex:1' onclick="$('#np_rec').click()">${nps.recB64 ? 'Foto allegata' : 'Allega scontrino'}</button>

function saveNp() {
  const a = +nps.v.replace(',', '.');
  if (!(a > 0)) return toast('Inserisci un importo');
  if (nps.mode === 'inc') {
    addInc(a, nps.d, nps.n.trim() || IT[nps.incType]);
  } else if (nps.c === 'gpl') {
    if (!+nps.p) return toast('Inserisci €/L');
    addFill(a, +nps.p, nps.pl, nps.d);
  } else {
    const id = uid();
    if (nps.recB64) DB.save(id, nps.recB64);
    if (nps.splitN > 1) {
      const share = Math.round((a / nps.splitN) * 100) / 100;
      const credit = Math.round((a - share) * 100) / 100;
      const who = cap(nps.splitWho.trim() || 'Amici');
      addEx(nps.c, share, nps.d, `${nps.n || 'Spesa divisa'} (1/${nps.splitN})`, Boolean(nps.recB64), id, true);
      addDebt(who, credit, 'due', true);
      toast(`Quota ${eur(share)} · Credito ${eur(credit)} (${who})`);
      R();
    } else {
      addEx(nps.c, a, nps.d, nps.n, Boolean(nps.recB64), id);
    }
  }
  closeNp();
}

function openEd(id) {
  const e = S.ex.find(x => x.id === id);
  if (!e) return;
  if (e.fid) return toast('Modifica dalla scheda Auto');
  eds = { id, a: String(e.a), c: e.c, d: e.d, n: e.n || '', rec: Boolean(e.rec), vac: Boolean(e.vac) };
  edR();
}

async function handleEdReceipt(inpEl) {
  const f = inpEl.files && inpEl.files[0];
  if (!f) return;
  const b64 = await compressImage(f);
  DB.save(eds.id, b64);
  eds.rec = true;
  const e = S.ex.find(x => x.id === eds.id);
  if (e) e.rec = true;
  save();
  const wrap = $('#ed-rec-btns');
  if (wrap) {
    wrap.innerHTML = `<button class='btn s' onclick="viewReceipt('${eds.id}')">Vedi foto</button>
      <button class='btn s' onclick="$('#ed_rec').click()">Sostituisci</button>
      <input type='file' id='ed_rec' accept='image/*' capture='environment' hidden onchange='handleEdReceipt(this)'>`;
  }
  toast('Foto salvata');
}

function setEdCat(k) {
  vib(12);
  eds.c = k;
  document.querySelectorAll('#ed-chips .chip').forEach(el => {
    el.classList.toggle('on', el.dataset.k === k);
  });
}

function toggleEdVac() {
  vib(12);
  eds.vac = !eds.vac;
  const tog = $('#ed-vac-tog');
  if (tog) tog.classList.toggle('on', eds.vac);
}

function edR() {
  const cats = getCats();
  const cKeys = getCatKeys();
  openSheet(`
    <div class='row sp'><b style='font-size:14.5px'>Modifica spesa</b><button class='x' onclick='closeNp()'>Chiudi</button></div>
    <div id='ed-chips' class='chips' style='margin-top:9px'>${cKeys.map(k => `<button class='chip ${eds.c === k ? 'on' : ''}' data-k='${k}' onclick="setEdCat('${k}')">${cats[k][0]}</button>`).join('')}</div>
    <label>Importo €</label>
    <input type='number' step='.01' value='${eds.a}' oninput='eds.a=this.value'>
    <div class='g2'>
      <div><label>Data</label><input type='date' value='${eds.d}' max='${today()}' onchange='eds.d=this.value'></div>
      <div><label>Nota</label><input value='${esc(eds.n)}' oninput='eds.n=this.value'></div>
    </div>
    <div class='row sp' style='margin-top:9px'>
      <span class='m'>Tagga come spesa Vacanza</span>
      <button id='ed-vac-tog' type='button' class='sw-toggle ${eds.vac ? 'on' : ''}' onclick='toggleEdVac()'><i></i></button>
    </div>
    <div id='ed-rec-btns' class='g2' style='margin-top:9px'>
      ${eds.rec ? `<button class='btn s' onclick="viewReceipt('${eds.id}')">Vedi foto</button>` : ''}
      <button class='btn s' style='${eds.rec ? '' : 'grid-column:span 2'}' onclick="$('#ed_rec').click()">${eds.rec ? 'Sostituisci' : 'Allega foto'}</button>
      <input type='file' id='ed_rec' accept='image/*' capture='environment' hidden onchange='handleEdReceipt(this)'>
    </div>
    <div class='g2' style='margin-top:11px'>
      <button class='btn d' onclick="delEx(eds.id);closeNp()">Elimina</button>
      <button class='btn' onclick='saveEd()'>Salva</button>
    </div>
  `);
}

function saveEd() {
  const a = +String(eds.a).replace(',', '.');
  if (!(a > 0)) return toast('Importo non valido');
  const e = S.ex.find(x => x.id === eds.id);
  if (e) Object.assign(e, { a, c: eds.c, d: eds.d, n: eds.n, rec: eds.rec, vac: eds.vac });
  save();
  closeNp();
  toast('Aggiornato');
  R();
}

function switchDayComposerTab(which) {
  const isEv = which === 'ev';
  const bEv = $('#dc-tab-ev'), bEx = $('#dc-tab-ex');
  const pEv = $('#dc-pane-ev'), pEx = $('#dc-pane-ex');
  if (bEv) bEv.className = isEv ? 'on' : '';
  if (bEx) bEx.className = !isEv ? 'on' : '';
  if (pEv) pEv.style.display = isEv ? 'block' : 'none';
  if (pEx) pEx.style.display = !isEv ? 'block' : 'none';
}

function saveDayComposerEvent(ds, sendToCal = false) {

function buildMonthGridHTML() {
  const y = cm.getFullYear(), m = cm.getMonth(), first = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
  let g = ['L', 'M', 'M', 'G', 'V', 'S', 'D'].map(x => '<b>' + x + '</b>').join('');
  for (let i = 0; i < first; i++) g += '<button class="e"></button>';
  for (let d = 1; d <= dim; d++) {
    const ds = y + '-' + pad(m + 1) + '-' + pad(d);
    const ne = evOn(ds).length;
    const nx = S.ex.some(e => e.d === ds);
    const ni = S.inc.some(i => i.d === ds);
    const noff = isOffDay(ds);
    g += `<button class="lp ${ds === today() ? 't ' : ''}${ds === sel ? 's ' : ''}${noff ? 'off' : ''}"
      onpointerdown="lpStart(()=>openDayComposer('${ds}'))"
      onpointerup="lpEnd()"
      onpointerleave="lpEnd()"
      onclick="lpTap(()=>{sel='${ds}';weekOff=Math.round((new Date('${ds}T12:00')-new Date(today()+'T12:00'))/(7*86400000));closeNp();R()})">${d}<i>${ne ? '<u></u>' : ''}${nx ? '<u class="x2"></u>' : ''}${ni ? `<u style='background:${ds === sel ? '#000000' : 'var(--ok)'}'></u>` : ''}${noff ? '<u class="x3"></u>' : ''}</i></button>`;
  }
  return g;
}

async function cloudCreateBin() {
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  if (!key) return toast('Inserisci Master Key');
  S.cloud.key = key;
  save(true);
  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Name': 'LeoWealth', 'X-Bin-Private': 'true' },
      body: JSON.stringify(S)
    });
    const j = await res.json();
    if (j && j.metadata && j.metadata.id) {
      S.cloud.bin = j.metadata.id;
      S.cloud.lastSync = Date.now();
      save(true);
      toast('Bin creato: ' + j.metadata.id);
      R();
    } else toast('Chiave non valida');
  } catch (e) { toast('Errore di rete'); }
}

async function cloudPush(silent = false) {
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) { if (!silent) toast('Dati Cloud mancanti'); return; }
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key },
      body: JSON.stringify(S)
    });
    if (res.ok) {
      S.cloud.lastSync = Date.now();
      try { localStorage.setItem('lw', JSON.stringify(S)); } catch (e) {}
      if (!silent) { toast('Salvato su Cloud'); R(); }
    } else if (!silent) toast('Errore Cloud');
  } catch (e) { if (!silent) toast('Errore di rete'); }
}

async function cloudPull(silent = false) {
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) { if (!silent) toast('Dati Cloud mancanti'); return; }
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, { headers: { 'X-Master-Key': key } });
    const j = await res.json();
    if (j && j.record) {
      const remoteUpdated = +j.record.updatedAt || 0;
      if (silent && remoteUpdated <= (S.updatedAt || 0)) return;
      const keepCloud = Object.assign({}, S.cloud, { lastSync: Date.now() });
      S = migrate(j.record);
      S.cloud = keepCloud;
      save(true);
      R();
      if (!silent) toast('Dati caricati dal Cloud');
    } else if (!silent) toast('Bin non trovato');
  } catch (e) { if (!silent) toast('Errore di rete'); }
}

function imp(i) {
  const f = i.files[0];
  if (!f) return;
  f.text().then(t => {
    try {
      const parsed = JSON.parse(t);
      if (!parsed || typeof parsed !== 'object' || !(Array.isArray(parsed.ex) || Array.isArray(parsed.inc) || Array.isArray(parsed.ev))) throw new Error('bad');
      try { localStorage.setItem('lw_pre', JSON.stringify(S)); } catch (_) {}
      S = migrate(parsed);
      S.lastBackupAt = Date.now();
      save();
      R();
      toast('Backup importato', 'restoreBak(\'lw_pre\')');
    } catch (e) { toast('File non valido'); }
  });
}
