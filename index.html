<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leo Wealth">
<title>Leo Wealth</title>

<link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Leo%20Wealth%22%2C%22short_name%22%3A%22Leo%20Wealth%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%2C%22orientation%22%3A%22portrait%22%7D">
<style>
:root{
  color-scheme:dark;
  --t:#f5f5f7;
  --m:#8e8e93;
  --g:rgba(255,255,255,.07);
  --b:rgba(255,255,255,.12);
  --a:#0a84ff;
  --ok:#30d158;
  --w:#ff9f0a;
  --bad:#ff453a;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;max-width:100vw;overflow-x:hidden;
  scroll-padding-top:env(safe-area-inset-top,0px);
}
body{
  background:radial-gradient(600px 400px at 85% -5%,#0a84ff33,transparent),radial-gradient(500px 400px at -10% 30%,#bf5af222,transparent),#000;
  color:var(--t);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  min-height:100dvh;
  -webkit-text-size-adjust:100%;
}
main{
  width:100%;max-width:560px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(108px + env(safe-area-inset-bottom,0px));
}
h1{font-size:clamp(24px,6.8vw,28px);margin:4px 0 2px;letter-spacing:-.5px;line-height:1.15}
h2{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.8px;margin:20px 4px 8px;font-weight:600}
.sub{color:var(--m);margin:0 0 10px;font-size:13px}
.card{
  background:var(--g);
  border:1px solid var(--b);
  border-radius:20px;
  padding:14px;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  margin-bottom:12px;
  max-width:100%;
}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row>*{min-width:0}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.big{font-size:clamp(25px,7.2vw,34px);font-weight:700;letter-spacing:-.8px;line-height:1.12}
.m{color:var(--m);font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.w{color:var(--w)}
button,input,select,textarea{font:inherit;color:var(--t)}

/* Feedback tattile elastico stile iOS */
button{cursor:pointer;transition:transform .12s cubic-bezier(.1,.9,.2,1),opacity .12s ease,background .2s ease}
button:active{transform:scale(.94);opacity:.82}

.btn{
  background:var(--a);border:0;border-radius:14px;padding:11px 14px;font-weight:600;
  min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn.s{background:var(--g);border:1px solid var(--b)}
.btn.d{background:#ff453a33;color:var(--bad)}
.btn.okb{background:#30d15828;color:var(--ok);border:1px solid #30d15855}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:11px;min-height:34px}

/* Griglia spese rapide 3x2 ottimizzata per 375px */
.q{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.q .btn{
  padding:12px 4px;background:var(--g);border:1px solid var(--b);
  display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;min-height:84px;
}
.q .btn b{font-size:14px;line-height:1.2}
.q .btn .m{font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* Input 16px obbligatori per bloccare lo zoom automatico di iOS Safari */
input,select,textarea{
  font-size:16px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--b);
  border-radius:12px;
  padding:10px 12px;
  width:100%;min-width:0;max-width:100%;
  min-height:44px;
  outline:0;
}
input[type="date"],input[type="time"]{
  -webkit-appearance:none;appearance:none;display:block;
}
input:focus,select:focus{border-color:var(--a)}
label{font-size:12px;color:var(--m);display:block;margin:8px 0 4px}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2>*,.g3>*{min-width:0;max-width:100%}
.g3 input,.g3 select{padding:10px 8px}

/* Segmented toggle pill */
.seg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--b);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:0;border:0;border-radius:9px;padding:6px 8px;font-size:12px;font-weight:600;color:var(--m);min-height:30px}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}

/* Floating Bottom Navigation a 5 tab bilanciati per iPhone */
nav{
  position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:540px;margin:auto;display:flex;gap:2px;
  background:rgba(28,28,30,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border:1px solid var(--b);border-radius:24px;padding:5px;z-index:8;
}
nav button{
  flex:1;min-width:0;background:0;border:0;padding:7px 2px;border-radius:18px;color:var(--m);
  font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
nav button.on{color:#fff;background:rgba(255,255,255,.14);font-weight:600}

/* Floating Action Button */
.fab{
  position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:50%;border:0;
  background:linear-gradient(135deg,#0a84ff,#bf5af2);
  font-size:28px;color:#fff;box-shadow:0 8px 26px #0a84ff66;z-index:8;
  display:flex;align-items:center;justify-content:center;
}

/* LED Serbatoio GPL */
.leds{display:flex;gap:6px}
.led{flex:1;height:10px;border-radius:5px;background:#ffffff1a;transition:all .3s ease}
.led.on{background:var(--ok);box-shadow:0 0 12px var(--ok)}
.led.lo{background:var(--w);box-shadow:0 0 12px var(--w)}
.led.cr{background:var(--bad);box-shadow:0 0 12px var(--bad)}

/* Liste & Swipe-to-Delete */
.li{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--b);
  touch-action:pan-y;will-change:transform;min-width:0;
}
.li:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.x{background:0;border:0;color:var(--bad);font-size:18px;padding:6px 8px;flex:none}
.bar{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s ease}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal b{font-size:11px;color:var(--m);font-weight:500}
.cal button{aspect-ratio:1;border-radius:11px;border:1px solid transparent;background:#ffffff0a;font-size:14px;position:relative;padding:0;min-width:0}
.cal button.t{border-color:var(--a)}
.cal button.s{background:var(--a);font-weight:700}
.cal button.off{background:#bf5af226;border-color:#bf5af266}
.cal button.s.off{background:var(--a);border-color:#d896ff}
.cal button.e{opacity:.25;pointer-events:none}
.cal i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal i u{width:4px;height:4px;border-radius:50%;background:var(--ok)}
.cal i u.x2{background:var(--w)}

/* Animazioni Native iOS per Bottom Sheet e Toast */
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes dropDown{from{transform:translateY(-110%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:none;align-items:flex-end}
.sheet.on{display:flex;animation:fadeIn .2s ease}
.sheet.on>div{
  width:100%;max-width:560px;margin:0 auto;background:#1c1c1e;
  border:1px solid var(--b);border-bottom:0;border-radius:26px 26px 0 0;
  padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:slideUp .32s cubic-bezier(.1,.9,.2,1);
}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}
.keys button{background:#2c2c2e;border:0;border-radius:14px;padding:12px;font-size:21px;min-height:46px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--g);border:1px solid var(--b);border-radius:20px;padding:7px 11px;font-size:13px;min-height:34px}
.chip.on{background:var(--a);border-color:var(--a);font-weight:600}

.toast{
  position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));
  max-width:536px;margin:auto;background:rgba(44,44,46,.96);border:1px solid var(--b);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:16px;padding:11px 14px;z-index:30;display:none;
  align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 12px 32px rgba(0,0,0,.6);font-size:14px;
}
.toast.on{display:flex;animation:dropDown .36s cubic-bezier(.1,.9,.2,1)}

.msg{background:#ffffff10;border:1px solid var(--b);border-radius:16px;padding:12px 14px;margin:8px 0 12px;line-height:1.45;animation:fadeIn .2s ease}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:99px;background:#ffffff14;color:var(--m);white-space:nowrap}
.badge.sw{background:#bf5af228;color:#d896ff;border:1px solid #bf5af255}
.badge.ok{background:#30d15824;color:var(--ok);border:1px solid #30d15855}
.badge.w{background:#ff9f0a24;color:var(--w);border:1px solid #ff9f0a55}

/* Scontrini & Lightbox */
.rcp-prev{width:100%;max-height:170px;object-fit:cover;border-radius:14px;border:1px solid var(--b);margin-top:8px;cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex;animation:fadeIn .2s ease}
.lb img{max-width:100%;max-height:78dvh;border-radius:16px;border:1px solid var(--b)}

/* Modalità Ufficio / Privacy Mode */
body.blur-mode .money-val{filter:blur(6px);opacity:.72;transition:filter .18s ease,opacity .18s ease;user-select:none}
body.blur-mode .money-val:active,
body.blur-mode .card:active .money-val{filter:none;opacity:1}

code{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<main id="v"></main>
<div class="toast" id="to"></div>
<button class="fab" aria-label="Nuova spesa" onclick="np(today())">+</button>
<nav id="nv"></nav>
<div class="sheet" id="sh" onclick="if(event.target===this)closeNp()"></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"></div>

<script>
/* ==========================================================================
   1. UTILITY, FEEDBACK APTICO (VIBRAZIONE) & PWA SERVICE WORKER
   ========================================================================== */
const $ = s => document.querySelector(s),
      pad = n => String(n).padStart(2, '0'),
      iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()),
      today = () => iso(new Date()),
      eur = n => (Math.round(n * 100) / 100).toFixed(2).replace('.', ',') + ' €',
      esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
      escAttr = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;'),
      uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

const vib = (pattern = 35) => {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
};

// Copia negli appunti compatibile con iOS Safari & iFrame
function copyText(text, label = 'Copiato negli appunti') {
  vib(25);
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(label);
  } catch (e) {
    toast('Impossibile copiare');
  }
}

// Service Worker offline-first tramite Blob
(function initServiceWorker() {
  try {
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const code = `
        const CACHE = 'leo-wealth-v5';
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => e.waitUntil(clients.claim()));
        self.addEventListener('fetch', e => {
          if (e.request.method !== 'GET' || !e.request.url.startsWith(self.location.origin)) return;
          e.respondWith(
            caches.open(CACHE).then(c =>
              fetch(e.request).then(r => { if (r && r.status === 200) c.put(e.request, r.clone()); return r; })
              .catch(() => c.match(e.request))
            )
          );
        });
      `;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'application/javascript' }))).catch(() => {});
    }
  } catch (e) {}
})();

/* ==========================================================================
   2. INDEXED DB ('LW_Store') PER FOTO SCONTRINI SENZA SATURARE LOCALSTORAGE
   ========================================================================== */
const DB = {
  db: null,
  init: () => new Promise(resolve => {
    try {
      const req = indexedDB.open('LW_Store', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('receipts')) db.createObjectStore('receipts');
      };
      req.onsuccess = e => { DB.db = e.target.result; resolve(); };
      req.onerror = () => resolve();
    } catch (e) { resolve(); }
  }),
  save: (id, dataUrl) => new Promise(resolve => {
    if (!DB.db || !dataUrl) return resolve();
    try {
      const tx = DB.db.transaction('receipts', 'readwrite');
      tx.objectStore('receipts').put(dataUrl, id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch (e) { resolve(); }
  }),
  get: id => new Promise(resolve => {
    if (!DB.db || !id) return resolve(null);
    try {
      const req = DB.db.transaction('receipts', 'readonly').objectStore('receipts').get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  }),
  del: id => new Promise(resolve => {
    if (!DB.db || !id) return resolve();
    try {
      const tx = DB.db.transaction('receipts', 'readwrite');
      tx.objectStore('receipts').delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    } catch (e) { resolve(); }
  })
};
DB.init();

/* ==========================================================================
   3. STATO APPLICATIVO ('lw') & COSTANTI
   ========================================================================== */
const CAT = {
  heets: ['Heets', '#ff9f0a'],
  caffe: ['Caffè', '#bf5af2'],
  cibo:  ['Cibo fuori', '#ffd60a'],
  benz:  ['Benzina', '#ff453a'],
  gpl:   ['GPL', '#30d158'],
  svago: ['Svago', '#0a84ff'],
  altro: ['Altro', '#8e8e93']
};
const CK = Object.keys(CAT);
const FIX = { heets: 5.5, caffe: 0.35, benz: 20 };
const MESI = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const MESI_S = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const DN = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const KEYS = [1, 2, 3, 4, 5, 6, 7, 8, 9, ',', 0, '<'];
const IT = ['Stipendio', 'Regalo', 'Altro'];

let S = {
  sal: 700,
  bud: 230,
  payDay: 1,          // Giorno del mese in cui arriva lo stipendio (1..31)
  liq0: 0,
  tank: 30,
  kmDay: 92,          // Tratta giornaliera A/R Ancona–Cingoli
  idealKmL: 15.5,     // Rendimento ideale km/L
  ex: [],
  fills: [],
  ev: [],
  extra: {},
  inc: [],
  rec: [],
  goals: [],
  debts: [],
  offDays: [],        // Giorni di Smart Working / Ferie: ['YYYY-MM-DD', ...]
  parked: [],         // Regola 48h: [{ id, name, amount, createdAt }]
  savedImpulse: 0,    // Soldi risparmiati rinunciando agli acquisti parcheggiati
  carpool: [],        // Rimborsi passaggi SS76: [{ id, d, amount, note }]
  maintLastKm: 0,     // Km totali al momento dell'ultimo tagliando
  maintInt: 15000,    // Intervallo tagliando in km
  priv: false,        // Modalità Ufficio / Privacy
  cloud: { key: '', bin: '', lastSync: 0 }
};

try {
  const saved = JSON.parse(localStorage.getItem('lw') || '{}');
  Object.assign(S, saved);
  if (saved.cap && !saved.liq0) { S.liq0 = saved.cap; delete S.cap; }
  if (saved.maintBase && !saved.maintLastKm) { S.maintLastKm = saved.maintBase; delete S.maintBase; }
  if (saved.sw && !Array.isArray(saved.offDays)) {
    S.offDays = Object.keys(saved.sw).filter(k => saved.sw[k]);
    delete S.sw;
  }
} catch (e) {}

S.payDay = Math.min(31, Math.max(1, +S.payDay || 1));
S.kmDay = +S.kmDay || 92;
S.idealKmL = +S.idealKmL || 15.5;
S.inc = S.inc || [];
S.rec = S.rec || [];
S.goals = S.goals || [];
S.debts = S.debts || [];
S.offDays = Array.isArray(S.offDays) ? S.offDays : [];
S.parked = Array.isArray(S.parked) ? S.parked : [];
S.savedImpulse = +S.savedImpulse || 0;
S.carpool = Array.isArray(S.carpool) ? S.carpool : [];
S.extra = S.extra || {};
S.maintLastKm = +S.maintLastKm || 0;
S.maintInt = +S.maintInt || 15000;
S.cloud = Object.assign({ key: '', bin: '', lastSync: 0 }, S.cloud || {});

const save = () => {
  try { localStorage.setItem('lw', JSON.stringify(S)); } catch (e) {}
};

let tab = 'home', cm = new Date(), sel = today(), mo = 0, chartMode = '14d', ans = '', pend = null;
let nps = null, eds = null, ins = null, lastInc = null, lastMaintBackup = null;

const wk = ds => { const w = new Date(ds + 'T12:00').getDay(); return w > 0 && w < 6; };
const isOffDay = ds => S.offDays.includes(ds);
const isWorkDay = ds => wk(ds) && !isOffDay(ds);
const hh = t => { const [a, b] = t.split(':'); return +a + +b / 60; };

/* ==========================================================================
   4. ICONE SVG, TOAST & NOTIFICHE PUSH LOCALI
   ========================================================================== */
const IC = {
  home: `<path d='M3 11l9-8 9 8'/><path d='M5 10v10h14V10'/>`,
  cal:  `<rect x='3' y='5' width='18' height='16' rx='3'/><path d='M3 10h18M8 3v4M16 3v4'/>`,

/* ==========================================================================
   5. SWIPE-TO-DELETE GLOBALE (NON INTERFERISCE CON LO SCROLL VERTICALE IPHONE)
   ========================================================================== */
(function initSwipeToDelete() {
  let startX = 0, startY = 0, activeRow = null, swiping = false;
  document.addEventListener('touchstart', e => {
    const row = e.target.closest('.li');
    if (!row || !row.querySelector('.x') || e.touches.length !== 1) return;
    activeRow = row;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    swiping = false;
    row.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchmove', e => {
    if (!activeRow) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (!swiping) {
      if (Math.abs(dy) > Math.abs(dx) * 0.8) { activeRow = null; return; }
      if (Math.abs(dx) > Math.abs(dy) * 1.4 && Math.abs(dx) > 14) swiping = true;
    }
    if (swiping && dx < 0) {
      activeRow.style.transform = `translateX(${Math.max(-110, dx)}px)`;
      activeRow.style.opacity = String(Math.max(0.35, 1 + dx / 160));
    }
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!activeRow) return;
    const row = activeRow;
    activeRow = null;
    const dx = e.changedTouches[0].clientX - startX;
    row.style.transition = 'transform .24s cubic-bezier(.16,1,.3,1), opacity .2s ease';
    if (swiping && dx < -72) {
      vib([30, 30, 50]);
      row.style.transform = 'translateX(-100%)';
      row.style.opacity = '0';
      setTimeout(() => {
        const delBtn = row.querySelector('.x');
        if (delBtn) delBtn.click();
      }, 190);
    } else {
      row.style.transform = 'translateX(0)';
      row.style.opacity = '1';
    }
  });
})();

/* ==========================================================================
   6. CICLO BUDGET SUL GIORNO DI PAGA (getCycle) & LOGICA FINANZIARIA
   ========================================================================== */
function clampDay(year, monthIdx, day) {
  return Math.min(day, new Date(year, monthIdx + 1, 0).getDate());
}

function getCycle(refDate = new Date(), offset = 0) {
  const pd = Math.min(31, Math.max(1, +S.payDay || 1));
  const ref = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate(), 12, 0, 0);
  const anchorDayThisMonth = clampDay(ref.getFullYear(), ref.getMonth(), pd);

  let baseYear = ref.getFullYear();
  let baseMonth = ref.getMonth();
  if (ref.getDate() < anchorDayThisMonth) {
    baseMonth -= 1;
    if (baseMonth < 0) { baseMonth = 11; baseYear -= 1; }
  }

  const startRaw = new Date(baseYear, baseMonth + offset, 1, 12, 0, 0);
  const sy = startRaw.getFullYear(), sm = startRaw.getMonth();
  const startDate = new Date(sy, sm, clampDay(sy, sm, pd), 12, 0, 0);

  const nextRaw = new Date(sy, sm + 1, 1, 12, 0, 0);
  const ny = nextRaw.getFullYear(), nm = nextRaw.getMonth();
  const nextStartDate = new Date(ny, nm, clampDay(ny, nm, pd), 12, 0, 0);
  const endDate = new Date(nextStartDate.getTime() - 86400000);

  const totalDays = Math.max(1, Math.round((nextStartDate - startDate) / 86400000));
  const todayMid = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate(), 12, 0, 0);
  const elapsedDays = Math.max(1, Math.min(totalDays, Math.round((todayMid - startDate) / 86400000) + 1));
  const leftDays = Math.max(1, totalDays - elapsedDays + 1);

  const label = pd === 1
    ? `${MESI[sm]} ${sy}`
    : `${startDate.getDate()} ${MESI_S[sm]} – ${endDate.getDate()} ${MESI_S[endDate.getMonth()]} ${endDate.getFullYear()}`;

  const shortLabel = pd === 1
    ? `${MESI[sm]}`
    : `${startDate.getDate()} ${MESI_S[sm]} – ${endDate.getDate()} ${MESI_S[endDate.getMonth()]}`;

  return { start: iso(startDate), end: iso(endDate), totalDays, elapsedDays, leftDays, label, shortLabel };
}

function liq() {
  return S.liq0 + S.inc.reduce((s, i) => s + i.a, 0) - S.ex.reduce((s, e) => s + e.a, 0);
}

function stats() {
  const cyc = getCycle(new Date(), 0);
  const spent = S.ex.filter(e => e.d >= cyc.start && e.d <= cyc.end).reduce((s, e) => s + e.a, 0);
  const rem = S.bud - spent;
  return {
    cyc,
    dim: cyc.totalDays,
    day: cyc.elapsedDays,
    left: cyc.leftDays,
    spent,
    rem,
    daily: Math.max(0, rem) / cyc.leftDays,
    per: S.bud / cyc.totalDays,
    goal: S.sal - S.bud
  };
}

function catSumRange(startIso, endIso) {
  const o = {};
  S.ex.filter(e => e.d >= startIso && e.d <= endIso).forEach(e => {
    o[e.c] = (o[e.c] || 0) + e.a;
  });
  return o;
}

  const e = { id, d: d || today(), c, a: +a, n: n || '' };

    DB.save(id, imgData);
  }
  S.ex.push(e);
  save();
  toast(CAT[c][0] + ' ' + eur(a) + (e.d !== today() ? ' · ' + e.d.split('-').reverse().join('/') : ''), `delEx('${e.id}')`);
  R();
}

function delEx(id) {
  const e = S.ex.find(x => x.id === id);
  if (e && e.fid) S.fills = S.fills.filter(f => f.id !== e.fid);
  if (e && e.rid) {
    const r = S.rec.find(x => x.id === e.rid);
    if (r) { r.sk = r.sk || []; r.sk.push(e.d.slice(0, 7)); }
  }
  if (e && e.hasImg) DB.del(id);
  S.ex = S.ex.filter(x => x.id !== id);
  save();
  $('#to').classList.remove('on');
  R();
}

  const n = $('#pk-n')?.value.trim();

  if (!n || !(a > 0)) return toast('Inserisci oggetto e importo');
  parkItem(n, a);
}

function buyParked(id) {
  const idx = S.parked.findIndex(p => p.id === id);
  if (idx < 0) return;
  const item = S.parked[idx];
  S.parked.splice(idx, 1);
  const guessedCat = catOf(item.name.toLowerCase()) || 'svago';
  addEx(guessedCat, item.amount, today(), item.name);
}

function renounceParked(id) {
  const idx = S.parked.findIndex(p => p.id === id);
  if (idx < 0) return;
  const item = S.parked[idx];
  S.parked.splice(idx, 1);
  S.savedImpulse = +(S.savedImpulse + item.amount).toFixed(2);
  save();
  R();
  if (S.goals.length > 0) {
    toast(`🎉 Salvati ${eur(item.amount)}! Versarli in «${esc(S.goals[0].n)}»?`, `depositSavedToGoal(0, ${item.amount})`, 'Versa');
  } else {
    toast(`🎉 Ottima scelta! Hai salvato ${eur(item.amount)}`);
  }
}

function depositSavedToGoal(goalIdx, specificAmount) {
  const amt = specificAmount != null ? Math.min(S.savedImpulse, specificAmount) : S.savedImpulse;
  if (!(amt > 0) || !S.goals[goalIdx]) return;
  S.goals[goalIdx].s = +(S.goals[goalIdx].s + amt).toFixed(2);
  S.savedImpulse = Math.max(0, +(S.savedImpulse - amt).toFixed(2));
  save();
  $('#to').classList.remove('on');
  toast(`🎯 Versati ${eur(amt)} in «${esc(S.goals[goalIdx].n)}»!`);
  R();
}

      const k = y + '-' + pad(m),
            dd = Math.min(r.day, new Date(y, m, 0).getDate()),

      if (ds <= today() && !S.ex.some(e => e.rid === r.id && e.d.startsWith(k)) && !(r.sk || []).includes(k)) {

    const first = new Date(heets[0].d + 'T12:00');

    const packs = heets.reduce((s, e) => s + Math.max(1, Math.round(e.a / 5.5)), 0);
    if (packs > 1) {
      const every = spanDays / (packs - 1);
      if (every >= 0.5 && every <= 30) {

      }
    }
  }
  if (S.ex.length > 0) {
    let streak = 0;
    const d = new Date();
    for (let i = 0; i < 60; i++) {
      const ds = iso(d);
      const hasDiscretionary = S.ex.some(e => e.d === ds && !e.rid && e.c !== 'gpl' && e.c !== 'benz');

function slots(dur) {
  const out = [], now = new Date();

    const ds = iso(d),

    const pr = isWorkDay(ds) ? [19, 20, 21, 7] : [10, 11, 15, 16, 17, 9, 18];
    const h = pr.find(h => (i > 0 || h > now.getHours()) && h + dur <= 22.5 && bz.every(([s, e]) => h + dur <= s || h >= e));
    if (h != null) out.push({ ds, h });
  }
  return out;
}

function dayK(f, w) {
  const km = S.kmDay || 92;
  return isWorkDay(f.d) ? (f.pl === 'wk' ? km / 2 : (w === 'a' ? km : 0)) : 0;
}

function kmB(a, b) {
  const km = S.kmDay || 92;
  let k = dayK(a, 'a') + dayK(b, 'b');
  for (let d = new Date(a.d + 'T12:00'); ; ) {
    d.setDate(d.getDate() + 1);
    const x = iso(d);
    if (x >= b.d) break;
    if (isWorkDay(x)) k += km;
  }
  return k + Object.entries(S.extra).filter(([d]) => d >= a.d && d <= b.d).reduce((s, [, v]) => s + v, 0);
}

function car() {
  const km = S.kmDay || 92;
  const ideal = S.idealKmL || 15.5;
  const f = [...S.fills].sort((a, b) => a.d > b.d ? 1 : -1);
  let L = 0, K = 0, E = 0;
  f.forEach((x, i) => {
    if (i) {
      const k = kmB(f[i - 1], x);
      if (k > 0) { K += k; L += x.eur / x.ppl; E += x.eur; }
    }
  });
  const avg = K && L ? K / L : ideal,
        last = f[f.length - 1];
  let since = 0;
  if (last) {
    const t = today(), h = new Date().getHours();
    if (last.d < t) {
      since = dayK(last, 'a');
      for (let d = new Date(last.d + 'T12:00'); ; ) {
        d.setDate(d.getDate() + 1);
        const x = iso(d);
        if (x >= t) break;
        if (isWorkDay(x)) since += km;
      }
      if (isWorkDay(t)) since += h < 8 ? 0 : h < 18 ? km / 2 : km;
    }
    since += Object.entries(S.extra).filter(([d]) => d >= last.d).reduce((s, [, v]) => s + v, 0);
  }
  const extraBeforeFirst = f.length
    ? Object.entries(S.extra).filter(([d]) => d < f[0].d).reduce((s, [, v]) => s + v, 0)
    : Object.values(S.extra).reduce((s, v) => s + v, 0);
  const totalKm = K + since + extraBeforeFirst;
  const maintSince = Math.max(0, totalKm - (S.maintLastKm || 0));
  const maintInt = S.maintInt || 15000;
  const maintRem = maintInt - maintSince;

  const carpoolTot = S.carpool.reduce((s, c) => s + c.amount, 0);
  const netFuelEur = Math.max(0, E - carpoolTot);
  const cpkGross = K ? E / K : 0;
  const cpkNet = K ? netFuelEur / K : 0;

  const range = S.tank * avg,
        rem = last ? Math.max(0, range - since) : null,
        tk = rem == null ? 0 : Math.ceil(rem / range * 4),
        ppl = last ? last.ppl : 0.75,
        mk = km * 22,
        wl = avg < ideal ? mk / avg - mk / ideal : 0;

  return {
    f, K, avg, last, since, range, rem, tk, wl, we: wl * ppl,
    cpk: cpkNet, cpkGross, carpoolTot, totalKm, maintSince, maintInt, maintRem
  };
}

function detectGpsStation(target) {
  vib(25);
  if (!navigator.geolocation) return toast('GPS non disponibile su questo dispositivo');
  toast('Rilevo posizione GPS…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      const haversine = (la1, lo1, la2, lo2) => {
        const R = 6371, dLa = (la2 - la1) * Math.PI / 180, dLo = (lo2 - lo1) * Math.PI / 180;
        const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * Math.PI / 180) * Math.cos(la2 * Math.PI / 180) * Math.sin(dLo / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      };
      const dAncona = haversine(lat, lon, 43.6158, 13.5189);
      const dCingoli = haversine(lat, lon, 43.3742, 13.2164);
      const pl = dAncona <= dCingoli ? 'an' : 'wk';
      if (target === 'modal' && nps) {
        nps.pl = pl;
        npR();
      } else if ($('#fl')) {
        $('#fl').value = pl;
      }
      toast(pl === 'an'
        ? `📍 Zona Ancona (${Math.round(dAncona)} km)`
        : `📍 Zona Lavoro / Cingoli (${Math.round(dCingoli)} km)`);
    },
    () => toast('Permesso GPS negato o segnale assente'),
    { enableHighAccuracy: false, timeout: 6000 }
  );
}

function compressReceipt(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => resolve(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

async function onReceiptPick(input, mode) {
  const file = input.files && input.files[0];
  if (!file) return;
  const dataUrl = await compressReceipt(file);
  if (!dataUrl) return toast('Impossibile leggere la foto');
  vib(30);
  if (mode === 'new' && nps) { nps.img = dataUrl; npR(); }
  if (mode === 'edit' && eds) { eds.img = dataUrl; eds.imgChanged = true; edR(); }

}

   12. ASSISTENTE AI (SOMME INLINE, PARCHEGGIO 48H, SMART WORKING, CARPOOL)

const NW = { uno:1, due:2, tre:3, quattro:4, cinque:5, sei:6, sette:7, otto:8, nove:9, dieci:10, quindici:15, venti:20, trenta:30, quaranta:40, cinquanta:50, sessanta:60, cento:100 };
const KW = [
  ['heets', /heets|iqos|sigarett|tabacc|\bfumo\b/],
  ['caffe', /caff|cappuccin|espresso|macchiato/],
  ['benz',  /benzin|carburant|diesel/],
  ['gpl',   /\bgpl\b|pieno/],
  ['cibo',  /colazion|pranz|\bcen(a|o|are|ato)\b|aperitiv|spritz|pizz|ristorant|panin|kebab|sushi|mcdonald|merend|gelat|brunch|mangi|trattori|osteri|hamburger|coop|conad|lidl|supermercat|spesa\s+aliment/],
  ['svago', /amic|ragazz|fidanzat|uscit|uscire|serata|cinema|disco|locale|\bpub\b|birr|drink|weekend|svago|divert|concert|bowling/]
];
const catOf = t => (KW.find(k => k[1].test(t)) || [])[0];

function cleanSpeechTypos(raw) {
  return raw
    .replace(/\b(g\s*t\s*l|gi\s*pi\s*elle|g\s*p\s*l)\b/gi, 'gpl')
    .replace(/\b(hitz|its|eats|h\s*e\s*e\s*t\s*s)\b/gi, 'heets')
    .replace(/\bben[zs]a\b/gi, 'benzina');
}

function extractNumbers(t) {
  const sanitized = t
    .replace(/\d+(?:[.,]\d+)?\s*or[ae]/g, ' ')
    .replace(/\b\d{1,2}:\d{2}\b/g, ' ')
    .replace(/\bil\s+\d{1,2}\b/g, ' ');
  const nums = [...sanitized.matchAll(/(\d+(?:[.,]\d+)?)/g)]
    .map(m => +m[1].replace(',', '.'))
    .filter(n => n > 0);
  if (nums.length > 1) return { total: nums.reduce((a, b) => a + b, 0), parts: nums };
  if (nums.length === 1) return { total: nums[0], parts: nums };
  const w = sanitized.match(/\b(uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|quindici|venti|trenta|quaranta|cinquanta|sessanta|cento)\s+(euro|eur|di)\b/);
  if (w) return { total: NW[w[1]], parts: [NW[w[1]]] };
  return { total: null, parts: [] };
}

function extractPurchaseItem(raw) {
  let s = raw
    .replace(/^(posso|ce la faccio a|mi conviene|mi basta per|posso permettermi di|posso permettermi|vorrei)\s+(comprare|prendere|spendere|pagare|acquistare)?\s*/i, '')
    .replace(/\b(un|uno|una|un'|il|lo|la|i|gli|le|dei|degli|delle)\b/gi, ' ')
    .replace(/\b(da|a|di|per|circa|sui|sul|sulla)\s*\d+(?:[.,]\d+)?\s*(euro|eur|€)?/gi, ' ')
    .replace(/\d+(?:[.,]\d+)?\s*(euro|eur|€)?/gi, ' ')
    .replace(/[?!.,]+$/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return s && s.length >= 2 ? cap(s) : 'Acquisto';
}

function addIt(c, a, d, when, raw, split, parts) {
  if (split) a = a / 2;
  if (c === 'gpl') {
    np(today());
    nps.c = 'gpl';
    nps.v = String(a).replace('.', ',');
    npR();
    return 'Per il GPL mi servono prezzo al litro e dove hai fatto il pieno: completa qui sotto.';
  }
  addEx(c, a, d, raw.slice(0, 60));
  const detail = parts && parts.length > 1 ? ` (${parts.map(x => eur(x)).join(' + ')})` : '';
  return `Segnato <b>${CAT[c][0]}</b> <span class='money-val'>${eur(a)}</span>${detail}${split ? ' (la tua metà)' : ''}${when}.` +
    (d === today() ? ` Oggi puoi ancora spendere <span class='money-val'>${eur(stats().daily)}</span>.` : '');
}

function brain(t0, raw0) {
  const raw = cleanSpeechTypos(raw0);
  const t = raw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const oreM = t.match(/(\d+(?:[.,]\d+)?)\s*or[ae]/);
  const { total: num, parts } = oreM ? { total: null, parts: [] } : extractNumbers(t);
  const c = catOf(t);
  const sv = /spes|segna|pagat|ho preso|comprat|\bpago\b|offert|costat/.test(t);
  const split = /dividi|a meta|50 e 50|alla romana|diviso/.test(t);
  const s = stats();

  let offset = 0;
  if (/altro ?ieri/.test(t)) offset = -2;
  else if (/\bieri\b/.test(t)) offset = -1;
  else if (/dopodomani/.test(t)) offset = 2;
  else if (/\bdomani\b/.test(t)) offset = 1;
  const dt = new Date();
  dt.setDate(dt.getDate() + offset);
  const ds = iso(dt);
  const when = offset === -1 ? ' (ieri)' : offset === -2 ? ' (l’altro ieri)' : offset === 1 ? ' (domani)' : '';
  const p = pend;
  pend = null;

  // 1. Smart Working / Ferie (0 km tragitto)
  if (/smart\s*working|smartworking|lavoro\s*da\s*casa|ferie|non\s*(vado|sono\s*andato)\s*a\s*lavoro|in\s*sede/.test(t)) {
    const backToOffice = /annull|togli|rimuovi|in\s*sede/.test(t);
    if (backToOffice) {
      if (isOffDay(ds)) toggleOffDay(ds, true);
      R();
      return `Ok: <b>${ds === today() ? 'oggi' : ds.split('-').reverse().join('/')}</b> segnato in sede (${S.kmDay} km tragitto).`;
    } else {
      if (!isOffDay(ds)) toggleOffDay(ds, true);
      R();
      const cNow = car();
      return `Segnato <b>Smart Working / Ferie</b> per ${ds === today() ? 'oggi' : ds.split('-').reverse().join('/')}: <b>0 km</b> scalati dal GPL` +
        (cNow.last ? ` (autonomia aggiornata: <b>${Math.round(cNow.rem)} km</b>).` : '.');
    }
  }

  // 2. Carpooling / Rimborso passaggio SS76
  if (/passaggi|carpool|benzina\s*divis|rimborso\s*(viaggio|ss76|auto)/.test(t)) {
    const amt = num > 0 ? num : 5;
    addCarpool(amt);
    return `Segnato rimborso passaggio SS76 di <b class='money-val'>+${eur(amt)}</b>: aggiunto alla liquidità e scalato dal costo netto al km!`;
  }

  // 3. Debiti e crediti
  let m;
  if (num > 0 && (m = raw.match(/([A-Za-zÀ-ÿ]+)\s+mi\s+deve/i))) return addDebt(cap(m[1]), num, 'due');
  if (num > 0 && (m = raw.match(/\bdevo\s+[\d.,]+\s*(?:euro|€)?\s*a\s+([A-Za-zÀ-ÿ]+)/i))) return addDebt(cap(m[1]), num, 'owe');
  if ((m = raw.match(/([A-Za-zÀ-ÿ]+)\s+(?:mi\s+ha|ha)\s+(?:ridato|restituito|rimborsato)/i)) ||
      (m = raw.match(/(?:ridato|restituito|rimborsato)\s+(?:a\s+)?([A-Za-zÀ-ÿ]+)/i))) {
    const nm = m[1].toLowerCase(),
          i = S.debts.findIndex(g => !g.p && g.dir === 'due' && g.who.toLowerCase() === nm);
    if (i >= 0) {
      const g = S.debts[i];
      settle(i);
      return `Fatto: ${esc(g.who)} ti ha restituito <span class='money-val'>${eur(g.a)}</span>.`;
    }
    return `Non trovo crediti aperti con ${esc(m[1])}.`;
  }
  if (/chi mi deve|a chi devo|\bdebiti\b|\bcrediti\b/.test(t)) {
    const o = S.debts.filter(g => !g.p);
    return o.length ? o.map(g => `${esc(g.who)} ${g.dir === 'due' ? 'ti deve' : 'devi'} <b class='money-val'>${eur(g.a)}</b>`).join('<br>') : 'Nessun debito aperto.';
  }

  // 4. Contesto pendente
  if (p && !/\bposso\b|quanto/.test(t)) {
    if (p.c && num != null) return addIt(c || p.c, num, ds, when, raw, split, parts);
    if (p.a != null && c) return addIt(c, num ?? p.a, ds, when, raw, split, parts);
  }

  // 5. Stipendio / Entrate
  if (/stipendio|busta paga/.test(t) && /arriv|ricev|accredit|pagat|preso|incassat/.test(t) && !/quando|\bse\b/.test(t)) {
    const a = num > 0 ? num : S.sal;
    S.inc.push({ id: uid(), d: today(), a, t: 'Stipendio' });
    save();
    R();
    return `Stipendio di <b class='money-val'>${eur(a)}</b> accreditato. Liquidità: <span class='money-val'>${eur(liq())}</span>.`;
  }
  if (/regal|mi (hanno|ha) (dato|mandato|bonificato)|ricevuto|incassat/.test(t) && num > 0 && !sv) {
    S.inc.push({ id: uid(), d: today(), a: num, t: 'Regalo' });
    save();
    R();
    return `Aggiunti <b class='money-val'>${eur(num)}</b> alla liquidità (ora <span class='money-val'>${eur(liq())}</span>).`;
  }

  // 6. Simulazione spesa "Posso permettermelo?" + Bottone Regola delle 48 ore
  if (/\bposso\b|ce la faccio|mi conviene|mi basta|permettermi/.test(t) && num > 0 && /euro|eur|€|spender|compr|permett|prend|pagar|acquist/.test(t)) {
    const itemName = extractPurchaseItem(raw);
    const parkBtn = `<div style='margin-top:10px'><button class='btn s sm' style='width:100%' onclick="parkItem('${escAttr(itemName)}', ${num})">⏳ Parcheggia «${esc(itemName)}» (${eur(num)}) per 48h</button></div>`;
    if (num <= s.rem) {
      return `Sì: dopo questa spesa ti restano <span class='money-val'>${eur(s.rem - num)}</span> di budget nel ciclo (${s.cyc.shortLabel}), il target di risparmio non è toccato.${parkBtn}`;
    }
    const days = Math.ceil((num - s.rem) / s.per);
    return `Non subito: mancano <span class='money-val'>${eur(num - s.rem)}</span> nel ciclo corrente. Se non spendi altro puoi permettertelo tra circa <b>${days} giorni</b>.${parkBtn}`;
  }

  // 7. Query spese, liquidità, autonomia & tagliando
  if (/quanto ho (gia )?speso|quanto spendo/.test(t)) {
    const o = /oggi/.test(t),
          tot = (o ? S.ex.filter(e => e.d === today()) : S.ex.filter(e => e.d >= s.cyc.start && e.d <= s.cyc.end)).reduce((a, e) => a + e.a, 0),
          top = Object.entries(catSumRange(s.cyc.start, s.cyc.end)).sort((a, b) => b[1] - a[1])[0];
    return `${o ? 'Oggi' : `In questo ciclo (${s.cyc.shortLabel})`} hai speso <b class='money-val'>${eur(tot)}</b>.` + (!o && top ? ` La voce più pesante è ${CAT[top[0]][0]} (<span class='money-val'>${eur(top[1])}</span>).` : '');
  }
  if (/quanto (ho|mi resta|mi rimane|posso spendere)|budget|saldo|liquidit|disponibil/.test(t) && !sv) {
    return `Liquidità <b class='money-val'>${eur(liq())}</b>. Nel ciclo ${s.cyc.shortLabel} hai speso <span class='money-val'>${eur(s.spent)}</span> su <span class='money-val'>${eur(S.bud)}</span>: ti restano <span class='money-val'>${eur(s.rem)}</span>, circa <b class='money-val'>${eur(s.daily)}</b> al giorno (${s.left}g alla paga).`;
  }
  if (/autonomia|quanti km|quanto gpl|gpl.*(rimast|resta)|riserva|tagliando/.test(t)) {
    const k = car();
    return k.last
      ? `Hai circa <b>${Math.round(k.rem)} km</b> di autonomia (${k.tk}/4 tacche). Prossimo tagliando tra <b>${Math.max(0, Math.round(k.maintRem))} km</b>.`
      : 'Registra prima un pieno nella scheda Auto.';
  }

  // 8. Agenda / Time-Finder
  const act = /agenda|calendario/.test(t) || (/voglio|vorrei|devo |organizza|pianifica|prenota|trova|quando|andare|andiamo|stasera|domani|dopodomani|prossim/.test(t) && num == null && !sv);
  if (act) {
    const title = raw.replace(/^(voglio|vorrei|devo|organizza|pianifica|prenota|trova|metti in agenda|segna in agenda)\s+(di\s+)?/i, '').replace(/\d+(?:[.,]\d+)?\s*or[ae]/i, '').trim() || raw,
          dur = oreM ? +oreM[1].replace(',', '.') : /mezz/.test(t) ? 0.5 : /cena|aperitiv|pranz/.test(t) ? 2 : 1.5;
    return slotHTML(title, dur);
  }

  // 9. Registrazione spesa (singola o somma multipla)
  if (c) {
    const a = num ?? FIX[c];
    if (a == null) { pend = { c }; return `Quanto hai speso per ${CAT[c][0].toLowerCase()}?`; }
    return addIt(c, a, ds, when, raw, split, parts);
  }
  if (num != null) {
    pend = { a: num, parts };
    return `Ok, <span class='money-val'>${eur(num)}</span>${parts.length > 1 ? ` (${parts.map(x => eur(x)).join(' + ')})` : ''}. Per cosa? (es. cena, caffè, svago, benzina…)`;
  }
  if (sv) return 'Quanto hai speso e per cosa?';

  return 'Prova così: «spesa coop 15 di carne e 10 di verdura», «oggi smart working», «passaggio 5 euro», «posso comprare una felpa da 40 euro?», «autonomia», «voglio andare in palestra».';
}

async function cloudCreateBin() {
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  if (!key) return toast('Incolla prima la tua X-Master-Key di JSONBin.io');
  S.cloud.key = key;
  save();
  toast('Creazione Bin in corso…');
  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Name': 'LeoWealth', 'X-Bin-Private': 'true' },
      body: JSON.stringify(S)
    });
    const j = await res.json();
    if (j && j.metadata && j.metadata.id) {
      S.cloud.bin = j.metadata.id;
      S.cloud.lastSync = Date.now();
      save();
      toast('☁️ Bin creato: ' + j.metadata.id);
      R();
    } else {
      toast('Chiave API non valida');
    }
  } catch (e) { toast('Errore di rete'); }
}

async function cloudPush() {
  vib(25);
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) return toast('Inserisci Master Key e Bin ID');
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key },
      body: JSON.stringify(S)
    });
    if (res.ok) {
      S.cloud.lastSync = Date.now();
      save();
      toast('☁️ Dati salvati su Cloud');
      R();
    } else toast('Errore upload Cloud');
  } catch (e) { toast('Errore di connessione'); }
}

async function cloudPull() {
  vib(25);
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) return toast('Inserisci Master Key e Bin ID');
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, {
      headers: { 'X-Master-Key': key }
    });
    const j = await res.json();
    if (j && j.record) {
      const keepCloud = Object.assign({}, S.cloud, { lastSync: Date.now() });
      Object.assign(S, j.record);
      S.cloud = keepCloud;
      save();
      toast('☁️ Dati caricati dal Cloud');
      R();
    } else toast('Bin non trovato');
  } catch (e) { toast('Errore download Cloud'); }
}

function ring(p, col, txt, sub) {
  p = Math.min(1, Math.max(0, p));
  return `<svg viewBox="0 0 120 120" width="116" height="116" style="flex:none">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff14" stroke-width="12"/>

function cal() {
  const y = cm.getFullYear(), m = cm.getMonth(),
        first = (new Date(y, m, 1).getDay() + 6) % 7,
        dim = new Date(y, m + 1, 0).getDate();
  let g = ['L', 'M', 'M', 'G', 'V', 'S', 'D'].map(x => '<b>' + x + '</b>').join('');
  for (let i = 0; i < first; i++) g += '<button class="e"></button>';
  for (let d = 1; d <= dim; d++) {
    const ds = y + '-' + pad(m + 1) + '-' + pad(d),
          ne = evOn(ds).length,
          nx = S.ex.some(e => e.d === ds),
          off = isOffDay(ds);
    g += `<button class="${ds === today() ? 't ' : ''}${ds === sel ? 's ' : ''}${off ? 'off' : ''}" onclick="vib(18);sel='${ds}';R()">${d}<i>${ne ? '<u></u>' : ''}${nx ? '<u class="x2"></u>' : ''}</i></button>`;
  }
  const ev = evOn(sel),
        exs = S.ex.filter(e => e.d === sel),
        dd = new Date(sel + 'T12:00');

  return `<h1>Agenda</h1>
    <div class='card'>
      <div class='row sp' style='margin-bottom:10px'>
        <button class='btn s sm' onclick='vib(18);cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);R()'>‹</button>
        <b>${MESI[m]} ${y}</b>
        <button class='btn s sm' onclick='vib(18);cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);R()'>›</button>
      </div>
      <div class='cal'>${g}</div>
      <div class='m' style='margin-top:8px'>
        <span class='dot' style='background:var(--ok);display:inline-block'></span> impegni ·
        <span class='dot' style='background:var(--w);display:inline-block'></span> spese ·
        <span class='dot' style='background:#bf5af2;display:inline-block'></span> smart working

    </div>
    <div class='row sp' style='margin:18px 4px 8px'>
      <h2 style='margin:0'>${dd.getDate()} ${MESI[dd.getMonth()]}</h2>
      ${wk(sel) ? `<button class='btn s sm' onclick="toggleOffDay('${sel}')">${isOffDay(sel) ? `🚗 In sede (${S.kmDay} km)` : '🏠 Smart Working'}</button>` : ''}
    </div>
    <div class='card'>` +
    (isOffDay(sel)
      ? `<div class='li'><span class='badge sw'>🏠 Smart Working / Ferie · 0 km tragitto</span></div>`
      : wk(sel)
        ? `<div class='li m'><span>08–09 · viaggio</span></div><div class='li m'><span>09–18 · lavoro</span></div><div class='li m'><span>18–19 · viaggio</span></div>`
        : '') +
    ev.map(e => `<div class='li'><b>${e.tm}</b><span class='grow'>${esc(e.t)}${e.r ? ` <span class='m'>↻ ${e.r === 'w' ? 'settimanale' : 'giornaliera'}</span>` : ''}</span><button class='x' onclick="delEv('${e.id}')">✕</button></div>`).join('') +
    exs.map(e => `<div class='li'><span class='dot' style='background:${CAT[e.c][1]}'></span><span class='grow' onclick="openEd('${e.id}')">${CAT[e.c][0]}${e.hasImg ? ' 🧾' : ''}</span><b class='money-val'>${eur(e.a)}</b><button class='x' onclick="delEx('${e.id}')">✕</button></div>`).join('') +
    (!wk(sel) && !ev.length && !exs.length ? `<span class='m'>Nessun impegno o spesa in questo giorno.</span>` : '') +

function money() {
  const cyc = getCycle(new Date(), mo),
        prevCyc = getCycle(new Date(), mo - 1),
        bc = catSumRange(cyc.start, cyc.end),
        tot = Object.values(bc).reduce((a, b) => a + b, 0),
        s = stats(),
        ents = Object.entries(bc).sort((a, b) => b[1] - a[1]);
  let off = 0;
  const arcs = ents.map(([c, v]) => {
    const l = v / tot * 251.3,
          r = `<circle cx="60" cy="60" r="40" fill="none" stroke="${CAT[c][1]}" stroke-width="16" stroke-dasharray="${l} 251.3" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += l;
    return r;
  }).join('');

  const hist = S.ex.filter(e => e.d >= cyc.start && e.d <= cyc.end).sort((a, b) => a.d < b.d ? 1 : -1);

  return `<div class='row sp'>
      <h1>Soldi</h1>
      <button class='btn s sm' onclick="vib(20);tab='settings';R();window.scrollTo(0,0)">⚙️ Budget & Fisse</button>
    </div>

      <button class='btn s sm' onclick='vib(18);mo--;R()'>‹</button>

      <button class='btn s sm' onclick='vib(18);mo++;R()'>›</button>
    </div>
    ${recapCycle(cyc, prevCyc)}
    <h2>Dove vanno i soldi</h2>
    <div class='card'>` +
    (tot
      ? `<div class='row'>
          <svg viewBox='0 0 120 120' width='116' height='116' style='flex:none'>${arcs}<text x='60' y='64' text-anchor='middle' fill='#fff' font-weight='700' font-size='15' class='money-val'>${eur(tot).replace(',00', '')}</text></svg>
          <div class='grow'>${ents.map(([c, v]) => `<div class='row sp m' style='margin-bottom:3px'><span><span class='dot' style='background:${CAT[c][1]};display:inline-block'></span> ${CAT[c][0]}</span><span>${Math.round(v / tot * 100)}%</span></div>`).join('')}</div>
         </div>` +
        ents.map(([c, v]) => `<div style='margin-top:10px'><div class='row sp'><span>${CAT[c][0]}</span><b class='money-val'>${eur(v)}</b></div><div class='bar'><i style='width:${v / ents[0][1] * 100}%;background:${CAT[c][1]}'></i></div></div>`).join('')
      : `<span class='m'>Nessuna spesa in questo ciclo.</span>`) +
    `</div>
    ${chartSectionHTML(s)}
    ${parkedHTML(true)}
    ${goalsHTML()}
    ${debtHTML()}
    <h2>Entrate</h2>
    <div class='card'>${incList()}</div>
    <h2>Movimenti · tocca per gestire o scorri per eliminare</h2>
    <div class='card'>` +
    (hist.length
      ? hist.map(e => `<div class='li'><span class='dot' style='background:${CAT[e.c][1]}'></span><span class='grow' onclick="openEd('${e.id}')">${CAT[e.c][0]}${e.rid ? " <span class='m'>· fissa</span>" : ''}${e.hasImg ? ' 🧾' : ''}<div class='m'>${e.d.split('-').reverse().join('/')}</div></span><b class='money-val'>${eur(e.a)}</b><button class='x' onclick="delEx('${e.id}')">✕</button></div>`).join('')
      : `<span class='m'>Nessun movimento in questo ciclo.</span>`) +
    `</div>`;
}

function carV() {
  const c = car(), l = c.last;
  const fAn = c.f.filter(x => x.pl !== 'wk');
  const fWk = c.f.filter(x => x.pl === 'wk');
  const avgAn = fAn.length ? fAn.reduce((s, x) => s + x.ppl, 0) / fAn.length : null;
  const avgWk = fWk.length ? fWk.reduce((s, x) => s + x.ppl, 0) / fWk.length : null;

  const benzEx = S.ex.filter(e => e.c === 'benz').sort((a, b) => b.d.localeCompare(a.d));
  const lastBenz = benzEx[0];
  const daysSinceBenz = lastBenz ? Math.max(0, Math.round((new Date(today() + 'T12:00') - new Date(lastBenz.d + 'T12:00')) / 864e5)) : null;

  const maintPct = Math.min(100, Math.round(c.maintSince / c.maintInt * 100));

  return `<div class='row sp'>

         </div>` +

    <h2>Km extra (weekend)</h2>

    <h2>Storico pieni · scorri per eliminare</h2>
    <div class='card'>` +
    (c.f.length
      ? [...c.f].reverse().map(x => {
          const idx = S.fills.findIndex(f => f.id === x.id);
          return `<div class='li'><span class='grow'>${x.d.split('-').reverse().join('/')}<div class='m'>${(x.eur / x.ppl).toFixed(1).replace('.', ',')} L · ${x.pl === 'wk' ? 'lavoro / Cingoli' : 'Ancona'} (${x.ppl.toFixed(3).replace('.', ',')} €/L)</div></span><b class='money-val'>${eur(x.eur)}</b><button class='x' onclick='delFill(${idx})'>✕</button></div>`;
        }).join('')
      : `<span class='m'>Ancora nessun pieno.</span>`) +
    `</div>`;
}

/* ==========================================================================
   15. NAVIGAZIONE A 5 TAB, AUTOMAZIONI URL SHORTCUTS & AVVIO
   ========================================================================== */
const TABS = [
  ['home',     I('home', 20),  'Home',         home],
  ['cal',      I('cal', 20),   'Agenda',       cal],
  ['money',    I('chart', 20), 'Soldi',        money],
  ['car',      I('car', 20),   'Auto',         carV],
  ['settings', I('gear', 20),  'Impostazioni', settingsV]
];

function R() {
  document.body.classList.toggle('blur-mode', Boolean(S.priv));
  const y = window.scrollY;
  $('#v').innerHTML = TABS.find(t => t[0] === tab)[3]();
  $('#nv').innerHTML = TABS.map(t =>
    `<button class="${t[0] === tab ? 'on' : ''}" onclick="vib(20);tab='${t[0]}';R();window.scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`
  ).join('');
  window.scrollTo(0, y);
}

function handleUrlActions() {
  try {
    const params = new URLSearchParams(location.search);
    let handled = false;
    if (params.has('add')) {
      const c = params.get('add').toLowerCase();
      if (CAT[c] && FIX[c]) {
        addEx(c, FIX[c], today());
        handled = true;
      }
    }
    if (params.get('sw') === '1') {
      toggleOffDay(today());
      handled = true;
    }
    if (params.get('priv') === '1') {
      S.priv = !S.priv;
      save();
      R();
      handled = true;
    }
    if (params.get('pay') === '1') {
      payNow();
      handled = true;
    }
    if (handled && history.replaceState) {
      history.replaceState(null, '', location.pathname);
    }
  } catch (e) {}
}

window.onload = function () {
  applyRec();
  tab = 'home';
  R();
  handleUrlActions();
  setTimeout(checkAutoAlerts, 2500);
};
</script>
