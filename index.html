function weekKey() { const d = new Date(); d.setDate(d.getDate() - d.getDay()); return iso(d); }
function weekBanner() {
  if (![0, 1].includes(new Date().getDay()) || S.weekSeen === weekKey()) return '';
  if (!noticeLive('week:' + weekKey())) return '';
  noticeSchedule(['week:' + weekKey()]);
  return `<div class='card row sp' style='padding:9px 13px;margin-bottom:9px'><span style='font-size:12.5px'>Riepilogo della settimana pronto</span><button class='btn sm' onclick='openWeekSheet()'>Vedi</button></div>`;
}
function weekData() {
  const mk = o => { const x = new Date(); x.setDate(x.getDate() - o); return iso(x); };
  const d0 = mk(6), p0 = mk(13), p1 = mk(7), ok = e => !e.vac && !e.rid;
  const cur = S.ex.filter(e => e.d >= d0 && e.d <= today() && ok(e)), prev = S.ex.filter(e => e.d >= p0 && e.d <= p1 && ok(e));
  const sum = x => x.reduce((s, e) => s + parseNum(e.a), 0), byc = {}, byd = {};
  cur.forEach(e => { byc[e.c] = (byc[e.c] || 0) + parseNum(e.a); byd[e.d] = (byd[e.d] || 0) + parseNum(e.a); });
  let free = 0; for (let i = 0; i < 7; i++) if (!byd[mk(i)]) free++;
  return { tot: sum(cur), pt: sum(prev), byc, free, big: [...cur].sort((a, b) => parseNum(b.a) - parseNum(a.a))[0], inc: S.inc.filter(i => i.d >= d0 && i.d <= today()).reduce((s, i) => s + parseNum(i.a), 0) };
}
function openWeekSheet() {
  S.weekSeen = weekKey(); save();
  const w = weekData(), cats = getCats(), diff = w.tot - w.pt, pct = w.pt > 0 ? Math.round(diff / w.pt * 100) : null;
  const rows = Object.entries(w.byc).sort((a, b) => b[1] - a[1]).slice(0, 4), mx = rows[0] ? rows[0][1] : 1;
  const line = w.tot === 0 ? 'Settimana senza spese extra: ottimo.' : pct == null ? `Hai speso ${eur(w.tot)} in 7 giorni.` : diff <= 0 ? `Hai speso ${eur(-diff)} in meno della settimana scorsa.` : `Hai speso ${eur(diff)} in più della settimana scorsa.`;
  openSheet(`<div class='row sp'><b style='font-size:15px'>Ultimi 7 giorni</b><button class='x' onclick='closeNp()'>Chiudi</button></div>
    <div class='kpi-grid' style='margin-top:12px'>
      <div class='kpi-box'><span class='m'>Speso</span><b class='money-val'>${eur(w.tot)}</b></div>
      <div class='kpi-box'><span class='m'>Vs prima</span><b class='${pct == null ? '' : diff <= 0 ? 'ok' : 'bad'}'>${pct == null ? '—' : (pct > 0 ? '+' : '') + pct + '%'}</b></div>
      <div class='kpi-box'><span class='m'>Giorni a zero</span><b>${w.free}/7</b></div>
    </div>
    <div class='m' style='margin:12px 0 8px;color:var(--t)'>${line}</div>
    ${rows.map(([c, v]) => `<div style='margin-bottom:10px'><div class='row sp' style='font-size:12.5px'><span>${cats[c] ? cats[c][0] : c}</span><b class='money-val'>${eur(v)}</b></div><div class='bar'><i style='width:${v / mx * 100}%;background:#fff'></i></div></div>`).join('')}
    ${w.big ? `<div class='m'>Spesa più grande: <b class='money-val' style='color:var(--t)'>${eur(w.big.a)}</b> · ${esc(w.big.n || (cats[w.big.c] || ['Altro'])[0])}</div>` : ''}
    ${w.inc > 0 ? `<div class='m' style='margin-top:4px'>Entrate: <b class='money-val' style='color:var(--t)'>+${eur(w.inc)}</b></div>` : ''}`);
}

const NF_LABELS = [
  ['evento', 'Impegni in arrivo'], ['budget', 'Budget del ciclo e del giorno'],
  ['stipendio', 'Stipendio da registrare'],
  ['debiti', 'Crediti aperti da tempo'], ['backup', 'Backup dati'], ['fisse', 'Addebiti spese fisse (Calendario)']
];
function nf() {
  if (!S.nf || typeof S.nf !== 'object') S.nf = {};
  const n = S.nf;
  n.types = Object.assign({ evento: true, budget: true, stipendio: true, debiti: true, backup: true, fisse: true }, n.types || {});
  n.evMin = n.evMin || 30;
  n.sent = n.sent || {};
  n.sysd = n.sysd || {};
  n.ntfyTopic = typeof n.ntfyTopic === 'string' ? n.ntfyTopic : '';
  n.ntfyOn = Boolean(n.ntfyOn);
  n.autoCalShortcut = Boolean(n.autoCalShortcut);
  return n;
}

function computeAlerts() {
  const n = nf(), t = n.types, al = [], s = stats(0), now = new Date(), tdy = today();
  const add = (key, k, text, act, label, sys) => {
    if (n.sent[key] !== tdy) al.push({ key, k, text, act, label, sys: !!sys });
  };

  if (t.evento) {
    const nowM = now.getHours() * 60 + now.getMinutes();
    evOn(tdy).forEach(e => {
      const [eh, em] = (e.tm || '00:00').split(':').map(Number), diff = eh * 60 + em - nowM;
      if (diff >= 0 && diff <= n.evMin) add('ev:' + e.id + ':' + tdy, 'w', `${e.t} alle ${e.tm}${diff ? ` (tra ${diff} min)` : ''}`, "tab='cal';R()", 'Agenda', true);
    });
  }

  if (t.budget && !S.vacMode) {
    const pct = parseNum(S.bud) > 0 ? s.spent / parseNum(S.bud) : 0;
    const todayExp = S.ex.filter(e => e.d === tdy && !e.rid && !e.vac).reduce((a, e) => a + parseNum(e.a), 0);
    if (pct >= 1) add('bud:100', 'bad', 'Budget del ciclo esaurito', '', '', true);
    else if (pct >= 0.85) add('bud:85', 'w', `Hai usato l’${Math.round(pct * 100)}% del budget del ciclo`, '', '', true);
    if (s.daily > 0 && todayExp > s.daily && pct < 1) add('bud:day', 'w', 'Oggi hai superato il budget giornaliero', '', '', false);
  }

  if (t.stipendio && !S.inc.some(i => i.d >= s.cyc.startStr && i.d <= s.cyc.endStr && (i.t || '') === 'Stipendio')) {
    const daysFromPay = Math.floor((new Date(tdy + 'T12:00') - new Date(s.cyc.startStr + 'T12:00')) / 86400000);
    if (daysFromPay >= 0 && daysFromPay <= 2) {
      add('pay:' + s.cyc.startStr, 'ok', `Stipendio ${eur(S.sal)} da registrare`, 'payNow()', 'Registra', true);
    }
  }

  if (t.debiti) {
    const old = S.debts.filter(g => !g.p && g.dir === 'due' && g.d && (Date.now() - new Date(g.d + 'T12:00')) > 14 * 864e5)[0];
    if (old) add('debt:' + old.id, 'w', `${old.who} ti deve ${eur(old.a)} da più di 2 settimane`, "tab='money';moneySub='deb';R()", 'Vedi', true);
  }

  if (t.backup) {
    const ds = S.lastBackupAt ? Math.floor((Date.now() - S.lastBackupAt) / 864e5) : null;
    if (ds == null || ds >= 15) add('bk', 'w', 'Backup dei dati non fatto da tempo', "tab='set';sysSub='sync';R()", 'Backup', false);
  }

  const order = { bad: 0, w: 1, ok: 2 };
  return al.sort((a, b) => order[a.k] - order[b.k]);
}

const NOTICE_MS = 7000, noticeSeen = {};
function noticeLive(key) {
  const now = Date.now();
  if (!noticeSeen[key]) noticeSeen[key] = now;
  return now - noticeSeen[key] < NOTICE_MS;
}
function noticeSchedule(keys) {
  clearTimeout(noticeSchedule.t);
  const now = Date.now();
  const left = keys.map(k => NOTICE_MS - (now - noticeSeen[k])).filter(x => x > 0);
  if (!left.length) return;
  noticeSchedule.t = setTimeout(() => {

function encodeHeaderUTF8(str) {
  try {
    const bytes = new TextEncoder().encode(String(str));
    let bin = '';
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    return '=?UTF-8?B?' + btoa(bin) + '?=';
  } catch (e) {
    return String(str).replace(/[^\x20-\x7E]/g, '-');
  }
}

async function ntfyPush(title, body, priority = 3) {
  const n = nf();
  const topic = (n.ntfyTopic || '').trim().replace(/^https?:\/\/ntfy\.sh\//i, '');
  if (!n.ntfyOn || !topic) return false;
  try {
    const res = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}`, {
      method: 'POST',
      keepalive: true,
      headers: {
        'Title': encodeHeaderUTF8(title),
        'Priority': String(priority),
        'Tags': priority >= 4 ? 'warning' : 'bell'
      },
      body
    });
    return res.ok;
  } catch (e) {
    return false;
  }
}

async function sendMorningBriefPush() {

  const evStr = ev.length ? `Prossimo: ${ev[0].tm} ${ev[0].t}` : (wk(today()) ? `Sede ${S.workStart}–${S.workEnd}` : 'Agenda libera');
  const lines = [qStr, evStr].filter(Boolean).join(' · ');
  const ok = await ntfyPush('MY SPACE · Briefing Oggi', lines, 3);
  if (ok) {
    nf().sysd['brief:' + today()] = today();
    save(true);
  }
  return ok;
}

async function sysNotify(title, body, tag, priority = 3) {
  let delivered = false;
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg && reg.showNotification) { await reg.showNotification(title, { body, tag }); delivered = true; }
    } catch (e) {}
    if (!delivered) {
      try { new Notification(title, { body, tag }); delivered = true; } catch (e) {}
    }
  }
  const pushed = await ntfyPush(title, body, priority);
  return delivered || pushed;
}

let nfSig = '';
function nfTick(immediate = false) {

function icsT(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }

function buildReminders() {
  const n = nf(), t = n.types, L = [], stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const z = (ds, tm) => ds.replace(/-/g, '') + 'T' + tm.replace(':', '') + '00';
  const untilStr = endDs => endDs ? ';UNTIL=' + endDs.replace(/-/g, '') + 'T235959Z' : '';

  const ev = (uidStr, ds, tm, sum, o = {}) => {
    L.push('BEGIN:VEVENT', 'UID:' + uidStr + '@myspace', 'DTSTAMP:' + stamp, 'DTSTART:' + z(ds, tm), 'DURATION:PT' + (o.dur || 30) + 'M', 'SUMMARY:' + icsT(sum));
    if (o.rr) L.push('RRULE:' + o.rr);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsT(sum), 'TRIGGER:' + (o.trig || 'PT0S'), 'END:VALARM', 'END:VEVENT');
  };

  const tdy = today();
  const nextDom = day => {
    const d = new Date();
    const targetDay = Math.min(31, Math.max(1, +day || 1));
    const dimCurr = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    if (d.getDate() > Math.min(targetDay, dimCurr)) d.setMonth(d.getMonth() + 1);
    const dimTarget = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(targetDay, dimTarget));
    return iso(d);
  };

  let count = 0;

  if (t.evento) {
    S.ev.forEach(e => {
      if (e.d < tdy && !e.r) return;
      let rr = '';
      if (e.r === 'd') rr = 'FREQ=DAILY' + untilStr(e.end);
      else if (e.r === 'w') rr = 'FREQ=WEEKLY' + untilStr(e.end);
      else if (e.r === 'm') rr = 'FREQ=MONTHLY' + untilStr(e.end);
      else if (e.r && e.r.startsWith('i')) {
        const iv = Math.max(1, parseInt(e.r.slice(1), 10) || 1);
        rr = `FREQ=DAILY;INTERVAL=${iv}` + untilStr(e.end);
      }
      ev('ev-' + e.id, e.d < tdy && e.r ? tdy : e.d, e.tm || '09:00', e.t, {
        dur: Math.round((parseNum(e.dur) || 1) * 60),
        trig: '-PT' + n.evMin + 'M',
        rr
      });
      count++;
    });
  }

  if (t.stipendio) {
    const pd = Math.min(31, Math.max(1, +S.payDay || 1));
    ev('pay', nextDom(pd), '09:00', `Stipendio: registralo in MY SPACE (${eur(S.sal)})`, {
      trig: '-PT2H',
      rr: 'FREQ=MONTHLY;BYMONTHDAY=' + (pd > 28 ? -1 : pd)
    });
    count++;
  }

  if (t.fisse) {
    S.rec.forEach(r => {
      const rDay = Math.min(31, Math.max(1, +r.day || 1));
      ev('rec-' + r.id, nextDom(rDay), '09:00', `Addebito ${r.n} (${eur(r.a)})`, {
        trig: parseNum(r.a) >= 15 ? '-PT24H' : '-PT2H',
        rr: 'FREQ=MONTHLY;BYMONTHDAY=' + (rDay > 28 ? -1 : rDay)
      });
      count++;
    });
  }

  if (t.backup) {
    const d = new Date();
    d.setMonth(d.getMonth() + 1);
    d.setDate(1);
    ev('backup', iso(d), '10:00', 'Esporta backup dati MY SPACE', { rr: 'FREQ=MONTHLY;BYMONTHDAY=1' });
    count++;
  }

  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MY SPACE//IT', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:MY SPACE', ...L, 'END:VCALENDAR'].join('\r\n');
  return { ics, count };
}

function exportReminders() {
  const { ics, count } = buildReminders();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  a.download = 'my-space-promemoria.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast(`${count} promemoria pronti per il Calendario`);

function handleUrlActions() {
  const p = new URLSearchParams(location.search);
  let changed = false;
  if (p.has('add')) {
    const c = p.get('add').toLowerCase();
    if (getCats()[c] && FIX[c]) {
      addEx(c, FIX[c], today(), 'Rapido');
      changed = true;
    }
  }
  if (p.get('sw') === '1') {
    if (!isOffDay(today())) toggleOffDay(today());
    changed = true;
  }
  if (p.get('check') === '1') {
    nfTick(true);
    toast('Controllo avvisi e push eseguito');
    changed = true;
  }
  if (p.get('brief') === '1') {
    sendMorningBriefPush().then(ok => {
      if (ok) toast('Briefing mattutino inviato');
    });
    changed = true;
  }
  if (changed && history.replaceState) {
    history.replaceState(null, '', location.pathname);
  }
}

}
