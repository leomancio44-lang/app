<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MY SPACE">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%23000000'/%3E%3Crect x='14' y='14' width='152' height='152' rx='28' fill='%23111113' stroke='%23222227' stroke-width='2'/%3E%3Ctext x='90' y='108' text-anchor='middle' fill='%23ffffff' font-family='-apple-system,sans-serif' font-size='54' font-weight='800' letter-spacing='-2'%3EMS%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22MY%20SPACE%22%2C%22short_name%22%3A%22MY%20SPACE%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
<title>MY SPACE</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --s1:#0D0D10;
  --s2:#141418;
  --s3:#1C1C21;
  --t:#F5F5F7;
  --m:#9797A2;
  --m2:#63636D;
  --b:rgba(255,255,255,.07);
  --bh:rgba(255,255,255,.2);
  --ok:#32D74B;
  --w:#F59E0B;
  --bad:#EF4444;
  --vac:#38BDF8;
  --r-card:22px;
  --r-md:16px;
  --r-sm:12px;
  --hi:inset 0 1px 0 rgba(255,255,255,.055);
  --ease:cubic-bezier(.2,.8,.2,1);
  --safe-top:max(env(safe-area-inset-top,0px),48px);
  --top-gap:calc(var(--safe-top) + 22px);
  box-sizing:border-box;
}
html{
  scroll-padding-top:var(--top-gap);
  overflow-x:hidden;
  background:#000000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  overflow-x:hidden;
  background:#000000;
  color:var(--t);
  font:14px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  letter-spacing:-.008em;
  font-variant-numeric:tabular-nums;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

/* Copertura nero OLED puro sotto la status bar iOS */
.safe-top-cap{
  position:fixed;
  top:0;left:0;right:0;
  height:calc(var(--top-gap) - 8px);
  background:#000000;
  z-index:45;
  pointer-events:none;
}

.app-shell{
  max-width:448px;
  width:100%;
  min-height:100dvh;
  margin:0 auto;
  background:transparent;
  padding:var(--top-gap) 14px calc(92px + env(safe-area-inset-bottom,0px));
  position:relative;
  transform-origin:top center;
  transition:transform .28s cubic-bezier(.16,1,.3,1),border-radius .28s cubic-bezier(.16,1,.3,1),filter .28s ease;
}
body.sheet-open .app-shell,
body:has(#sh.on) .app-shell{
  transform:scale(.962) translateY(4px);
  border-radius:22px;
  filter:brightness(.82);
  overflow:hidden;
}

.app-title{font-size:18px;font-weight:700;letter-spacing:.16em;color:var(--t)}
h1{font-size:26px;font-weight:700;margin:2px 0 0;letter-spacing:-.8px;line-height:1.15}
h2{
  font-size:13px;font-weight:600;letter-spacing:0;text-transform:none;
  color:var(--m);margin:24px 4px 10px;
}
.kicker{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--m);margin:0;display:block}
label{font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--m);display:block;margin:14px 2px 6px}
.m{font-size:12px;color:var(--m)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.w{color:var(--w)}
.hero-num{font-weight:700;letter-spacing:-2px;font-size:clamp(38px,11.5vw,46px);line-height:1.05;color:#FFFFFF}
.big{font-size:clamp(19px,5.2vw,22px);font-weight:700;letter-spacing:-.7px;line-height:1.12}

.card,.sub-card,.sub-link,.gami-pill,.li-card,.qbtn,.wday{
  background:linear-gradient(180deg,#101014 0%,#0C0C0F 100%);
  border:1px solid var(--b);
  box-shadow:var(--hi);
}
.card{
  border-radius:var(--r-card);
  padding:16px;
  margin-bottom:12px;
  max-width:100%;
  transition:border-color .16s,transform .14s;
}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--bh)}
.lp{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lp:active{transform:scale(.978);border-color:rgba(255,255,255,.32)}

.hero-card.card{
  background:
    radial-gradient(120% 80% at 0% 0%,rgba(255,255,255,.075) 0%,rgba(255,255,255,0) 58%),
    linear-gradient(180deg,#121216 0%,#0B0B0E 100%)!important;
  border-color:rgba(255,255,255,.12)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1)!important;
  padding:18px 18px 16px!important;
}
.hero-card .badge{background:rgba(255,255,255,.09)!important;color:var(--t)!important}

.eye-inline{
  width:24px;height:24px;border-radius:8px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  color:var(--m);
  display:inline-flex;align-items:center;justify-content:center;
  padding:0;flex:none;
}
.eye-inline.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF}

.row{display:flex;align-items:center;gap:8px;min-width:0}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2>div,.g3>div{min-width:0}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  padding-top:14px;
  margin-top:14px;
  border-top:1px solid var(--b);
}
.hero-stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.hstat{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.055);
  padding:12px;
  border-radius:var(--r-md);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:76px;
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
.hstat:hover{background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.1)}
.hstat b{display:block;font-size:19px;font-weight:700;margin-top:5px;color:var(--t);letter-spacing:-.6px}
.hstat .sub-stat{font-size:11px;color:var(--m);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gami-pill{
  display:grid;
  grid-template-columns:1fr;
  align-items:center;
  border-radius:18px;
  padding:9px 10px;
  margin-bottom:11px;
  gap:6px;
}
.gami-cell{
  display:flex;align-items:center;gap:8px;
  min-width:0;cursor:pointer;
  padding:4px 6px;border-radius:11px;
  transition:background .15s;
}
.gami-cell:hover{background:rgba(255,255,255,.04)}
.gami-cell.sw-on{background:rgba(50,215,75,.11)}
.gami-ico{
  width:30px;height:30px;border-radius:10px;
  background:rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.gami-cell.sw-on .gami-ico{background:rgba(50,215,75,.2);color:var(--ok)}

.qgrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-bottom:11px;
}
.qgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.qbtn{
  border-radius:var(--r-card);
  padding:10px 6px;
  min-height:92px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-align:center;
  min-width:0;
}
.qbtn svg{width:22px;height:22px;padding:7px;box-sizing:content-box;border-radius:13px;background:rgba(255,255,255,.09)}
.qbtn:hover{border-color:var(--bh)}
.qbtn.pri{background:#F5F5F7;color:#000000;border-color:#F5F5F7;box-shadow:none}
.qbtn.pri svg{background:rgba(0,0,0,.09)}
.qbtn b{font-size:15px;font-weight:650;letter-spacing:-.2px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qbtn .qsub{font-size:11.5px;color:var(--m);line-height:1}
.qbtn.pri .qsub{color:rgba(0,0,0,.6)}

button,input,select,textarea{font:inherit;color:var(--t)}
button{
  cursor:pointer;
  transition:transform .13s cubic-bezier(.16,1,.3,1),opacity .13s,background .15s,border-color .15s;
}
button:active,.btn:active{transform:scale(.97);opacity:.92}

.btn{
  background:#F5F5F7;
  color:#000000;
  border:1px solid #F5F5F7;
  min-height:44px;
  border-radius:14px;
  padding:0 18px;
  font-weight:600;
  font-size:14px;
  letter-spacing:-.1px;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  box-shadow:none;
}
.btn:hover{background:#E5E5EA}
.btn.s{background:rgba(255,255,255,.065);color:var(--t);border:1px solid var(--b);box-shadow:var(--hi)}
.btn.s:hover{background:rgba(255,255,255,.1);border-color:var(--bh)}
.btn.d{background:rgba(239,68,68,.12);color:var(--bad);border:1px solid rgba(239,68,68,.28)}
.btn.sm{min-height:34px;padding:0 13px;font-size:12.5px;border-radius:11px}

.icon-btn{
  width:40px;height:40px;border-radius:13px;
  background:rgba(255,255,255,.065);border:1px solid var(--b);
  box-shadow:var(--hi);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--m);padding:0;flex:none;
}
.icon-btn:hover{color:var(--t);border-color:var(--bh)}
.icon-btn.on{color:#000000;background:#FFFFFF;border-color:#FFFFFF}

input,select,textarea{
  background:rgba(255,255,255,.045);
  border:1px solid var(--b);
  min-height:46px;
  border-radius:14px;
  padding:12px 14px;
  width:100%;
  max-width:100%;
  min-width:0;
  font-size:16px;
  outline:0;
  -webkit-appearance:none;
  transition:border-color .15s,background .15s,box-shadow .15s;
}
textarea{resize:vertical;min-height:82px;font-size:14px}
input[type="date"]{min-height:46px;font-size:14px}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.65}
input:focus,select:focus,textarea:focus{
  border-color:rgba(255,255,255,.55);
  background:rgba(255,255,255,.065);
  box-shadow:0 0 0 3px rgba(255,255,255,.07);
}

.seg{
  display:flex;
  background:#0D0D10;
  border:1px solid var(--b);
  border-radius:16px;
  padding:3px;
  gap:3px;
}
.seg button{
  flex:1;min-width:0;background:0;border:0;
  min-height:34px;border-radius:13px;padding:0 10px;
  font-size:12.5px;font-weight:550;color:var(--m);
  white-space:nowrap;
}
.seg button.on{background:#F5F5F7;color:#000000;font-weight:650;box-shadow:none}

body::after{
  content:'';position:fixed;left:0;right:0;bottom:0;height:128px;z-index:20;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.82) 62%,#000 100%);
}
body.kb-open::after,body:has(#sh.on)::after{opacity:0}
nav.liquid-dock{
  position:fixed;
  left:14px;right:14px;
  bottom:max(12px,env(safe-area-inset-bottom,12px));
  max-width:420px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(22,22,27,.78);
  backdrop-filter:blur(28px) saturate(170%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 36px rgba(0,0,0,.7);
  border-radius:26px;
  padding:5px;
  z-index:30;
}
nav.liquid-dock button{
  flex:1;min-width:0;background:0;border:0;
  padding:8px 2px 7px;border-radius:21px;
  color:var(--m);font-size:10.5px;font-weight:550;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:color .2s var(--ease),background .25s var(--ease);
}
nav.liquid-dock button.on{
  color:#FFFFFF;
  background:rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}

.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.09);overflow:visible;margin-top:6px;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s cubic-bezier(.16,1,.3,1)}
.pace-tick{position:absolute;top:-2px;width:1.5px;height:9px;background:rgba(255,255,255,.55);border-radius:1px;pointer-events:none}

.li-card{
  border-radius:var(--r-md);
  padding:13px 14px;
  margin-bottom:8px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  touch-action:pan-y;
}
.li-t{font-size:14.5px;font-weight:600;letter-spacing:-.2px;line-height:1.25}
.li-a{font-size:14.5px;font-weight:650;letter-spacing:-.25px}
.li-card .m{margin-top:2px}
.li{
  display:flex;align-items:center;gap:9px;
  padding:12px 0;
  border-bottom:1px solid var(--b);
  touch-action:pan-y;
}
.li:last-child{border:0;padding-bottom:2px}
.li:first-child{padding-top:2px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.x{
  background:0;border:0;color:var(--m2);
  min-width:34px;min-height:34px;border-radius:10px;font-size:13px;
  display:inline-flex;align-items:center;justify-content:center;
}
.x:hover,.x:active{color:var(--bad);background:rgba(239,68,68,.1)}

.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wday{
  border-radius:16px;
  padding:7px 2px;
  min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  color:var(--m);
}
.wday.t{border-color:rgba(255,255,255,.45)}
.wday.s{background:#FFFFFF;color:#000000;border-color:#FFFFFF;box-shadow:none}
.wday.wkday:not(.s){border-color:rgba(255,255,255,.15)}
.wday.off:not(.s){background:rgba(255,255,255,.03);border-style:dashed}
.wday.ferie:not(.s){background:rgba(56,189,248,.11);border-color:rgba(56,189,248,.42);color:#BAE6FD}
.wday.ferie-sel,.cal button.ferie-sel{background:rgba(56,189,248,.32)!important;border-color:#38BDF8!important;color:#FFFFFF!important;transform:scale(.95)}
.wday .wn{font-size:9px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.wday .wd{font-size:13.5px;font-weight:700}
.wday .wdots{display:flex;gap:2px;height:4px}
.wday .wdots u{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal b{font-size:10px;color:var(--m);font-weight:600;padding-bottom:4px}
.cal button{
  aspect-ratio:1;border-radius:10px;border:1px solid transparent;
  background:rgba(255,255,255,.04);font-size:12px;position:relative;padding:0;
}
.cal button.t{border-color:rgba(255,255,255,.45)}
.cal button.s{background:#FFFFFF;color:#000000;font-weight:700}
.cal button.wkday:not(.s){background:rgba(255,255,255,.075)}
.cal button.off:not(.s){border-color:rgba(255,255,255,.22);border-style:dashed}
.cal button.ferie:not(.s){background:rgba(56,189,248,.14);border-color:rgba(56,189,248,.45);color:#BAE6FD}
.cal button.e{opacity:.15;pointer-events:none}
.cal i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal i u{width:3.5px;height:3.5px;border-radius:50%;background:var(--ok)}
.cal i u.x3{background:#FFFFFF}
.cal i u.x4{background:var(--vac)}

.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.kpi-box{background:var(--s2);border:0;border-radius:11px;padding:8px 9px}
.kpi-box .m{font-size:10.5px;display:block}
.kpi-box b{font-size:13px;display:block;margin-top:2px}

.sheet{
  position:fixed;inset:0;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:40;display:none;align-items:flex-end;justify-content:center;
}
.sheet.on{display:flex}
.sheet.on>div{animation:slideUp .24s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet>div{
  width:100%;max-width:448px;
  background:#131317;
  border-top:1px solid rgba(255,255,255,.12);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  border-radius:28px 28px 0 0;
  padding:8px 15px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:90dvh;overflow-y:auto;
  will-change:transform;
}
.grabber-wrap{padding:4px 0 9px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.grabber{width:38px;height:5px;border-radius:99px;background:rgba(255,255,255,.2)}

.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.keys button{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;height:58px;padding:0;font-size:26px;font-weight:500;
}
.hscroll{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap!important;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none;white-space:nowrap}
.sug-chip{background:rgba(255,255,255,.06);border:1px solid var(--b);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;flex:none;min-width:74px}
.sug-chip b{font-size:12.5px;font-weight:600;white-space:nowrap}
.sug-chip span{font-size:10.5px;color:var(--m)}
.sug-chip.on{background:#FFFFFF;border-color:#FFFFFF}
.sug-chip.on b,.sug-chip.on span{color:#000000}
.keys button:hover{background:rgba(255,255,255,.14)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  background:rgba(255,255,255,.055);border:1px solid var(--b);
  border-radius:99px;padding:8px 14px;font-size:12.5px;font-weight:500;color:var(--m);
}
.chip.on{background:#F5F5F7;color:#000000;border-color:#F5F5F7;font-weight:600}

.wd-pills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:6px}
.wd-pill{padding:7px 0;border-radius:9px;background:#000000;border:1px solid var(--b);color:var(--m);font-size:10.5px;font-weight:700;text-align:center}
.wd-pill.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.wd-pill.sw-on{background:rgba(50,215,75,.18);color:var(--ok);border-color:rgba(50,215,75,.45)}

.chk-box{
  width:17px;height:17px;border-radius:5px;
  border:1.5px solid var(--bh);
  background:transparent;
  display:inline-flex;align-items:center;justify-content:center;
  flex:none;color:#000000;
}
.chk-box.on{background:#FFFFFF;border-color:#FFFFFF}

.toast{
  position:fixed;left:14px;right:14px;
  top:var(--top-gap);
  max-width:420px;margin:0 auto;
  background:rgba(30,30,36,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;padding:10px 12px 10px 15px;z-index:50;
  display:none;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.75);font-size:13px;
}
.toast.on{display:flex;animation:dropDown .24s cubic-bezier(.16,1,.3,1)}
@keyframes dropDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}

.msg{
  position:relative;overflow:hidden;
  background:var(--s2);border:1px solid rgba(255,255,255,.14);

    pieces.forEach(p => {
      p.vy += 0.32;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (dt > 1700) p.alpha = Math.max(0, 1 - (dt - 1700) / 700);
      if (p.alpha > 0 && p.y < H + 30) {
        alive++;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
    });
    if (alive > 0 && dt < 2500) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  }
  requestAnimationFrame(frame);
}

function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.68));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function migrate(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;
  const out = Object.assign({}, base, raw);

  if (raw.cap != null && !raw.liq0) out.liq0 = parseNum(raw.cap);
  if (raw.payday != null && !raw.payDay) out.payDay = parseNum(raw.payday) || 1;
  if (raw.sw && !Array.isArray(raw.offDays)) out.offDays = Object.keys(raw.sw).filter(k => raw.sw[k]);
  if ((raw.binKey || raw.binId) && (!raw.cloud || !raw.cloud.key)) {
    out.cloud = { key: raw.binKey || '', bin: raw.binId || '', lastSync: 0 };
  }

  out.schemaVer = base.schemaVer;
  out.updatedAt = +out.updatedAt || 0;
  out.sal = parseNum(out.sal);
  out.bud = parseNum(out.bud);
  out.payDay = Math.min(31, Math.max(1, Math.round(parseNum(out.payDay)) || 1));
  out.liq0 = parseNum(out.liq0);
  out.workStart = typeof out.workStart === 'string' && out.workStart.includes(':') ? out.workStart : '09:00';
  out.workEnd = typeof out.workEnd === 'string' && out.workEnd.includes(':') ? out.workEnd : '18:00';
  out.commuteMins = Math.max(0, Math.round(parseNum(out.commuteMins)));
  out.homeLabel = (out.homeLabel || 'Casa').trim();
  out.workLabel = (out.workLabel || 'Sede').trim();
  out.homeHist = Boolean(out.homeHist);
  out.haptics = out.haptics !== false;
  out.priv = Boolean(out.priv);
  out.vacMode = Boolean(out.vacMode);
  out.vacBud = Math.max(0, parseNum(out.vacBud));
  out.vacStart = typeof out.vacStart === 'string' ? out.vacStart : '';
  out.lastBackupAt = +out.lastBackupAt || 0;

  if (!Array.isArray(out.workDays)) out.workDays = [1, 2, 3, 4, 5];
  ['ex', 'ev', 'notes', 'inc', 'rec', 'debts', 'offDays', 'swDays', 'inOfficeDays', 'vacDays', 'celebratedCycles', 'customCats'].forEach(k => {
    if (!Array.isArray(out[k])) out[k] = [];
  });
  out.swDays = out.swDays.filter(d => out.workDays.includes(d));
  out.cloud = Object.assign({ key: '', bin: '', lastSync: 0 }, out.cloud || {});
  out.nf = Object.assign({}, base.nf, out.nf || {});
  out.nf.types = Object.assign({}, base.nf.types, out.nf.types || {});
  out.nf.sent = out.nf.sent && typeof out.nf.sent === 'object' ? out.nf.sent : {};
  out.nf.sysd = out.nf.sysd && typeof out.nf.sysd === 'object' ? out.nf.sysd : {};
  out.nf.ntfyTopic = typeof out.nf.ntfyTopic === 'string' ? out.nf.ntfyTopic : '';
  out.nf.ntfyOn = Boolean(out.nf.ntfyOn);
  out.nf.autoCalShortcut = Boolean(out.nf.autoCalShortcut);

  delete out.cap;
  delete out.sw;
  return out;
}

function setFerieRange(fromDs, toDs, clear = false) {
  if (!fromDs || !toDs) return 0;
  const start = fromDs <= toDs ? fromDs : toDs;
  const end = fromDs <= toDs ? toDs : fromDs;
  if (!Array.isArray(S.vacDays)) S.vacDays = [];
  if (!Array.isArray(S.offDays)) S.offDays = [];
  if (!Array.isArray(S.inOfficeDays)) S.inOfficeDays = [];
  let count = 0;
  for (let d = new Date(start + 'T12:00'); iso(d) <= end; d.setDate(d.getDate() + 1)) {
    const ds = iso(d);
    if (!isScheduledWorkday(ds)) continue;
    count++;
    if (clear) {
      S.vacDays = S.vacDays.filter(x => x !== ds);
    } else {
      if (!S.vacDays.includes(ds)) S.vacDays.push(ds);
      S.offDays = S.offDays.filter(x => x !== ds);
      S.inOfficeDays = S.inOfficeDays.filter(x => x !== ds);
    }
  }
  S.vacDays.sort();
  save();
  return count;
}

function getFerieRanges() {
  const days = [...new Set((S.vacDays || []).filter(isScheduledWorkday))].sort();
  if (!days.length) return [];
  const ranges = [];
  let start = days[0], prev = days[0], count = 1;
  for (let i = 1; i < days.length; i++) {
    const cur = days[i];
    let gapHasWorkday = false;
    for (let d = new Date(prev + 'T12:00'); ;) {
      d.setDate(d.getDate() + 1);
      const x = iso(d);
      if (x >= cur) break;
      if (isScheduledWorkday(x)) { gapHasWorkday = true; break; }
    }
    if (!gapHasWorkday) {
      prev = cur;
      count++;
    } else {
      ranges.push({ start, end: prev, count });
      start = prev = cur;
      count = 1;
    }
  }
  ranges.push({ start, end: prev, count });
  return ranges;
}

function kbSetMode(m) {

function kbShowPop(keyEl, vars) {
  const pop = $('#kb-pop');
  if (!pop) return;
  pop.innerHTML = vars.map(v => `<span>${esc(v)}</span>`).join('');
  pop.classList.add('on');
  const r = keyEl.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.max(4, Math.min(window.innerWidth - pw - 4, r.left - 4));
  pop.style.left = left + 'px';
  pop.style.top = (r.top - ph - 6) + 'px';
}
function kbHidePop() {
  const pop = $('#kb-pop');
  if (pop) { pop.classList.remove('on'); pop.innerHTML = ''; }
}
function kbHlPop(st) {
  const spans = Array.from(document.querySelectorAll('#kb-pop span'));
  if (!spans.length) return;
  let best = 0, bd = Infinity;
  spans.forEach((s, i) => {
    const r = s.getBoundingClientRect();
    const d = Math.abs(st.x - (r.left + r.width / 2));
    if (d < bd) { bd = d; best = i; }
  });
  spans.forEach((s, i) => s.classList.toggle('hl', i === best));
  if (st.hl !== best) hapTick();
  st.hl = best;
}

const kbPtr = new Map();
(function kbBindKeys() {
  const box = $('#app-kb');
  if (!box) return;

  box.addEventListener('pointerdown', e => {
    const key = e.target.closest ? e.target.closest('.kb-key[data-k]') : null;
    if (!key) return;
    e.preventDefault();
    const st = { key, x: e.clientX, popped: false, hl: 0, vars: null, timer: null };
    key.classList.add('pr');
    const vars = kbMode === 'alpha' ? KB_ACC[key.dataset.base] : null;
    if (vars) {
      st.timer = setTimeout(() => {
        st.popped = true;
        st.vars = kbShift ? vars.map(v => v.toUpperCase()) : vars;
        key.classList.remove('pr');
        kbShowPop(key, st.vars);
        st.hl = -1;
        kbHlPop(st);
      }, 380);
    }
    kbPtr.set(e.pointerId, st);
  });

  box.addEventListener('pointermove', e => {
    const st = kbPtr.get(e.pointerId);
    if (!st) return;
    st.x = e.clientX;
    if (st.popped) kbHlPop(st);
  });

  const end = (e, cancel) => {
    const st = kbPtr.get(e.pointerId);
    if (!st) return;
    kbPtr.delete(e.pointerId);
    clearTimeout(st.timer);
    st.key.classList.remove('pr');
    if (st.popped) {
      const ch = st.vars[st.hl];
      kbHidePop();
      if (!cancel && ch) kbPress(ch);
      return;
    }
    if (cancel) return;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const k2 = under && under.closest ? under.closest('.kb-key[data-k]') : null;
    if (k2) kbPress(k2.dataset.k);
  };
  box.addEventListener('pointerup', e => end(e, false));
  box.addEventListener('pointercancel', e => end(e, true));
})();

function kbOpen(el) {
  if (!el) return;
  if (kbTarget && kbTarget !== el) {
    const prevEl = kbTarget;
    kbTarget = null;
    prevEl.classList.remove('kb-active');
    kbCommitValue(prevEl);
  }
  kbTarget = el;
  el.readOnly = true;
  el.classList.add('kb-active');
  kbMode = isNumericInput(el) ? 'num' : 'alpha';
  kbShift = !(el.value && el.value.trim().length > 0);
  document.body.classList.add('kb-open');
  const box = $('#app-kb');
  if (box) {
    box.classList.add('on');
    box.setAttribute('aria-hidden', 'false');
    kbRender();
  }
  setTimeout(() => {
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
  }, 60);
}

function kbCommitValue(el) {
  if (!el) return;
  try {
    el.dispatchEvent(new Event('change', { bubbles: true }));
  } catch (e) {}
}

function kbClose() {
  kbStopDel();
  kbHidePop();
  const el = kbTarget;
  kbTarget = null;
  if (el) {
    el.classList.remove('kb-active');
    kbCommitValue(el);
  }
  document.body.classList.remove('kb-open');
  const box = $('#app-kb');
  if (box) {
    box.classList.remove('on');

}

function kbPress(ch) {
  if (!kbTarget) return;
  hapTick();
  const el = kbTarget;
  let val = el.value || '';

  if (kbMode === 'num') {
    if (ch === ',' || ch === '.') {
      if (val.includes('.') || val.includes(',')) return;
      val = (val || '0') + ',';
    } else {
      val += ch;
    }
  } else {
    if (ch === ' ' && val.endsWith(' ') && /[^\s.,;:!?]\s$/.test(val)) {
      val = val.slice(0, -1) + '. ';
      kbShift = true;
      kbRender();
    } else if (ch === '.' && val.endsWith(' ')) {
      val = val.slice(0, -1) + '. ';
      kbShift = true;
    } else {
      val += ch;
      if (kbShift && /[A-ZÀÈÉÌÒÙ]/.test(ch)) {
        kbShift = false;
        kbRender();
      } else if (ch === '.' || ch === '!' || ch === '?' || ch === '\n') {
        kbShift = true;
        kbRender();
      }
    }
  }

  el.value = val;
  kbUpdatePreview();
  try { el.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {}
}

function kbBackspace() {
  if (!kbTarget) return;

    kbRender();

}

function kbToggleShift() {

function kbToggleMode() {

function undoFerieDrag() {

    if (bar) bar.classList.remove('on');

  const b = calDrag.startDs <= calDrag.currDs ? calDrag.currDs : calDrag.startDs;
  let workCnt = 0;
  for (let d = new Date(a + 'T12:00'); iso(d) <= b; d.setDate(d.getDate() + 1)) {

function finishCalDrag() {

  const cnt = setFerieRange(startDs, currDs, mode === 'clear');

function lpClear() {
  clearTimeout(lpTimer); clearTimeout(lpArmTimer);
  lpTimer = null; lpArmTimer = null;
  if (lpEl) { lpEl.classList.remove('lp-arm'); lpEl = null; }
}
function lpCancel() { if (lpTimer || lpArmTimer) lpClear(); }

function lpStart(fn, calDs = null) {
  const ev = window.event;
  lpClear();
  clearTimeout(lpResetTimer);
  lpTriggered = false;
  lpX = lpY = NaN;
  if (ev) {
    if (ev.isPrimary === false) return;
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    if (ev.target && ev.target.closest && ev.target.closest('.x,.eye-inline,input,textarea,select')) return;
    lpX = ev.clientX; lpY = ev.clientY;
    lpEl = ev.currentTarget && ev.currentTarget.classList ? ev.currentTarget : null;

  const el = lpEl;
  lpArmTimer = setTimeout(() => { lpArmTimer = null; if (el) el.classList.add('lp-arm'); }, LP_ARM);
  lpTimer = setTimeout(() => {
    lpTimer = null;
    if (el) el.classList.remove('lp-arm');
    lpEl = null;
    if (calDs) {
      calDrag.armed = true;
      calDrag.moved = false;
      calDrag.startDs = calDs;

      document.body.style.overflow = 'hidden';

document.addEventListener('pointermove', e => {

/* Navigazione swipe tra pagine + gesto back iOS da sinistra a destra */
let navAnimDir = '';
const pageSwipe = { active: false, sx: 0, sy: 0, st: 0, inRow: false, edgeReady: false };

document.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  if ($('#sh')?.classList.contains('on') || $('#tp')?.classList.contains('on') || kbTarget || calDrag.armed) return;
  if (e.target.closest('#an-svg, .hscroll, input, textarea, select')) return;
  const t = e.touches[0];
  pageSwipe.active = true;
  pageSwipe.sx = t.clientX;
  pageSwipe.sy = t.clientY;
  pageSwipe.st = Date.now();
  pageSwipe.inRow = Boolean(e.target.closest('.li, .li-card')?.querySelector('.x'));
  pageSwipe.edgeReady = false;
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!pageSwipe.active || calDrag.armed) return;
  const t = e.touches[0];
  const dx = t.clientX - pageSwipe.sx;
  const dy = t.clientY - pageSwipe.sy;
  const isSubPage = tab === 'set' || tab === 'subs';
  const eb = $('#edge-back');
  if (eb && isSubPage && pageSwipe.sx <= 60 && dx > 10 && Math.abs(dx) > Math.abs(dy) * 1.2) {
    const pull = Math.min(44, Math.round(dx * 0.55));
    eb.style.opacity = String(Math.min(1, dx / 65));
    eb.style.transform = `translate3d(${pull - 44}px,-50%,0)`;
    const ready = dx >= 68;
    if (ready && !pageSwipe.edgeReady) hapTick();
    pageSwipe.edgeReady = ready;
    eb.classList.toggle('ready', ready);
  }
}, { passive: true });

document.addEventListener('touchend', e => {
  const eb = $('#edge-back');
  if (eb) {
    eb.style.opacity = '0';
    eb.style.transform = 'translate3d(-44px,-50%,0)';
    eb.classList.remove('ready');
  }
  if (!pageSwipe.active) return;
  pageSwipe.active = false;
  if (calDrag.armed || $('#sh')?.classList.contains('on') || $('#tp')?.classList.contains('on') || kbTarget) return;

  const t = e.changedTouches[0];
  const dx = t.clientX - pageSwipe.sx;
  const dy = t.clientY - pageSwipe.sy;
  const dt = Date.now() - pageSwipe.st;
  const horiz = (Math.abs(dx) > 58 && Math.abs(dx) > Math.abs(dy) * 1.35) ||
                (Math.abs(dx) > 40 && dt < 260 && Math.abs(dx) > Math.abs(dy) * 1.5);
  if (!horiz) return;

  // Pagine secondarie (Sistema / Abbonamenti): slide da sinistra verso destra per tornare indietro
  if (tab === 'set' || tab === 'subs') {
    if (dx > 0) {
      hapTick();
      navAnimDir = 'prev';
      tab = 'home';
      R();
      scrollTo(0, 0);
    }
    return;
  }

  // Schede principali: slide destra/sinistra tra Home, Agenda, Note, Dati
  const order = TABS.map(x => x[0]);
  const idx = order.indexOf(tab);
  if (idx < 0) return;

  if (dx < 0) {
    if (pageSwipe.inRow) return;
    if (idx < order.length - 1) {
      hapTick();
      navAnimDir = 'next';
      tab = order[idx + 1];
      R();
      scrollTo(0, 0);
    }
  } else if (dx > 0) {
    if (idx > 0) {
      hapTick();
      navAnimDir = 'prev';
      tab = order[idx - 1];
      R();
      scrollTo(0, 0);
    }
  }
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!lpTimer) return;
  const t = e.touches && e.touches[0];

/* ==========================================================================
   7. CALCOLI FINANZIARI, RICORRENZE E ANALYTICS
   ========================================================================== */
function getCycleRange(offset = 0) {
  const pd = Math.min(31, Math.max(1, +S.payDay || 1));
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  const dimCurr = new Date(y, m + 1, 0).getDate();
  const effCurr = Math.min(pd, dimCurr);
  if (now.getDate() < effCurr) {
    m -= 1;
    if (m < 0) { m = 11; y -= 1; }
  }
  const startDate = new Date(y, m + offset, 1);
  const sy = startDate.getFullYear(), sm = startDate.getMonth();
  const sDim = new Date(sy, sm + 1, 0).getDate();
  const start = new Date(sy, sm, Math.min(pd, sDim));

  const nextMonth = new Date(sy, sm + 1, 1);
  const ny = nextMonth.getFullYear(), nm = nextMonth.getMonth();
  const nDim = new Date(ny, nm + 1, 0).getDate();
  const nextStart = new Date(ny, nm, Math.min(pd, nDim));
  const end = new Date(nextStart.getTime() - 86400000);

  const startStr = iso(start);
  const endStr = iso(end);
  const totalDays = Math.round((end - start) / 86400000) + 1;
  const label = pd === 1
    ? `${MESI[sm].slice(0, 3)} ${sy}`
    : `${start.getDate()} ${MESI[sm].slice(0, 3)} – ${end.getDate()} ${MESI[nm].slice(0, 3)}`;

  return { startStr, endStr, totalDays, label };
}

function getCycleForDate(ds) {
  const pd = Math.min(31, Math.max(1, +S.payDay || 1));
  const ref = new Date(ds + 'T12:00');
  let y = ref.getFullYear(), m = ref.getMonth();
  const dimCurr = new Date(y, m + 1, 0).getDate();
  if (ref.getDate() < Math.min(pd, dimCurr)) {
    m -= 1;
    if (m < 0) { m = 11; y -= 1; }
  }
  const sDim = new Date(y, m + 1, 0).getDate();
  const start = new Date(y, m, Math.min(pd, sDim));
  const nextM = new Date(y, m + 1, 1);
  const nDim = new Date(nextM.getFullYear(), nextM.getMonth() + 1, 0).getDate();
  const nextStart = new Date(nextM.getFullYear(), nextM.getMonth(), Math.min(pd, nDim));
  const end = new Date(nextStart.getTime() - 86400000);
  return {
    startStr: iso(start),
    endStr: iso(end),
    totalDays: Math.round((end - start) / 86400000) + 1
  };
}

function liq() {
  const totalIn = S.inc.reduce((s, i) => s + parseNum(i.a), 0);
  const totalOut = S.ex.reduce((s, e) => s + parseNum(e.a), 0);
  return Math.round((parseNum(S.liq0) + totalIn - totalOut) * 100) / 100;
}

const monIdx = ym => { const [y, m] = String(ym).split('-').map(Number); return y * 12 + m - 1; };
function recDue(r, ym) {
  const i = monIdx(ym) - monIdx(r.st || ym);
  if (i < 0) return false;
  const ev = +r.every || 1;
  if (i % ev) return false;
  if (r.months > 0 && i / ev >= r.months) return false;
  return true;
}
function recMonthly(r) {
  const share = r.splitN > 1 ? parseNum(r.a) / r.splitN : parseNum(r.a);
  return share / (+r.every || 1);
}
function recStats(r) {
  const ev = +r.every || 1, t = today(), cur = t.slice(0, 7);
  let elapsed = 0;
  if (r.months > 0) {
    const last = monIdx(r.st) + (r.months - 1) * ev;
    for (let i = monIdx(r.st); i <= Math.min(last, monIdx(cur)); i += ev) {
      const y = Math.floor(i / 12), m = i % 12 + 1, dd = Math.min(+r.day || 1, new Date(y, m, 0).getDate());
      if (y + '-' + pad(m) + '-' + pad(dd) <= t) elapsed++;
    }
  }
  const tot = r.fin ? (+r.tot || r.months) : 0;
  const done = r.fin ? Math.min(tot, (+r.paid0 || 0) + elapsed) : 0;
  const rem = r.fin ? Math.max(0, tot - done) : 0;
  let next = null;
  for (let k = 0; k < 26 && !next; k++) {
    const idx = monIdx(cur) + k, y = Math.floor(idx / 12), m = idx % 12 + 1, ym = y + '-' + pad(m);
    if (!recDue(r, ym)) continue;
    const ds = ym + '-' + pad(Math.min(+r.day || 1, new Date(y, m, 0).getDate()));
    if (ds > t) next = ds;
  }
  return { tot, done, rem, next, finished: r.fin && rem <= 0 };
}
function fmtDay(ds) { const d = new Date(ds + 'T12:00'); return d.getDate() + ' ' + MESI[d.getMonth()].slice(0, 3).toLowerCase(); }
function fmtIdx(i) { return MESI[i % 12].slice(0, 3).toLowerCase() + ' ' + Math.floor(i / 12); }

function getUpcomingRecurringInCycle(cyc, t) {
  let upcoming = 0;
  for (let d = new Date(t + 'T12:00'); iso(d) <= cyc.endStr; d.setDate(d.getDate() + 1)) {
    const ds = iso(d);
    if (ds <= t) continue;
    const ym = ds.slice(0, 7);
    const y = d.getFullYear(), m = d.getMonth() + 1;
    const dim = new Date(y, m, 0).getDate();
    S.rec.forEach(r => {
      if (!recDue(r, ym)) return;
      if ((r.sk || []).includes(ym)) return;
      const effDay = Math.min(+r.day || 1, dim);
      if (d.getDate() === effDay && !S.ex.some(e => e.rid === r.id && e.d.startsWith(ym))) {
        const myShare = r.splitN > 1 ? parseNum(r.a) / r.splitN : parseNum(r.a);
        upcoming += myShare;
      }
    });
  }
  return Math.round(upcoming * 100) / 100;
}

function stats(offset = 0) {
  const cyc = getCycleRange(offset);
  const t = today();
  const exList = S.ex.filter(e => !e.vac && e.d >= cyc.startStr && e.d <= cyc.endStr);
  const incList = S.inc.filter(i => i.d >= cyc.startStr && i.d <= cyc.endStr);
  const spent = Math.round(exList.reduce((s, e) => s + parseNum(e.a), 0) * 100) / 100;
  const fixedSpent = Math.round(exList.filter(e => e.rid).reduce((s, e) => s + parseNum(e.a), 0) * 100) / 100;
  const varSpent = Math.round((spent - fixedSpent) * 100) / 100;
  const earned = Math.round(incList.reduce((s, i) => s + parseNum(i.a), 0) * 100) / 100;
  const bud = parseNum(S.bud);
  const rem = Math.round((bud - spent) * 100) / 100;

  const sDate = new Date(cyc.startStr + 'T12:00');
  const eDate = new Date(cyc.endStr + 'T12:00');
  const tDate = new Date(t + 'T12:00');

  let elapsed = Math.floor((tDate - sDate) / 86400000) + 1;
  elapsed = Math.min(cyc.totalDays, Math.max(1, elapsed));
  let left = Math.floor((eDate - tDate) / 86400000) + 1;
  left = Math.min(cyc.totalDays, Math.max(1, left));

  const spentToday = Math.round(S.ex.filter(e => !e.vac && !e.rid && e.d === t).reduce((s, e) => s + parseNum(e.a), 0) * 100) / 100;
  const upcomingRec = offset === 0 ? getUpcomingRecurringInCycle(cyc, t) : 0;
  const spendableRem = Math.round((rem - upcomingRec) * 100) / 100;
  const idealPerDay = bud / cyc.totalDays;
  const safeToday = spendableRem <= 0 ? 0 : Math.round((spendableRem / left) * 100) / 100;

  const varBurnRate = varSpent / elapsed;
  const projSpentEnd = Math.round((fixedSpent + upcomingRec + varBurnRate * cyc.totalDays) * 100) / 100;
  const projLiqEnd = Math.round((liq() - Math.max(0, projSpentEnd - spent)) * 100) / 100;

  return {
    cyc, exList, incList, dim: cyc.totalDays, spent, fixedSpent, varSpent, earned,
    net: Math.round((earned - spent) * 100) / 100,
    rem, upcomingRec, spendableRem, left, day: elapsed, spentToday,
    daily: safeToday, per: idealPerDay,
    projSpentEnd, projLiqEnd, goal: parseNum(S.sal) - bud
  };
}

function vacStats() {
  const start = S.vacStart || today();
  const vacEx = S.ex.filter(e => e.vac && (!S.vacStart || e.d >= start));
  const spent = Math.round(vacEx.reduce((s, e) => s + parseNum(e.a), 0) * 100) / 100;
  const bud = parseNum(S.vacBud);
  const rem = Math.round((bud - spent) * 100) / 100;
  const spentToday = Math.round(vacEx.filter(e => e.d === today()).reduce((s, e) => s + parseNum(e.a), 0) * 100) / 100;
  const daysActive = Math.max(1, (S.vacDays || []).filter(d => !S.vacStart || d >= start).length);
  return { exList: vacEx, spent, bud, rem, spentToday, daysActive };
}

function getNetPosition() {
  const openDebts = (S.debts || []).filter(g => !g.p);
  const credits = openDebts.filter(g => g.dir === 'due').reduce((s, g) => s + parseNum(g.a), 0);
  const debts = openDebts.filter(g => g.dir === 'owe').reduce((s, g) => s + parseNum(g.a), 0);
  const cash = liq();
  return {
    cash,
    credits: Math.round(credits * 100) / 100,
    debts: Math.round(debts * 100) / 100,
    netWorth: Math.round((cash + credits - debts) * 100) / 100
  };
}

function checkCycleCelebration() {
  const prev = stats(-1);
  if (!prev.exList.length) return;
  const key = prev.cyc.startStr;
  if (!(S.celebratedCycles || []).includes(key) && prev.rem > 0) {
    S.celebratedCycles.push(key);
    save(true);
    setTimeout(() => {
      launchConfetti();
      toast(`Obiettivo ciclo centrato · Risparmiati ${eur(prev.rem)}`);
    }, 650);
  }
}

function catSumRange(startStr, endStr, varOnly = false) {
  const o = {};
  S.ex.filter(e => !e.vac && (!varOnly || !e.rid) && e.d >= startStr && e.d <= endStr)
    .forEach(e => o[e.c] = (o[e.c] || 0) + parseNum(e.a));
  return o;
}

function getSpendingAnomalies() {
  const s0 = stats(0);
  const s1 = stats(-1);
  if (s1.varSpent <= 0 || s0.day < 5) return [];
  const cats = getCats();
  const c0 = catSumRange(s0.cyc.startStr, today(), true);
  const c1 = catSumRange(s1.cyc.startStr, s1.cyc.endStr, true);
  const alerts = [];
  Object.keys(c0).forEach(k => {
    const paceNow = c0[k] / s0.day;
    const pacePrev = (c1[k] || 0) / s1.dim;
    if (pacePrev > 0.3 && paceNow > pacePrev * 1.32 && c0[k] >= 12) {
      const pct = Math.round(((paceNow - pacePrev) / pacePrev) * 100);
      alerts.push({ cat: cats[k]?.[0] || k, pct, proj: Math.round(paceNow * s0.dim * 100) / 100 });
    }
  });
  return alerts.slice(0, 2);
}

function getAnalyticsPoints(metric, range, offset) {
  const t = today();
  if (range === '6M') {
    const pts = [];
    for (let k = -5; k <= 0; k++) {
      const st = stats(offset + k);
      const val = metric === 'exp'
        ? st.spent
        : metric === 'sav'
        ? Math.max(0, st.rem)
        : (parseNum(S.liq0) + S.inc.filter(i => i.d <= st.cyc.endStr).reduce((a, b) => a + parseNum(b.a), 0) - S.ex.filter(e => e.d <= st.cyc.endStr).reduce((a, b) => a + parseNum(b.a), 0));
      pts.push({ label: st.cyc.label, short: st.cyc.label.split(' ')[0], v: val });
    }
    return pts;
  }

  let dates = [];
  if (range === '14G') {
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      dates.push(iso(d));
    }
  } else {
    const cyc = getCycleRange(offset);
    for (let d = new Date(cyc.startStr + 'T12:00'); iso(d) <= cyc.endStr; d.setDate(d.getDate() + 1)) {
      const ds = iso(d);
      if (offset === 0 && ds > t) break;
      dates.push(ds);
    }
    if (!dates.length) dates = [cyc.startStr];
  }

  return dates.map(ds => {
    const parts = ds.split('-');
    const short = `${parts[2]}/${parts[1]}`;
    let v = 0, ideal = null;
    if (metric === 'liq') {
      v = parseNum(S.liq0) + S.inc.filter(i => i.d <= ds).reduce((s, i) => s + parseNum(i.a), 0) - S.ex.filter(e => e.d <= ds).reduce((s, e) => s + parseNum(e.a), 0);
    } else if (metric === 'exp') {
      v = S.ex.filter(e => !e.vac && e.d === ds).reduce((s, e) => s + parseNum(e.a), 0);
    } else {
      const cyc = range === '14G' ? getCycleForDate(ds) : getCycleRange(offset);
      const spentSoFar = S.ex.filter(e => !e.vac && e.d >= cyc.startStr && e.d <= ds).reduce((s, e) => s + parseNum(e.a), 0);
      v = Math.max(0, parseNum(S.bud) - spentSoFar);
      const dayIdx = Math.max(1, Math.round((new Date(ds + 'T12:00') - new Date(cyc.startStr + 'T12:00')) / 86400000) + 1);
      ideal = Math.max(0, parseNum(S.bud) - (parseNum(S.bud) / cyc.totalDays) * dayIdx);
    }
    return { label: short, short, v, ideal };
  });
}

function delEx(id) {
  const e = S.ex.find(x => x.id === id);
  if (e && e.rid) {
    const r = S.rec.find(x => x.id === e.rid);
    if (r) { r.sk = r.sk || []; r.sk.push(e.d.slice(0, 7)); }
  }
  if (e && e.rec) DB.del(e.id);
  S.ex = S.ex.filter(x => x.id !== id);
  save();
  $('#to').classList.remove('on');
  R();
}

function applyRec() {
  const n = new Date();
  let ch = 0;
  S.rec.forEach(r => {
    let [y, m] = r.st.split('-').map(Number);
    while (y < n.getFullYear() || (y === n.getFullYear() && m <= n.getMonth() + 1)) {
      const k = y + '-' + pad(m),
            dd = Math.min(r.day, new Date(y, m, 0).getDate()),
            ds = k + '-' + pad(dd);
      if (recDue(r, k) && ds <= today() && !S.ex.some(e => e.rid === r.id && e.d.startsWith(k)) && !(r.sk || []).includes(k)) {
        const splitN = Math.max(1, +r.splitN || 1);
        const totalAmt = Math.round(parseNum(r.a) * 100) / 100;
        if (splitN > 1) {
          const share = Math.round((totalAmt / splitN) * 100) / 100;
          const credit = Math.round((totalAmt - share) * 100) / 100;
          const who = cap((r.splitWho || 'Amici').trim());
          S.ex.push({ id: uid(), rid: r.id, d: ds, c: r.c, a: share, n: `${r.n} (1/${splitN})` });
          if (credit > 0) {
            S.debts.push({ id: uid(), who, a: credit, dir: 'due', d: ds });
          }
        } else {
          S.ex.push({ id: uid(), rid: r.id, d: ds, c: r.c, a: totalAmt, n: r.n });
        }
        ch = 1;
      }
      m++;
      if (m > 12) { m = 1; y++; }
    }
  });
  if (ch) save();
}

/* ==========================================================================
   9. AGENDA, SMART WORKING, VACANZA, CONTO ALLA ROVESCIA & CALENDARIO APPLE
   ========================================================================== */
function evOn(ds) {
  const w = new Date(ds + 'T12:00').getDay();
  return S.ev.filter(e => {
    if (e.d === ds) return true;
    if (e.d > ds) return false;
    if (e.end && ds > e.end) return false;
    if (!e.r) return false;
    if (e.r === 'd') return true;
    if (e.r === 'w') return new Date(e.d + 'T12:00').getDay() === w;
    if (e.r === 'm') return new Date(e.d + 'T12:00').getDate() === new Date(ds + 'T12:00').getDate();
    if (e.r.startsWith('i')) {
      const step = Math.max(1, parseInt(e.r.slice(1), 10) || 1);
      const diff = Math.round((new Date(ds + 'T12:00') - new Date(e.d + 'T12:00')) / 86400000);
      return diff % step === 0;
    }
    return false;
  }).sort((a, b) => a.tm.localeCompare(b.tm));
}

function getLiveAgendaStatus() {
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const ev = evOn(today());

  for (const e of ev) {
    const [eh, em] = (e.tm || '09:00').split(':').map(Number);
    const startMins = eh * 60 + em;
    const endMins = startMins + Math.round((parseNum(e.dur) || 1) * 60);
    if (nowMins >= startMins && nowMins < endMins) {
      return { text: `In corso · ${e.t}`, cls: 'ok' };
    }
    const diff = startMins - nowMins;
    if (diff > 0 && diff <= 240) {
      const lbl = diff < 60 ? `Tra ${diff} min` : `Tra ${Math.floor(diff / 60)}h ${diff % 60 ? (diff % 60) + 'm' : ''}`.trim();
      return { text: `${lbl} · ${e.t}`, cls: diff <= 45 ? 'w' : '' };
    }
  }

  if (wk(today())) {
    const [wh, wm] = (S.workEnd || '18:00').split(':').map(Number);
    const endWorkMins = wh * 60 + wm;
    const homeMins = endWorkMins + (+S.commuteMins || 0);
    if (nowMins >= endWorkMins - 45 && nowMins < homeMins) {
      const arrH = Math.floor(homeMins / 60) % 24;
      const arrM = homeMins % 60;
      return { text: `Rientro ~${pad(arrH)}:${pad(arrM)}`, cls: '' };
    }
  }
  return null;
}

function toggleOffDay(ds, silent = false) {
  vib(20);
  if (!isScheduledWorkday(ds)) {
    if (!silent) toast('Giorno non lavorativo');
    return false;
  }
  if (isVacDay(ds)) {
    if (!silent) toast('Giorno segnato come Ferie');
    return false;
  }
  const currentlySw = isOffDay(ds);
  lastSwUndo = {
    ds,
    prevOffDays: [...(S.offDays || [])],
    prevInOfficeDays: [...(S.inOfficeDays || [])]
  };
  S.offDays = (S.offDays || []).filter(d => d !== ds);
  S.inOfficeDays = (S.inOfficeDays || []).filter(d => d !== ds);

  if (currentlySw) {
    if (isHabitualSwDay(ds)) S.inOfficeDays.push(ds);
    save();
    if (!silent) { toast(isHabitualSwDay(ds) ? 'In sede (eccezione oggi)' : 'In sede', 'undoSwAction()'); R(); }
    return false;
  } else {
    if (!isHabitualSwDay(ds)) S.offDays.push(ds);
    save();
    if (!silent) {
      toast('Smart working attivo', 'undoSwAction()');
      R();
    }
    return true;
  }
}

function undoSwAction() {
  if (!lastSwUndo) return;
  S.offDays = lastSwUndo.prevOffDays;
  S.inOfficeDays = lastSwUndo.prevInOfficeDays || [];
  lastSwUndo = null;
  save();
  $('#to').classList.remove('on');
  toast('Azione annullata');

}

function classifyActivityContext(rawTitle) {
  const t = rawTitle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (/colazion|cappuccin|cornett|brioche/.test(t)) return { kind: 'Colazione', defDur: 0.75, wkSlots: [7, 7.5, 8, 8.5, 9], weSlots: [8.5, 9, 9.5, 10] };
  if (/pranz|mensa|pausa pranzo/.test(t)) return { kind: 'Pranzo', defDur: 1.25, wkSlots: [12.5, 13, 13.5], weSlots: [12.5, 13, 13.5, 14] };
  if (/aperitiv|spritz|happy hour/.test(t)) return { kind: 'Aperitivo', defDur: 1.5, wkSlots: [18.5, 19, 19.5], weSlots: [18, 18.5, 19, 19.5] };
  if (/\bcen(a|are|etta)\b|ristorant|pizz|sushi|trattori|osteri|hamburger/.test(t)) return { kind: 'Cena', defDur: 2, wkSlots: [20, 20.5, 21, 19.5], weSlots: [20, 20.5, 21] };
  if (/allen|palestr|corsa|correr|nuot|calcett|padel|tennis|bici|sport|workout|yoga|pesi/.test(t)) return { kind: 'Allenamento', defDur: 1.5, wkSlots: [18.5, 19, 19.5, 7, 17.5], weSlots: [10, 10.5, 16, 17, 11] };
  if (/medic|dentist|dottor|visita|banc|post|comun|tagli|parrucchier|barbier|meccanic|gommist|commission/.test(t)) return { kind: 'Appuntamento', defDur: 1, wkSlots: [8.5, 13, 17.5, 18, 18.5], weSlots: [9.5, 10.5, 11.5, 16] };
  return { kind: 'Generico', defDur: 1, wkSlots: [18.5, 19, 20, 20.5, 8], weSlots: [10, 11, 15.5, 17, 18.5] };
}

function slots(dur, rawTitle = '', preferRange = null) {
  const out = [], now = new Date();
  const ctx = classifyActivityContext(rawTitle);
  const useDur = dur || ctx.defDur;
  const wStart = hh(S.workStart || '09:00');
  const wEnd = hh(S.workEnd || '18:00');
  const commH = (S.commuteMins || 0) / 60;
  const nowH = now.getHours() + now.getMinutes() / 60;

  const startOffset = preferRange === 'next_week' ? 7 : 0;
  const maxDays = preferRange === 'this_week' ? 7 : 14;

  for (let i = startOffset; i < startOffset + maxDays && out.length < 4; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const ds = iso(d);
    const isWkDay = wk(ds);
    const bz = evOn(ds).map(e => [hh(e.tm), hh(e.tm) + (parseNum(e.dur) || 1)]);

    if (isWkDay) {
      bz.push([Math.max(0, wStart - commH), Math.min(24, wEnd + commH)]);
    }

    let candidates = isWkDay ? [...ctx.wkSlots] : [...ctx.weSlots];
    if (preferRange === 'morning') candidates = candidates.filter(h => h < 12.5);
    if (preferRange === 'afternoon') candidates = candidates.filter(h => h >= 12.5 && h < 18.5);
    if (preferRange === 'evening') candidates = candidates.filter(h => h >= 18.5);
    if (!candidates.length) candidates = isWkDay ? [18.5, 19.5, 20.5] : [10.5, 15.5, 18.5, 20.5];

    const h = candidates.find(hr =>
      (i > 0 || hr > nowH + 0.25) &&
      hr + useDur <= 23.5 &&
      bz.every(([s, e]) => hr + useDur <= s || hr >= e)
    );
    if (h != null) {
      const reason = !isWkDay ? 'giornata libera' : h >= wEnd + commH ? 'dopo il rientro' : h + useDur <= wStart - commH ? 'prima del lavoro' : 'pausa';
      out.push({ ds, h, dur: useDur, reason, kind: ctx.kind });
    }
  }
  return out;
}

function sendToAppleCalendarShortcut(title, dateStr, timeStr, durHours = 1) {
  const cleanTitle = (title || 'Impegno').replace(/\|/g, '-');
  const [hhStr, mmStr] = (timeStr || '09:00').split(':');
  const startDt = new Date(`${dateStr}T${pad(+hhStr || 9)}:${pad(+mmStr || 0)}:00`);
  const endDt = new Date(startDt.getTime() + Math.round((parseNum(durHours) || 1) * 3600000));
  const toLocalIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
  const payload = `${cleanTitle}|${toLocalIso(startDt)}|${toLocalIso(endDt)}`;
  location.href = `shortcuts://run-shortcut?name=LeoCalendar&input=text&text=${encodeURIComponent(payload)}`;
}

    if (same >= 3 && !r && !S.ev.some(e => e.t.toLowerCase() === t.toLowerCase() && e.r)) {
      setTimeout(() => toast(`Rendere «${esc(t)}» settimanale?`, `mkW('${id}')`, 'Sì'), 2200);

}

function addNoteOrChecklist(title, itemsOrBody, isChecklist = false, silent = false) {
  const cleanTitle = cap((title || '').trim() || (isChecklist ? 'Lista' : 'Nota veloce'));
  if (isChecklist) {
    const rawItems = Array.isArray(itemsOrBody) ? itemsOrBody : String(itemsOrBody || '').split(/,|\be\b|\n/).map(x => x.trim()).filter(Boolean);
    const existing = S.notes.find(n => n.type === 'checklist' && n.title.toLowerCase() === cleanTitle.toLowerCase());
    if (existing) {
      rawItems.forEach(txt => existing.items.push({ id: uid(), txt: cap(txt), done: false }));
      existing.updatedAt = Date.now();
      save();
      if (!silent) { toast(`Aggiunte ${rawItems.length} voci a «${existing.title}»`); R(); }
      return existing;
    }
    const note = {
      id: uid(),
      type: 'checklist',
      title: cleanTitle,
      items: rawItems.map(txt => ({ id: uid(), txt: cap(txt), done: false })),
      updatedAt: Date.now()
    };
    S.notes.unshift(note);
    save();
    if (!silent) { toast(`Checklist «${cleanTitle}» creata`); R(); }
    return note;
  } else {
    const note = {
      id: uid(),
      type: 'note',
      title: cleanTitle,
      body: String(itemsOrBody || '').trim(),
      updatedAt: Date.now()
    };
    S.notes.unshift(note);
    save();
    if (!silent) { toast(`Nota «${cleanTitle}» salvata`); R(); }
    return note;
  }
}

function toggleChecklistItem(noteId, itemId) {
  vib(12);
  const n = S.notes.find(x => x.id === noteId);
  if (!n || !Array.isArray(n.items)) return;
  const it = n.items.find(x => x.id === itemId);
  if (it) {
    it.done = !it.done;
    n.updatedAt = Date.now();
    save();
    R();
  }
}

function resetChecklist(noteId) {
  vib(15);
  const n = S.notes.find(x => x.id === noteId);
  if (!n || !Array.isArray(n.items)) return;
  n.items.forEach(x => x.done = false);
  n.updatedAt = Date.now();
  save();
  toast(`Checklist «${n.title}» azzerata`);
  R();
}

function addChecklistItemInline(noteId, txt) {
  const clean = (txt || '').trim();
  if (!clean) return;
  const n = S.notes.find(x => x.id === noteId);
  if (!n || !Array.isArray(n.items)) return;
  n.items.push({ id: uid(), txt: cap(clean), done: false });
  n.updatedAt = Date.now();
  save();
  R();
}

function delNote(id) {

}

function buildLiqSparkline() {
  const pts = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = iso(d);
    const val = parseNum(S.liq0) + S.inc.filter(x => x.d <= ds).reduce((s, x) => s + parseNum(x.a), 0) - S.ex.filter(x => x.d <= ds).reduce((s, x) => s + parseNum(x.a), 0);
    pts.push(val);
  }
  const mn = Math.min(...pts), mx = Math.max(...pts);
  const span = Math.max(1, mx - mn);
  const coords = pts.map((v, i) => `${(i * (64 / 6)).toFixed(1)},${(20 - ((v - mn) / span) * 16).toFixed(1)}`).join(' ');
  const rising = pts[pts.length - 1] >= pts[0];
  const strokeCol = rising ? 'rgba(50,215,75,.75)' : 'rgba(255,255,255,.38)';
  return `<svg viewBox='0 0 64 22' width='64' height='22' style='flex:none;overflow:visible'><polyline fill='none' stroke='${strokeCol}' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' points='${coords}'/></svg>`;
}

function renderDataSearchResults(qRaw) {
  const q = (qRaw || '').trim().toLowerCase();
  if (!q) return `<div class='card m' style='text-align:center'>Digita un nome, una categoria, una data o un importo.</div>`;
  const cats = getCats();

  const matchedEx = S.ex.filter(e => {
    const catName = (cats[e.c]?.[0] || '').toLowerCase();
    const note = (e.n || '').toLowerCase();
    const amtComma = String(e.a).replace('.', ',');
    const amtDot = String(e.a);
    const dateIt = e.d.split('-').reverse().join('/');
    const vacTag = e.vac ? 'vacanza ferie' : '';
    return catName.includes(q) || note.includes(q) || amtComma.includes(q) || amtDot.includes(q) || dateIt.includes(q) || e.d.includes(q) || vacTag.includes(q);
  }).map(e => ({
    kind: 'ex',
    id: e.id,
    d: e.d,
    title: e.n || (cats[e.c]?.[0] || 'Altro'),
    sub: `${cats[e.c]?.[0] || 'Altro'} · ${e.d.split('-').reverse().join('/')}`,
    a: parseNum(e.a),
    vac: Boolean(e.vac),
    rec: Boolean(e.rec)
  }));

  const matchedInc = S.inc.filter(i => {
    const title = (i.t || 'Entrata').toLowerCase();
    const amtComma = String(i.a).replace('.', ',');
    const amtDot = String(i.a);
    const dateIt = i.d.split('-').reverse().join('/');
    return title.includes(q) || amtComma.includes(q) || amtDot.includes(q) || dateIt.includes(q) || i.d.includes(q) || 'entrata'.includes(q);
  }).map(i => ({
    kind: 'inc',
    id: i.id,
    d: i.d,
    title: i.t || 'Entrata',
    sub: `Entrata · ${i.d.split('-').reverse().join('/')}`,
    a: parseNum(i.a)
  }));

  const totOut = Math.round(matchedEx.reduce((s, x) => s + x.a, 0) * 100) / 100;
  const totIn = Math.round(matchedInc.reduce((s, x) => s + x.a, 0) * 100) / 100;
  const all = [...matchedEx, ...matchedInc].sort((a, b) => b.d.localeCompare(a.d));

  return `
    <div class='card' style='padding:12px 14px'>
      <div class='row sp'>
        <span class='badge'>${all.length} ${all.length === 1 ? 'risultato' : 'risultati'}</span>
        <div class='row' style='gap:10px;font-size:12px'>
          ${totOut > 0 ? `<span class='m'>Uscite <b class='money-val' style='color:var(--t)'>-${eur(totOut)}</b></span>` : ''}
          ${totIn > 0 ? `<span class='m'>Entrate <b class='ok money-val'>+${eur(totIn)}</b></span>` : ''}
        </div>
      </div>
    </div>
    ${all.length ? all.map(item => item.kind === 'ex'
      ? `<div class='li-card'>
          <div class='grow' style='cursor:pointer' onclick="openEd('${item.id}')">
            <div class='li-t'>${esc(item.title)}${item.vac ? ` <span class='badge vac'>VACANZA</span>` : ''}${item.rec ? ` <span class='badge'>Foto</span>` : ''}</div>
            <div class='m'>${item.sub}</div>
          </div>
          <div class='row' style='gap:8px'>
            <b class='money-val li-a'>- ${eur(item.a)}</b>
            <button class='x' aria-label='Elimina spesa' onclick="delEx('${item.id}')">✕</button>
          </div>
        </div>`
      : `<div class='li-card'>
          <div class='grow'>
            <div class='li-t'>${esc(item.title)}</div>
            <div class='m'>${item.sub}</div>
          </div>
          <div class='row' style='gap:8px'>
            <b class='ok money-val li-a'>+${eur(item.a)}</b>
            <button class='x' aria-label='Elimina entrata' onclick="delInc('${item.id}')">✕</button>
          </div>
        </div>`
    ).join('') : `<div class='card m' style='text-align:center'>Nessun movimento trovato per «${esc(qRaw)}».</div>`}`;
}

function money() {
  const s = stats(cycOff);
  const prevS = stats(cycOff - 1);
  const cats = getCats();
  const bc = catSumRange(s.cyc.startStr, s.cyc.endStr);
  const pbc = catSumRange(prevS.cyc.startStr, prevS.cyc.endStr);
  const tot = Object.values(bc).reduce((a, b) => a + b, 0);
  const ents = Object.entries(bc).sort((a, b) => b[1] - a[1]);
  const anomalies = getSpendingAnomalies();

  const pts = getAnalyticsPoints(anMetric, anRange, cycOff);
  const vals = pts.map(p => p.v);
  const minVal = vals.length ? Math.min(...vals) : 0;
  const maxVal = vals.length ? Math.max(...vals) : 0;
  const avgVal = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  const latestVal = vals.length ? vals[vals.length - 1] : 0;

  const span = Math.max(1, maxVal - minVal);
  const coords = pts.map((p, i) => {
    const x = pts.length === 1 ? 175 : 14 + (i * (322 / (pts.length - 1)));
    const y = 104 - ((p.v - minVal) / span) * 84;
    const iy = p.ideal != null ? 104 - ((Math.min(maxVal, Math.max(minVal, p.ideal)) - minVal) / span) * 84 : null;
    return { x, y, iy, v: p.v, label: p.label };
  });
  activeChartCoords = coords;
  const metricTitles = { liq: 'Patrimonio', exp: 'Spese', sav: 'Residuo budget' };
  activeChartMeta = { title: metricTitles[anMetric] };

  let svgChartHTML = '';
  if (anMetric === 'exp' && pts.length > 1) {
    const barMax = Math.max(maxVal, s.per * 1.35, 1);
    const idealBarY = 108 - ((s.per / barMax) * 90);
    const barW = Math.max(4, Math.min(18, (320 / pts.length) * 0.62));
    const barCoords = pts.map((p, i) => {
      const x = 16 + (i * (318 / (pts.length - 1)));
      const h = Math.max(2, (p.v / barMax) * 90);
      const y = 108 - h;

    activeChartCoords = barCoords;
    const lastBar = barCoords[barCoords.length - 1];
    svgChartHTML = `<svg id='an-svg' viewBox='0 0 350 122' width='100%' style='overflow:visible;touch-action:none;cursor:crosshair'

      ${barCoords.map(b => {

function chartScrub(ev) {
  const svg = $('#an-svg');
  if (!svg || !activeChartCoords.length) return;
  const rect = svg.getBoundingClientRect();
  const relX = ((ev.clientX - rect.left) / rect.width) * 350;
  let nearest = activeChartCoords[0];
  let best = Math.abs(relX - nearest.x);
  for (const p of activeChartCoords) {
    const d = Math.abs(relX - p.x);
    if (d < best) { best = d; nearest = p; }
  }
  const vline = $('#an-vline');
  const dot = $('#an-dot');
  if (vline) { vline.setAttribute('x1', nearest.x); vline.setAttribute('x2', nearest.x); vline.style.display = 'block'; }
  if (dot) { dot.setAttribute('cx', nearest.x); dot.setAttribute('cy', nearest.y); }
  const valEl = $('#an-curr-val');
  const lblEl = $('#an-curr-lbl');
  if (valEl) valEl.textContent = eur(nearest.v);
  if (lblEl) lblEl.textContent = `${activeChartMeta.title} · ${nearest.label}`;
}

function chartReset() {
  if (!activeChartCoords.length) return;
  const last = activeChartCoords[activeChartCoords.length - 1];
  const vline = $('#an-vline');
  const dot = $('#an-dot');
  if (vline) vline.style.display = 'none';
  if (dot) { dot.setAttribute('cx', last.x); dot.setAttribute('cy', last.y); }
  const valEl = $('#an-curr-val');
  const lblEl = $('#an-curr-lbl');
  if (valEl) valEl.textContent = eur(last.v);
  if (lblEl) lblEl.textContent = activeChartMeta.title;
}

function toggleWorkDay(dowIdx) {
  vib(14);
  const arr = Array.isArray(S.workDays) ? [...S.workDays] : [1, 2, 3, 4, 5];
  const pos = arr.indexOf(dowIdx);
  if (pos >= 0) {
    arr.splice(pos, 1);
    S.swDays = (S.swDays || []).filter(d => d !== dowIdx);
  } else {
    arr.push(dowIdx);
  }
  S.workDays = arr.sort((a, b) => a - b);
  save();
  R();
}

function toggleSwHabitDay(dowIdx) {
  vib(14);
  if (!(S.workDays || []).includes(dowIdx)) return;
  const arr = Array.isArray(S.swDays) ? [...S.swDays] : [];

let nps = null, eds = null, lastInc = null;

function spendSuggestions(byUse = false, limit = 6) {
  const now = new Date(), hr = now.getHours(), dow = now.getDay();
  const cats = getCats(), map = {};
  const exHour = e => {
    if (typeof e.h === 'number') return e.h;
    const ms = parseInt(String(e.id || '').slice(0, 8), 36);
    return (ms > 1.4e12 && ms < 4e12) ? new Date(ms).getHours() : null;
  };
  S.ex.forEach(e => {
    if (e.rid || e.vac || !(parseNum(e.a) > 0)) return;
    const label = (e.n || '').replace(/^\d+×\s*/, '').trim();
    const key = e.c + '|' + label.toLowerCase();
    const age = Math.max(0, (Date.now() - new Date(e.d + 'T12:00')) / 86400000);
    if (age > (byUse ? 240 : 120)) return;
    const w = byUse ? 1 / (1 + age / 90) : 1 / (1 + age / 30);
    const h = exHour(e);
    const hourMatch = !byUse && h != null && Math.abs(h - hr) <= 2 ? 2 : 0;
    const dayMatch = !byUse && new Date(e.d + 'T12:00').getDay() === dow ? 0.6 : 0;
    const m = map[key] || (map[key] = { c: e.c, n: label, score: 0, amts: {}, last: parseNum(e.a) });
    m.score += w * (1 + hourMatch + dayMatch);
    m.amts[parseNum(e.a)] = (m.amts[parseNum(e.a)] || 0) + 1;
    m.last = parseNum(e.a);
  });
  const out = Object.values(map).map(m => {
    const a = +Object.entries(m.amts).sort((x, y) => y[1] - x[1])[0][0];
    return { c: m.c, n: m.n || (cats[m.c] ? cats[m.c][0] : 'Spesa'), a, score: m.score };
  }).sort((x, y) => y.score - x.score).slice(0, limit);
  if (out.length < 4) {
    const defs = hr < 11 ? [['caffe', 'Caffè', 0.35], ['cibo', 'Colazione', 2.5], ['heets', 'Heets', 5.5]]
      : hr < 15 ? [['cibo', 'Pranzo', 10], ['caffe', 'Caffè', 0.35], ['heets', 'Heets', 5.5]]
      : [['caffe', 'Caffè', 0.35], ['heets', 'Heets', 5.5], ['cibo', 'Cena', 15]];
    defs.forEach(([c, n, a]) => {
      if (out.length < 4 && cats[c] && !out.some(o => o.n.toLowerCase() === n.toLowerCase())) out.push({ c, n, a, score: 0 });
    });
  }
  return out;
}

function incomeSuggestions(limit = 8) {
  const map = {};
  S.inc.forEach(i => {
    const amt = parseNum(i.a);
    if (!(amt > 0)) return;
    const label = (i.t || 'Entrata').trim();
    const key = label.toLowerCase();
    const age = Math.max(0, (Date.now() - new Date(i.d + 'T12:00')) / 86400000);
    if (age > 365) return;
    const w = 1 / (1 + age / 90);
    const m = map[key] || (map[key] = { n: label, score: 0, amts: {}, last: amt });
    m.score += w;
    m.amts[amt] = (m.amts[amt] || 0) + 1;
    m.last = amt;
  });

  const out = Object.values(map).map(m => {
    const a = +Object.entries(m.amts).sort((x, y) => y[1] - x[1])[0][0];
    const incType = IT.findIndex(x => x.toLowerCase() === m.n.toLowerCase());
    return { n: m.n, a, incType, score: m.score };
  }).sort((x, y) => y.score - x.score).slice(0, limit);

  const sal = parseNum(S.sal);
  const defs = [
    ...(sal > 0 ? [['Stipendio', sal, 0]] : []),
    ['Rimborso', 20, 2],
    ['Regalo', 50, 1],
    ['Altro', 10, 3]
  ];
  defs.forEach(([n, a, incType]) => {
    if (out.length < 4 && !out.some(o => o.n.toLowerCase() === n.toLowerCase())) {
      out.push({ n, a, incType, score: 0 });
    }
  });
  return out;
}

/* Pannello dedicato per impostare intervalli di Ferie sui soli giorni lavorativi */
function openFerieSheet() {
  const ranges = getFerieRanges();
  const defStart = sel >= today() ? sel : today();
  openSheet(`
    <div class='row sp'><b style='font-size:15px'>Imposta ferie</b><button class='x' onclick='closeNp()'>Chiudi</button></div>
    <div class='m' style='margin:6px 0 8px'>Segna solo i giorni lavorativi nell’intervallo scelto (i giorni non lavorativi restano vuoti, senza creare eventi in agenda).</div>
    <div class='g2'>
      <div><label style='margin-top:0'>Dal</label><input id='fe-from' type='date' value='${defStart}' onchange='updateFeriePreview()'></div>
      <div><label style='margin-top:0'>Al</label><input id='fe-to' type='date' value='${defStart}' onchange='updateFeriePreview()'></div>
    </div>
    <div id='fe-prev' class='m' style='margin-top:8px'></div>
    <button class='btn' style='width:100%;margin-top:10px' onclick='saveFerieRange()'>Salva ferie</button>
    ${ranges.length ? `<div style='margin-top:14px;padding-top:12px;border-top:1px solid var(--b)'>
      <span class='kicker' style='margin-bottom:6px'>Periodi di ferie salvati</span>
      ${ranges.map(rg => `<div class='li' style='padding:7px 0'>
        <div class='grow'>
          <b>${rg.start === rg.end ? fmtDay(rg.start) : `${fmtDay(rg.start)} – ${fmtDay(rg.end)}`}</b>
          <div class='m'>${rg.count} ${rg.count === 1 ? 'giorno lavorativo' : 'giorni lavorativi'}</div>
        </div>
        <button class='x' aria-label='Rimuovi ferie' onclick="setFerieRange('${rg.start}','${rg.end}',true);openFerieSheet();R()">✕</button>
      </div>`).join('')}
    </div>` : ''}
  `);
  updateFeriePreview();
}

function updateFeriePreview() {
  const f = $('#fe-from')?.value;
  const t = $('#fe-to')?.value;
  const el = $('#fe-prev');
  if (!f || !t || !el) return;
  const start = f <= t ? f : t;
  const end = f <= t ? t : f;
  let cnt = 0;
  for (let d = new Date(start + 'T12:00'); iso(d) <= end; d.setDate(d.getDate() + 1)) {
    if (isScheduledWorkday(iso(d))) cnt++;
  }
  el.innerHTML = cnt > 0
    ? `Verranno segnati <b style='color:var(--t)'>${cnt} ${cnt === 1 ? 'giorno lavorativo' : 'giorni lavorativi'}</b> come ferie.`
    : 'Nessun giorno lavorativo presente in questo intervallo.';
}

function saveFerieRange() {
  const f = $('#fe-from')?.value;
  const t = $('#fe-to')?.value;
  if (!f || !t) return toast('Seleziona le date');
  const cnt = setFerieRange(f, t, false);
  if (!cnt) return toast('Nessun giorno lavorativo in queste date');
  closeNp();
  toast(`${cnt} ${cnt === 1 ? 'giorno' : 'giorni'} di ferie salvati`);
  R();
}

function renderMonthGridHTML() {
  const y = cm.getFullYear(), m = cm.getMonth(), first = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate();
  let g = ['L', 'M', 'M', 'G', 'V', 'S', 'D'].map(x => '<b>' + x + '</b>').join('');
  for (let i = 0; i < first; i++) g += '<button class="e"></button>';
  for (let d = 1; d <= dim; d++) {
    const ds = y + '-' + pad(m + 1) + '-' + pad(d);
    const ne = evOn(ds).length;
    const ni = S.inc.some(i => i.d === ds);
    const st = getDayWorkStatus(ds);
    const stCls = st === 'ferie' ? 'ferie' : st === 'sw' ? 'off' : st === 'work' ? 'wkday' : '';
    g += `<button data-ds="${ds}" class="lp ${ds === today() ? 't ' : ''}${ds === sel ? 's ' : ''}${stCls}"
      onpointerdown="lpStart(null,'${ds}')"
      onpointerup="lpEnd()"
      onclick="lpTap(()=>{sel='${ds}';weekOff=Math.round((new Date('${ds}T12:00')-new Date(today()+'T12:00'))/(7*86400000));closeNp();R()})">${d}<i>${ne ? '<u></u>' : ''}${ni ? `<u style='background:${ds === sel ? '#000000' : 'var(--ok)'}'></u>` : ''}${st === 'ferie' ? '<u class="x4"></u>' : st === 'sw' ? '<u class="x3"></u>' : ''}</i></button>`;
  }
  return g;
}

function saveRecSheet() {
  if (kbTarget) kbClose();
  const n = $('#rn')?.value.trim();
  const a = parseNum($('#ra')?.value);
  if (!n || !(a > 0)) return toast('Inserisci nome e importo');
  const day = Math.min(31, Math.max(1, Math.round(parseNum($('#rd')?.value)) || 1));
  const c = $('#rc')?.value || 'altro';
  const splitN = Math.max(1, +($('#r-split')?.value || 1) || 1);
  const splitWho = cap(($('#r-who')?.value || 'Amici').trim());

  const now = new Date();
  let startYm = today().slice(0, 7);
  if (recStartMode === 'next') {
    const nm = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    startYm = `${nm.getFullYear()}-${pad(nm.getMonth() + 1)}`;
  }

  const rec = { id: uid(), n, a, day, c, splitN, splitWho, st: startYm, sk: [], every: 1, months: 0 };
  if (recType === 'fin') {
    const dur = Math.floor(parseNum($('#rf-dur')?.value));
    const total = $('#rf-unit')?.value === 'y' ? dur * 12 : dur;
    const paid = Math.max(0, Math.floor(parseNum($('#rf-paid')?.value)));
    if (!(total > 0)) return toast('Inserisci la durata');
    if (paid >= total) return toast('Le rate pagate coprono già tutto');
    Object.assign(rec, { fin: true, tot: total, paid0: paid, months: total - paid });
  } else if (recFreq === 'y') {
    const M = +($('#rec-month')?.value || 0);
    let y = now.getFullYear();
    const dd = Math.min(day, new Date(y, M + 1, 0).getDate());
    if (y + '-' + pad(M + 1) + '-' + pad(dd) <= today() || recStartMode === 'next') y++;
    Object.assign(rec, { every: 12, st: y + '-' + pad(M + 1) });
  }
  S.rec.push(rec);
  applyRec();
  save();
  closeNp();

let tp = null;
const TP_H = 44;

function tpStyle(k, f) {
  const col = $('#tp-' + k);
  if (!col) return;
  if (f == null) f = col.scrollTop / TP_H;
  col.querySelectorAll('.tp-it').forEach((el, i) => {
    const d = Math.abs(f - i);
    el.style.opacity = Math.max(0.16, 1 - d * 0.4).toFixed(2);
    el.style.transform = `scale(${Math.max(0.74, 1 - d * 0.08).toFixed(3)})`;
  });
}

function tpUpdateBig() {
  const b = $('#tp-big');
  if (b && tp) b.textContent = pad(tp.h) + ':' + pad(tp.m);
}

function tpOnScroll(k) {
  if (!tp) return;
  const col = $('#tp-' + k);
  if (!col) return;
  const max = k === 'h' ? 23 : 59;
  const f = col.scrollTop / TP_H;
  const idx = Math.max(0, Math.min(max, Math.round(f)));
  tpStyle(k, f);
  if (tp[k] !== idx) {
    tp[k] = idx;
    hapTick();
    tpUpdateBig();
  }
}

function tpGo(k, idx, smooth) {
  const col = $('#tp-' + k);
  if (!col) return;
  col.scrollTo({ top: idx * TP_H, behavior: smooth ? 'smooth' : 'auto' });
  if (!smooth && tp) tp[k] = idx;
}

function tpPreset(v) {
  if (!tp) return;
  let h, m;
  if (v === 'now') {
    const d = new Date();
    h = d.getHours();
    m = Math.round(d.getMinutes() / 5) * 5;
    if (m === 60) { m = 0; h = (h + 1) % 24; }
  } else {
    [h, m] = v.split(':').map(Number);
  }
  tpGo('h', h, true);
  tpGo('m', m, true);
}

function bindTpDrag() {
  const grab = $('#tp-grab');
  const box = $('#tp-box');
  if (!grab || !box) return;
  let sy = 0, dy = 0;
  grab.addEventListener('touchstart', e => {
    sy = e.touches[0].clientY;
    dy = 0;
    box.style.transition = 'none';
  }, { passive: true });
  grab.addEventListener('touchmove', e => {
    dy = Math.max(0, e.touches[0].clientY - sy);
    box.style.transform = `translate3d(0,${dy}px,0)`;
  }, { passive: true });
  grab.addEventListener('touchend', () => {
    box.style.transition = 'transform .2s cubic-bezier(.16,1,.3,1)';
    if (dy > 80) {
      box.style.transform = 'translate3d(0,100%,0)';
      setTimeout(tpClose, 160);
    } else {
      box.style.transform = 'translate3d(0,0,0)';
    }
  });
}

function openTimePicker(inp) {
  if (kbTarget) kbClose();
  const mt = /^(\d{1,2}):(\d{2})$/.exec(inp.value || '');
  const h = mt ? Math.min(23, +mt[1]) : 19;

  const presets = [['now', 'Adesso'], ['08:00', '08:00'], ['12:30', '12:30'], ['19:00', '19:00'], ['21:00', '21:00']];

  $('#tp').innerHTML = `

      <div class='row sp'>

      </div>

async function cloudCreateBin() {
  if (kbTarget) kbClose();

  if (!key) return toast('Inserisci Master Key');
  S.cloud.key = key;
  save(true);
  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Name': 'MySpace', 'X-Bin-Private': 'true' },
      body: JSON.stringify(S)
    });
    const j = await res.json();
    if (j && j.metadata && j.metadata.id) {
      S.cloud.bin = j.metadata.id;
      S.cloud.lastSync = Date.now();
      save(true);
      toast('Bin creato: ' + j.metadata.id);
      R();

async function cloudPush(silent = false) {
  if (kbTarget && !silent) kbClose();
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) { if (!silent) toast('Dati Cloud mancanti'); return; }
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key },
      body: JSON.stringify(S)
    });
    if (res.ok) {
      S.cloud.lastSync = Date.now();
      try { localStorage.setItem('lw', JSON.stringify(S)); } catch (e) {}
      if (!silent) { toast('Salvato su Cloud'); R(); }
    } else if (!silent) toast('Errore Cloud');
  } catch (e) { if (!silent) toast('Errore di rete'); }
}

async function cloudPull(silent = false) {
  if (kbTarget && !silent) kbClose();
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) { if (!silent) toast('Dati Cloud mancanti'); return; }
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, { headers: { 'X-Master-Key': key } });
    const j = await res.json();
    if (j && j.record) {
      const remoteUpdated = +j.record.updatedAt || 0;
      if (silent && remoteUpdated <= (S.updatedAt || 0)) return;
      const keepCloud = Object.assign({}, S.cloud, { lastSync: Date.now() });
      S = migrate(j.record);
      S.cloud = keepCloud;
      save(true);
      R();
      if (!silent) toast('Dati caricati dal Cloud');
    } else if (!silent) toast('Bin non trovato');
  } catch (e) { if (!silent) toast('Errore di rete'); }
}

function imp(i) {
