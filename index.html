const NW = {
  zero: 0, uno: 1, un: 1, una: 1, due: 2, tre: 3, quattro: 4, cinque: 5, sei: 6, sette: 7, otto: 8, nove: 9, dieci: 10,
  undici: 11, dodici: 12, tredici: 13, quattordici: 14, quindici: 15, sedici: 16, diciassette: 17, diciotto: 18, diciannove: 19,
  venti: 20, trenta: 30, quaranta: 40, cinquanta: 50, sessanta: 60, settanta: 70, ottanta: 80, novanta: 90,
  cento: 100, duecento: 200, trecento: 300, cinquecento: 500, mille: 1000,
  deca: 10, ventino: 20, cinquantino: 50, centone: 100
};

const KW = [
  ['heets', /heets|iqos|sigarett|tabacc|\bfumo\b|terez|terea/],
  ['caffe', /caff|cappuccin|espresso|macchiato|marocchino/],
  ['benz', /benzin|carburant|diesel|gasolio/],
  ['gpl', /\bgpl\b|pieno/],
  ['cibo', /colazion|pranz|\bcen(a|o|are|ato|etta)\b|aperitiv|spritz|pizz|ristorant|panin|kebab|sushi|mcdonald|merend|gelat|brunch|mangi|trattori|osteri|hamburger|spesa|coop|conad|lidl|eurospin|supermercat|pasta|carne|pesce|frutta|verdur|birr|vino|drink/],
  ['svago', /amic|ragazz|fidanzat|uscit|uscire|serata|cinema|disco|locale|\bpub\b|weekend|svago|divert|concert|bowling|padel|calcett|palestr|abbonament|netflix|spotify|amazon|regal|vestit|scarp|felp/]
];

function catOf(t) {
  const hit = KW.find(k => k[1].test(t));
  if (hit) return hit[0];
  if (Array.isArray(S.customCats)) {
    const customHit = S.customCats.find(cc => t.includes(cc.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')));
    if (customHit) return customHit.id;
  }
  return null;
}

function parseNaturalDate(t) {
  const base = new Date();
  if (/altro ?ieri/.test(t)) { base.setDate(base.getDate() - 2); return { ds: iso(base), label: "l'altro ieri", explicit: true }; }
  if (/\bieri\b/.test(t)) { base.setDate(base.getDate() - 1); return { ds: iso(base), label: 'ieri', explicit: true }; }
  if (/dopodomani/.test(t)) { base.setDate(base.getDate() + 2); return { ds: iso(base), label: 'dopodomani', explicit: true }; }
  if (/domani/.test(t)) { base.setDate(base.getDate() + 1); return { ds: iso(base), label: 'domani', explicit: true }; }
  if (/oggi|stasera|stanotte|stamattina|oggi pomeriggio/.test(t)) { return { ds: iso(base), label: 'oggi', explicit: true }; }

  const traM = t.match(/\b(?:tra|fra)\s+(\d+|uno|due|tre|quattro|cinque|sei|sette|dieci|quindici)\s+giorn/);
  if (traM) {
    const add = /\d+/.test(traM[1]) ? +traM[1] : (NW[traM[1]] || 1);
    base.setDate(base.getDate() + add);
    return { ds: iso(base), label: `tra ${add}g`, explicit: true };
  }

  if (/settimana prossima|prossima settimana/.test(t)) {
    base.setDate(base.getDate() + 7);
    return { ds: iso(base), label: 'settimana prossima', explicit: true };
  }

  const dowMap = { domenic: 0, luned: 1, marted: 2, mercoled: 3, gioved: 4, venerd: 5, sabat: 6 };
  for (const [stem, targetDow] of Object.entries(dowMap)) {
    if (new RegExp(`\\b${stem}[ioa]?\\b`).test(t)) {
      const currDow = base.getDay();
      let diff = (targetDow - currDow + 7) % 7;
      if (diff === 0) diff = 7;
      base.setDate(base.getDate() + diff);
      return { ds: iso(base), label: `${DN[targetDow].slice(0, 3)} ${base.getDate()}/${base.getMonth() + 1}`, explicit: true };
    }
  }

  const mesiMap = { gennai: 0, febbrai: 1, marz: 2, april: 3, maggi: 4, giugn: 5, lugli: 6, agost: 7, settembr: 8, ottobr: 9, novembr: 10, dicembr: 11 };
  for (const [mStem, mIdx] of Object.entries(mesiMap)) {
    const dm = t.match(new RegExp(`\\b(\\d{1,2})\\s+${mStem}[io]\\b`));
    if (dm) {
      const dayNum = Math.min(31, Math.max(1, +dm[1]));
      let yr = base.getFullYear();
      const cand = new Date(yr, mIdx, dayNum, 12, 0);
      if (cand < new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0)) cand.setFullYear(yr + 1);
      return { ds: iso(cand), label: `${dayNum} ${MESI[mIdx].slice(0, 3)}`, explicit: true };
    }
  }

  const ilDay = t.match(/\bil\s+(\d{1,2})\b(?!\s*(?:euro|eur|%|km|anni|ore))/);
  if (ilDay) {
    const dayNum = Math.min(31, Math.max(1, +ilDay[1]));
    const cand = new Date(base.getFullYear(), base.getMonth(), dayNum, 12, 0);
    if (cand < new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0)) cand.setMonth(cand.getMonth() + 1);
    return { ds: iso(cand), label: `${dayNum}/${cand.getMonth() + 1}`, explicit: true };
  }

  return { ds: iso(base), label: 'oggi', explicit: false };
}

function parseNaturalTime(t) {
  if (/mezzogiorn/.test(t)) return { tm: '12:00', explicit: true };
  if (/mezzanott/.test(t)) return { tm: '00:00', explicit: true };

  const mFull = t.match(/\b(?:all[e']|ore|verso le|per le|intorno alle|dalle)\s*(\d{1,2})(?:[:.](\d{2})|\s+e\s+(mezz[ao]|un quarto|\d{1,2})|\s+meno\s+(un quarto|\d{1,2}))?/);
  if (mFull) {
    let hr = Math.min(23, Math.max(0, +mFull[1]));
    let min = 0;
    if (mFull[2]) {
      min = Math.min(59, +mFull[2]);
    } else if (mFull[3]) {
      if (/mezz/.test(mFull[3])) min = 30;
      else if (/quarto/.test(mFull[3])) min = 15;
      else min = Math.min(59, +mFull[3]);
    } else if (mFull[4]) {
      const sub = /quarto/.test(mFull[4]) ? 15 : Math.min(59, +mFull[4]);
      hr = (hr + 23) % 24;
      min = 60 - sub;
    } else if (/pomeriggi|ser/.test(t) && hr >= 1 && hr <= 11) {
      hr += 12;
    }
    return { tm: `${pad(hr)}:${pad(min)}`, explicit: true };
  }

  const mColon = t.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if (mColon) {
    return { tm: `${pad(+mColon[1])}:${mColon[2]}`, explicit: true };
  }

  return { tm: null, explicit: false };
}

function getNums(t) {
  const cleaned = t
    .replace(/\b(?:all[e']|ore|verso le|per le|dalle)\s*\d{1,2}(?:[:.]\d{2})?/g, ' ')
    .replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g, ' ')
    .replace(/\bil\s+\d{1,2}\b/g, ' ');

  const euroMezzo = cleaned.match(/(\d+|un|uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|venti|trenta|quaranta|cinquanta)\s*(?:euro|eur)\s*e\s*mezz[oa]/);
  if (euroMezzo) {
    const base = /\d+/.test(euroMezzo[1]) ? +euroMezzo[1] : (NW[euroMezzo[1]] || 0);
    return { total: base + 0.5, parts: [base + 0.5] };
  }
  const matches = [...cleaned.matchAll(/(\d+(?:[.,]\d+)?)/g)].map(m => +m[1].replace(',', '.')).filter(x => x > 0);
  if (matches.length > 1) return { total: Math.round(matches.reduce((a, b) => a + b, 0) * 100) / 100, parts: matches };
  if (matches.length === 1) return { total: matches[0], parts: matches };
  const w = cleaned.match(/\b(uno|un|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|undici|dodici|quindici|venti|trenta|quaranta|cinquanta|sessanta|settanta|ottanta|novanta|cento|duecento|trecento|cinquecento|mille|deca|ventino|cinquantino|centone)\b/);
  return w ? { total: NW[w[1]], parts: [NW[w[1]]] } : { total: null, parts: [] };
}

function addIt(c, a, d, when, raw, splitInfo, parts) {
  const cats = getCats();
  if (splitInfo && splitInfo.n > 1) {
    const share = Math.round((a / splitInfo.n) * 100) / 100;
    const credit = Math.round((a - share) * 100) / 100;
    const who = splitInfo.who || 'Amici';
    addEx(c, share, d, `${raw.slice(0, 36)} (1/${splitInfo.n})`, false, null, true);
    addDebt(who, credit, 'due', true);
    return `<b>${cats[c]?.[0] || c}</b> <b class='money-val'>${eur(share)}</b> (quota 1/${splitInfo.n}) + credito <b>${eur(credit)}</b> verso <b>${esc(who)}</b>${when}.`;
  }
  if (c === 'gpl') {
    const pplM = raw.match(/0[.,]\d{2,3}/);
    const ppl = pplM ? +pplM[0].replace(',', '.') : (S.fills[S.fills.length - 1]?.ppl || 0);
    if (ppl > 0) {
      const pl = /cingol|lavor|sed/i.test(raw) ? 'wk' : 'an';
      addFill(a, ppl, pl, d || today(), true);
      return `Pieno GPL <b class='money-val'>${eur(a)}</b> (${ppl.toFixed(3).replace('.', ',')} €/L)${when}.`;
    }
    np(d || today(), 'ex', 'gpl');
    nps.v = String(a).replace('.', ',');
    npR();
    return 'Completa il prezzo €/L nel pannello.';
  }
  addEx(c, a, d, raw.slice(0, 48), false, null, true);
  const detail = parts && parts.length > 1 ? ` (${parts.map(x => eur(x)).join(' + ')})` : '';
  return `<b>${cats[c]?.[0] || c}</b> <b class='money-val'>${eur(a)}</b>${detail}${when}.`;
}

function cleanEventTitle(raw) {
  return raw
    .replace(/^(segna|metti|aggiungi|ricordami|appunta|inserisci|salva|ho|c'e|ci sta)\s+(in agenda\s+|sul calendario\s+|un appuntamento\s+|l'appuntamento\s+|di\s+|che\s+)*/i, '')
    .replace(/\b(oggi|domani|dopodomani|stasera|stamattina|settimana prossima)\b/gi, '')
    .replace(/\b(?:tra|fra)\s+\d+\s+giorn[io]\b/gi, '')
    .replace(/\b(luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabat[oa]|domenic[ae])\b/gi, '')
    .replace(/\b(?:all[e']|ore|verso le|per le|intorno alle|dalle)\s*\d{1,2}(?:[:.]\d{2}|\s+e\s+(?:mezz[ao]|un quarto|\d{1,2})|\s+meno\s+(?:un quarto|\d{1,2}))?/gi, '')
    .replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g, '')
    .replace(/\b(a mezzogiorno|a mezzanotte)\b/gi, '')
    .replace(/\b(ogni giorno|tutti i giorni|ogni settimana|ogni mese|ogni \d+ giorni)\b/gi, '')
    .replace(/\b(per|di)\s+\d+(?:[.,]\d+)?\s*or[ae]\b/gi, '')
    .replace(/^[\s,:-]+|[\s,:-]+$/g, '')
    .trim();
}

function brainSingle(t0, raw) {
  const t = t0.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const oreM = t.match(/(\d+(?:[.,]\d+)?)\s*or[ae]/);
  const nums = oreM ? { total: null, parts: [] } : getNums(t);
  const num = nums.total;
  const c = catOf(t);
  const s = stats(0);
  const dateInfo = parseNaturalDate(t);
  const timeInfo = parseNaturalTime(t);
  const ds = dateInfo.ds;
  const when = dateInfo.explicit ? ` (${dateInfo.label})` : '';

  const p = pend;
  pend = null;

  const incIntent = /mi hanno dato|mi ha dato|mi sono entrati|aggiungi (?:questi )?soldi|aggiungi entrata|ho ricevuto|ricevuto|ho incassato|incassato|mi hanno pagato|mi ha pagato|entrata|accredit|regalo di|mi hanno regalato|trovato per terra|guadagnat|bonifico ricevuto|rimborso ricevuto/.test(t);
  const expIntent = /spes|segna.*euro|pagat|ho preso|comprat|\bpago\b|offert|costat|buttato|persi/.test(t);

  // 0. Rettifica rapida dell'ultima operazione ("no, erano 15 euro", "correggi in 12,50", "sposta sotto svago")
  if (/^(?:no[,]?\s*)?(?:erano|correggi|modifica|cambia|metti(?:lo|la)?\s+sotto|sposta\s+sotto)\b/i.test(t)) {
    const cats = getCats();
    if (c && lastActionMeta && lastActionMeta.kind === 'ex') {
      const targetEx = S.ex.find(x => x.id === lastActionMeta.id);
      if (targetEx) {
        targetEx.c = c;
        return `Spostato sotto <b>${cats[c][0]}</b> (<b class='money-val'>${eur(targetEx.a)}</b>).`;
      }
    }
    if (num != null && num > 0) {
      if (lastActionMeta && lastActionMeta.kind === 'inc') {
        const targetInc = S.inc.find(x => x.id === lastActionMeta.id);
        if (targetInc) {
          targetInc.a = Math.round(num * 100) / 100;
          return `Entrata corretta a <b class='ok money-val'>+${eur(targetInc.a)}</b>.`;
        }
      }
      const targetEx = (lastActionMeta && lastActionMeta.kind === 'ex' && S.ex.find(x => x.id === lastActionMeta.id)) || S.ex[S.ex.length - 1];
      if (targetEx) {
        targetEx.a = Math.round(num * 100) / 100;
        if (targetEx.fid) {
          const fill = S.fills.find(f => f.id === targetEx.fid);
          if (fill) fill.eur = targetEx.a;
        }
        return `Importo corretto a <b class='money-val'>${eur(targetEx.a)}</b> (${cats[targetEx.c]?.[0] || targetEx.c}).`;
      }
    }
  }

  // 1. Navigazione rapida tra schede via voce
  if (/^(apri|vai a|mostra|portami su|fammi vedere)\s+(la\s+|le\s+|il\s+|i\s+)?(home|agenda|calendario|note|checklist|dati|soldi|analytics|auto|macchina|gpl|sistema|impostazioni)$/.test(t)) {
    if (/agenda|calendario/.test(t)) { tab = 'cal'; return 'Apertura Agenda.'; }
    if (/note|checklist/.test(t)) { tab = 'notes'; return 'Apertura Note & Checklist.'; }
    if (/dati|soldi|analytics/.test(t)) { tab = 'money'; return 'Apertura Dati & Analytics.'; }
    if (/auto|macchina|gpl/.test(t)) { tab = 'car'; return 'Apertura Auto & Mobilità.'; }
    if (/sistema|impostazioni/.test(t)) { tab = 'set'; return 'Apertura Sistema.'; }
    tab = 'home'; return 'Apertura Home.';
  }

  // 2. Modalità Vacanza & Privacy
  if (/modalita vacanza|sono in ferie|vado in vacanza|attiva vacanza|disattiva vacanza|fine vacanza|torno da vacanza/.test(t)) {
    const turnOff = /disattiva|fine|torno|spegni|chiudi/.test(t);
    toggleVacationMode(!turnOff, true);
    return !turnOff
      ? `Modalità Vacanza attiva · Budget <b class='money-val'>${eur(S.vacBud)}</b> · 0 km auto.`
      : 'Modalità Vacanza disattivata · Ciclo mensile ripristinato.';
  }
  if (/privacy|modalita ufficio|nascondi importi|mostra importi|sfoca/.test(t)) {
    const turnOff = /disattiva|spegni|mostra|togli/.test(t);
    S.priv = !turnOff;
    return S.priv ? 'Modalità Privacy attivata.' : 'Modalità Privacy disattivata.';
  }

  // 3. Smart Working / Remote / Ferie
  if (/smart ?working|lavoro da casa|remote|non vado in ufficio|resto a casa|sto a casa|prendo ferie|giorno di ferie/.test(t)) {
    const targetDs = dateInfo.explicit ? ds : today();
    if (!isOffDay(targetDs)) toggleOffDay(targetDs, true);
    return `Remote / Ferie attivo (${dateInfo.label}) · 0 km auto.`;
  }

  // 4. Auto: Km Extra, Carpooling, Tagliando
  if (/km extra|chilometri extra|fatto \d+ km/.test(t) && num > 0) {
    S.extra[ds] = (S.extra[ds] || 0) + num;
    return `Aggiunti <b>${num} km extra</b>${when}.`;
  }
  if (/passaggio|carpooling/.test(t)) {
    const val = num > 0 ? num : 5;
    addInc(val, ds, 'Passaggio Carpooling', true);
    return `Passaggio carpooling <b class='ok money-val'>+${eur(val)}</b>.`;
  }
  if (/fatto il tagliando|azzera tagliando|reset tagliando/.test(t)) {
    S.maintLastKm = Math.round(car().totalTrackedKm);
    return 'Contatore tagliando azzerato.';
  }

  // 5. Note & Checklist (spunta vocale, creazione, aggiunta voci o lettura)
  let m;
  if ((m = raw.match(/(?:spunta|segna\s+(?:come\s+)?(?:pres[oa]|fatt[oa]|completat[oa])|complet[ao])\s+(?:il\s+|la\s+|lo\s+|i\s+|gli\s+|le\s+)?([A-Za-zÀ-ÿ0-9\s]{2,28}?)(?:\s+(?:dalla|nella|sulla)\s+(?:lista\s+(?:della\s+)?|checklist\s+)?([A-Za-zÀ-ÿ0-9\s]{2,24}))?$/i))) {
    const itemTarget = m[1].trim().toLowerCase();
    const listFilter = m[2] ? m[2].trim().toLowerCase() : null;
    for (const n of S.notes) {
      if (n.type !== 'checklist') continue;
      if (listFilter && !n.title.toLowerCase().includes(listFilter)) continue;
      const it = (n.items || []).find(x => x.txt.toLowerCase().includes(itemTarget));
      if (it) {
        it.done = true;
        n.updatedAt = Date.now();
        return `Spuntato <b>${esc(it.txt)}</b> in <b>${esc(n.title)}</b>.`;
      }
    }
    return `Non trovo «${esc(m[1].trim())}» nelle checklist.`;
  }

  if (/leggi (?:le )?(?:mie )?note|che note ho|mostra note|lista della spesa|cosa c'e nella lista/.test(t) && !/aggiungi|segna|scrivi|metti|crea/.test(t)) {
    if (!S.notes.length) return 'Non hai ancora nessuna nota o checklist salvata.';
    return S.notes.slice(0, 3).map(n => n.type === 'checklist'
      ? `<b>${esc(n.title)}</b>: ${n.items.filter(x => !x.done).map(x => esc(x.txt)).join(', ') || 'tutto completato'}`
      : `<b>${esc(n.title)}</b>: ${esc(n.body.slice(0, 80))}`
    ).join('<br>');
  }

  if ((m = raw.match(/(?:aggiungi|metti|segna|inserisci|scrivi)\s+(?:alla\s+|nella\s+|sulla\s+)?(?:lista\s+(?:della\s+)?|checklist\s+)([A-Za-zÀ-ÿ0-9\s]{2,24}?)(?:\s*[:,-]\s*|\s+)(.+)$/i))) {
    const listName = m[1].trim();
    const items = m[2].split(/,|\be\b/).map(x => x.trim()).filter(Boolean);
    addNoteOrChecklist(listName, items, true, true);
    return `Checklist <b>${esc(cap(listName))}</b> aggiornata (${items.map(esc).join(', ')}).`;
  }
  if ((m = raw.match(/(?:crea|nuova)\s+(?:una\s+)?(?:checklist|lista)\s+([A-Za-zÀ-ÿ0-9\s]{2,24}?)(?:\s*[:,-]\s*|\s+con\s+|\s+)(.+)$/i))) {
    const listName = m[1].trim();
    const items = m[2].split(/,|\be\b/).map(x => x.trim()).filter(Boolean);
    addNoteOrChecklist(listName, items, true, true);
    return `Checklist <b>${esc(cap(listName))}</b> creata.`;
  }
  if (/^(?:prendi nota|segna nelle note|scrivi una nota|nuova nota|appunta|ricordati che|nota)\b/i.test(t)) {
    const body = raw.replace(/^(?:prendi nota|segna nelle note|scrivi una nota|nuova nota|appunta|ricordati che|nota)\s*[:,-]?\s*/i, '').trim();
    if (!body) return 'Dimmi pure cosa vuoi annotare.';
    const parts = body.split(':');
    if (parts.length > 1 && parts[0].length <= 28) {
      addNoteOrChecklist(parts[0].trim(), parts.slice(1).join(':').trim(), false, true);
      return `Nota <b>${esc(cap(parts[0].trim()))}</b> salvata.`;
    }
    addNoteOrChecklist('Nota veloce', body, false, true);
    return `Annotato: «${esc(body.slice(0, 60))}».`;
  }

  // 6. Obiettivi & Abbonamenti via Voce
  if (/obiettivo/.test(t) && num > 0) {
    if (/versa|aggiungi|metti/.test(t) && S.goals.length) {
      const g = S.goals.find(x => t.includes(x.n.toLowerCase())) || S.goals[0];
      const prevS = g.s;
      g.s = Math.round((g.s + num) * 100) / 100;
      if (prevS < g.t && g.s >= g.t) setTimeout(launchConfetti, 250);
      return `Versati <b class='ok money-val'>${eur(num)}</b> in <b>${esc(g.n)}</b> (${eur(g.s)} / ${eur(g.t)}).`;
    }
    const gName = raw.replace(/.*obiettivo\s+(?:per\s+|di\s+)?/i, '').replace(/\d+([.,]\d+)?\s*(euro|eur|€).*/i, '').trim() || 'Risparmio';
    S.goals.push({ id: uid(), n: cap(gName), t: num, s: 0 });
    return `Obiettivo <b>${esc(cap(gName))}</b> (<b class='money-val'>${eur(num)}</b>) creato.`;
  }

  if (/abbonament|spesa fissa/.test(t) && num > 0) {
    const dayM = t.match(/\bil\s+(\d{1,2})\b/);
    const dayNum = dayM ? Math.min(31, Math.max(1, +dayM[1])) : 1;
    const rName = raw.replace(/.*?(abbonamento|spesa fissa)\s+/i, '').replace(/\d+([.,]\d+)?\s*(euro|eur|€).*/i, '').replace(/\bil\s+\d{1,2}\b/i, '').trim() || 'Abbonamento';
    S.rec.push({ id: uid(), n: cap(rName), a: num, day: dayNum, c: c || 'altro', st: today().slice(0, 7), sk: [] });
    applyRec();
    return `Abbonamento <b>${esc(cap(rName))}</b> (<b class='money-val'>${eur(num)}</b>, giorno ${dayNum}) aggiunto.`;
  }

  // 7. Debiti & Crediti
  if (num > 0 && (m = raw.match(/([A-Za-zÀ-ÿ]+)\s+mi\s+deve/i))) return addDebt(cap(m[1]), num, 'due', true);
  if (num > 0 && (m = raw.match(/\bdevo\s+[\d.,]+\s*(?:euro|€)?\s*a\s+([A-Za-zÀ-ÿ]+)/i))) return addDebt(cap(m[1]), num, 'owe', true);

  if ((m = raw.match(/([A-Za-zÀ-ÿ]+)\s+(?:mi\s+ha|ha)\s+(?:ridato|restituito|rimborsato|dato)/i)) || (m = raw.match(/(?:ridato|restituito|rimborsato)\s+(?:a\s+)?([A-Za-zÀ-ÿ]+)/i))) {
    const nm = m[1].toLowerCase();
    if (!['soldi', 'euro', 'dei', 'gli', 'un', 'una', 'questi'].includes(nm)) {
      const i = S.debts.findIndex(g => !g.p && g.dir === 'due' && g.who.toLowerCase() === nm);
      if (i >= 0) {
        const g = S.debts[i];
        settle(i, true);
        return `Credito saldato: <b>${esc(g.who)}</b> (+<b class='ok money-val'>${eur(g.a)}</b>).`;
      } else if (incIntent && num > 0) {
        addInc(num, ds, `Da ${cap(m[1])}`, true);
        return `Entrata da <b>${esc(cap(m[1]))}</b> <b class='ok money-val'>+${eur(num)}</b>${when}.`;
      }
    }
  }

  if (/chi mi deve|a chi devo|\bdebiti\b|\bcrediti\b/.test(t)) {
    const o = S.debts.filter(g => !g.p);
    return o.length ? o.map(g => `${esc(g.who)} ${g.dir === 'due' ? 'ti deve' : 'devi'} <b>${eur(g.a)}</b>`).join('<br>') : 'Nessun debito aperto.';
  }

  // 8. Memoria conversazionale multi-turno
  if (p && !/\bposso\b|quanto/.test(t)) {
    if (p.mode === 'inc' && num != null) {
      addInc(num, ds, 'Entrata', true);
      return `Entrata <b class='ok money-val'>+${eur(num)}</b>${when}.`;
    }
    if (p.c && num != null) return addIt(c || p.c, num, ds, when, raw, null, nums.parts);
    if (p.a != null && incIntent) {
      addInc(p.a, ds, 'Entrata', true);
      return `Entrata <b class='ok money-val'>+${eur(p.a)}</b>${when}.`;
    }
    if (p.a != null && (c || expIntent)) return addIt(c || 'altro', num ?? p.a, ds, when, raw, null, nums.parts);
  }

  // 9. Stipendio
  if (/stipendio|busta paga/.test(t) && /arriv|ricev|accredit|pagat|preso|incassat/.test(t) && !/quando|\bse\b/.test(t)) {
    const a = num > 0 ? num : S.sal;
    addInc(a, ds, 'Stipendio', true);
    return `Stipendio <b class='ok money-val'>+${eur(a)}</b>${when}.`;
  }

  // 10. Entrata flessibile
  if (incIntent) {
    if (num != null && num > 0) {
      const label = /regal/.test(t) ? 'Regalo' : /rimbors/.test(t) ? 'Rimborso' : 'Entrata';
      addInc(num, ds, label, true);
      return `${label} <b class='ok money-val'>+${eur(num)}</b>${when}.`;
    } else {
      pend = { mode: 'inc' };
      return 'Quanto hai ricevuto?';
    }
  }

  // 11. Regola 48h ("Posso comprare / vorrei comprare...")
  if (/\bposso\b|ce la faccio|mi conviene|mi basta|permettermi|vorrei comprare/.test(t) && num > 0) {
    const itemName = raw.replace(/.*?(comprare|prendere|spendere|permettermi)\s+(un|una|uno|il|la|lo|i|gli|le)?\s*/i, '').replace(/\s*(da|di|per)?\s*\d+([.,]\d+)?\s*(euro|eur|€).*/i, '').trim() || 'Acquisto extra';
    const parkBtn = `<div style='margin-top:8px'><button class='btn s sm' onclick="parkItem('${escAttr(itemName)}',${num})">Parcheggia 48h</button></div>`;
    const budgetPool = S.vacMode ? vacStats().rem : s.rem;
    if (num <= budgetPool) {
      return `Sì · Residuo <b class='money-val'>${eur(budgetPool - num)}</b>.${parkBtn}`;
    }
    const days = Math.ceil((num - budgetPool) / Math.max(1, s.per));
    return `Mancano <b class='money-val'>${eur(num - budgetPool)}</b> (~${days}g).${parkBtn}`;
  }

  // 12. Query informative su spese, budget, patrimonio e auto
  if (/quanto ho (gia )?speso|quanto spendo/.test(t)) {
    const o = /oggi/.test(t);
    const tot = (o ? S.ex.filter(e => !e.vac && e.d === today()) : s.exList).reduce((a, e) => a + e.a, 0);
    return `${o ? 'Oggi' : 'Ciclo'} <b class='money-val'>${eur(tot)}</b>.`;
  }

  if (/quanto (ho|mi resta|mi rimane|posso spendere)|come sto messo|situazione|budget|saldo|liquidit|patrimonio|disponibil/.test(t) && !expIntent) {
    if (S.vacMode) {
      const vs = vacStats();
      return `Patrimonio <b class='money-val'>${eur(liq())}</b> · Vacanza residuo <b class='${vs.rem > 0 ? 'ok' : 'bad'} money-val'>${eur(vs.rem)}</b> (spesi ${eur(vs.spent)} su ${eur(vs.bud)}).`;
    }
    return `Patrimonio <b class='money-val'>${eur(liq())}</b> · Oggi <b class='${s.daily > 0 ? 'ok' : 'bad'} money-val'>${eur(s.daily)}</b> · Ciclo <b class='money-val'>${eur(s.rem)}</b>.`;
  }

  if (/autonomia|quanti km|quanto gpl|gpl.*(rimast|resta)|riserva|quando finisco il gpl/.test(t)) {
    const k = car();
    return k.last ? `<b>${Math.round(k.rem)} km</b> (${k.tk}/4) · ${k.reserveDay}.` : 'Nessun pieno registrato.';
  }

  // 13. Spostamento o riprogrammazione di un appuntamento esistente ("sposta il dentista a giovedì alle 17")
  if (/^(?:sposta|rimanda|anticipa|posticipa)\s+/i.test(t) && (dateInfo.explicit || timeInfo.explicit) && num == null) {
    const evPart = raw.replace(/^(?:sposta|rimanda|anticipa|posticipa)\s+(?:l'appuntamento\s+|l'impegno\s+|il\s+|la\s+|lo\s+|i\s+|gli\s+|le\s+)?/i, '')
      .replace(/\b(?:a|al|allo|alla|ai|agli|alle|per)\s+(?:domani|dopodomani|oggi|luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabat[oa]|domenic[ae]|tra\s+\d+\s+giorn[io]|\d{1,2}\s+[a-z]+|\d{1,2}[:.]\d{2}|ore\s+\d{1,2}|all[e']\s*\d{1,2}).*$/i, '')
      .trim();
    if (evPart) {
      const targetEv = S.ev.find(e => e.t.toLowerCase().includes(evPart.toLowerCase()));
      if (targetEv) {
        if (dateInfo.explicit) targetEv.d = ds;
        if (timeInfo.explicit) targetEv.tm = timeInfo.tm;
        return `Spostato <b>${esc(targetEv.t)}</b> · ${dateInfo.explicit ? dateInfo.label : targetEv.d.split('-').reverse().join('/')} alle <b>${targetEv.tm}</b>.`;
      }
    }
  }

  // 14. Cancellazione appuntamento via voce
  if (/^(cancella|elimina|annulla|rimuovi)\s+(?:l'appuntamento|l'impegno|appuntamento|impegno)?/i.test(t) && !num) {
    const target = cleanEventTitle(raw.replace(/^(cancella|elimina|annulla|rimuovi)\s+(?:l'appuntamento|l'impegno|appuntamento|impegno)?\s*(?:dal|da|con|per)?\s*/i, ''));
    if (target) {
      const idx = S.ev.findIndex(e => e.t.toLowerCase().includes(target.toLowerCase()));
      if (idx >= 0) {
        const remEv = S.ev.splice(idx, 1)[0];
        return `Impegno <b>${esc(remEv.t)}</b> eliminato.`;
      }
    }
  }

  // 15. Appuntamento diretto con Orario Esplicito
  if (timeInfo.explicit && num == null) {
    const title = cleanEventTitle(raw) || 'Impegno';
    const dur = oreM ? +oreM[1].replace(',', '.') : classifyActivityContext(title).defDur;
    let r = '';
    if (/ogni giorno|tutti i giorni/.test(t)) r = 'd';
    else if (/ogni settimana|tutti i /.test(t)) r = 'w';
    else if (/ogni mese/.test(t)) r = 'm';
    else {
      const iM = t.match(/ogni\s+(\d+)\s+giorn/);
      if (iM) r = 'i' + iM[1];
    }
    addEv(title, ds, timeInfo.tm, dur, r, '', true);
    return `In agenda: <b>${esc(cap(title))}</b> · ${dateInfo.label} alle <b>${timeInfo.tm}</b>${r ? ' (ricorrente)' : ''}.`;
  }

  // 16. Time-Finder Contestuale Intelligente
  const act = /agenda|calendario|appuntament|ricordami/.test(t) || (/voglio|vorrei|devo |organizza|pianifica|prenota|trova|trovami|incastra|quando|andare|andiamo|stasera|domani|dopodomani|prossim/.test(t) && num == null && !expIntent);
  if (act) {
    const title = cleanEventTitle(raw) || raw;
    const dur = oreM ? +oreM[1].replace(',', '.') : /mezz/.test(t) ? 0.5 : 0;
    const pref = /settimana prossima|prossima settimana/.test(t) ? 'next_week'
      : /questa settimana/.test(t) ? 'this_week'
      : /mattin/.test(t) ? 'morning'
      : /pomeriggi/.test(t) ? 'afternoon'
      : /ser/.test(t) ? 'evening' : null;
    return slotHTML(title, dur, pref);
  }

  // 17. Split alla romana
  let splitInfo = null;
  const inPeopleM = t.match(/\bin\s+(\d+|due|tre|quattro|cinque|sei)\b/);
  const divisoConM = raw.match(/(?:divis[oa]|a met[àa]|alla romana)\s+(?:con\s+)?([A-Za-zÀ-ÿ]+)/i);
  if (/dividi|a meta|50 e 50|alla romana|diviso/.test(t) || inPeopleM) {
    const nPeople = inPeopleM ? (/\d+/.test(inPeopleM[1]) ? +inPeopleM[1] : (NW[inPeopleM[1]] || 2)) : 2;
    const who = divisoConM && !['due', 'tre', 'quattro', 'amici'].includes(divisoConM[1].toLowerCase()) ? cap(divisoConM[1]) : 'Amici';
    if (nPeople >= 2 && nPeople <= 12) splitInfo = { n: nPeople, who };
  }

  // 18. Spese per categoria o importo libero
  if (c) {
    const cats = getCats();
    const a = num ?? FIX[c];
    if (a == null) { pend = { c }; return `Importo per ${cats[c][0].toLowerCase()}?`; }
    return addIt(c, a, ds, when, raw, splitInfo, nums.parts);
  }

  if (num != null) {
    if (expIntent) {
      return addIt('altro', num, ds, when, raw, splitInfo, nums.parts);
    }
    pend = { a: num };
    return `<b>${eur(num)}</b> — Spesa o Entrata?<div class='row' style='margin-top:8px'>
      <button class='btn sm' onclick="addEx('altro',${num},'${ds}','');ans='';R()">Spesa</button>
      <button class='btn s sm' onclick="addInc(${num},'${ds}','Entrata');ans='';R()">Entrata</button>
    </div>`;
  }

  return 'Prova: «Domani alle 18:30 dentista», «No, erano 15 euro», «Segna preso il latte nella lista spesa» o «Ho pagato 60 euro cena in 3».';
}

function splitMultiClauses(raw) {
  if (/(?:lista|checklist|nota)/i.test(raw) && !/(?:\be poi\b|\binoltre\b|\bah e\b|;)/i.test(raw)) {
    return [raw.trim()];
  }
  const parts = raw
    .split(/(?:\s*;\s*|\s+\be\s+poi\b\s+|\s+\binoltre\b\s+|\s+\bah\s+e\b\s+|,\s+(?=(?:ho|segna|metti|aggiungi|trovami|ricordami|mi hanno|domani|oggi|luned|marted|mercoled|gioved|venerd|sabat|domenic|spes|pagat|sposta|no\b)))/i)
    .map(s => s.trim())
    .filter(Boolean);
  return parts.length ? parts : [raw.trim()];
}

function brain(raw) {
  if (/riepilogo (?:della |di questa )?settimana|com.{1,2} andata la settimana|weekly/i.test(raw)) { openWeekSheet(); return 'Ecco il riepilogo della settimana.'; }
  const clauses = splitMultiClauses(raw);
  if (clauses.length === 1) {
    return brainSingle(clauses[0].toLowerCase(), clauses[0]);
  }
  const results = clauses.map(cl => '• ' + brainSingle(cl.toLowerCase(), cl));
  return results.join('<br>');
}

function weekData() {

  cur.forEach(e => { byc[e.c] = (byc[e.c] || 0) + e.a; byd[e.d] = (byd[e.d] || 0) + e.a; });
  let free = 0; for (let i = 0; i < 7; i++) if (!byd[mk(i)]) free++;

  n.types = Object.assign({ evento: true, gpl: true, budget: true, stipendio: true, parcheggio: true, sera: true, tagliando: true, debiti: true, backup: true, fisse: true }, n.types || {});
  n.evMin = n.evMin || 30;
  n.evening = n.evening || 21;
  n.sent = n.sent || {};
  n.sysd = n.sysd || {};
  n.ntfyTopic = typeof n.ntfyTopic === 'string' ? n.ntfyTopic : '';
  n.ntfyOn = Boolean(n.ntfyOn);
  return n;
}

function computeAlerts() {
  const n = nf(), t = n.types, al = [], s = stats(0), c = car(), km = S.kmDay || 92, now = new Date(), tdy = today(), tom = tomorrow();
  const add = (key, k, text, act, label, sys, act2 = '', label2 = '') => {
    if (n.sent[key] !== tdy) al.push({ key, k, text, act, label, sys: !!sys, act2, label2 });
  };

  if (t.evento) {
    const nowM = now.getHours() * 60 + now.getMinutes();
    evOn(tdy).forEach(e => {
      const [eh, em] = (e.tm || '00:00').split(':').map(Number), diff = eh * 60 + em - nowM;
      if (diff >= 0 && diff <= n.evMin) add('ev:' + e.id + ':' + tdy, 'w', `${e.t} alle ${e.tm}${diff ? ` (tra ${diff} min)` : ''}`, "tab='cal';R()", 'Agenda', true);
    });
  }

  if (t.gpl && c.last && S.commuteMode === 'gpl') {
    if (c.rem < km) {
      add('gpl:low', 'bad', 'GPL in riserva: fermati al prossimo distributore', 'openFillSheet()', 'Pieno', true);
    } else if (wk(tom) && c.rem < km * 1.15) {
      add('gpl:tom', 'w', `Fai GPL oggi al rientro o domani mattina (domani ${km} km A/R)`, 'openFillSheet()', 'Pieno', true);
    } else if (c.rem < km * 2) {
      add('gpl:soon', 'w', `GPL: autonomia ${Math.round(c.rem)} km (${c.reserveDay})`, 'openFillSheet()', 'Pieno', true);
    }
  }

  if (t.tagliando && c.last && c.maintLeft != null && c.maintLeft <= 1000) {
    add('tag:' + Math.floor(Math.max(0, c.maintLeft) / 250), 'w', `Tagliando tra ${Math.max(0, Math.round(c.maintLeft))} km`, '', '', true);
  }

  if (t.budget && !S.vacMode) {
    const pct = S.bud > 0 ? s.spent / S.bud : 0;
    const todayExp = S.ex.filter(e => e.d === tdy && !e.rid && !e.vac).reduce((a, e) => a + e.a, 0);
    if (pct >= 1) add('bud:100', 'bad', 'Budget del ciclo esaurito', '', '', true);
    else if (pct >= 0.85) add('bud:85', 'w', `Hai usato l’${Math.round(pct * 100)}% del budget del ciclo`, '', '', true);
    if (s.daily > 0 && todayExp > s.daily && pct < 1) add('bud:day', 'w', 'Oggi hai superato il budget giornaliero', '', '', false);
  }

  if (t.stipendio && !S.inc.some(i => i.d >= s.cyc.startStr && i.d <= s.cyc.endStr && (i.t || '') === 'Stipendio')) {
    const daysFromPay = Math.floor((new Date(tdy + 'T12:00') - new Date(s.cyc.startStr + 'T12:00')) / 86400000);
    if (daysFromPay >= 0 && daysFromPay <= 2) {
      add('pay:' + s.cyc.startStr, 'ok', `Stipendio ${eur(S.sal)} da registrare`, 'payNow()', 'Registra', true);
    }
  }

  if (t.parcheggio) {
    const r = S.parked.filter(x => Date.now() - x.createdAt >= 48 * 3600000).length;
    if (r) add('park', 'ok', `${r} acquist${r > 1 ? 'i pronti' : 'o pronto'} da decidere`, "tab='money';moneySub='48h';R()", 'Vedi', true);
  }

  if (t.sera && now.getHours() >= n.evening && !S.ex.some(e => e.d === tdy && !e.rid) && !(S.zeroSpendDays || []).includes(tdy)) {
    add('sera', 'w', 'Nessuna spesa registrata oggi', 'confirmZeroSpendToday()', '0 spese oggi', true, 'np(today())', '+ Spesa');
  }

  if (t.debiti) {
    const old = S.debts.filter(g => !g.p && g.dir === 'due' && g.d && (Date.now() - new Date(g.d + 'T12:00')) > 14 * 864e5)[0];
    if (old) add('debt:' + old.id, 'w', `${old.who} ti deve ${eur(old.a)} da più di 2 settimane`, "tab='money';moneySub='deb';R()", 'Vedi', true);
  }

  if (t.backup) {
    const ds = S.lastBackupAt ? Math.floor((Date.now() - S.lastBackupAt) / 864e5) : null;
    if (ds == null || ds >= 15) add('bk', 'w', 'Backup dei dati non fatto da tempo', "tab='set';sysSub='sync';R()", 'Backup', false);
  }

  const order = { bad: 0, w: 1, ok: 2 };
  return al.sort((a, b) => order[a.k] - order[b.k]);
}

function alertsCard() {
  const al = computeAlerts().slice(0, 3); if (!al.length) return '';
  const col = k => k === 'bad' ? 'var(--bad)' : k === 'w' ? 'var(--w)' : 'var(--ok)';
  return `<div class='card' style='padding:4px 14px;margin-bottom:12px'>${al.map(a => `<div class='li' style='gap:8px'>

async function ntfyPush(title, body, priority = 3) {
  const n = nf();
  const topic = (n.ntfyTopic || '').trim().replace(/^https?:\/\/ntfy\.sh\//i, '');
  if (!n.ntfyOn || !topic) return false;
  try {
    const res = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}`, {
      method: 'POST',
      keepalive: true,
      headers: {
        'Title': title,
        'Priority': String(priority),
        'Tags': priority >= 4 ? 'warning' : 'bell'
      },
      body
    });
    return res.ok;
  } catch (e) {
    return false;
  }
}

  const lines = [qStr, gplStr, evStr].filter(Boolean).join(' · ');

async function sysNotify(title, body, tag, priority = 3) {
  let delivered = false;
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg && reg.showNotification) { await reg.showNotification(title, { body, tag }); delivered = true; }
    } catch (e) {}
    if (!delivered) {
      try { new Notification(title, { body, tag }); delivered = true; } catch (e) {}
    }
  }
  const pushed = await ntfyPush(title, body, priority);
  return delivered || pushed;
}

function icsT(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }

function buildReminders() {
  const n = nf(), t = n.types, L = [], stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const z = (ds, tm) => ds.replace(/-/g, '') + 'T' + tm.replace(':', '') + '00';
  const untilStr = endDs => endDs ? ';UNTIL=' + endDs.replace(/-/g, '') + 'T235959Z' : '';

  const ev = (uidStr, ds, tm, sum, o = {}) => {
    L.push('BEGIN:VEVENT', 'UID:' + uidStr + '@leowealth', 'DTSTAMP:' + stamp, 'DTSTART:' + z(ds, tm), 'DURATION:PT' + (o.dur || 30) + 'M', 'SUMMARY:' + icsT(sum));
    if (o.rr) L.push('RRULE:' + o.rr);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsT(sum), 'TRIGGER:' + (o.trig || 'PT0S'), 'END:VALARM', 'END:VEVENT');
  };

  const tdy = today();
  const nextDom = day => {
    const d = new Date();
    const targetDay = Math.min(31, Math.max(1, +day || 1));
    const dimCurr = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    if (d.getDate() > Math.min(targetDay, dimCurr)) d.setMonth(d.getMonth() + 1);
    const dimTarget = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(targetDay, dimTarget));
    return iso(d);
  };

  let count = 0;

  if (t.evento) {
    S.ev.forEach(e => {
      if (e.d < tdy && !e.r) return;
      let rr = '';
      if (e.r === 'd') rr = 'FREQ=DAILY' + untilStr(e.end);
      else if (e.r === 'w') rr = 'FREQ=WEEKLY' + untilStr(e.end);
      else if (e.r === 'm') rr = 'FREQ=MONTHLY' + untilStr(e.end);
      else if (e.r && e.r.startsWith('i')) {
        const iv = Math.max(1, parseInt(e.r.slice(1), 10) || 1);
        rr = `FREQ=DAILY;INTERVAL=${iv}` + untilStr(e.end);
      }
      ev('ev-' + e.id, e.d < tdy && e.r ? tdy : e.d, e.tm || '09:00', e.t, {
        dur: Math.round((+e.dur || 1) * 60),
        trig: '-PT' + n.evMin + 'M',
        rr
      });
      count++;
    });
  }

  if (t.stipendio) {
    const pd = Math.min(31, Math.max(1, +S.payDay || 1));
    ev('pay', nextDom(pd), '09:00', `Stipendio: registralo in Leo Wealth (${eur(S.sal)})`, {
      trig: '-PT2H',
      rr: 'FREQ=MONTHLY;BYMONTHDAY=' + (pd > 28 ? -1 : pd)
    });
    count++;
  }

  if (t.fisse) {
    S.rec.forEach(r => {
      const rDay = Math.min(31, Math.max(1, +r.day || 1));
      ev('rec-' + r.id, nextDom(rDay), '09:00', `Addebito ${r.n} (${eur(r.a)})`, {
        trig: +r.a >= 15 ? '-PT24H' : '-PT2H',
        rr: 'FREQ=MONTHLY;BYMONTHDAY=' + (rDay > 28 ? -1 : rDay)
      });
      count++;
    });
  }

  if (t.gpl && S.commuteMode === 'gpl') {
    const c = car();
    if (c.last && c.reserveDs) {
      ev('gpl-res', c.reserveDs, '08:00', `Rifornimento GPL consigliato (${Math.round(c.rem)} km residui)`, {
        trig: '-PT12H'
      });
      count++;
    }
  }

  if (t.sera) {
    ev('sera', tdy, pad2h(n.evening), 'Leo Wealth: controlla o conferma 0 spese oggi', { rr: 'FREQ=DAILY' });
    count++;
  }

  if (t.backup) {
    const d = new Date();
    d.setMonth(d.getMonth() + 1);
    d.setDate(1);
    ev('backup', iso(d), '10:00', 'Esporta backup dati Leo Wealth', { rr: 'FREQ=MONTHLY;BYMONTHDAY=1' });
    count++;
  }

  if (t.parcheggio) {
    S.parked.forEach(x => {
      const d = new Date(x.createdAt + 48 * 3600000);
      if (d > new Date()) {
        ev('park-' + x.id, iso(d), pad2h(d.getHours()), `Decidi acquisto 48h: ${x.name} (${eur(x.amount)})`);
        count++;
      }
    });
  }

  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Leo Wealth//IT', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Leo Wealth', ...L, 'END:VCALENDAR'].join('\r\n');
  return { ics, count };
}

    try {
      const v = $('#v');
      if (v && !v.children.length) v.innerHTML = `<div class='card' style='margin-top:40px'><b>Qualcosa non va</b><div class='m' style='margin:6px 0 12px'>Errore di visualizzazione. I tuoi dati sono al sicuro.</div><button class='btn' style='width:100%' onclick='location.reload()'>Ricarica</button><button class='btn s' style='width:100%;margin-top:8px' onclick='exp()'>Esporta backup</button></div>`;
    } catch (_) {}
  }
}

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(nfTick, 400); });
let lastDay = today();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && today() !== lastDay) {
    lastDay = today();
    try { syncVacationDay(); applyRec(); } catch (e) {}
    R();
  }
});
let bootDone = false;
async function bootApp() {
  if (bootDone) return;
  bootDone = true;
  try {
    if (location.search.includes('_v=') && history.replaceState) {
      const clean = new URL(location.href);
      clean.searchParams.delete('_v');
      history.replaceState(null, '', clean.pathname + clean.search);
    }
    DB.init();
    syncVacationDay();
    applyRec();
    tab = 'home';
    R();
    handleUrlActions();
    setTimeout(nfTick, 1500); setInterval(nfTick, 60000);
    if (loadWarn) toast(loadWarn === 'restored' ? 'Dati danneggiati: ripristinato l’ultimo backup automatico' : 'Dati non leggibili: copia conservata, si riparte da zero');
    checkCycleCelebration();
    await requestPersistentStorage();
    if (S.cloud && S.cloud.key && S.cloud.bin) {
      setTimeout(() => cloudPull(true), 1200);
    }
  } catch (err) {
    console.error('Boot error:', err);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootApp);
} else {
  bootApp();
}
window.addEventListener('load', bootApp);
</script>
</body>
