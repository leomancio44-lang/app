    .replace(/\b(oggi|domani|domattina|dopodomani|stasera|stamattina|settimana prossima)\b/gi, '')
    .replace(/\b(?:tra|fra)\s+\d+\s+giorn[io]\b/gi, '')
    .replace(/\b(luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabat[oa]|domenic[ae])\b/gi, '')
    .replace(/\b(?:all[e']|ore|verso le|per le|intorno alle|dalle)\s*\d{1,2}(?:[:.]\d{2}|\s+e\s+(?:mezz[ao]|un quarto|tre quarti|\d{1,2})|\s+meno\s+(?:un quarto|\d{1,2}))?/gi, '')
    .replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g, '')
    .replace(/\b(a mezzogiorno|a mezzanotte|a pranzo|a cena)\b/gi, '')
    .replace(/\b(ogni giorno|tutti i giorni|ogni settimana|ogni mese|ogni \d+ giorni)\b/gi, '')
    .replace(/\b(per|di)\s+\d+(?:[.,]\d+)?\s*or[ae]\b/gi, '')
    .replace(/^[\s,:-]+|[\s,:-]+$/g, '')
    .trim();
}

function analyzePersonalHabits() {
  const s0 = stats(0), s1 = stats(-1);

}

function brainSingle(t0, raw) {
  const t = t0.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const oreM = t.match(/(\d+(?:[.,]\d+)?)\s*or[ae]/);
  const nums = oreM ? { total: null, parts: [] } : getNums(t);
  const num = nums.total;
  const c = catOf(t);
  const s = stats(0);
  const dateInfo = parseNaturalDate(t);
  const timeInfo = parseNaturalTime(t);
  const ds = dateInfo.ds;
  const when = dateInfo.explicit ? ` (${dateInfo.label})` : '';

  const p = pend;
  pend = null;

  const incIntent = /mi hanno dato|mi ha dato|mi sono entrati|aggiungi (?:questi )?soldi|aggiungi entrata|ho ricevuto|ricevuto|ho incassato|incassato|mi hanno pagato|mi ha pagato|entrata|accredit|regalo di|mi hanno regalato|trovato per terra|guadagnat|bonifico|rimborso|vinted|cashback/.test(t);
  const expIntent = /spes|segna.*euro|pagat|ho preso|comprat|\bpago\b|offert|costat|buttato|persi/.test(t);
  let m;

  // 0. Aiuto rapido
  if (/^(aiuto|help|comandi|cosa sai fare|che puoi fare)$/i.test(t.trim())) {
    showVoiceHelp = true;
    return 'Ecco gli esempi di comandi qui sopra.';
  }

  // 1. Cancellazione ultima spesa / entrata
  if (/^(cancella|elimina|rimuovi|annulla)\s+(?:l')?ultim[ao]\s+(spesa|entrata|movimento|operazione)$/i.test(t.trim())) {
    if (/entrata/.test(t)) {
      if (!S.inc.length) return 'Nessuna entrata da eliminare.';
      const rem = S.inc.pop();
      return `Eliminata entrata <b class='money-val'>+${eur(rem.a)}</b> (${esc(rem.t || 'Entrata')}).`;
    }
    if (!S.ex.length) return 'Nessuna spesa da eliminare.';
    const rem = S.ex[S.ex.length - 1];
    delEx(rem.id);
    return `Eliminata spesa <b class='money-val'>${eur(rem.a)}</b> (${esc(rem.n || 'Spesa')}).`;
  }

  // 2. Rettifica rapida ultima operazione
  if (/^(?:no[,]?\s*)?(?:erano|correggi|modifica|cambia|metti(?:lo|la)?\s+sotto|sposta\s+sotto)\b/i.test(t)) {
    const cats = getCats();
    if (c && lastActionMeta && lastActionMeta.kind === 'ex') {
      const targetEx = S.ex.find(x => x.id === lastActionMeta.id);
      if (targetEx) {
        targetEx.c = c;
        return `Spostato sotto <b>${cats[c][0]}</b> (<b class='money-val'>${eur(targetEx.a)}</b>).`;
      }
    }
    if (num != null && num > 0) {
      if (lastActionMeta && lastActionMeta.kind === 'inc') {
        const targetInc = S.inc.find(x => x.id === lastActionMeta.id);
        if (targetInc) {
          targetInc.a = Math.round(num * 100) / 100;
          return `Entrata corretta a <b class='ok money-val'>+${eur(targetInc.a)}</b>.`;
        }
      }
      const targetEx = (lastActionMeta && lastActionMeta.kind === 'ex' && S.ex.find(x => x.id === lastActionMeta.id)) || S.ex[S.ex.length - 1];
      if (targetEx) {
        targetEx.a = Math.round(num * 100) / 100;
        if (targetEx.fid) {
          const fill = S.fills.find(f => f.id === targetEx.fid);
          if (fill) fill.eur = targetEx.a;
        }
        return `Importo corretto a <b class='money-val'>${eur(targetEx.a)}</b> (${cats[targetEx.c]?.[0] || targetEx.c}).`;
      }
    }
  }

  // 3. Cambio impostazioni tramite chat
  if (/(?:imposta|cambia|metti|porta|fissa|modifica)\s+(?:lo\s+|il\s+)?stipendio/i.test(t) && num > 0) {
    S.sal = Math.round(num * 100) / 100;
    return `Stipendio impostato a <b class='money-val'>${eur(S.sal)}</b>.`;
  }
  if (/(?:imposta|cambia|metti|porta|fissa|modifica)\s+(?:il\s+)?budget/i.test(t) && num > 0) {
    S.bud = Math.round(num * 100) / 100;
    return `Budget del ciclo impostato a <b class='money-val'>${eur(S.bud)}</b>.`;
  }
  if (/^(?:budget|stipendio)\s+\d+/i.test(t) && num > 0) {
    if (/^stipendio/.test(t)) { S.sal = Math.round(num * 100) / 100; return `Stipendio aggiornato a <b class='money-val'>${eur(S.sal)}</b>.`; }
    S.bud = Math.round(num * 100) / 100; return `Budget aggiornato a <b class='money-val'>${eur(S.bud)}</b>.`;
  }
  if (/(?:aumenta|alza|aggiungi)\s+(?:il\s+)?budget\s+(?:di\s+)?\d+/i.test(t) && num > 0) {
    S.bud = Math.round((S.bud + num) * 100) / 100;
    return `Budget aumentato a <b class='money-val'>${eur(S.bud)}</b>.`;
  }
  if (/(?:abbassa|riduci|togli|scendi)\s+(?:il\s+)?budget\s+(?:di\s+)?\d+/i.test(t) && num > 0) {
    S.bud = Math.max(0, Math.round((S.bud - num) * 100) / 100);
    return `Budget ridotto a <b class='money-val'>${eur(S.bud)}</b>.`;
  }
  if (/giorno\s+(?:di\s+)?paga\s+(\d{1,2})/i.test(t)) {
    const pd = Math.min(31, Math.max(1, +t.match(/giorno\s+(?:di\s+)?paga\s+(\d{1,2})/i)[1]));
    S.payDay = pd;
    return `Giorno di paga impostato al <b>${pd}</b> del mese.`;
  }
  if (/(?:allinea|imposta|aggiorna)\s+(?:il\s+)?(?:patrimonio|saldo|liquidit[aà])\s+(?:a\s+)?/i.test(t) && num != null) {
    S.liq0 += (num - liq());
    return `Patrimonio allineato a <b class='money-val'>${eur(liq())}</b>.`;
  }
  if (/lavoro\s+dall[e']\s*(\d{1,2}(?:[:.]\d{2})?)\s+all[e']\s*(\d{1,2}(?:[:.]\d{2})?)/i.test(t)) {
    const wm = t.match(/lavoro\s+dall[e']\s*(\d{1,2})(?:[:.](\d{2}))?\s+all[e']\s*(\d{1,2})(?:[:.](\d{2}))?/i);
    S.workStart = `${pad(+wm[1])}:${wm[2] || '00'}`;
    S.workEnd = `${pad(+wm[3])}:${wm[4] || '00'}`;
    return `Orario lavoro aggiornato: <b>${S.workStart} – ${S.workEnd}</b>.`;
  }
  if (/tragitto\s+(\d+)\s*minut/i.test(t)) {
    S.commuteMins = Math.max(0, +t.match(/tragitto\s+(\d+)\s*minut/i)[1]);
    return `Durata tragitto impostata a <b>${S.commuteMins} minuti</b>.`;
  }
  if (/arrotondamento|spiccioli/.test(t)) {
    const off = /disattiva|spegni|togli|no/.test(t);
    S.roundUp = !off;
    return S.roundUp ? 'Arrotondamento spiccioli attivato.' : 'Arrotondamento spiccioli disattivato.';
  }
  if ((m = raw.match(/(?:crea|nuova|aggiungi)\s+categoria\s+([A-Za-zÀ-ÿ0-9\s]{2,20})$/i))) {
    const name = cap(m[1].trim());
    S.customCats.push({ id: 'c_' + uid(), name, col: '#38BDF8' });
    return `Categoria <b>${esc(name)}</b> creata.`;
  }

  // 4. Navigazione rapida tra schede
  if (/^(apri|vai a|mostra|portami su|fammi vedere)\s+(la\s+|le\s+|il\s+|i\s+)?(home|agenda|calendario|note|checklist|dati|soldi|analytics|auto|macchina|gpl|sistema|impostazioni)$/.test(t)) {
    if (/agenda|calendario/.test(t)) { tab = 'cal'; return 'Apertura Agenda.'; }
    if (/note|checklist/.test(t)) { tab = 'notes'; return 'Apertura Note & Checklist.'; }
    if (/dati|soldi|analytics/.test(t)) { tab = 'money'; return 'Apertura Dati & Analytics.'; }
    if (/auto|macchina|gpl/.test(t)) { tab = 'car'; return 'Apertura Auto & Mobilità.'; }
    if (/sistema|impostazioni/.test(t)) { tab = 'set'; return 'Apertura Sistema.'; }
    tab = 'home'; return 'Apertura Home.';
  }

  // 5. Modalità Vacanza & Privacy
  if (/modalita vacanza|sono in ferie|vado in vacanza|attiva vacanza|disattiva vacanza|fine vacanza|torno da vacanza/.test(t)) {
    const turnOff = /disattiva|fine|torno|spegni|chiudi/.test(t);
    toggleVacationMode(!turnOff, true);
    return !turnOff
      ? `Modalità Vacanza attiva · Budget <b class='money-val'>${eur(S.vacBud)}</b> · 0 km auto.`
      : 'Modalità Vacanza disattivata · Ciclo mensile ripristinato.';
  }
  if (/privacy|modalita ufficio|nascondi importi|mostra importi|sfoca/.test(t)) {
    const turnOff = /disattiva|spegni|mostra|togli/.test(t);
    S.priv = !turnOff;
    return S.priv ? 'Modalità Privacy attivata.' : 'Modalità Privacy disattivata.';
  }

  // 6. Smart Working / Remote / Ferie
  if (/smart ?working|lavoro da casa|remote|non vado in ufficio|resto a casa|sto a casa|prendo ferie|giorno di ferie|auto ferma|resto ad ancona/.test(t)) {
    const targetDs = dateInfo.explicit ? ds : today();
    if (!isOffDay(targetDs)) toggleOffDay(targetDs, true);
    return `Smart Working attivo (${dateInfo.label}) · 0 km auto.`;
  }

  // 7. Auto: Km Extra, Carpooling, Tagliando
  if (/km extra|chilometri extra|fatto \d+ km/.test(t) && num > 0) {
    S.extra[ds] = (S.extra[ds] || 0) + num;
    return `Aggiunti <b>${num} km extra</b>${when}.`;
  }
  if (/passaggio|carpooling/.test(t)) {
    const val = num > 0 ? num : 5;
    addInc(val, ds, 'Passaggio Carpooling', true);
    return `Passaggio carpooling <b class='ok money-val'>+${eur(val)}</b>.`;
  }
  if (/fatto il tagliando|azzera tagliando|reset tagliando/.test(t)) {
    S.maintLastKm = Math.round(car().totalTrackedKm);
    return 'Contatore tagliando azzerato.';
  }

  // 8. Note & Checklist
  if ((m = raw.match(/(?:spunta|segna\s+(?:come\s+)?(?:pres[oa]|fatt[oa]|completat[oa])|complet[ao]|ho\s+preso|depenna)\s+(?:il\s+|la\s+|lo\s+|i\s+|gli\s+|le\s+)?([A-Za-zÀ-ÿ0-9\s]{2,28}?)(?:\s+(?:dalla|nella|sulla)\s+(?:lista\s+(?:della\s+)?|checklist\s+)?([A-Za-zÀ-ÿ0-9\s]{2,24}))?$/i))) {
    const itemTarget = m[1].trim().toLowerCase();
    const listFilter = m[2] ? m[2].trim().toLowerCase() : null;
    for (const n of S.notes) {
      if (n.type !== 'checklist') continue;
      if (listFilter && !n.title.toLowerCase().includes(listFilter)) continue;
      const it = (n.items || []).find(x => x.txt.toLowerCase().includes(itemTarget));
      if (it) {
        it.done = true;
        n.updatedAt = Date.now();
        return `Spuntato <b>${esc(it.txt)}</b> in <b>${esc(n.title)}</b>.`;
      }
    }
  }

  if (/leggi (?:le )?(?:mie )?note|che note ho|mostra note|lista della spesa|cosa c'e nella lista/.test(t) && !/aggiungi|segna|scrivi|metti|crea/.test(t)) {
    if (!S.notes.length) return 'Non hai ancora nessuna nota o checklist salvata.';
    return S.notes.slice(0, 3).map(n => n.type === 'checklist'
      ? `<b>${esc(n.title)}</b>: ${n.items.filter(x => !x.done).map(x => esc(x.txt)).join(', ') || 'tutto completato'}`
      : `<b>${esc(n.title)}</b>: ${esc(n.body.slice(0, 80))}`
    ).join('<br>');
  }

  if ((m = raw.match(/(?:aggiungi|metti|segna|inserisci|scrivi)\s+(?:alla\s+|nella\s+|sulla\s+)?(?:lista\s+(?:della\s+)?|checklist\s+)([A-Za-zÀ-ÿ0-9\s]{2,24}?)(?:\s*[:,-]\s*|\s+)(.+)$/i))) {
    const listName = m[1].trim();
    const items = m[2].split(/,|\be\b/).map(x => x.trim()).filter(Boolean);
    addNoteOrChecklist(listName, items, true, true);
    return `Checklist <b>${esc(cap(listName))}</b> aggiornata (${items.map(esc).join(', ')}).`;
  }
  if ((m = raw.match(/(?:crea|nuova)\s+(?:una\s+)?(?:checklist|lista)\s+([A-Za-zÀ-ÿ0-9\s]{2,24}?)(?:\s*[:,-]\s*|\s+con\s+|\s+)(.+)$/i))) {
    const listName = m[1].trim();
    const items = m[2].split(/,|\be\b/).map(x => x.trim()).filter(Boolean);
    addNoteOrChecklist(listName, items, true, true);
    return `Checklist <b>${esc(cap(listName))}</b> creata.`;
  }
  if (/^(?:prendi nota|segna nelle note|scrivi una nota|nuova nota|appunta|ricordati che|nota)\b/i.test(t)) {
    const body = raw.replace(/^(?:prendi nota|segna nelle note|scrivi una nota|nuova nota|appunta|ricordati che|nota)\s*[:,-]?\s*/i, '').trim();
    if (!body) return 'Dimmi pure cosa vuoi annotare.';
    const parts = body.split(':');
    if (parts.length > 1 && parts[0].length <= 28) {
      addNoteOrChecklist(parts[0].trim(), parts.slice(1).join(':').trim(), false, true);
      return `Nota <b>${esc(cap(parts[0].trim()))}</b> salvata.`;
    }
    addNoteOrChecklist('Nota veloce', body, false, true);
    return `Annotato: «${esc(body.slice(0, 60))}».`;
  }

  // 9. Obiettivi & Abbonamenti via Voce
  if (/obiettivo/.test(t) && num > 0) {
    if (/versa|aggiungi|metti/.test(t) && S.goals.length) {
      const g = S.goals.find(x => t.includes(x.n.toLowerCase())) || S.goals[0];
      const prevS = g.s;
      g.s = Math.round((g.s + num) * 100) / 100;
      if (prevS < g.t && g.s >= g.t) setTimeout(launchConfetti, 250);
      return `Versati <b class='ok money-val'>${eur(num)}</b> in <b>${esc(g.n)}</b> (${eur(g.s)} / ${eur(g.t)}).`;
    }
    const gName = raw.replace(/.*obiettivo\s+(?:per\s+|di\s+)?/i, '').replace(/\d+([.,]\d+)?\s*(euro|eur|€).*/i, '').trim() || 'Risparmio';
    S.goals.push({ id: uid(), n: cap(gName), t: num, s: 0 });
    return `Obiettivo <b>${esc(cap(gName))}</b> (<b class='money-val'>${eur(num)}</b>) creato.`;
  }

  if (/abbonament|spesa fissa/.test(t) && num > 0) {
    const dayM = t.match(/\bil\s+(\d{1,2})\b/);
    const dayNum = dayM ? Math.min(31, Math.max(1, +dayM[1])) : 1;
    const divM = raw.match(/divis[oa]\s+(?:a\s+met[àa]\s+)?(?:con\s+)?([A-Za-zÀ-ÿ]+)/i);
    const splitN = divM ? 2 : 1;
    const splitWho = divM ? cap(divM[1]) : 'Amici';
    const rName = raw.replace(/.*?(abbonamento|spesa fissa)\s+/i, '').replace(/\d+([.,]\d+)?\s*(euro|eur|€).*/i, '').replace(/\bil\s+\d{1,2}\b/i, '').replace(/divis[oa].*/i, '').trim() || 'Abbonamento';
    S.rec.push({ id: uid(), n: cap(rName), a: num, day: dayNum, c: c || 'altro', splitN, splitWho, st: today().slice(0, 7), sk: [] });
    applyRec();
    return `Abbonamento <b>${esc(cap(rName))}</b> (<b class='money-val'>${eur(num)}</b>, giorno ${dayNum}${splitN > 1 ? `, ÷2 con ${esc(splitWho)}` : ''}) aggiunto.`;
  }

  // 10. Debiti & Crediti
  if (num > 0 && (m = raw.match(/([A-Za-zÀ-ÿ]+)\s+mi\s+deve/i))) return addDebt(cap(m[1]), num, 'due', true);
  if (num > 0 && (m = raw.match(/\bdevo\s+[\d.,]+\s*(?:euro|€)?\s*a\s+([A-Za-zÀ-ÿ]+)/i))) return addDebt(cap(m[1]), num, 'owe', true);

  if ((m = raw.match(/([A-Za-zÀ-ÿ]+)\s+(?:mi\s+ha|ha)\s+(?:ridato|restituito|rimborsato|dato)/i)) || (m = raw.match(/(?:ridato|restituito|rimborsato)\s+(?:a\s+)?([A-Za-zÀ-ÿ]+)/i))) {
    const nm = m[1].toLowerCase();
    if (!['soldi', 'euro', 'dei', 'gli', 'un', 'una', 'questi'].includes(nm)) {
      const i = S.debts.findIndex(g => !g.p && g.dir === 'due' && g.who.toLowerCase() === nm);
      if (i >= 0) {
        const g = S.debts[i];
        settle(i, true);
        return `Credito saldato: <b>${esc(g.who)}</b> (+<b class='ok money-val'>${eur(g.a)}</b>).`;
      } else if (incIntent && num > 0) {
        addInc(num, ds, `Da ${cap(m[1])}`, true);
        return `Entrata da <b>${esc(cap(m[1]))}</b> <b class='ok money-val'>+${eur(num)}</b>${when}.`;
      }
    }
  }

  if (/chi mi deve|a chi devo|\bdebiti\b|\bcrediti\b/.test(t)) {
    const o = S.debts.filter(g => !g.p);
    return o.length ? o.map(g => `${esc(g.who)} ${g.dir === 'due' ? 'ti deve' : 'devi'} <b>${eur(g.a)}</b>`).join('<br>') : 'Nessun debito aperto.';
  }

  // 11. Memoria conversazionale multi-turno
  if (p && !/\bposso\b|quanto/.test(t)) {
    if (p.mode === 'inc' && num != null) {
      addInc(num, ds, 'Entrata', true);
      return `Entrata <b class='ok money-val'>+${eur(num)}</b>${when}.`;
    }
    if (p.c && num != null) return addIt(c || p.c, num, ds, when, raw, null, nums.parts);
    if (p.a != null && incIntent) {
      addInc(p.a, ds, 'Entrata', true);
      return `Entrata <b class='ok money-val'>+${eur(p.a)}</b>${when}.`;
    }
    if (p.a != null && (c || expIntent)) return addIt(c || 'altro', num ?? p.a, ds, when, raw, null, nums.parts);
  }

  // 12. Stipendio
  if (/stipendio|busta paga/.test(t) && /arriv|ricev|accredit|pagat|preso|incassat/.test(t) && !/quando|\bse\b/.test(t)) {
    const a = num > 0 ? num : S.sal;
    addInc(a, ds, 'Stipendio', true);
    return `Stipendio <b class='ok money-val'>+${eur(a)}</b>${when}.`;
  }

  // 13. Entrata flessibile
  if (incIntent) {
    if (num != null && num > 0) {
      const label = /regal/.test(t) ? 'Regalo' : /rimbors/.test(t) ? 'Rimborso' : /vinted/.test(t) ? 'Vinted' : 'Entrata';
      addInc(num, ds, label, true);
      return `${label} <b class='ok money-val'>+${eur(num)}</b>${when}.`;
    } else {
      pend = { mode: 'inc' };
      return 'Quanto hai ricevuto?';
    }
  }

  // 14. Simulazione What-If & Regola 48h
  if (/\bse\b.*(?:spend|pag|compr|prend).*come chiud/i.test(t) && num > 0) {
    const afterRem = Math.round((s.spendableRem - num) * 100) / 100;
    const afterDaily = afterRem <= 0 ? 0 : Math.round((afterRem / s.left) * 100) / 100;
    return `Se spendi <b class='money-val'>${eur(num)}</b>: residuo <b class='${afterRem >= 0 ? 'ok' : 'bad'} money-val'>${eur(afterRem)}</b> · quota giornaliera <b class='money-val'>${eur(afterDaily)}</b>/g.`;
  }

  if (/\bposso\b|ce la faccio|mi conviene|mi basta|permettermi|vorrei comprare/.test(t) && num > 0) {
    const itemName = raw.replace(/.*?(comprare|prendere|spendere|permettermi)\s+(un|una|uno|il|la|lo|i|gli|le)?\s*/i, '').replace(/\s*(da|di|per)?\s*\d+([.,]\d+)?\s*(euro|eur|€).*/i, '').trim() || 'Acquisto extra';
    const parkBtn = `<div style='margin-top:8px'><button class='btn s sm' onclick="parkItem('${escAttr(itemName)}',${num})">Parcheggia 48h</button></div>`;
    const budgetPool = S.vacMode ? vacStats().rem : s.spendableRem;
    if (num <= budgetPool) {
      return `Sì · Residuo <b class='money-val'>${eur(budgetPool - num)}</b>.${parkBtn}`;
    }
    const days = Math.ceil((num - budgetPool) / Math.max(1, s.per));
    return `Mancano <b class='money-val'>${eur(num - budgetPool)}</b> (~${days}g).${parkBtn}`;
  }

  // 15. Analisi abitudini, KPI e interrogazioni
  if (/abitudin|come spendo|analizza|riassunto|panoramica|ritmo heets/.test(t)) {
    return analyzePersonalHabits();
  }
  if (/in che giorno spendo|giorno piu caro/.test(t)) {
    const byDow = [0, 0, 0, 0, 0, 0, 0];
    S.ex.filter(e => !e.rid && !e.vac).forEach(e => { byDow[new Date(e.d + 'T12:00').getDay()] += (+e.a || 0); });
    const mx = Math.max(...byDow);
    if (mx <= 0) return 'Nessun dato sufficiente.';
    const dIdx = byDow.indexOf(mx);
    return `Il giorno in cui spendi di più è <b>${DN[dIdx]}</b> (<b class='money-val'>${eur(mx)}</b> totali).`;
  }
  if (/spesa piu alta|spesa massima|acquisto piu grande/.test(t)) {
    const big = [...s.exList].filter(e => !e.rid).sort((a, b) => b.a - a.a)[0];
    return big ? `Spesa più alta del ciclo: <b class='money-val'>${eur(big.a)}</b> (${esc(big.n || 'Altro')}, ${big.d.split('-').reverse().join('/')}).` : 'Nessuna spesa nel ciclo.';
  }
  if (/quanti giorni.*stipendio|quando arriva lo stipendio|prossimo stipendio/.test(t)) {
    return `Mancano <b>${s.left} ${s.left === 1 ? 'giorno' : 'giorni'}</b> al prossimo stipendio (ciclo ${s.cyc.label}).`;
  }

  if (/quanto ho (gia )?speso|quanto spendo/.test(t)) {
    if (c) {
      const cats = getCats();
      const catTot = s.exList.filter(e => e.c === c).reduce((a, e) => a + e.a, 0);
      return `${cats[c][0]} nel ciclo: <b class='money-val'>${eur(catTot)}</b>.`;
    }
    const o = /oggi/.test(t);
    const tot = (o ? S.ex.filter(e => !e.vac && e.d === today()) : s.exList).reduce((a, e) => a + e.a, 0);
    return `${o ? 'Oggi' : 'Ciclo'} <b class='money-val'>${eur(tot)}</b>.`;
  }

  if (/quanto (ho|mi resta|mi rimane|posso spendere)|come sto messo|situazione|budget|saldo|liquidit|patrimonio|disponibil/.test(t) && !expIntent) {
    if (S.vacMode) {
      const vs = vacStats();
      return `Patrimonio <b class='money-val'>${eur(liq())}</b> · Vacanza residuo <b class='${vs.rem > 0 ? 'ok' : 'bad'} money-val'>${eur(vs.rem)}</b> (spesi ${eur(vs.spent)} su ${eur(vs.bud)}).`;
    }
    return `Patrimonio <b class='money-val'>${eur(liq())}</b> · Oggi <b class='${s.daily > 0 ? 'ok' : 'bad'} money-val'>${eur(s.daily)}</b> · Ciclo <b class='money-val'>${eur(s.rem)}</b>.`;
  }

  if (/autonomia|quanti km|quanto gpl|gpl.*(rimast|resta)|riserva|quando finisco il gpl|arrivo a domani/.test(t)) {
    const k = car();
    return k.last ? `<b>${Math.round(k.rem)} km</b> (${k.tk}/4) · ${k.reserveDay}.` : 'Nessun pieno registrato.';
  }

  // 16. Interrogazione impegni del giorno
  if (/(?:che|quali)\s+impegn[io]\s+ho|cosa\s+ho\s+in\s+agenda|impegni\s+di\s+(?:oggi|domani|dopodomani)/i.test(t)) {
    const evDay = evOn(ds);
    if (!evDay.length) return `Nessun impegno extra per ${dateInfo.label}.`;
    return `Impegni (${dateInfo.label}):<br>` + evDay.map(e => `• <b>${e.tm}</b> ${esc(e.t)}`).join('<br>');
  }

  // 17. Spostamento o riprogrammazione di un appuntamento esistente
  if (/^(?:sposta|rimanda|anticipa|posticipa)\s+/i.test(t) && (dateInfo.explicit || timeInfo.explicit) && num == null) {
    const evPart = raw.replace(/^(?:sposta|rimanda|anticipa|posticipa)\s+(?:l'appuntamento\s+|l'impegno\s+|il\s+|la\s+|lo\s+|i\s+|gli\s+|le\s+)?/i, '')
      .replace(/\b(?:a|al|allo|alla|ai|agli|alle|per)\s+(?:domani|dopodomani|oggi|luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabat[oa]|domenic[ae]|tra\s+\d+\s+giorn[io]|\d{1,2}\s+[a-z]+|\d{1,2}[:.]\d{2}|ore\s+\d{1,2}|all[e']\s*\d{1,2}).*$/i, '')
      .trim();
    if (evPart) {
      const targetEv = S.ev.find(e => e.t.toLowerCase().includes(evPart.toLowerCase()));
      if (targetEv) {
        if (dateInfo.explicit) targetEv.d = ds;
        if (timeInfo.explicit) targetEv.tm = timeInfo.tm;
        return `Spostato <b>${esc(targetEv.t)}</b> · ${dateInfo.explicit ? dateInfo.label : targetEv.d.split('-').reverse().join('/')} alle <b>${targetEv.tm}</b>.`;
      }
    }
  }

  // 18. Cancellazione appuntamento via voce
  if (/^(cancella|elimina|annulla|rimuovi)\s+(?:l'appuntamento|l'impegno|appuntamento|impegno)?/i.test(t) && !num) {
    const target = cleanEventTitle(raw.replace(/^(cancella|elimina|annulla|rimuovi)\s+(?:l'appuntamento|l'impegno|appuntamento|impegno)?\s*(?:dal|da|con|per)?\s*/i, ''));
    if (target) {

  // 19. Appuntamento diretto con Orario Esplicito

      setTimeout(() => sendToAppleCalendarShortcut(cap(title), ds, timeInfo.tm, dur), 180);
    }
    return `In agenda: <b>${esc(cap(title))}</b> · ${dateInfo.label} alle <b>${timeInfo.tm}</b>${r ? ' (ricorrente)' : ''}.<div style='margin-top:8px'><button class='btn s sm' onclick="sendToAppleCalendarShortcut('${escAttr(cap(title))}','${ds}','${timeInfo.tm}',${dur})">Aggiungi a Calendario iPhone</button></div>`;
  }

  // 20. Time-Finder Contestuale
  const act = /agenda|calendario|appuntament|ricordami/.test(t) || (/voglio|vorrei|devo |organizza|pianifica|prenota|trova|trovami|incastra|quando|andare|andiamo|stasera|domani|dopodomani|prossim/.test(t) && num == null && !expIntent);

  const divisoConM = raw.match(/(?:divis[oa]|a met[àa]|alla romana)\s+(?:con\s+)?([A-Za-zÀ-ÿ]+)/i);
  if (/dividi|a meta|50 e 50|alla romana|diviso/.test(t) || inPeopleM) {

    const who = divisoConM && !['due', 'tre', 'quattro', 'amici'].includes(divisoConM[1].toLowerCase()) ? cap(divisoConM[1]) : 'Amici';

function splitMultiClauses(raw) {
  if (/(?:lista|checklist|nota)/i.test(raw) && !/(?:\be poi\b|\binoltre\b|\bah e\b|;)/i.test(raw)) {
    return [raw.trim()];
  }
  const parts = raw
    .split(/(?:\s*;\s*|\s+\be\s+poi\b\s+|\s+\binoltre\b\s+|\s+\bah e\b\s+|,\s+(?=(?:ho|segna|metti|aggiungi|trovami|ricordami|mi hanno|domani|oggi|luned|marted|mercoled|gioved|venerd|sabat|domenic|spes|pagat|sposta|no\b)))/i)
    .map(s => s.trim())
    .filter(Boolean);
  return parts.length ? parts : [raw.trim()];
}

function brain(raw) {
  if (/riepilogo (?:della |di questa )?settimana|com.{1,2} andata la settimana|weekly/i.test(raw)) {
    openWeekSheet();
    return 'Ecco il riepilogo della settimana.';
  }
  const clauses = splitMultiClauses(raw);
  if (clauses.length === 1) {
    return brainSingle(clauses[0].toLowerCase(), clauses[0]);
  }
  const results = clauses.map(cl => '• ' + brainSingle(cl.toLowerCase(), cl));
  return results.join('<br>');
}

function weekKey() { const d = new Date(); d.setDate(d.getDate() - d.getDay()); return iso(d); }

function weekData() {

const NOTICE_MS = 7000, noticeSeen = {};
function noticeLive(key) {

function encodeHeaderUTF8(str) {
  try {
    const bytes = new TextEncoder().encode(String(str));
    let bin = '';
    bytes.forEach(b => { bin += String.fromCharCode(b); });
    return '=?UTF-8?B?' + btoa(bin) + '?=';
  } catch (e) {
    return String(str).replace(/[^\x20-\x7E]/g, '-');
  }
}

async function ntfyPush(title, body, priority = 3) {
  const n = nf();
  const topic = (n.ntfyTopic || '').trim().replace(/^https?:\/\/ntfy\.sh\//i, '');
  if (!n.ntfyOn || !topic) return false;
  try {
    const res = await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}`, {
      method: 'POST',
      keepalive: true,
      headers: {
        'Title': encodeHeaderUTF8(title),
        'Priority': String(priority),
        'Tags': priority >= 4 ? 'warning' : 'bell'
      },
      body
    });
    return res.ok;
  } catch (e) {
    return false;
  }
}

async function sysNotify(title, body, tag, priority = 3) {

      if (reg && reg.showNotification) { await reg.showNotification(title, { body, tag }); delivered = true; }

    if (!delivered) {
      try { new Notification(title, { body, tag }); delivered = true; } catch (e) {}

  }
  const pushed = await ntfyPush(title, body, priority);
  return delivered || pushed;
}

function icsT(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n'); }

function buildReminders() {
  const n = nf(), t = n.types, L = [], stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const z = (ds, tm) => ds.replace(/-/g, '') + 'T' + tm.replace(':', '') + '00';

    if (o.rr) L.push('RRULE:' + o.rr);

  };

  const tdy = today();

    if (d.getDate() > Math.min(targetDay, dimCurr)) d.setMonth(d.getMonth() + 1);
    const dimTarget = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(targetDay, dimTarget));

      else if (e.r && e.r.startsWith('i')) {

    const pd = Math.min(31, Math.max(1, +S.payDay || 1));
    ev('pay', nextDom(pd), '09:00', `Stipendio: registralo in Leo Wealth (${eur(S.sal)})`, {
      trig: '-PT2H',
      rr: 'FREQ=MONTHLY;BYMONTHDAY=' + (pd > 28 ? -1 : pd)
    });
    count++;
  }

  if (t.fisse) {
    S.rec.forEach(r => {
      const rDay = Math.min(31, Math.max(1, +r.day || 1));
      ev('rec-' + r.id, nextDom(rDay), '09:00', `Addebito ${r.n} (${eur(r.a)})`, {
        trig: +r.a >= 15 ? '-PT24H' : '-PT2H',
        rr: 'FREQ=MONTHLY;BYMONTHDAY=' + (rDay > 28 ? -1 : rDay)
      });
      count++;
    });
  }

  if (false) {
    const c = car();
    if (c.last && c.reserveDs) {
      ev('gpl-res', c.reserveDs, '08:00', `Rifornimento GPL consigliato (${Math.round(c.rem)} km residui)`, {
        trig: '-PT12H'
      });
      count++;
    }
  }

  if (t.sera) {
    ev('sera', tdy, pad2h(n.evening), 'Leo Wealth: controlla o conferma 0 spese oggi', { rr: 'FREQ=DAILY' });
    count++;
  }

  if (t.backup) {
    const d = new Date();
    d.setMonth(d.getMonth() + 1);
    d.setDate(1);
    ev('backup', iso(d), '10:00', 'Esporta backup dati Leo Wealth', { rr: 'FREQ=MONTHLY;BYMONTHDAY=1' });
    count++;
  }

  if (t.parcheggio) {
    S.parked.forEach(x => {
      const d = new Date(x.createdAt + 48 * 3600000);
      if (d > new Date()) {
        ev('park-' + x.id, iso(d), pad2h(d.getHours()), `Decidi acquisto 48h: ${x.name} (${eur(x.amount)})`);
        count++;
      }
    });
  }

  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Leo Wealth//IT', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Leo Wealth', ...L, 'END:VCALENDAR'].join('\r\n');
  return { ics, count };
}

function exportReminders() {
  const { ics, count } = buildReminders();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
  a.download = 'leo-wealth-promemoria.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast(`${count} promemoria pronti per il Calendario`);
}

function undoLastVoiceCommand() {
  if (!lastVoiceSnapshot) return;
  try {
    S = migrate(JSON.parse(lastVoiceSnapshot));

}

function ask(q) {
  if (kbTarget) kbClose();
  q = (q || '').trim();
  if (!q) return;
  vib(15);
  lastVoiceSnapshot = JSON.stringify(S);
  const res = brain(q);
  save();
  setAns(res);
  R();
  scrollTo(0, 0);
}

function mic() {
  if (kbTarget) kbClose();
  vib(20);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Voce non supportata');
  const r = new SR();
  r.lang = 'it-IT';
  r.onresult = e => ask(e.results[0][0].transcript);
  r.start();
  toast('In ascolto...');
}

function handleUrlActions() {
  const p = new URLSearchParams(location.search);
  let changed = false;
  if (p.has('add')) {
    const c = p.get('add').toLowerCase();
    if (getCats()[c] && FIX[c]) {
      addEx(c, FIX[c], today(), 'Rapido');
      changed = true;
    }
  }
  if (p.get('sw') === '1') {
    if (!isOffDay(today())) toggleOffDay(today());
    changed = true;
  }
  if (p.get('check') === '1') {
    nfTick(true);
    toast('Controllo avvisi e push eseguito');
    changed = true;
  }
  if (p.get('brief') === '1') {
    sendMorningBriefPush().then(ok => {
      if (ok) toast('Briefing mattutino inviato');
    });
    changed = true;
  }
  if (changed && history.replaceState) {
    history.replaceState(null, '', location.pathname);
  }
}

const TABS = [
  ['home', I('home', 17), 'Home', home],
  ['cal', I('cal', 17), 'Agenda', cal],
  ['notes', I('note', 17), 'Note', notesV],
  ['money', I('chart', 17), 'Dati', money]
];

function R() {
  try {
    document.body.className = [
      S.priv ? 'blur-mode' : '',
      $('#sh').classList.contains('on') ? 'sheet-open' : '',
      kbTarget ? 'kb-open' : ''
    ].filter(Boolean).join(' ');

    const y = scrollY;
    const viewEl = $('#v');
    const navEl = $('#nv');
    const activeTab = tab === 'set'
      ? ['set', I('gear', 17), 'Sistema', settingsV]
      : tab === 'subs' ? ['subs', I('star', 17), 'Abbonamenti', subsV]
      : (TABS.find(t => t[0] === tab) || TABS[0]);
    if (R.last !== tab) {
      document.body.classList.add('tab-enter');
      clearTimeout(R.te); R.te = setTimeout(() => document.body.classList.remove('tab-enter'), 700);
      R.last = tab;
    }

    if (viewEl) viewEl.innerHTML = activeTab[3]();
    if (navEl) navEl.innerHTML = TABS.map(t => `<button class="${t[0] === tab ? 'on' : ''}" onclick="vib(12);tab='${t[0]}';R();scrollTo(0,0)"><span>${t[1]}</span><span>${t[2]}</span></button>`).join('');

    if (tab === 'home') {
      const s = stats(0);
      const curr = {
        liq: liq(),
        today: S.vacMode ? vacStats().spentToday : s.daily,
        cyc: S.vacMode ? vacStats().rem : s.rem
      };
      if (prevKpiVals) {
        animateNum($('#kpi-liq'), prevKpiVals.liq, curr.liq);
        animateNum($('#kpi-today'), prevKpiVals.today, curr.today);
        animateNum($('#kpi-cyc'), prevKpiVals.cyc, curr.cyc);
      }
      prevKpiVals = curr;
    }

    scrollTo(0, y);
  } catch (err) {
    console.error('Render error:', err);
    try {
      const v = $('#v');
      if (v && !v.children.length) v.innerHTML = `<div class='card' style='margin-top:40px'><b>Qualcosa non va</b><div class='m' style='margin:6px 0 12px'>Errore di visualizzazione. I tuoi dati sono al sicuro.</div><button class='btn' style='width:100%' onclick='location.reload()'>Ricarica</button><button class='btn s' style='width:100%;margin-top:8px' onclick='exp()'>Esporta backup</button></div>`;
    } catch (_) {}
  }
}

function bootAppSync() {
  try {
    initHaptics();
    if (location.search.includes('_v=') && history.replaceState) {
      const clean = new URL(location.href);
      clean.searchParams.delete('_v');
      history.replaceState(null, '', clean.pathname + clean.search);
    }
    syncVacationDay();
    applyRec();
    tab = 'home';
    R();
    handleUrlActions();
    DB.init();
    setTimeout(nfTick, 1200);
    setInterval(nfTick, 60000);
    if (loadWarn) toast(loadWarn === 'restored' ? 'Dati danneggiati: ripristinato l’ultimo backup automatico' : 'Dati non leggibili: copia conservata, si riparte da zero');
    checkCycleCelebration();
    requestPersistentStorage();
    if (S.cloud && S.cloud.key && S.cloud.bin) {
      setTimeout(() => cloudPull(true), 1200);
    }
  } catch (err) {
    console.error('Boot error:', err);
  }
}
