<!DOCTYPE html>
<html lang="it" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leo Wealth">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%23000000'/%3E%3Crect x='14' y='14' width='152' height='152' rx='28' fill='%23111113' stroke='%23222227' stroke-width='2'/%3E%3Ctext x='90' y='108' text-anchor='middle' fill='%23ffffff' font-family='-apple-system,sans-serif' font-size='56' font-weight='800' letter-spacing='-2'%3ELW%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Leo%20Wealth%22%2C%22short_name%22%3A%22Leo%20Wealth%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
<title>MY SPACE</title>
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --s1:#0E0E11;
  --s2:#16161A;
  --t:#FFFFFF;
  --m:#84848C;
  --b:rgba(255,255,255,.075);
  --bh:rgba(255,255,255,.22);
  --ok:#32D74B;
  --w:#F59E0B;
  --bad:#EF4444;
  --vac:#38BDF8;
  --safe-top:max(env(safe-area-inset-top,0px),48px);
  --top-gap:calc(var(--safe-top) + 22px);
  box-sizing:border-box;
}
html{
  scroll-padding-top:var(--top-gap);
  overflow-x:hidden;
  background:#000000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  overflow-x:hidden;
  background:#000000;
  color:var(--t);
  font:13.5px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

/* Copertura nero OLED puro sotto la status bar iOS per evitare fasce sbiadite */
.safe-top-cap{
  position:fixed;
  top:0;left:0;right:0;
  height:calc(var(--top-gap) - 8px);
  background:#000000;
  z-index:45;
  pointer-events:none;
}

.app-shell{
  max-width:448px;
  width:100%;
  min-height:100dvh;
  margin:0 auto;
  background:#000000;
  border-left:1px solid rgba(255,255,255,.045);
  border-right:1px solid rgba(255,255,255,.045);
  padding:var(--top-gap) 14px calc(92px + env(safe-area-inset-bottom,0px));
  position:relative;
  transform-origin:top center;
  transition:transform .28s cubic-bezier(.16,1,.3,1),border-radius .28s cubic-bezier(.16,1,.3,1),filter .28s ease;
}
body.sheet-open .app-shell,
body:has(#sh.on) .app-shell{
  transform:scale(.962) translateY(4px);
  border-radius:22px;
  filter:brightness(.82);
  overflow:hidden;
}

.kicker{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.11em;
  color:var(--m);
  font-weight:600;
  margin:0;
  display:block;
}
h1{
  font-size:17px;
  font-weight:700;
  margin:2px 0 0;
  letter-spacing:-.35px;
  line-height:1.15;
}
h2{
  font-size:9.5px;
  color:var(--m);
  text-transform:uppercase;
  letter-spacing:.11em;
  margin:15px 2px 7px;
  font-weight:600;
}
.hero-num{
  font-size:clamp(28px,8vw,34px);
  font-weight:800;
  letter-spacing:-1.15px;
  line-height:1.05;
}
.big{font-size:clamp(19px,5.2vw,22px);font-weight:800;letter-spacing:-.55px;line-height:1.12}
.m{color:var(--m);font-size:11px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.w{color:var(--w)}

.card{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:18px;
  padding:13px;
  margin-bottom:9px;
  max-width:100%;
  transition:border-color .16s,transform .14s;
}
.card.tap{cursor:pointer}
.card.tap:hover{border-color:var(--bh)}
.lp{user-select:none;-webkit-user-select:none}
.lp:active{transform:scale(.978);border-color:rgba(255,255,255,.32)}

/* Semaforo silenzioso sulla Card Patrimonio */
.hero-card{
  background:var(--s1);
  border-color:var(--hero-border,rgba(255,255,255,.12));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 14px 34px rgba(0,0,0,.65);
  transition:background .35s ease,border-color .35s ease;
}
.hero-card{background:var(--s1)!important;border-color:var(--b)!important;box-shadow:none!important}
.hero-card .badge{background:rgba(255,255,255,.08)!important;color:var(--t)!important}
.app-title{font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--t)}
.hero-stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}

.cmd-bar{
  background:var(--s1);
  border:1px solid rgba(255,255,255,.1);
  border-radius:13px;
  padding:3px 5px 3px 9px;
  display:flex;
  align-items:center;
  gap:4px;
  height:40px;
  transition:border-color .15s;
}
.cmd-bar:focus-within{border-color:rgba(255,255,255,.36)}

.eye-inline{
  width:22px;height:22px;border-radius:7px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  color:var(--m);
  display:inline-flex;align-items:center;justify-content:center;
  padding:0;flex:none;
}
.eye-inline.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF}

.row{display:flex;align-items:center;gap:8px;min-width:0}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}

.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g2>div,.g3>div{min-width:0}

.hero-stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  padding-top:11px;
  margin-top:11px;
  border-top:1px solid var(--b);
}
.hstat{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.04);
  padding:8px 8px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  min-height:62px;
  cursor:pointer;
  transition:background .15s,border-color .15s;
}
.hstat:hover{background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.1)}
.hstat b{display:block;font-size:13.5px;font-weight:800;margin-top:3px;color:var(--t);letter-spacing:-.3px}
.hstat .sub-stat{font-size:9.5px;color:var(--m);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Barra di stato compatta a 3 colonne: Streak | Tesoretto | Smart Working */
.gami-pill{
  display:grid;
  grid-template-columns:1fr 1px 1fr 1px 1fr;
  align-items:center;
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:14px;
  padding:7px 8px;
  margin-bottom:9px;
  gap:6px;
}
.gami-div{height:22px;background:var(--b)}
.gami-cell{
  display:flex;align-items:center;gap:6px;
  min-width:0;cursor:pointer;
  padding:3px 4px;border-radius:9px;
  transition:background .15s;
}
.gami-cell:hover{background:rgba(255,255,255,.04)}
.gami-cell.sw-on{background:rgba(50,215,75,.11)}
.gami-ico{
  width:24px;height:24px;border-radius:7px;
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  flex:none;
}
.gami-cell.sw-on .gami-ico{background:rgba(50,215,75,.2);color:var(--ok)}

.qgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.gami-pill.one{grid-template-columns:1fr}
.qgrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-bottom:9px;
}
.qbtn{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:13px;
  padding:8px 5px;
  min-height:54px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2.5px;
  text-align:center;
  min-width:0;
}
.qbtn:hover{border-color:var(--bh);background:var(--s2)}
.qbtn.pri{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.qbtn.austerity{background:#09090B;border-color:#1F1F23;color:#8E8E93}
.qbtn.austerity.pri{background:#222226;border-color:#36363C;color:#E4E4E7}
.qbtn b{font-size:11.5px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.qbtn .qsub{font-size:9px;color:var(--m);line-height:1}
.qbtn.pri .qsub{color:rgba(0,0,0,.6)}
.qbtn.austerity.pri .qsub{color:#A1A1AA}

button,input,select,textarea{font:inherit;color:var(--t)}
button{
  cursor:pointer;
  transition:transform .13s cubic-bezier(.16,1,.3,1),opacity .13s,background .15s,border-color .15s;
}
button:active{transform:scale(.96);opacity:.9}

.btn{
  background:#FFFFFF;
  color:#000000;
  border:1px solid #FFFFFF;
  border-radius:12px;
  padding:9px 13px;
  font-weight:600;
  font-size:12px;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.btn:hover{background:#E5E5EA}
.btn.s{background:var(--s1);color:var(--t);border:1px solid var(--b)}
.btn.s:hover{background:var(--s2);border-color:var(--bh)}
.btn.d{background:rgba(239,68,68,.12);color:var(--bad);border:1px solid rgba(239,68,68,.28)}
.btn.sm{padding:6px 10px;font-size:11px;border-radius:9px}

.icon-btn{
  width:34px;height:34px;border-radius:11px;
  background:var(--s1);border:1px solid var(--b);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--m);padding:0;flex:none;
}
.icon-btn:hover{color:var(--t);border-color:var(--bh)}
.icon-btn.on{color:#000000;background:#FFFFFF;border-color:#FFFFFF}

input,select,textarea{
  background:#000000;
  border:1px solid var(--b);
  border-radius:11px;
  padding:9px 11px;
  width:100%;
  max-width:100%;
  min-width:0;
  font-size:16px;
  outline:0;
  -webkit-appearance:none;
  transition:border-color .15s;
}
textarea{resize:vertical;min-height:82px;font-size:14px}
input[type="date"],input[type="time"]{min-height:38px;font-size:13.5px}
input[type="time"]::-webkit-calendar-picker-indicator,
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.65}
input:focus,select:focus,textarea:focus{border-color:#FFFFFF}
label{
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--m);
  font-weight:600;
  display:block;
  margin:9px 0 4px;
}

.seg{
  display:flex;
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:12px;
  padding:3px;
  gap:3px;
}
.seg button{
  flex:1;min-width:0;background:0;border:0;
  border-radius:9px;padding:6px 4px;
  font-size:10.5px;font-weight:500;color:var(--m);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.seg button.on{background:#FFFFFF;color:#000000;font-weight:600}

nav.liquid-dock{
  position:fixed;
  left:14px;right:14px;
  bottom:max(12px,env(safe-area-inset-bottom,12px));
  max-width:420px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-around;
  background:rgba(16,16,20,.86);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.11);
  box-shadow:0 12px 32px rgba(0,0,0,.85);
  border-radius:22px;
  padding:5px;
  z-index:30;
}
nav.liquid-dock button{
  flex:1;min-width:0;background:0;border:0;
  padding:6px 2px;border-radius:16px;
  color:var(--m);font-size:9px;font-weight:500;
  display:flex;flex-direction:column;align-items:center;gap:2.5px;
}
nav.liquid-dock button.on{
  color:#FFFFFF;
  background:rgba(255,255,255,.11);
  font-weight:600;
}

.fab{
  position:fixed;
  right:max(16px,calc(50vw - 208px));
  bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:42px;height:42px;border-radius:13px;
  border:1px solid rgba(255,255,255,.22);
  background:#FFFFFF;color:#000000;
  font-size:20px;font-weight:600;line-height:1;
  box-shadow:0 8px 22px rgba(0,0,0,.8);
  z-index:25;
  display:flex;align-items:center;justify-content:center;
}

.leds{display:flex;gap:4px}
.led{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.1)}
.led.on{background:var(--ok)}
.led.lo{background:var(--w)}
.led.cr{background:var(--bad)}

.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:visible;margin-top:6px;position:relative}
.bar i{display:block;height:100%;border-radius:2px;transition:width .35s cubic-bezier(.16,1,.3,1)}
.pace-tick{position:absolute;top:-2px;width:1.5px;height:8px;background:rgba(255,255,255,.55);border-radius:1px;pointer-events:none}

.li-card{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:14px;
  padding:10px 12px;
  margin-bottom:7px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  touch-action:pan-y;
}
.li{
  display:flex;align-items:center;gap:9px;
  padding:9px 0;
  border-bottom:1px solid var(--b);
  touch-action:pan-y;
}
.li:last-child{border:0;padding-bottom:2px}
.li:first-child{padding-top:2px}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.x{background:0;border:0;color:var(--m);font-size:12px;padding:4px 6px}
.x:hover{color:var(--bad)}

.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wday{
  background:var(--s1);
  border:1px solid var(--b);
  border-radius:13px;
  padding:7px 2px;
  min-height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  color:var(--m);
}
.wday.t{border-color:rgba(255,255,255,.45)}
.wday.s{background:#FFFFFF;color:#000000;border-color:#FFFFFF}
.wday.off:not(.s){background:rgba(255,255,255,.03);border-style:dashed}
.wday .wn{font-size:8.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.wday .wd{font-size:13px;font-weight:700}
.wday .wdots{display:flex;gap:2px;height:4px}
.wday .wdots u{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal b{font-size:10px;color:var(--m);font-weight:600;padding-bottom:4px}
.cal button{
  aspect-ratio:1;border-radius:10px;border:1px solid transparent;
  background:rgba(255,255,255,.04);font-size:12px;position:relative;padding:0;
}
.cal button.t{border-color:rgba(255,255,255,.45)}
.cal button.s{background:#FFFFFF;color:#000000;font-weight:700}
.cal button.off{border-color:rgba(255,255,255,.22);border-style:dashed}
.cal button.e{opacity:.15;pointer-events:none}
.cal i{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal i u{width:3.5px;height:3.5px;border-radius:50%;background:var(--ok)}
.cal i u.x2{background:var(--w)}
.cal i u.x3{background:#FFFFFF}

.kpi-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.kpi-box{background:var(--s2);border:0;border-radius:11px;padding:8px 9px}
.kpi-box .m{font-size:9.5px;display:block}
.kpi-box b{font-size:12px;display:block;margin-top:2px}

.sheet{
  position:fixed;inset:0;
  background:rgba(0,0,0,.84);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  z-index:40;display:none;align-items:flex-end;justify-content:center;
}
.sheet.on{display:flex}
.sheet.on>div{animation:slideUp .24s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet>div{
  width:100%;max-width:448px;
  background:var(--s2);
  border-top:1px solid rgba(255,255,255,.14);
  border-radius:24px 24px 0 0;
  padding:8px 15px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:90dvh;overflow-y:auto;
  will-change:transform;
}
.grabber-wrap{padding:4px 0 9px;display:flex;justify-content:center;cursor:grab;touch-action:none}
.grabber{width:34px;height:4px;border-radius:99px;background:rgba(255,255,255,.24)}

.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.keys button{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.06);
  border-radius:15px;height:58px;padding:0;font-size:26px;font-weight:500;
}
.hscroll{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap!important;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none;white-space:nowrap}
.sug-chip{background:var(--s1);border:1px solid var(--b);border-radius:12px;padding:7px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;flex:none;min-width:74px}
.sug-chip b{font-size:12.5px;font-weight:600;white-space:nowrap}
.sug-chip span{font-size:10.5px;color:var(--m)}
.sug-chip.on{background:#FFFFFF;border-color:#FFFFFF}
.sug-chip.on b,.sug-chip.on span{color:#000000}
.keys button:hover{background:rgba(255,255,255,.14)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{
  background:#000000;border:1px solid var(--b);
  border-radius:10px;padding:5.5px 9.5px;font-size:11px;font-weight:500;color:var(--m);
}
.chip.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF;font-weight:600}

.wd-pills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:6px}
.wd-pill{padding:7px 0;border-radius:9px;background:#000000;border:1px solid var(--b);color:var(--m);font-size:10.5px;font-weight:700;text-align:center}
.wd-pill.on{background:#FFFFFF;color:#000000;border-color:#FFFFFF}

.chk-box{
  width:17px;height:17px;border-radius:5px;
  border:1.5px solid var(--bh);
  background:transparent;
  display:inline-flex;align-items:center;justify-content:center;
  flex:none;color:#000000;
}
.chk-box.on{background:#FFFFFF;border-color:#FFFFFF}

.toast{
  position:fixed;left:14px;right:14px;
  top:var(--top-gap);
  max-width:420px;margin:0 auto;
  background:rgba(24,24,28,.96);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.14);
  border-radius:14px;padding:9px 13px;z-index:50;
  display:none;align-items:center;justify-content:space-between;gap:10px;
  box-shadow:0 10px 28px rgba(0,0,0,.85);font-size:12px;
}
.toast.on{display:flex;animation:dropDown .24s cubic-bezier(.16,1,.3,1)}
@keyframes dropDown{from{transform:translateY(-100%);opacity:0}to{transform:translateY(0);opacity:1}}

.msg{
  position:relative;overflow:hidden;
  background:var(--s2);border:1px solid rgba(255,255,255,.16);
  border-radius:15px;padding:11px 13px;margin-bottom:9px;line-height:1.42;font-size:12px;
  transition:opacity .28s ease,transform .28s ease;
}
.msg.fading{opacity:0;transform:translateY(-6px)}
.msg::after{
  content:'';position:absolute;left:0;bottom:0;height:2px;width:100%;
  background:rgba(255,255,255,.32);transform-origin:left center;
  animation:msgTimer var(--dur,5200ms) linear forwards;
}
.msg.paused::after{animation-play-state:paused}
@keyframes msgTimer{from{transform:scaleX(1)}to{transform:scaleX(0)}}

.checkin-card{
  background:var(--s1);
  border:1px solid rgba(50,215,75,.24);
  border-radius:15px;padding:10px 12px;margin-bottom:9px;
}

.badge{

const APP_VER = '16.2';

  const now = performance.now();

const vib = (pattern = 18) => {
  try {
    if (Array.isArray(pattern)) {
      if (navigator.vibrate) { navigator.vibrate(pattern); return; }

      pattern.forEach((ms, i) => { if (i % 2 === 0) setTimeout(hapTick, t); t += ms; });

                if (r && r.status === 200) {
                  const copy = r.clone();
                  caches.open(CACHE).then(c => c.put(e.request, copy));
                }
                return r;
              }).catch(() => cached);
              return cached || netFetch;
            })
          );
        });
      `;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([code], { type: 'application/javascript' }))).catch(() => {});
    }
  } catch (e) {}
})();

/* ==========================================================================
   2. CONFETTI ENGINE
   ========================================================================== */
function launchConfetti() {
  vib([25, 45, 35]);
  const cv = $('#confetti-cv');
  if (!cv) return;
  cv.style.display = 'block';
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  cv.width = W * dpr;
  cv.height = H * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);

  const colors = ['#FFFFFF', '#32D74B', '#F59E0B', '#38BDF8', '#A1A1AA'];
  const pieces = Array.from({ length: 85 }, () => ({
    x: W * (0.2 + Math.random() * 0.6),
    y: H * 0.35 + (Math.random() - 0.5) * 60,
    vx: (Math.random() - 0.5) * 11,
    vy: -6 - Math.random() * 9,
    w: 5 + Math.random() * 5,
    h: 3 + Math.random() * 4,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 0.25,
    col: colors[Math.floor(Math.random() * colors.length)],
    alpha: 1
  }));

  const start = performance.now();
  function frame(now) {
    const dt = now - start;
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    pieces.forEach(p => {
      p.vy += 0.32;
      p.vx *= 0.985;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      if (dt > 1700) p.alpha = Math.max(0, 1 - (dt - 1700) / 700);
      if (p.alpha > 0 && p.y < H + 30) {
        alive++;
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.col;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
    });
    if (alive > 0 && dt < 2500) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, W, H); cv.style.display = 'none'; }
  }
  requestAnimationFrame(frame);
}

   ========================================================================== */
const DB = {
  db: null,
  init: () => new Promise(r => {
    try {
      const q = indexedDB.open('LW_Store', 1);
      q.onupgradeneeded = e => {
        if (!e.target.result.objectStoreNames.contains('receipts')) {
          e.target.result.createObjectStore('receipts');
        }
      };
      q.onsuccess = e => { DB.db = e.target.result; r(); };
      q.onerror = () => r();
    } catch (e) { r(); }
  }),
  save: (id, b64) => {
    try { if (DB.db) DB.db.transaction('receipts', 'readwrite').objectStore('receipts').put(b64, id); } catch (e) {}
  },
  del: id => {
    try { if (DB.db) DB.db.transaction('receipts', 'readwrite').objectStore('receipts').delete(id); } catch (e) {}
  },
  get: id => new Promise(r => {
    try {
      if (!DB.db) return r(null);
      const q = DB.db.transaction('receipts').objectStore('receipts').get(id);
      q.onsuccess = () => r(q.result || null);
      q.onerror = () => r(null);
    } catch (e) { r(null); }
  })
};

function compressImage(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.68));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function migrate(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;
  const out = Object.assign({}, base, raw);

  if (raw.cap != null && !raw.liq0) out.liq0 = +raw.cap || 0;
  if (raw.payday != null && !raw.payDay) out.payDay = +raw.payday || 1;
  if (raw.maintBase != null && !raw.maintLastKm) out.maintLastKm = +raw.maintBase || 0;
  if (raw.lastServiceKm != null && !raw.maintLastKm) out.maintLastKm = +raw.lastServiceKm || 0;
  if (raw.serviceInt != null && !raw.maintInt) out.maintInt = +raw.serviceInt || 15000;
  if (Array.isArray(raw.park) && !Array.isArray(raw.parked)) out.parked = raw.park;
  if (raw.savedImp != null && !raw.savedImpulse) out.savedImpulse = +raw.savedImp || 0;
  if (raw.sw && !Array.isArray(raw.offDays)) out.offDays = Object.keys(raw.sw).filter(k => raw.sw[k]);
  if ((raw.binKey || raw.binId) && (!raw.cloud || !raw.cloud.key)) {
    out.cloud = { key: raw.binKey || '', bin: raw.binId || '', lastSync: 0 };
  }

  out.schemaVer = base.schemaVer;
  out.updatedAt = +out.updatedAt || 0;
  out.sal = +out.sal || 0;
  out.bud = +out.bud || 0;
  out.payDay = Math.min(31, Math.max(1, +out.payDay || 1));
  out.liq0 = +out.liq0 || 0;
  out.tank = +out.tank || 30;
  out.kmDay = +out.kmDay >= 0 ? +out.kmDay : 92;
  out.idealKmL = +out.idealKmL || 15.5;
  out.workStart = typeof out.workStart === 'string' && out.workStart.includes(':') ? out.workStart : '09:00';
  out.workEnd = typeof out.workEnd === 'string' && out.workEnd.includes(':') ? out.workEnd : '18:00';
  out.commuteMins = Math.max(0, +out.commuteMins || 0);
  out.homeLabel = (out.homeLabel || 'Casa').trim();
  out.workLabel = (out.workLabel || 'Sede').trim();
  out.commuteMode = ['gpl', 'transit', 'remote'].includes(out.commuteMode) ? out.commuteMode : 'gpl';
  out.roundUp = Boolean(out.roundUp);
  out.homeHist = Boolean(out.homeHist);
  out.savedImpulse = Math.round((+out.savedImpulse || 0) * 100) / 100;
  out.maintLastKm = +out.maintLastKm || 0;
  out.maintInt = +out.maintInt || 15000;
  out.priv = Boolean(out.priv);
  out.vacMode = Boolean(out.vacMode);
  out.vacBud = +out.vacBud >= 0 ? +out.vacBud : 500;
  out.vacStart = typeof out.vacStart === 'string' ? out.vacStart : '';
  out.lastBackupAt = +out.lastBackupAt || 0;

  if (!Array.isArray(out.workDays)) out.workDays = [1, 2, 3, 4, 5];
  ['ex', 'fills', 'ev', 'notes', 'inc', 'rec', 'goals', 'debts', 'offDays', 'swClaimedDays', 'vacDays', 'parked', 'carpool', 'celebratedCycles', 'customCats', 'archivedCycles', 'zeroSpendDays'].forEach(k => {
    if (!Array.isArray(out[k])) out[k] = [];
  });
  if (!out.extra || typeof out.extra !== 'object' || Array.isArray(out.extra)) out.extra = {};
  out.cloud = Object.assign({ key: '', bin: '', lastSync: 0 }, out.cloud || {});
  out.nf = Object.assign({}, base.nf, out.nf || {});
  out.nf.types = Object.assign({}, base.nf.types, out.nf.types || {});
  out.nf.sent = out.nf.sent && typeof out.nf.sent === 'object' ? out.nf.sent : {};

  out.nf.ntfyOn = Boolean(out.nf.ntfyOn);
  out.nf.autoCalShortcut = Boolean(out.nf.autoCalShortcut);

  delete out.cap;
  delete out.maintBase;

}

function kbHlPop(st) {

const kbPtr = new Map();
(function kbBindKeys() {

/* ==========================================================================
   7. CALCOLI FINANZIARI ACCURATI, SMART WORKING REALE, GAMIFICATION & CICLO
   ========================================================================== */
function getCycleRange(offset = 0) {
  const pd = Math.min(31, Math.max(1, +S.payDay || 1));
  const now = new Date();
  let y = now.getFullYear(), m = now.getMonth();
  const dimCurr = new Date(y, m + 1, 0).getDate();
  const effCurr = Math.min(pd, dimCurr);
  if (now.getDate() < effCurr) {
    m -= 1;
    if (m < 0) { m = 11; y -= 1; }
  }
  const startDate = new Date(y, m + offset, 1);
  const sy = startDate.getFullYear(), sm = startDate.getMonth();
  const sDim = new Date(sy, sm + 1, 0).getDate();
  const start = new Date(sy, sm, Math.min(pd, sDim));

  const nextMonth = new Date(sy, sm + 1, 1);
  const ny = nextMonth.getFullYear(), nm = nextMonth.getMonth();
  const nDim = new Date(ny, nm + 1, 0).getDate();
  const nextStart = new Date(ny, nm, Math.min(pd, nDim));
  const end = new Date(nextStart.getTime() - 86400000);

  const startStr = iso(start);
  const endStr = iso(end);
  const totalDays = Math.round((end - start) / 86400000) + 1;
  const label = pd === 1
    ? `${MESI[sm].slice(0, 3)} ${sy}`
    : `${start.getDate()} ${MESI[sm].slice(0, 3)} – ${end.getDate()} ${MESI[nm].slice(0, 3)}`;

  return { startStr, endStr, totalDays, label };
}

function liq() {
  const totalIn = S.inc.reduce((s, i) => s + (+i.a || 0), 0);
  const totalOut = S.ex.reduce((s, e) => s + (+e.a || 0), 0);
  return Math.round(((+S.liq0 || 0) + totalIn - totalOut) * 100) / 100;
}

const monIdx = ym => { const [y, m] = String(ym).split('-').map(Number); return y * 12 + m - 1; };
function recDue(r, ym) {
  const i = monIdx(ym) - monIdx(r.st || ym);
  if (i < 0) return false;
  const ev = +r.every || 1;
  if (i % ev) return false;
  if (r.months > 0 && i / ev >= r.months) return false;
  return true;
}
function recMonthly(r) {
  const share = r.splitN > 1 ? (+r.a || 0) / r.splitN : (+r.a || 0);
  return share / ((+r.every || 1));
}
function recStats(r) {
  const ev = +r.every || 1, t = today(), cur = t.slice(0, 7);
  let elapsed = 0;
  if (r.months > 0) {
    const last = monIdx(r.st) + (r.months - 1);
    for (let i = monIdx(r.st); i <= Math.min(last, monIdx(cur)); i++) {
      const y = Math.floor(i / 12), m = i % 12 + 1, dd = Math.min(+r.day || 1, new Date(y, m, 0).getDate());
      if (y + '-' + pad(m) + '-' + pad(dd) <= t) elapsed++;
    }
  }
  const tot = r.fin ? (+r.tot || r.months) : 0;
  const done = r.fin ? Math.min(tot, (+r.paid0 || 0) + elapsed) : 0;
  const rem = r.fin ? Math.max(0, tot - done) : 0;
  let next = null;
  for (let k = 0; k < 26 && !next; k++) {
    const idx = monIdx(cur) + k, y = Math.floor(idx / 12), m = idx % 12 + 1, ym = y + '-' + pad(m);
    if (!recDue(r, ym)) continue;
    const ds = ym + '-' + pad(Math.min(+r.day || 1, new Date(y, m, 0).getDate()));
    if (ds > t) next = ds;
  }
  const endIdx = r.months > 0 ? monIdx(r.st) + (r.months - 1) * ev : null;
  return { tot, done, rem, next, endIdx, finished: r.fin && rem <= 0 };
}
function fmtDay(ds) { const d = new Date(ds + 'T12:00'); return d.getDate() + ' ' + MESI[d.getMonth()].slice(0, 3).toLowerCase(); }
function fmtIdx(i) { return MESI[i % 12].slice(0, 3).toLowerCase() + ' ' + Math.floor(i / 12); }

function getUpcomingRecurringInCycle(cyc, t) {
  let upcoming = 0;
  for (let d = new Date(t + 'T12:00'); iso(d) <= cyc.endStr; d.setDate(d.getDate() + 1)) {
    const ds = iso(d);
    if (ds <= t) continue;
    const ym = ds.slice(0, 7);
    const y = d.getFullYear(), m = d.getMonth() + 1;
    const dim = new Date(y, m, 0).getDate();
    S.rec.forEach(r => {
      if (!recDue(r, ym)) return;
      if ((r.sk || []).includes(ym)) return;
      const effDay = Math.min(+r.day || 1, dim);
      if (d.getDate() === effDay && !S.ex.some(e => e.rid === r.id && e.d.startsWith(ym))) {
        const myShare = r.splitN > 1 ? (+r.a || 0) / r.splitN : (+r.a || 0);
        upcoming += myShare;
      }
    });
  }
  return Math.round(upcoming * 100) / 100;
}

function stats(offset = 0) {
  const cyc = getCycleRange(offset);
  const t = today();
  const exList = S.ex.filter(e => !e.vac && e.d >= cyc.startStr && e.d <= cyc.endStr);
  const incList = S.inc.filter(i => i.d >= cyc.startStr && i.d <= cyc.endStr);
  const spent = Math.round(exList.reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const fixedSpent = Math.round(exList.filter(e => e.rid).reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const varSpent = Math.round((spent - fixedSpent) * 100) / 100;
  const earned = Math.round(incList.reduce((s, i) => s + (+i.a || 0), 0) * 100) / 100;
  const bud = +S.bud || 0;
  const rem = Math.round((bud - spent) * 100) / 100;

  const sDate = new Date(cyc.startStr + 'T12:00');
  const eDate = new Date(cyc.endStr + 'T12:00');
  const tDate = new Date(t + 'T12:00');

  let elapsed = Math.floor((tDate - sDate) / 86400000) + 1;
  elapsed = Math.min(cyc.totalDays, Math.max(1, elapsed));
  let left = Math.floor((eDate - tDate) / 86400000) + 1;
  left = Math.min(cyc.totalDays, Math.max(1, left));

  const spentToday = Math.round(S.ex.filter(e => !e.vac && !e.rid && e.d === t).reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const upcomingRec = offset === 0 ? getUpcomingRecurringInCycle(cyc, t) : 0;
  const spendableRem = Math.round((rem - upcomingRec) * 100) / 100;
  const idealPerDay = bud / cyc.totalDays;
  const safeToday = spendableRem <= 0 ? 0 : Math.round((spendableRem / left) * 100) / 100;

  const varBurnRate = varSpent / elapsed;
  const projSpentEnd = Math.round((fixedSpent + upcomingRec + varBurnRate * cyc.totalDays) * 100) / 100;
  const projLiqEnd = Math.round((liq() - Math.max(0, projSpentEnd - spent)) * 100) / 100;

  return {
    cyc, exList, incList, dim: cyc.totalDays, spent, fixedSpent, varSpent, earned,
    net: Math.round((earned - spent) * 100) / 100,
    rem, upcomingRec, spendableRem, left, day: elapsed, spentToday,
    daily: safeToday, per: idealPerDay,
    projSpentEnd, projLiqEnd, goal: (+S.sal || 0) - bud
  };
}

function vacStats() {
  const start = S.vacStart || today();
  const vacEx = S.ex.filter(e => e.vac && (!S.vacStart || e.d >= start));
  const spent = Math.round(vacEx.reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const bud = +S.vacBud || 0;
  const rem = Math.round((bud - spent) * 100) / 100;
  const spentToday = Math.round(vacEx.filter(e => e.d === today()).reduce((s, e) => s + (+e.a || 0), 0) * 100) / 100;
  const daysActive = Math.max(1, (S.vacDays || []).filter(d => !S.vacStart || d >= start).length);
  return { exList: vacEx, spent, bud, rem, spentToday, daysActive };
}

function getNetPosition() {
  const openDebts = (S.debts || []).filter(g => !g.p);
  const credits = openDebts.filter(g => g.dir === 'due').reduce((s, g) => s + (+g.a || 0), 0);
  const debts = openDebts.filter(g => g.dir === 'owe').reduce((s, g) => s + (+g.a || 0), 0);
  const cash = liq();
  return {
    cash,
    credits: Math.round(credits * 100) / 100,
    debts: Math.round(debts * 100) / 100,
    netWorth: Math.round((cash + credits - debts) * 100) / 100
  };
}

function getNoSpendStreak() {
  const impulseCats = ['heets', 'caffe', 'cibo', 'svago', 'altro'];
  let streak = 0;
  const d = new Date();
  const firstD = [...S.ex.map(e => e.d), ...S.inc.map(i => i.d), ...(S.zeroSpendDays || [])].sort()[0] || today();
  for (let i = 0; i < 120; i++) {
    const ds = iso(d);
    if (ds < firstD) break;
    const hasImpulse = S.ex.some(e => e.d === ds && !e.rid && !e.vac && impulseCats.includes(e.c));
    if (hasImpulse) {
      if (i === 0) { d.setDate(d.getDate() - 1); continue; }
      break;
    }
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

function getSwSavingsInfo() {
  const s = stats(0);
  const c = car();
  const ppl = c.last ? c.last.ppl : 0.75;
  const kml = c.avg || S.idealKmL || 15.5;
  const km = S.kmDay || 92;
  const perDaySaved = S.commuteMode === 'gpl'
    ? Math.round(((km / kml) * ppl + km * 0.04) * 100) / 100
    : S.commuteMode === 'transit' ? 5.00 : 0;

  const claimedSet = new Set(S.swClaimedDays || []);
  const swDaysCycle = (S.offDays || []).filter(ds =>
    ds >= s.cyc.startStr && ds <= s.cyc.endStr && isScheduledWorkday(ds)
  );
  const unclaimedSwDays = (S.offDays || []).filter(ds =>
    isScheduledWorkday(ds) && !claimedSet.has(ds) && !isVacDay(ds)
  );
  const unclaimedSwEur = Math.round(unclaimedSwDays.length * perDaySaved * 100) / 100;
  const cycleSaved = Math.round(swDaysCycle.length * perDaySaved * 100) / 100;
  const totalTesoretto = Math.round(((S.savedImpulse || 0) + unclaimedSwEur) * 100) / 100;

  return {
    count: swDaysCycle.length,

    unclaimedDays: unclaimedSwDays,
    unclaimedSwEur,
    cycleSaved,
    perDaySaved,
    tesoretto: totalTesoretto
  };

function getSpendingAnomalies() {
  const s0 = stats(0);
  const s1 = stats(-1);
  if (s1.varSpent <= 0 || s0.day < 5) return [];
  const cats = getCats();
  const c0 = catSumRange(s0.cyc.startStr, today(), true);
  const c1 = catSumRange(s1.cyc.startStr, s1.cyc.endStr, true);
  const alerts = [];
  Object.keys(c0).forEach(k => {
    if (k === 'gpl' || k === 'benz') return;
    const paceNow = c0[k] / s0.day;
    const pacePrev = (c1[k] || 0) / s1.dim;
    if (pacePrev > 0.3 && paceNow > pacePrev * 1.32 && c0[k] >= 12) {
      const pct = Math.round(((paceNow - pacePrev) / pacePrev) * 100);
      alerts.push({ cat: cats[k]?.[0] || k, pct, proj: Math.round(paceNow * s0.dim * 100) / 100 });
    }
  });
  return alerts.slice(0, 2);
}

function checkCycleCelebration() {

function catSumRange(startStr, endStr, varOnly = false) {
  const o = {};
  S.ex.filter(e => !e.vac && (!varOnly || !e.rid) && e.d >= startStr && e.d <= endStr)
    .forEach(e => o[e.c] = (o[e.c] || 0) + (+e.a || 0));
  return o;
}

function getAnalyticsPoints(metric, range, offset) {
  const t = today();
  if (range === '6M') {
    const pts = [];
    for (let k = -5; k <= 0; k++) {
      const st = stats(offset + k);
      const val = metric === 'exp' ? st.spent : metric === 'sav' ? Math.max(0, st.rem) : (S.liq0 + S.inc.filter(i => i.d <= st.cyc.endStr).reduce((a, b) => a + b.a, 0) - S.ex.filter(e => e.d <= st.cyc.endStr).reduce((a, b) => a + b.a, 0));
      pts.push({ label: st.cyc.label, short: st.cyc.label.split(' ')[0], v: val });
    }
    return pts;
  }

  let dates = [];
  if (range === '14G') {
    for (let i = 13; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      dates.push(iso(d));
    }
  } else {
    const cyc = getCycleRange(offset);
    for (let d = new Date(cyc.startStr + 'T12:00'); iso(d) <= cyc.endStr; d.setDate(d.getDate() + 1)) {
      const ds = iso(d);
      if (offset === 0 && ds > t) break;
      dates.push(ds);
    }
    if (!dates.length) dates = [cyc.startStr];
  }

  return dates.map((ds) => {
    const parts = ds.split('-');
    const short = `${parts[2]}/${parts[1]}`;
    let v = 0, ideal = null;
    if (metric === 'liq') {
      v = S.liq0 + S.inc.filter(i => i.d <= ds).reduce((s, i) => s + i.a, 0) - S.ex.filter(e => e.d <= ds).reduce((s, e) => s + e.a, 0);
    } else if (metric === 'exp') {
      v = S.ex.filter(e => !e.vac && e.d === ds).reduce((s, e) => s + e.a, 0);
    } else {
      const cyc = getCycleRange(offset);
      const spentSoFar = S.ex.filter(e => !e.vac && e.d >= cyc.startStr && e.d <= ds).reduce((s, e) => s + e.a, 0);
      v = Math.max(0, S.bud - spentSoFar);
      const dayIdx = Math.max(1, Math.round((new Date(ds + 'T12:00') - new Date(cyc.startStr + 'T12:00')) / 86400000) + 1);
      ideal = Math.max(0, S.bud - (S.bud / cyc.totalDays) * dayIdx);
    }
    return { label: short, short, v, ideal };
  });
}

function applyRec() {
  const n = new Date();
  let ch = 0;
  S.rec.forEach(r => {
    let [y, m] = r.st.split('-').map(Number);
    while (y < n.getFullYear() || (y === n.getFullYear() && m <= n.getMonth() + 1)) {
      const k = y + '-' + pad(m),
            dd = Math.min(r.day, new Date(y, m, 0).getDate()),
            ds = k + '-' + pad(dd);
      if (recDue(r, k) && ds <= today() && !S.ex.some(e => e.rid === r.id && e.d.startsWith(k)) && !(r.sk || []).includes(k)) {
        const splitN = Math.max(1, +r.splitN || 1);
        const totalAmt = Math.round((+r.a || 0) * 100) / 100;
        if (splitN > 1) {
          const share = Math.round((totalAmt / splitN) * 100) / 100;
          const credit = Math.round((totalAmt - share) * 100) / 100;
          const who = cap((r.splitWho || 'Amici').trim());
          S.ex.push({ id: uid(), rid: r.id, d: ds, c: r.c, a: share, n: `${r.n} (1/${splitN})` });
          if (credit > 0) {
            S.debts.push({ id: uid(), who, a: credit, dir: 'due', d: ds });
          }
        } else {
          S.ex.push({ id: uid(), rid: r.id, d: ds, c: r.c, a: totalAmt, n: r.n });
        }
        ch = 1;
      }
      m++;
      if (m > 12) { m = 1; y++; }
    }
  });
  if (ch) save();

/* ==========================================================================
   9. MOTORE AUTO, GPL, PREVISIONE GIORNO RISERVA & CARPOOLING
   ========================================================================== */
function dayK(f, w) {
  const km = S.kmDay || 92;
  if (!wk(f.d)) return 0;
  return f.pl === 'wk' ? km / 2 : (w === 'a' ? km : 0);
}

function kmB(a, b) {
  const km = S.kmDay || 92;
  let k = dayK(a, 'a') + dayK(b, 'b');
  for (let d = new Date(a.d + 'T12:00'); ;) {
    d.setDate(d.getDate() + 1);
    const x = iso(d);
    if (x >= b.d) break;
    if (wk(x)) k += km;
  }
  return k + Object.entries(S.extra).filter(([d]) => d > a.d && d <= b.d).reduce((s, [, v]) => s + v, 0);
}

function predictReserveDate(remKm) {
  if (remKm == null || remKm <= 0) return { label: 'In riserva', ds: today() };
  const km = S.kmDay || 92;
  if (km <= 0 || S.commuteMode === 'remote') return { label: 'Solo extra', ds: null };
  let left = remKm;
  const d = new Date();
  const h = d.getHours() + d.getMinutes() / 60;
  const endH = hh(S.workEnd || '18:00');
  if (wk(today())) {
    const remToday = h < hh(S.workStart || '09:00') ? km : h < endH ? km / 2 : 0;
    left -= remToday;
    if (left <= 0) return { label: 'Fino a stasera', ds: today() };
  }
  for (let i = 1; i <= 30; i++) {
    d.setDate(d.getDate() + 1);
    const ds = iso(d);
    if (wk(ds)) {
      left -= km;
      if (left <= 0) {
        if (i === 1) return { label: 'Fino a domani', ds };
        const dn = DN[d.getDay()].slice(0, 3);
        return { label: `Fino a ${dn} ${d.getDate()}`, ds };
      }
    }
  }
  return { label: 'Oltre 30 giorni', ds: null };
}

function car() {
  const km = S.kmDay || 92;
  const ideal = S.idealKmL || 15.5;
  const f = [...S.fills].sort((a, b) => a.d.localeCompare(b.d));
  let L = 0, K = 0, E = 0;
  const segs = [];
  f.forEach((x, i) => {
    if (i) {
      const k = kmB(f[i - 1], x);
      const lit = x.eur / x.ppl;
      if (k > 0 && lit > 0) {
        K += k;
        L += lit;
        E += x.eur;
        segs.push({ k, lit });
      }
    }
  });

  let avg = ideal;
  if (segs.length) {
    const recent = segs.slice(-5);
    const rK = recent.reduce((s, x) => s + x.k, 0);
    const rL = recent.reduce((s, x) => s + x.lit, 0);
    if (rL > 0) avg = rK / rL;
  }

  const last = f[f.length - 1];
  let since = 0;
  if (last) {
    const t = today(), h = new Date().getHours() + new Date().getMinutes() / 60;
    const startH = hh(S.workStart || '09:00');
    const endH = hh(S.workEnd || '18:00');
    if (last.d < t) {
      since = dayK(last, 'a');
      for (let d = new Date(last.d + 'T12:00'); ;) {
        d.setDate(d.getDate() + 1);
        const x = iso(d);
        if (x >= t) break;
        if (wk(x)) since += km;
      }
      if (wk(t)) since += h < startH ? 0 : h < endH ? km / 2 : km;
    } else if (last.d === t && wk(t)) {
      if (last.pl === 'an' && h >= endH) since += km;
      else if (last.pl === 'an' && h >= startH) since += km / 2;
      else if (last.pl === 'wk' && h >= endH) since += km / 2;
    }
    since += Object.entries(S.extra).filter(([d]) => d >= last.d).reduce((s, [, v]) => s + v, 0);
  }

  const range = S.tank * avg;
  const rem = last ? Math.max(0, range - since) : null;
  const tk = rem == null ? 0 : Math.min(4, Math.max(0, Math.ceil((rem / range) * 4)));
  const ppl = last ? last.ppl : 0.75;
  const mk = km * 22;
  const wl = avg < ideal ? mk / avg - mk / ideal : 0;

  let status = 'NONE', statusLabel = 'VUOTO', statusCls = '';
  if (last) {
    if (rem <= km * 1.15) {
      status = 'CRIT';
      statusLabel = 'FAI PIENO';
      statusCls = 'bad';
    } else if (rem <= km * 2.1) {
      status = 'LOW';
      statusLabel = 'A BREVE';
      statusCls = 'w';
    } else {
      status = 'OK';
      statusLabel = 'OK';
      statusCls = 'ok';
    }
  }

  const cpTotal = S.inc
    .filter(i => /passaggio|carpool/i.test(i.t || ''))
    .reduce((s, x) => s + (+x.a || 0), 0);
  const netE = Math.max(0, E - cpTotal);
  const cpk = K ? E / K : 0;
  const netCpk = K ? netE / K : 0;

  const anFills = f.filter(x => x.pl === 'an');
  const wkFills = f.filter(x => x.pl === 'wk');
  const avgAn = anFills.length ? anFills.reduce((s, x) => s + x.ppl, 0) / anFills.length : null;
  const avgWk = wkFills.length ? wkFills.reduce((s, x) => s + x.ppl, 0) / wkFills.length : null;

  const totalTrackedKm = K + since;
  const maintSince = Math.max(0, totalTrackedKm - (S.maintLastKm || 0));
  const maintInt = S.maintInt || 15000;
  const maintLeft = maintInt - maintSince;
  const resPred = predictReserveDate(rem);

  return {
    f, K, avg, last, since, range, rem, tk, wl, we: wl * ppl,
    status, statusLabel, statusCls, reserveDay: resPred.label, reserveDs: resPred.ds,
    cpk, netCpk, cpTotal, avgAn, avgWk, totalTrackedKm, maintSince, maintInt, maintLeft
  };
}

/* ==========================================================================
   10. AGENDA, SMART WORKING, VACANZA, CONTO ALLA ROVESCIA & CALENDARIO APPLE
   ========================================================================== */
function evOn(ds) {
  const w = new Date(ds + 'T12:00').getDay();
  return S.ev.filter(e => {
    if (e.d === ds) return true;
    if (e.d > ds) return false;
    if (e.end && ds > e.end) return false;
    if (!e.r) return false;
    if (e.r === 'd') return true;
    if (e.r === 'w') return new Date(e.d + 'T12:00').getDay() === w;
    if (e.r === 'm') return new Date(e.d + 'T12:00').getDate() === new Date(ds + 'T12:00').getDate();
    if (e.r.startsWith('i')) {
      const step = Math.max(1, parseInt(e.r.slice(1), 10) || 1);
      const diff = Math.round((new Date(ds + 'T12:00') - new Date(e.d + 'T12:00')) / 86400000);
      return diff % step === 0;
    }
    return false;
  }).sort((a, b) => a.tm.localeCompare(b.tm));
}

function getLiveAgendaStatus() {
  const now = new Date();
  const nowMins = now.getHours() * 60 + now.getMinutes();
  const ev = evOn(today());

  for (const e of ev) {
    const [eh, em] = (e.tm || '09:00').split(':').map(Number);
    const startMins = eh * 60 + em;
    const endMins = startMins + Math.round((+e.dur || 1) * 60);
    if (nowMins >= startMins && nowMins < endMins) {
      return { text: `In corso · ${e.t}`, cls: 'ok' };
    }
    const diff = startMins - nowMins;
    if (diff > 0 && diff <= 240) {
      const lbl = diff < 60 ? `Tra ${diff} min` : `Tra ${Math.floor(diff / 60)}h ${diff % 60 ? (diff % 60) + 'm' : ''}`.trim();
      return { text: `${lbl} · ${e.t}`, cls: diff <= 45 ? 'w' : '' };
    }
  }

  if (wk(today())) {
    const [wh, wm] = (S.workEnd || '18:00').split(':').map(Number);
    const endWorkMins = wh * 60 + wm;
    const homeMins = endWorkMins + (+S.commuteMins || 0);
    if (nowMins >= endWorkMins - 45 && nowMins < homeMins) {
      const arrH = Math.floor(homeMins / 60) % 24;
      const arrM = homeMins % 60;
      return { text: `Rientro ~${pad(arrH)}:${pad(arrM)}`, cls: '' };
    }
  }
  return null;
}

function classifyActivityContext(rawTitle) {
  const t = rawTitle.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (/colazion|cappuccin|cornett|brioche/.test(t)) {
    return { kind: 'Colazione', defDur: 0.75, wkSlots: [7, 7.5, 8, 8.5, 9], weSlots: [8.5, 9, 9.5, 10], note: 'mattina' };
  }
  if (/pranz|mensa|pausa pranzo/.test(t)) {
    return { kind: 'Pranzo', defDur: 1.25, wkSlots: [12.5, 13, 13.5], weSlots: [12.5, 13, 13.5, 14], note: 'fascia pranzo' };
  }
  if (/aperitiv|spritz|happy hour/.test(t)) {
    return { kind: 'Aperitivo', defDur: 1.5, wkSlots: [18.5, 19, 19.5], weSlots: [18, 18.5, 19, 19.5], note: 'tardo pomeriggio' };
  }
  if (/\bcen(a|are|etta)\b|ristorant|pizz|sushi|trattori|osteri|hamburger/.test(t)) {
    return { kind: 'Cena', defDur: 2, wkSlots: [20, 20.5, 21, 19.5], weSlots: [20, 20.5, 21], note: 'serata' };
  }
  if (/allen|palestr|corsa|correr|nuot|calcett|padel|tennis|bici|sport|workout|yoga|pesi/.test(t)) {
    return { kind: 'Allenamento', defDur: 1.5, wkSlots: [18.5, 19, 19.5, 7, 17.5], weSlots: [10, 10.5, 16, 17, 11], note: 'fascia sport' };
  }
  if (/studi|legger|libro|corso|esam|call|riunion|lavor|progett|codic/.test(t)) {
    return { kind: 'Focus / Studio', defDur: 1.5, wkSlots: [18.5, 20.5, 21, 8], weSlots: [9.5, 10.5, 15, 16.5], note: 'concentrazione' };
  }
  if (/medic|dentist|dottor|visita|banc|post|comun|tagli|parrucchier|barbier|meccanic|gommist|commission/.test(t)) {
    return { kind: 'Commissioni / Appuntamento', defDur: 1, wkSlots: [8.5, 13, 17.5, 18, 18.5], weSlots: [9.5, 10.5, 11.5, 16], note: 'orario diurno' };
  }
  if (/cinema|film|serat|uscir|uscit|amic|concert|teatr|bowling|locale|pub/.test(t)) {
    return { kind: 'Uscita / Serata', defDur: 2.5, wkSlots: [20.5, 21, 21.5], weSlots: [20.5, 21, 21.5, 17], note: 'serata' };
  }
  return { kind: 'Generico', defDur: 1, wkSlots: [18.5, 19, 20, 20.5, 8], weSlots: [10, 11, 15.5, 17, 18.5], note: 'finestra libera' };
}

function slots(dur, rawTitle = '', preferRange = null) {
  const out = [], now = new Date();
  const ctx = classifyActivityContext(rawTitle);
  const useDur = dur || ctx.defDur;
  const wStart = hh(S.workStart || '09:00');
  const wEnd = hh(S.workEnd || '18:00');
  const commH = (S.commuteMins || 0) / 60;
  const nowH = now.getHours() + now.getMinutes() / 60;

  const startOffset = preferRange === 'next_week' ? 7 : 0;
  const maxDays = preferRange === 'this_week' ? 7 : 14;

  for (let i = startOffset; i < startOffset + maxDays && out.length < 4; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const ds = iso(d);
    const isWkDay = wk(ds);
    const bz = evOn(ds).map(e => [hh(e.tm), hh(e.tm) + (+e.dur || 1)]);

    if (isWkDay) {
      bz.push([Math.max(0, wStart - commH), Math.min(24, wEnd + commH)]);
    }

    let candidates = isWkDay ? [...ctx.wkSlots] : [...ctx.weSlots];
    if (preferRange === 'morning') candidates = candidates.filter(h => h < 12.5);
    if (preferRange === 'afternoon') candidates = candidates.filter(h => h >= 12.5 && h < 18.5);
    if (preferRange === 'evening') candidates = candidates.filter(h => h >= 18.5);
    if (!candidates.length) candidates = isWkDay ? [18.5, 19.5, 20.5] : [10.5, 15.5, 18.5, 20.5];

    const h = candidates.find(hr =>
      (i > 0 || hr > nowH + 0.25) &&
      hr + useDur <= 23.5 &&
      bz.every(([s, e]) => hr + useDur <= s || hr >= e)
    );
    if (h != null) {
      const reason = !isWkDay ? 'giornata libera' : h >= wEnd + commH ? 'dopo il rientro' : h + useDur <= wStart - commH ? 'prima del lavoro' : 'pausa';
      out.push({ ds, h, dur: useDur, reason, kind: ctx.kind });
    }
  }
  return out;
}

function slotHTML(t, dur, preferRange = null) {
  const s = slots(dur, t, preferRange);
  if (!s.length) return 'Nessuno spazio libero trovato per questa fascia.';
  return `<div class='row sp' style='margin-bottom:6px'><span class='kicker'>SLOT · ${esc(s[0].kind.toUpperCase())}</span><span class='badge'>${s[0].dur}h</span></div>` + s.map(x => {

function sendToAppleCalendarShortcut(title, dateStr, timeStr, durHours = 1) {
  const cleanTitle = (title || 'Impegno').replace(/\|/g, '-');
  const [hhStr, mmStr] = (timeStr || '09:00').split(':');
  const startDt = new Date(`${dateStr}T${pad(+hhStr || 9)}:${pad(+mmStr || 0)}:00`);
  const endDt = new Date(startDt.getTime() + Math.round((+durHours || 1) * 3600000));
  const toLocalIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
  const payload = `${cleanTitle}|${toLocalIso(startDt)}|${toLocalIso(endDt)}`;
  const url = `shortcuts://run-shortcut?name=LeoCalendar&input=text&text=${encodeURIComponent(payload)}`;
  location.href = url;
}

function downloadSingleEventIcs(title, dateStr, timeStr, durHours = 1, r = '', endDs = '') {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const z = (ds, tm) => ds.replace(/-/g, '') + 'T' + tm.replace(':', '') + '00';
  const untilStr = endDs ? ';UNTIL=' + endDs.replace(/-/g, '') + 'T235959Z' : '';
  let rr = '';
  if (r === 'd') rr = 'FREQ=DAILY' + untilStr;
  else if (r === 'w') rr = 'FREQ=WEEKLY' + untilStr;
  else if (r === 'm') rr = 'FREQ=MONTHLY' + untilStr;
  else if (r && r.startsWith('i')) rr = `FREQ=DAILY;INTERVAL=${Math.max(1, parseInt(r.slice(1), 10) || 1)}` + untilStr;

  const L = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Leo Wealth//IT', 'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT', 'UID:' + uid() + '@leowealth', 'DTSTAMP:' + stamp,
    'DTSTART:' + z(dateStr, timeStr || '09:00'),
    'DURATION:PT' + Math.round((+durHours || 1) * 60) + 'M',
    'SUMMARY:' + icsT(title)
  ];
  if (rr) L.push('RRULE:' + rr);
  L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsT(title), 'TRIGGER:-PT' + (nf().evMin || 30) + 'M', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar;charset=utf-8' }));
  a.download = 'impegno-leowealth.ics';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

      return existing;
    }
    const note = {
      id: uid(),
      type: 'checklist',
      title: cleanTitle,
      items: rawItems.map(txt => ({ id: uid(), txt: cap(txt), done: false })),
      updatedAt: Date.now()
    };

function impulseToGoal() {
  const swInfo = getSwSavingsInfo();
  const totalPool = swInfo.tesoretto;
  if (!(totalPool > 0)) return;
  const prevImp = S.savedImpulse || 0;
  const prevClaimed = [...(S.swClaimedDays || [])];
  S.swClaimedDays = Array.from(new Set([...prevClaimed, ...swInfo.unclaimedDays]));

  if (S.goals.length) {
    const prevS = S.goals[0].s;
    lastSwUndo = {
      type: 'tesoretto',
      prevSavedImpulse: prevImp,
      prevSwClaimedDays: prevClaimed,
      goalIdx: 0,
      prevGoalVal: prevS
    };
    S.goals[0].s = Math.round((S.goals[0].s + totalPool) * 100) / 100;
    S.savedImpulse = 0;
    save();
    if (prevS < S.goals[0].t && S.goals[0].s >= S.goals[0].t) launchConfetti();
    toast(`+${eur(totalPool)} versati in ${S.goals[0].n}`, 'undoSwAction()');
  } else {
    const incId = uid();
    lastSwUndo = {
      type: 'tesoretto',
      prevSavedImpulse: prevImp,
      prevSwClaimedDays: prevClaimed,
      incId
    };
    S.inc.push({ id: incId, d: today(), a: totalPool, t: 'Tesoretto risparmiato' });
    S.savedImpulse = 0;
    save();
    toast(`+${eur(totalPool)} versati nel Patrimonio`, 'undoSwAction()');
  }
  R();
}

function buildLiqSparkline() {
  const pts = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const ds = iso(d);
    const val = S.liq0 + S.inc.filter(x => x.d <= ds).reduce((s, x) => s + (+x.a || 0), 0) - S.ex.filter(x => x.d <= ds).reduce((s, x) => s + (+x.a || 0), 0);
    pts.push(val);
  }
  const mn = Math.min(...pts), mx = Math.max(...pts);
  const span = Math.max(1, mx - mn);
  const coords = pts.map((v, i) => `${(i * (64 / 6)).toFixed(1)},${(20 - ((v - mn) / span) * 16).toFixed(1)}`).join(' ');
  const rising = pts[pts.length - 1] >= pts[0];
  const strokeCol = rising ? 'rgba(50,215,75,.75)' : 'rgba(255,255,255,.38)';
  return `<svg viewBox='0 0 64 22' width='64' height='22' style='flex:none;overflow:visible'><polyline fill='none' stroke='${strokeCol}' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' points='${coords}'/></svg>`;
}

function renderSpotlightContent(qRaw) {

    const catName = (cats[e.c]?.[0] || '').toLowerCase();
    const note = (e.n || '').toLowerCase();
    const amt = String(e.a).replace('.', ',');
    const dateIt = e.d.split('-').reverse().join('/');
    const vacTag = e.vac ? 'vacanza ferie' : '';
    return catName.includes(q) || note.includes(q) || amt.includes(q) || dateIt.includes(q) || e.d.includes(q) || vacTag.includes(q);
  }).map(e => ({
    kind: 'ex',
    id: e.id,
    d: e.d,
    title: e.n || (cats[e.c]?.[0] || 'Altro'),
    sub: `${cats[e.c]?.[0] || 'Altro'} · ${e.d.split('-').reverse().join('/')}`,
    a: +e.a || 0,
    vac: Boolean(e.vac),
    rec: Boolean(e.rec)
  }));

  const matchedInc = S.inc.filter(i => {
    const title = (i.t || 'Entrata').toLowerCase();
    const amt = String(i.a).replace('.', ',');
    const dateIt = i.d.split('-').reverse().join('/');
    return title.includes(q) || amt.includes(q) || dateIt.includes(q) || i.d.includes(q) || 'entrata'.includes(q);
  }).map(i => ({
    kind: 'inc',
    id: i.id,
    d: i.d,
    title: i.t || 'Entrata',
    sub: `Entrata · ${i.d.split('-').reverse().join('/')}`,
    a: +i.a || 0
  }));

  const totOut = Math.round(matchedEx.reduce((s, x) => s + x.a, 0) * 100) / 100;
  const totIn = Math.round(matchedInc.reduce((s, x) => s + x.a, 0) * 100) / 100;
  const net = Math.round((totIn - totOut) * 100) / 100;
  const all = [...matchedEx, ...matchedInc].sort((a, b) => b.d.localeCompare(a.d));

  return `
    <div class='card' style='margin-top:6px'>
      <div class='row sp' style='margin-bottom:7px'>
        <span class='kicker'>RISULTATI SPOTLIGHT</span>
        <span class='badge'>${all.length} movimenti</span>
      </div>
      <div class='kpi-grid'>
        <div class='kpi-box'><span class='m'>Uscite</span><b class='bad money-val'>-${eur(totOut)}</b></div>
        <div class='kpi-box'><span class='m'>Entrate</span><b class='ok money-val'>+${eur(totIn)}</b></div>
        <div class='kpi-box'><span class='m'>Netto</span><b class='${net >= 0 ? 'ok' : 'bad'} money-val'>${net >= 0 ? '+' : ''}${eur(net)}</b></div>
      </div>
    </div>
    ${all.length ? all.map(item => item.kind === 'ex'
      ? `<div class='li-card'>
          <div class='grow' style='cursor:pointer' onclick="openEd('${item.id}')">
            <div style='font-weight:600;font-size:12px'>${esc(item.title)}${item.vac ? ` <span class='badge vac'>VACANZA</span>` : ''}${item.rec ? ` <span class='badge'>Foto</span>` : ''}</div>
            <div class='m'>${item.sub}</div>
          </div>
          <div class='row' style='gap:8px'>
            <b class='money-val' style='font-size:12px'>- ${eur(item.a)}</b>
            <button class='x' onclick="delEx('${item.id}')">✕</button>
          </div>
        </div>`
      : `<div class='li-card'>
          <div class='grow'>
            <div style='font-weight:600;font-size:12px'>${esc(item.title)}</div>
            <div class='m'>${item.sub}</div>
          </div>
          <div class='row' style='gap:8px'>
            <b class='ok money-val' style='font-size:12px'>+${eur(item.a)}</b>
            <button class='x' onclick="delInc('${item.id}')">✕</button>
          </div>
        </div>`
    ).join('') : `<div class='card m' style='text-align:center'>Nessun movimento per «${esc(qRaw)}».</div>`}`;
}

function handleSpotlightInput(val) {
  spotlightQuery = val;
  const clearBtn = $('#sp-clear');
  if (clearBtn) clearBtn.style.display = spotlightQuery ? 'inline-flex' : 'none';
  const resBox = $('#spotlight-results');
  const normBox = $('#money-normal-view');
  if (spotlightQuery.trim()) {
    if (resBox) {
      resBox.style.display = 'block';
      resBox.innerHTML = renderSpotlightContent(spotlightQuery);
    }

function repeatExpenseToday(id) {

  const avgVal = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  const latestVal = vals.length ? vals[vals.length - 1] : 0;

  const span = Math.max(1, maxVal - minVal);

    const x = pts.length === 1 ? 175 : 14 + (i * (322 / (pts.length - 1)));
    const y = 104 - ((p.v - minVal) / span) * 84;
    const iy = p.ideal != null ? 104 - ((Math.min(maxVal, Math.max(minVal, p.ideal)) - minVal) / span) * 84 : null;
    return { x, y, iy, v: p.v, label: p.label };

function chartScrub(ev) {
  const svg = $('#an-svg');
  if (!svg || !activeChartCoords.length) return;
  const rect = svg.getBoundingClientRect();
  const relX = ((ev.clientX - rect.left) / rect.width) * 350;
  let nearest = activeChartCoords[0];
  let best = Math.abs(relX - nearest.x);
  for (const p of activeChartCoords) {
    const d = Math.abs(relX - p.x);
    if (d < best) { best = d; nearest = p; }
  }
  const vline = $('#an-vline');
  const dot = $('#an-dot');
  if (vline) { vline.setAttribute('x1', nearest.x); vline.setAttribute('x2', nearest.x); vline.style.display = 'block'; }
  if (dot) { dot.setAttribute('cx', nearest.x); dot.setAttribute('cy', nearest.y); }
  const valEl = $('#an-curr-val');
  const lblEl = $('#an-curr-lbl');
  if (valEl) valEl.textContent = eur(nearest.v);
  if (lblEl) lblEl.textContent = `${activeChartMeta.title} · ${nearest.label}`;
}

function chartReset() {
  if (!activeChartCoords.length) return;
  const last = activeChartCoords[activeChartCoords.length - 1];
  const vline = $('#an-vline');
  const dot = $('#an-dot');
  if (vline) vline.style.display = 'none';
  if (dot) { dot.setAttribute('cx', last.x); dot.setAttribute('cy', last.y); }
  const valEl = $('#an-curr-val');
  const lblEl = $('#an-curr-lbl');
  if (valEl) valEl.textContent = eur(last.v);
  if (lblEl) lblEl.textContent = activeChartMeta.title;
}

function spendSuggestions(byUse = false, limit = 6) {
  const now = new Date(), hr = now.getHours(), dow = now.getDay();
  const cats = getCats(), map = {};
  const exHour = e => {
    if (typeof e.h === 'number') return e.h;
    const ms = parseInt(String(e.id || '').slice(0, 8), 36);
    return (ms > 1.4e12 && ms < 4e12) ? new Date(ms).getHours() : null;
  };
  S.ex.forEach(e => {
    if (e.rid || e.vac || e.c === 'gpl' || e.c === 'benz' || !(e.a > 0)) return;
    const label = (e.n || '').replace(/^\d+×\s*/, '').trim();
    const key = e.c + '|' + label.toLowerCase();
    const age = Math.max(0, (Date.now() - new Date(e.d + 'T12:00')) / 86400000);
    if (age > (byUse ? 240 : 120)) return;
    const w = byUse ? 1 / (1 + age / 90) : 1 / (1 + age / 30);
    const h = exHour(e);
    const hourMatch = !byUse && h != null && Math.abs(h - hr) <= 2 ? 2 : 0;
    const dayMatch = !byUse && new Date(e.d + 'T12:00').getDay() === dow ? 0.6 : 0;
    const m = map[key] || (map[key] = { c: e.c, n: label, score: 0, amts: {}, last: e.a });
    m.score += w * (1 + hourMatch + dayMatch);
    m.amts[e.a] = (m.amts[e.a] || 0) + 1;
    m.last = e.a;
  });
  const out = Object.values(map).map(m => {
    const a = +Object.entries(m.amts).sort((x, y) => y[1] - x[1])[0][0];
    return { c: m.c, n: m.n || (cats[m.c] ? cats[m.c][0] : 'Spesa'), a, score: m.score };
  }).sort((x, y) => y.score - x.score).slice(0, limit);
  if (out.length < 4) {
    const defs = hr < 11 ? [['caffe', 'Caffè', 0.35], ['cibo', 'Colazione', 2.5], ['heets', 'Heets', 5.5]]
      : hr < 15 ? [['cibo', 'Pranzo', 10], ['caffe', 'Caffè', 0.35], ['heets', 'Heets', 5.5]]
      : [['caffe', 'Caffè', 0.35], ['heets', 'Heets', 5.5], ['cibo', 'Cena', 15]];
    defs.forEach(([c, n, a]) => {
      if (out.length < 4 && cats[c] && !out.some(o => o.n.toLowerCase() === n.toLowerCase())) out.push({ c, n, a, score: 0 });
    });
  }
  return out;
}

  nps = { mode, v: '', c: defaultCat, incType: 0, d: d || today(), p: l ? l.ppl : '', pl: 'an', n: '', recB64: null, splitN: 1, splitWho: '' };
  npR();

function closeNp() {
  vib(12);
  if (kbTarget) kbClose();
  $('#sh').classList.remove('on');

}

function updateNpDisplay() {
  const isInc = nps.mode === 'inc';
  const splitActive = !isInc && nps.c !== 'gpl' && nps.splitN > 1;
  const rawVal = +nps.v.replace(',', '.') || 0;
  const myShare = splitActive ? Math.round((rawVal / nps.splitN) * 100) / 100 : rawVal;

  const valEl = $('#np-val');
  if (valEl) valEl.textContent = `${nps.v || '0'} €`;

  const spInfo = $('#np-split-info');
  if (spInfo) {
    if (splitActive && rawVal > 0) {
      spInfo.style.display = 'block';
      spInfo.innerHTML = `La tua quota: <b style='color:var(--t)'>${eur(myShare)}</b> (credito ${eur(rawVal - myShare)})`;
    } else {
      spInfo.style.display = 'none';
    }
  }
}

function nk(i) {
  vib(10);
  const k = KEYS[i];
  if (k === '<') nps.v = nps.v.slice(0, -1);
  else if (k === ',') { if (!nps.v.includes(',')) nps.v = (nps.v || '0') + ','; }
  else if (nps.v.length < 7) nps.v += k;
  updateNpDisplay();
}

function setNpMode(m) {
  vib(12);
  nps.mode = m;
  const isInc = m === 'inc';
  $('#np-btn-ex').className = !isInc ? 'on' : '';

  $('#np-chips-inc').style.display = isInc ? 'flex' : 'none';
  $('#np-chips-ex').style.display = !isInc ? 'flex' : 'none';
  const sg = $('#np-sug'); if (sg) sg.style.display = (!isInc && (window._npSug || []).length) ? 'flex' : 'none';
  $('#np-split-wrap').style.display = !isInc ? 'block' : 'none';
  $('#np-rec-wrap').style.display = !isInc ? 'flex' : 'none';
  updateNpDisplay();
}

function setNpCat(c) {
  vib(12);

function npPickSug(k) {

function setNpSplit(n) {

function saveNp() {
  if (kbTarget) kbClose();
  const a = +nps.v.replace(',', '.');
  if (!(a > 0)) return toast('Inserisci un importo');
  if (nps.mode === 'inc') {
    addInc(a, nps.d, nps.n.trim() || IT[nps.incType]);
  } else if (nps.c === 'gpl') {
    if (!+nps.p) return toast('Inserisci €/L');
    addFill(a, +nps.p, nps.pl, nps.d);
  } else {
    const id = uid();
    if (nps.recB64) DB.save(id, nps.recB64);
    if (nps.splitN > 1) {
      const share = Math.round((a / nps.splitN) * 100) / 100;
      const credit = Math.round((a - share) * 100) / 100;
      const who = cap(nps.splitWho.trim() || 'Amici');
      addEx(nps.c, share, nps.d, `${nps.n || 'Spesa divisa'} (1/${nps.splitN})`, Boolean(nps.recB64), id, true);
      addDebt(who, credit, 'due', true);
      toast(`Quota ${eur(share)} · Credito ${eur(credit)} (${who})`);
      R();
    } else {
      addEx(nps.c, a, nps.d, nps.n, Boolean(nps.recB64), id);
    }
  }
  closeNp();
}

/* ==========================================================================
   SELETTORE ORARIO A RUOTE (sostituisce l'orario nativo di iOS)
   ========================================================================== */
let tp = null;
const TP_H = 44;

function tpStyle(k, f) {
  const col = $('#tp-' + k);
  if (!col) return;
  if (f == null) f = col.scrollTop / TP_H;
  col.querySelectorAll('.tp-it').forEach((el, i) => {
    const d = Math.abs(f - i);
    el.style.opacity = Math.max(0.16, 1 - d * 0.4).toFixed(2);
    el.style.transform = `scale(${Math.max(0.74, 1 - d * 0.08).toFixed(3)})`;
  });
}

function tpUpdateBig() {
  const b = $('#tp-big');
  if (b && tp) b.textContent = pad(tp.h) + ':' + pad(tp.m);
}

function tpOnScroll(k) {
  if (!tp) return;
  const col = $('#tp-' + k);
  if (!col) return;
  const max = k === 'h' ? 23 : 59;
  const f = col.scrollTop / TP_H;
  const idx = Math.max(0, Math.min(max, Math.round(f)));
  tpStyle(k, f);
  if (tp[k] !== idx) {
    tp[k] = idx;
    hapTick();
    tpUpdateBig();
  }
}

function tpGo(k, idx, smooth) {
  const col = $('#tp-' + k);
  if (!col) return;
  col.scrollTo({ top: idx * TP_H, behavior: smooth ? 'smooth' : 'auto' });
  if (!smooth && tp) tp[k] = idx;
}

function tpPreset(v) {
  if (!tp) return;
  let h, m;
  if (v === 'now') {
    const d = new Date();
    h = d.getHours();
    m = Math.round(d.getMinutes() / 5) * 5;
    if (m === 60) { m = 0; h = (h + 1) % 24; }
  } else {
    [h, m] = v.split(':').map(Number);
  }
  tpGo('h', h, true);
  tpGo('m', m, true);
}

function openTimePicker(inp) {
  if (kbTarget) kbClose();
  const mt = /^(\d{1,2}):(\d{2})$/.exec(inp.value || '');
  const h = mt ? Math.min(23, +mt[1]) : 19;
  const m = mt ? Math.min(59, +mt[2]) : 0;
  tp = { inp, h, m };

  const items = n => Array.from({ length: n }, (_, i) => `<div class='tp-it' data-i='${i}'>${pad(i)}</div>`).join('');
  const presets = [['now', 'Adesso'], ['08:00', '08:00'], ['12:30', '12:30'], ['19:00', '19:00'], ['21:00', '21:00']];

  $('#tp').innerHTML = `
    <div class='tp-box'>
      <div class='grabber-wrap'><div class='grabber'></div></div>
      <div class='row sp'>
        <button type='button' class='x' onclick='tpClose()'>Annulla</button>
        <b id='tp-big' class='tp-big'>${pad(h)}:${pad(m)}</b>
        <button type='button' class='btn sm' onclick='tpDone()'>Fine</button>
      </div>
      <div class='tp-wheels'>
        <div class='tp-band'></div>
        <div class='tp-col' id='tp-h'><div class='tp-pad'></div>${items(24)}<div class='tp-pad'></div></div>
        <div class='tp-sep'>:</div>
        <div class='tp-col' id='tp-m'><div class='tp-pad'></div>${items(60)}<div class='tp-pad'></div></div>
      </div>
      <div class='chips hscroll' style='justify-content:center'>
        ${presets.map(([v, l]) => `<button type='button' class='chip' onclick="tpPreset('${v}')">${l}</button>`).join('')}
      </div>
    </div>`;
  $('#tp').classList.add('on');

  ['h', 'm'].forEach(k => {
    const col = $('#tp-' + k);
    col.addEventListener('scroll', () => {
      if (col._raf) return;
      col._raf = requestAnimationFrame(() => { col._raf = 0; tpOnScroll(k); });
    }, { passive: true });
    col.addEventListener('click', ev => {
      const it = ev.target.closest('.tp-it');
      if (it) { hapTick(); tpGo(k, +it.dataset.i, true); }
    });
  });

  requestAnimationFrame(() => {
    tpGo('h', h, false);
    tpGo('m', m, false);
    tpStyle('h');
    tpStyle('m');
  });
}

function tpClose() {
  tp = null;
  $('#tp').classList.remove('on');
}

function tpDone() {
  if (!tp) return;
  const v = pad(tp.h) + ':' + pad(tp.m);
  const inp = tp.inp;
  tpClose();
  if (inp && inp.value !== v) {
    inp.value = v;
    try { inp.dispatchEvent(new Event('change', { bubbles: true })); } catch (e) {}
  }
}

async function cloudCreateBin() {
  if (kbTarget) kbClose();
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  if (!key) return toast('Inserisci Master Key');
  S.cloud.key = key;
  save(true);
  try {
    const res = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key, 'X-Bin-Name': 'LeoWealth', 'X-Bin-Private': 'true' },
      body: JSON.stringify(S)
    });
    const j = await res.json();
    if (j && j.metadata && j.metadata.id) {
      S.cloud.bin = j.metadata.id;
      S.cloud.lastSync = Date.now();
      save(true);
      toast('Bin creato: ' + j.metadata.id);
      R();
    } else toast('Chiave non valida');
  } catch (e) { toast('Errore di rete'); }
}

async function cloudPush(silent = false) {
  if (kbTarget && !silent) kbClose();
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) { if (!silent) toast('Dati Cloud mancanti'); return; }
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': key },
      body: JSON.stringify(S)
    });
    if (res.ok) {
      S.cloud.lastSync = Date.now();
      try { localStorage.setItem('lw', JSON.stringify(S)); } catch (e) {}
      if (!silent) { toast('Salvato su Cloud'); R(); }
    } else if (!silent) toast('Errore Cloud');
  } catch (e) { if (!silent) toast('Errore di rete'); }
}

async function cloudPull(silent = false) {
  if (kbTarget && !silent) kbClose();
  const key = ($('#ckey')?.value || S.cloud.key || '').trim();
  const bin = ($('#cbin')?.value || S.cloud.bin || '').trim();
  if (!key || !bin) { if (!silent) toast('Dati Cloud mancanti'); return; }
  S.cloud.key = key; S.cloud.bin = bin;
  try {
    const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, { headers: { 'X-Master-Key': key } });
    const j = await res.json();
    if (j && j.record) {
      const remoteUpdated = +j.record.updatedAt || 0;
      if (silent && remoteUpdated <= (S.updatedAt || 0)) return;
      const keepCloud = Object.assign({}, S.cloud, { lastSync: Date.now() });
      S = migrate(j.record);
      S.cloud = keepCloud;
      save(true);
      R();
      if (!silent) toast('Dati caricati dal Cloud');
    } else if (!silent) toast('Bin non trovato');
  } catch (e) { if (!silent) toast('Errore di rete'); }
}

function expCsv() {

  const rows = [['Data', 'Tipo', 'Categoria', 'Descrizione', 'Importo', 'Vacanza']];

function catOf(t) {

function parseNaturalDate(t) {
  const base = new Date();
  if (/altro ?ieri/.test(t)) { base.setDate(base.getDate() - 2); return { ds: iso(base), label: "l'altro ieri", explicit: true }; }
  if (/\bieri\b/.test(t)) { base.setDate(base.getDate() - 1); return { ds: iso(base), label: 'ieri', explicit: true }; }
  if (/dopodomani/.test(t)) { base.setDate(base.getDate() + 2); return { ds: iso(base), label: 'dopodomani', explicit: true }; }
  if (/domani|domattina/.test(t)) { base.setDate(base.getDate() + 1); return { ds: iso(base), label: 'domani', explicit: true }; }
  if (/oggi|stasera|stanotte|stamattina|oggi pomeriggio/.test(t)) { return { ds: iso(base), label: 'oggi', explicit: true }; }

  const traM = t.match(/\b(?:tra|fra)\s+(\d+|uno|due|tre|quattro|cinque|sei|sette|dieci|quindici)\s+giorn/);
  if (traM) {
    const add = /\d+/.test(traM[1]) ? +traM[1] : (NW[traM[1]] || 1);
    base.setDate(base.getDate() + add);
    return { ds: iso(base), label: `tra ${add}g`, explicit: true };
  }

  if (/settimana prossima|prossima settimana/.test(t)) {
    base.setDate(base.getDate() + 7);
    return { ds: iso(base), label: 'settimana prossima', explicit: true };
  }

  const dowMap = { domenic: 0, luned: 1, marted: 2, mercoled: 3, gioved: 4, venerd: 5, sabat: 6 };
  for (const [stem, targetDow] of Object.entries(dowMap)) {
    if (new RegExp(`\\b${stem}[ioa]?\\b`).test(t)) {
      const currDow = base.getDay();
      let diff = (targetDow - currDow + 7) % 7;
      if (diff === 0) diff = 7;
      base.setDate(base.getDate() + diff);
      return { ds: iso(base), label: `${DN[targetDow].slice(0, 3)} ${base.getDate()}/${base.getMonth() + 1}`, explicit: true };
    }
  }

  const slashDate = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/);
  if (slashDate) {
    const dNum = Math.min(31, Math.max(1, +slashDate[1]));
    const mNum = Math.min(12, Math.max(1, +slashDate[2])) - 1;
    let yNum = slashDate[3] ? (+slashDate[3] < 100 ? 2000 + +slashDate[3] : +slashDate[3]) : base.getFullYear();
    const cand = new Date(yNum, mNum, dNum, 12, 0);
    if (!slashDate[3] && cand < new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0)) cand.setFullYear(yNum + 1);
    return { ds: iso(cand), label: `${dNum}/${mNum + 1}`, explicit: true };
  }

  const mesiMap = { gennai: 0, febbrai: 1, marz: 2, april: 3, maggi: 4, giugn: 5, lugli: 6, agost: 7, settembr: 8, ottobr: 9, novembr: 10, dicembr: 11 };
  for (const [mStem, mIdx] of Object.entries(mesiMap)) {
    const dm = t.match(new RegExp(`\\b(\\d{1,2})\\s+${mStem}[io]\\b`));
    if (dm) {
      const dayNum = Math.min(31, Math.max(1, +dm[1]));
      let yr = base.getFullYear();
      const cand = new Date(yr, mIdx, dayNum, 12, 0);
      if (cand < new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0)) cand.setFullYear(yr + 1);
      return { ds: iso(cand), label: `${dayNum} ${MESI[mIdx].slice(0, 3)}`, explicit: true };
    }
  }

  const ilDay = t.match(/\bil\s+(\d{1,2})\b(?!\s*(?:euro|eur|%|km|anni|ore))/);
  if (ilDay) {
    const dayNum = Math.min(31, Math.max(1, +ilDay[1]));
    const cand = new Date(base.getFullYear(), base.getMonth(), dayNum, 12, 0);
    if (cand < new Date(base.getFullYear(), base.getMonth(), base.getDate(), 0, 0)) cand.setMonth(cand.getMonth() + 1);
    return { ds: iso(cand), label: `${dayNum}/${cand.getMonth() + 1}`, explicit: true };
  }

  return { ds: iso(base), label: 'oggi', explicit: false };
}

function parseNaturalTime(t) {
  if (/mezzogiorn/.test(t)) return { tm: '12:00', explicit: true };
  if (/mezzanott/.test(t)) return { tm: '00:00', explicit: true };
  if (/\ba pranzo\b/.test(t)) return { tm: '13:00', explicit: true };
  if (/\ba cena\b/.test(t)) return { tm: '20:30', explicit: true };

  const mFull = t.match(/\b(?:all[e']|ore|verso le|per le|intorno alle|dalle)\s*(\d{1,2})(?:[:.](\d{2})|\s+e\s+(mezz[ao]|un quarto|tre quarti|\d{1,2})|\s+meno\s+(un quarto|\d{1,2}))?/);
  if (mFull) {
    let hr = Math.min(23, Math.max(0, +mFull[1]));
    let min = 0;
    if (mFull[2]) {
      min = Math.min(59, +mFull[2]);
    } else if (mFull[3]) {
      if (/mezz/.test(mFull[3])) min = 30;
      else if (/tre quarti/.test(mFull[3])) min = 45;
      else if (/quarto/.test(mFull[3])) min = 15;
      else min = Math.min(59, +mFull[3]);
    } else if (mFull[4]) {
      const sub = /quarto/.test(mFull[4]) ? 15 : Math.min(59, +mFull[4]);
      hr = (hr + 23) % 24;
      min = 60 - sub;
    } else if (/pomeriggi|ser/.test(t) && hr >= 1 && hr <= 11) {
      hr += 12;
    }
    return { tm: `${pad(hr)}:${pad(min)}`, explicit: true };
  }

  const mColon = t.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
  if (mColon) {
    return { tm: `${pad(+mColon[1])}:${mColon[2]}`, explicit: true };
  }

  return { tm: null, explicit: false };
}

function getNums(t) {
  const cleaned = t
    .replace(/\b(?:all[e']|ore|verso le|per le|dalle)\s*\d{1,2}(?:[:.]\d{2})?/g, ' ')
    .replace(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g, ' ')
    .replace(/\b\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\b/g, ' ')
    .replace(/\bil\s+\d{1,2}\b/g, ' ');

  const euroMezzo = cleaned.match(/(\d+|un|uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|venti|trenta|quaranta|cinquanta)\s*(?:euro|eur)\s*e\s*mezz[oa]/);
  if (euroMezzo) {
    const base = /\d+/.test(euroMezzo[1]) ? +euroMezzo[1] : (NW[euroMezzo[1]] || 0);
    return { total: base + 0.5, parts: [base + 0.5] };
  }

  const decSpoken = cleaned.match(/\b(\d{1,3})\s+e\s+(\d{1,2})\b/);
  if (decSpoken) {
    const cents = decSpoken[2].length === 1 ? +decSpoken[2] * 10 : +decSpoken[2];
    const val = +decSpoken[1] + cents / 100;
    return { total: Math.round(val * 100) / 100, parts: [Math.round(val * 100) / 100] };
  }

  const centsOnly = cleaned.match(/\b(\d{1,2})\s*centesim/);
  if (centsOnly) {
    const val = (+centsOnly[1]) / 100;
    return { total: val, parts: [val] };
  }

  const multM = cleaned.match(/\b(due|paio|tre|quattro|cinque|\d)\s+(?:pacchett[oi]\s+di\s+|tazzin[ae]\s+di\s+)?(heets|caff[eè])\b/);
  if (multM) {
    const qty = /\d/.test(multM[1]) ? +multM[1] : (NW[multM[1]] || 1);
    const unit = /heets/.test(multM[2]) ? FIX.heets : FIX.caffe;
    const val = Math.round(qty * unit * 100) / 100;
    return { total: val, parts: [val] };
  }

  const matches = [...cleaned.matchAll(/(\d+(?:[.,]\d+)?)/g)].map(m => +m[1].replace(',', '.')).filter(x => x > 0);
  if (matches.length > 1) return { total: Math.round(matches.reduce((a, b) => a + b, 0) * 100) / 100, parts: matches };
  if (matches.length === 1) return { total: matches[0], parts: matches };
  const w = cleaned.match(/\b(uno|un|una|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|undici|dodici|quindici|venti|trenta|quaranta|cinquanta|sessanta|settanta|ottanta|novanta|cento|duecento|trecento|cinquecento|mille|deca|ventino|cinquantino|centone)\b/);
  return w ? { total: NW[w[1]], parts: [NW[w[1]]] } : { total: null, parts: [] };
}

function cleanExpenseNote(raw) {
  return raw
    .replace(/^(?:ho\s+)?(?:speso|pagato|preso|comprato|offerto|segna|metti|aggiungi)\s+/i, '')
    .replace(/\b\d+(?:[.,]\d+)?\s*(?:euro|eur|€)?\b/gi, '')
    .replace(/\b(?:di|per|al|allo|alla|ai|agli|alle|dal|dallo|dalla|in|con|su|sul|sulla|un|una|uno|il|lo|la|i|gli|le|oggi|ieri|altroieri|l'altro ieri)\b/gi, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function addIt(c, a, d, when, raw, splitInfo, parts) {
  const cats = getCats();
  const cleanNote = cleanExpenseNote(raw) || (cats[c]?.[0] || 'Spesa');
  if (splitInfo && splitInfo.n > 1) {
    const share = Math.round((a / splitInfo.n) * 100) / 100;
    const credit = Math.round((a - share) * 100) / 100;
    const who = splitInfo.who || 'Amici';
    addEx(c, share, d, `${cap(cleanNote)} (1/${splitInfo.n})`, false, null, true);
    addDebt(who, credit, 'due', true);
    return `<b>${cats[c]?.[0] || c}</b> <b class='money-val'>${eur(share)}</b> (quota 1/${splitInfo.n}) + credito <b>${eur(credit)}</b> verso <b>${esc(who)}</b>${when}.`;
  }
  if (c === 'gpl') {
    const pplM = raw.match(/0[.,]\d{2,3}/);
    const ppl = pplM ? +pplM[0].replace(',', '.') : (S.fills[S.fills.length - 1]?.ppl || 0);
    if (ppl > 0) {
      const pl = /cingol|lavor|sed/i.test(raw) ? 'wk' : 'an';
      addFill(a, ppl, pl, d || today(), true);
      return `Pieno GPL <b class='money-val'>${eur(a)}</b> (${ppl.toFixed(3).replace('.', ',')} €/L)${when}.`;
    }
    np(d || today(), 'ex', 'gpl');
    nps.v = String(a).replace('.', ',');
    npR();
    return 'Completa il prezzo €/L nel pannello.';
  }
  addEx(c, a, d, cap(cleanNote), false, null, true);
  const detail = parts && parts.length > 1 ? ` (${parts.map(x => eur(x)).join(' + ')})` : '';
  return `<b>${cats[c]?.[0] || c}</b> <b class='money-val'>${eur(a)}</b>${detail}${when}.`;
}

function cleanEventTitle(raw) {
